# ============================================================================
# afk.yml — AFK(離席)判定と、その間の報酬停止 / 自動キック
# ----------------------------------------------------------------------------
# 【何のための機構か】
# 放置しているだけで報酬が積み上がる状態(AFK釣り機・モブトラップ放置・オートクリッカー放置)を
# 止める。既にある個別のexploit対策(釣り換金の分あたり上限 / 防具EXPのクールダウン /
# 同一地点EXP逓減)と同じ思想で、「AFKなら実入りゼロ」という一段上の網をかける。
#
# 【AFK判定の入力(重要)】
# 「人間にしか出せない入力」だけを活動とみなす:
#   ・移動(位置の変化) / 視点の回転
#   ・チャット / コマンド入力
#   ・インベントリのクリック・ドラッグ / アイテムを捨てる / スニークの切替
# 逆に、次は<b>活動として数えない</b>:
#   ・素のクリック(PlayerInteractEvent) / 腕振り(アニメーション)
# オートクリッカーが無限に出せるのはまさにこの2つなので、これを活動に数えると
# 「クリックしっぱなしで放置」がAFK扱いから外れ、この機構が丸ごと無意味になる。
#
# 【反映】 /trinityforge reload で即反映される(判定タイマーは再スケジュールされる)。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/afk.md
# ※このファイルは config-editor の「使用制限スイッチ」画面から保存されるため、
#   本文へコメントを書き足しても次の保存で消える。説明は上記ドキュメントへ書くこと。

enabled: true
idle-seconds: 300
kick-after-seconds: 1800
kick-message: <yellow>長時間の放置により切断しました。<newline><gray>またのご参加をお待ちしています。
notify: true
tab-suffix: true
tab-suffix-text: " <gray>[AFK]</gray>"
exempt-permission: trinityforge.afk.exempt
check-interval-ticks: 40
warn-before-seconds: 30
warn-title: true
suppress:
  skill-exp: true
  vanilla-exp: true
  mob-drops: true
  fishing-sell: true
