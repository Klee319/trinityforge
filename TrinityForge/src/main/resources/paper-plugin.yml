name: TrinityForge
version: "${version}"
main: com.trinityforge.TrinityForge
description: Native progression and integration core for the EliteMobs + ArsPaper MMO server.
api-version: "1.21"
author: Klee319
# 任意依存(soft-depend)。どちらも未導入で起動できる — 該当機能が静かに無効化されるだけ。
# 誤って required: true にすると不在時に起動不能になるため厳禁。
#
# ※ paper-plugin.yml は Bukkit 形式の `softdepend:` を解釈しない(未知キーとして黙って捨てられる)。
#    2026-07-28 まで `softdepend: [Vault]` と書いてあったが実際には何も宣言できておらず、
#    Paper プラグインは宣言した依存以外のクラスを見られない(クラスローダ分離)ため、
#    他プラグインの API を触るには必ずこの `dependencies:` 形式で書くこと。
#  - load: BEFORE  … 相手を先にロードさせる(TF の onEnable 時点で相手の API が使える)
#  - required: false … 不在でも起動する
#  - join-classpath: true … 相手のクラスを参照できるようにする(これが無いと NoClassDefFoundError)
dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    # combat/display.yml の damage-indicator-particles(バニラ被弾パーティクルの個数上限)専用。
    # バニラの被弾パーティクルはどの Bukkit イベントにも乗らないためパケット層が必須。
    packetevents:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  trinityforge.admin:
    description: TrinityForge admin commands (reload, progression, give, bind, stamp, import, dungeon)
    default: op
  trinityforge.use:
    description: Allows /tf (usage) and player-facing subcommands when exposed
    default: true
  trinityforge.elitemobs.commands:
    description: Bypass EliteMobs/AdventurersGuild player-command gate (dungeon tooling)
    default: op
