# TrinityForge - Dungeon attribute themes (concern: support creating new EliteMobs dungeons).
# A theme is a defense-bias preset (DUNGEON_SPEC: each dungeon has an attribute theme, e.g.
# physical-heavy / magic-heavy). Authoring a new dungeon:
#   1. Pick or define a theme below.
#   2. /trinityforge importmobs theme <theme> <the dungeon's EliteMobs mob folder>
#      -> the dungeon's mobs get level-scaled, themed defender profiles in combat/mob-profiles.yml
#         and are tagged with the theme name (MOB_DUNGEON_THEME). Re-run after editing to re-tune.
#   3. /trinityforge dungeon themes  -> list available theme names.
#
# Each theme overrides the synthesized defender ramps (level uses combat/mob-import.yml). Values are
# base + per-level * level, clamped (rates to [0,1], flats >= 0). Tune freely; nothing is hardcoded.
# defense-rate%/resistance% (penetrable vs not), damage-reduction%, flat-defense 守備力, armor-strength 防具強度.
# 設定リファレンス(本文コメント移設先): docs/config-reference/dungeon/themes.md

themes: {}
