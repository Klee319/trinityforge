# TrinityForge - 素材互換リスト (material-lists)
# レシピ素材欄の list:<id> トークンが参照する「互いに互換とみなすMaterialの集合」を定義する。
# エディタの素材欄「互換リスト」ボタンからも作成・編集できる。
#
#   lists:
#     <id>:                # 半角英数字・アンダースコア推奨。レシピには list:<id> と書く
#       label: 表示名       # 任意。エディタでの表示用
#       materials:         # Bukkit Material名のリスト (1個以上)
#         - OAK_PLANKS
#
# 未定義の list:<id> を参照したレシピは、起動/リロード時に警告つきでそのレシピだけ無効化される。

lists:
  planks:
    label: 板材
    materials:
      - OAK_PLANKS
      - SPRUCE_PLANKS
      - BIRCH_PLANKS
      - JUNGLE_PLANKS
      - ACACIA_PLANKS
      - DARK_OAK_PLANKS
      - MANGROVE_PLANKS
      - CHERRY_PLANKS
      - PALE_OAK_PLANKS
      - CRIMSON_PLANKS
      - WARPED_PLANKS
      - BAMBOO_PLANKS
  cobblestone:
    label: 丸石
    materials:
      - COBBLESTONE
      - COBBLED_DEEPSLATE
      - BLACKSTONE
