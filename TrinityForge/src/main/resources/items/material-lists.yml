# TrinityForge - 素材互換リスト (material-lists)
# レシピ素材欄の list:<id> トークンが参照する「互いに互換とみなすMaterialの集合」を定義する。
# エディタの素材欄「互換リスト」ボタンからも作成・編集できる。
#
#   lists:
#     <id>:                # 半角英数字・アンダースコア推奨。レシピには list:<id> と書く
#       label: 表示名       # 任意。エディタでの表示用
#       materials:         # Bukkit Material名のリスト (1個以上)
#         - OAK_PLANKS
#
# 未定義の list:<id> を参照したレシピは、起動/リロード時に警告つきでそのレシピだけ無効化される。

lists:
  planks:
    label: 板材
    materials:
      - OAK_PLANKS
      - SPRUCE_PLANKS
      - BIRCH_PLANKS
      - JUNGLE_PLANKS
      - ACACIA_PLANKS
      - DARK_OAK_PLANKS
      - MANGROVE_PLANKS
      - CHERRY_PLANKS
      - PALE_OAK_PLANKS
      - CRIMSON_PLANKS
      - WARPED_PLANKS
      - BAMBOO_PLANKS
  cobblestone:
    label: 丸石
    materials:
      - COBBLESTONE
      - COBBLED_DEEPSLATE
      - BLACKSTONE
  # ---- 2026-08-01 追加 ----
  # 各ダンジョンの最終ボスが確定ドロップする「踏破の証」19種。key_binder のレシピが
  # list:dungeon_seals を5個要求することで、用途ゼロだった印18種に一斉に出口ができる。
  # 「19種すべて」ではなく「任意5種」にしてあるので、どのダンジョンから攻めても到達できる。
  # 印そのものは ArsPaper 側 materials.yml 定義(このリポジトリには存在しない)なので custom: で参照する。
  # 増減させるときは progression/collection.yml の dungeon_seal 一覧と必ず揃えること
  # (ShippedDungeonKeyReachabilityTest が食い違いを落とす)。
  dungeon_seals:
    label: ダンジョンの印
    materials:
      - custom:dungeon_seal_mines
      - custom:dungeon_seal_deep_mines
      - custom:dungeon_seal_quarry
      - custom:dungeon_seal_cave
      - custom:dungeon_seal_bridge
      - custom:dungeon_seal_city
      - custom:dungeon_seal_climb
      - custom:dungeon_seal_palace
      - custom:dungeon_seal_knight_castle
      - custom:dungeon_seal_sewer_maze
      - custom:dungeon_seal_steamworks
      - custom:dungeon_seal_nether_bell
      - custom:dungeon_seal_nether_wastes
      - custom:dungeon_seal_dark_cathedral
      - custom:dungeon_seal_enchant_trial
      - custom:dungeon_seal_fireworks
      - custom:dungeon_seal_hallosseum
      - custom:dungeon_seal_north_pole
      - custom:dungeon_seal_binder
  # 屑鉄の互換枠。tf_scrap は「入手経路だけあって出口がゼロ」(村人取引が鉄12→3で吸うだけの
  # 純粋なシンク)だったため、key_quarry のクラフト枠でこちらでも通るようにして出口を作る。
  scrap_metals:
    label: 屑鉄
    materials:
      - custom:iron_ingot_scrap
      - custom:tf_scrap
