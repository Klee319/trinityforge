# TrinityForge - Item catalog (concern: add detailed/extra items by config alone).
# Each entry is a named item template. The randomized "flavor" stats are NOT defined here; they are
# derived live from stats/roll.yml + stats/quality.yml at build time and shown via stats/lore.yml,
# so editing those tables + /trinityforge reload re-balances every catalog item without baking.
#
# Build/preview an item in-game with:  /trinityforge give <id> [quality]
#
# Fields per item:
#   material               (required) any Bukkit material name, e.g. DIAMOND_SWORD
#   display-name           (optional) MiniMessage, e.g. "<gradient:#ffd76a:#ff7a3c>Ember Edge</gradient>"
#   custom-model-data      (optional) resource-pack model id (integer)
#   bind-type              (optional) SOULBOUND | TRADEABLE | OWNER_BOUND (default TRADEABLE)
#   use-level-requirement  (optional) required skill-tree level to use (0 = unrestricted)
#   use-skill              (optional) skill tree the requirement is measured against, e.g. HEAVY_WEAPONS
#   lore                   (optional) フレーバー説明文（複数行可、MiniMessage記法）。
#                           自動生成される品質ティア行・ステータス行より前（lore先頭）に差し込まれる。
#                           未指定/空リストなら従来どおり説明文なしで生成される。
#                           記入例:
#                             lore:
#                               - "<gray><italic>燃え盛る戦火の中で鍛えられた一振り。</italic></gray>"
#                               - "<gray><italic>その刃は決して冷めることがない。</italic></gray>"
#   color                  (optional) 革防具の染色色。"#RRGGBB" 形式のHEX文字列。
#                           material が LEATHER_HELMET/LEATHER_CHESTPLATE/LEATHER_LEGGINGS/LEATHER_BOOTS/
#                           LEATHER_HORSE_ARMOR 等の LEATHER_* のときのみ有効。それ以外のmaterialに
#                           指定した場合、または不正なHEX文字列の場合は警告を出しcolor指定だけを無視する
#                           (アイテム本体は継続してロードされる)。
#                             例: color: "#8B0000"   (暗い赤色の革鎧)
#   enchant-glow           (optional) true でエンチャント光沢(発光)だけを付与する(実際のエンチャント効果は
#                           付かない見た目だけの光沢。隠しエンチャント+HIDE_ENCHANTSの定番手法)。既定 false。
#   recipe                 (optional) クラフト/鍛冶レシピ。method で方式を選ぶ。
#                           workbench: TF起動時/reload時に trinityforge:catalog_<id> でBukkit登録。
#                           ritual: Ars儀式登録。combine: 金床。netherite: 鍛冶台(Bukkit登録なし)。
#                           不正な記述は警告を出しレシピだけを無効化する(アイテム本体は継続してロード)。
#     method                workbench(既定) | ritual | combine | netherite
#     type                  workbench専用: shaped(既定) | shapeless
#     shape                 shaped専用。3行×最大3列。空マスは半角スペース。
#     ingredients           shaped: shape内の記号 -> Material の対応表。
#                           shapeless: Materialのリスト(重複可、最大9個)。
#     amount                任意、既定1。作業台/儀式の結果個数。
#     core-item / pedestal-items / source  儀式専用。
#     source-item           combine: 金床左(合成元) / netherite: 鍛冶台ベース。カタログID。
#     addition-item         combine 専用。金床右(合成対象)カタログID。
#                           合成先はこのエントリ自身: 合成元 + 合成対象 → このアイテム。
#     combine-exp           combine 専用。成功時 ARS_SMITHING EXP。
#     inherit-source-quality combine 専用。true=合成元品質継承。false(既定)=合成元と合成対象の品質平均。
#                           ネザライト化は常に合成元品質を引き継ぐ。鍛冶型+ネザライトインゴット必須。
#                           記入例(shaped):
#                             recipe:
#                               method: workbench
#                               type: shaped
#                               shape:
#                                 - "AAA"
#                                 - "A A"
#                                 - "   "
#                               ingredients:
#                                 A: DIAMOND
#                               amount: 1
#                           記入例(shapeless):
#                             recipe:
#                               type: shapeless
#                               ingredients: [DIAMOND, DIAMOND, STICK]
#                           記入例(合成):
#                             recipe:
#                               method: combine
#                               source-item: diamond_blade
#                               addition-item: ember_core
#                               combine-exp: 100
#                               inherit-source-quality: false
#                           記入例(ネザライト化):
#                             recipe:
#                               method: netherite
#                               source-item: diamond_blade

