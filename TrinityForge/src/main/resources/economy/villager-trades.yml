# TrinityForge — スキルツリー解放に連動する村人追加取引
# ゲートID = trade:<PROFESSION名> (2026-07-23 動的ID方式改修)。skilltree 側で `trade:WEAPONSMITH` 等を
# 参照して初めて解放される (未参照の職業は常にロックされたまま)。

professions:
  WEAPONSMITH:
    block-vanilla-trades: true
    trades:
      - input: { material: IRON_INGOT, amount: 12 }
        output: { catalog: tf_scrap, amount: 3 }
        max-uses: 12
        villager-xp: 5
      - input: { material: DIAMOND, amount: 2 }
        output: { catalog: tf_core_jewelry, amount: 1 }
        max-uses: 4
        villager-xp: 10
  ARMORER:
    block-vanilla-trades: true
    trades:
      - input: { material: IRON_INGOT, amount: 16 }
        output: { material: CHAINMAIL_CHESTPLATE, amount: 1 }
        max-uses: 8
        villager-xp: 5
  TOOLSMITH:
    block-vanilla-trades: true
    trades:
      - input: { material: IRON_INGOT, amount: 8 }
        output: { material: IRON_PICKAXE, amount: 1 }
        max-uses: 8
        villager-xp: 5
      # スクラップの出口(柱4)。tf_scrap は釣りのゴミ(junk-to-scrap)とガチャから出るので、
      # ここは「拾ったゴミを鉄へ戻す」回収路。iron_ingot_scrap は4個で鉄インゴット1個に戻るので、
      # 実効レートは「ゴミ8 → 鉄1」。WEAPONSMITH の 鉄12→スクラップ3 で買って回すと
      # 鉄32→鉄1 の大損になるので、鉄の複製経路にはならない。
      - input: { catalog: tf_scrap, amount: 8 }
        output: { catalog: iron_ingot_scrap, amount: 4 }
        max-uses: 12
        villager-xp: 3
  CLERIC:
    block-vanilla-trades: false
    trades:
      - input: { material: EMERALD, amount: 3 }
        output: { material: GOLDEN_APPLE, amount: 1 }
        max-uses: 6
        villager-xp: 5
      - input: { material: ROTTEN_FLESH, amount: 32 }
        output: { material: EMERALD, amount: 1 }
        max-uses: 16
        villager-xp: 2
  LIBRARIAN:
    block-vanilla-trades: false
    trades:
      - input: { material: EMERALD, amount: 5 }
        output: { material: BOOK, amount: 3 }
        max-uses: 12
        villager-xp: 3
      - input: { material: BOOK, amount: 8 }
        output: { material: ENCHANTED_BOOK, amount: 1 }
        max-uses: 4
        villager-xp: 8
