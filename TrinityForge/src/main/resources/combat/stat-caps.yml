# TrinityForge - 総合ステータス上限 (stat caps)
#
# プレイヤーの「最終合算値」— 装備 + スキルツリーパーク + 永続バフ + base-stats + 乗算レイヤを
# すべて適用し終えた後の値 — に上限(上側だけ)をかける任意設定。
#
# ● 既定は「上限なし」= 現在の挙動と完全に同一。何も書かなければ何も変わらない。
# ● 「上限なし」と「上限0」の区別: キーを未記載のままなら「上限なし」。明示的に数値(0を含む)を
#   書いた場合だけ「上限0」として機能する(base-stats.yml とは逆の規約 — あちらは0=未設定)。
# ● 編集後は /trinityforge reload で即時反映。
#
# ⚠ 設定できるキーの全一覧・適用点(totalOf / CombatListener / PlayerDefenseResolver)・
#   「まだ効かないキー」「そもそも書いても効かないキー」の理由は、すべて下記に移設済み:
#     docs/config-reference/combat/stat-caps.md
#
#   2026-07-26: 元はこのファイル本文に約170行のコメントで書いていたが、config-editor で
#   この画面を一度保存すると本文コメントが復元されず丸ごと消える(tools/config-editor/lib/yamlio.js)。
#   他の出荷config と同じく docs/config-reference/ へ退避した。キーを増減するときは
#   UI(STAT_CAPS_SECTIONS) / Java(StatCapsConfig) / 上記mdの3点セットで揃えること
#   (tools/config-editor/test/tf-stat-caps-registry.test.js が機械的に照合している)。

# 2026-08-01: 攻撃側8キーの初期上限を投入(K-19 / 追加コンテンツ詳細プラン §3 A-4)。
# ⚠ ここは「厳選(スレッド)の寄与分」ではなく【最終合算値】の上限なので、武器そのものの
#   attack-power も同じ上限に服する。値の導出根拠(出荷 item-stats.yml の実測)は
#   docs/config-reference/combat/stat-caps.md の「出荷初期値(2026-08-01)」を参照。
#   防御側は combat/damage.yml の max-mitigation-rate / max-crit-reduction が別途効くので書いていない。
#
# 2026-08-01(同日・後): バランス調整(要件1b「重武器の火力を上げる代わりに攻撃速度を下げる」)で
#   HEAVY_WEAPONS の attack-power を ×1.25 したため、単品最大が 96,279.8 → 120,349.8 へ上がり
#   旧上限 110000 を追い越した。上限を据え置くと【最上位武器に持ち替えてもダメージが伸びない】
#   という無言の症状になる(ShippedStatCapsDriftTest がこれを検出する)。
#   旧上限は当時の単品最大に対して 1.1425 倍の余裕を取っていたので、同じ余裕率を保って 137500 とする。
#
# 2026-08-01(同日・さらに後 / U5): 上の ×1.25 は重武器の実効DPSを軽武器比 +24% まで押し上げていた。
#   目標帯は「軽武器と同等〜+15%」なので、attack-power の倍率を ×1.25 → ×1.157 へ引き下げた
#   (attack-speed の ×0.85 は「一撃の重さで差を付ける」設計の根幹なので据え置き)。
#   これに伴い単品最大が 120,349.8 → 111,395.9 へ下がる。上限は「装備を潰さない」ことだけが
#   要件なので下げなくても壊れないが、上限が実態から離れると【厳選でどこまで伸ばせるか】の
#   設計意図が読めなくなるため、同じ余裕率(約1.14倍)を保って 127500 とする
#   (111,395.9 × 1.1425 = 127,270 → 切り上げて丸めた値。余裕率は 1.1446)。
#   ⚠ 単品最大の定義は fixed + per-quality×max-quality + random.max。ShippedStatCapsDriftTest が
#     出荷 item-stats.yml から実測して「上限 < 単品最大」を落とすので、勝手に下げると即座に露見する。
stat-caps:
  attack-power: 127500
  crit-chance: 0.85
  crit-damage: 3.2
  penetration: 0.85
  percent-bonus-damage: 1.0
  flat-bonus-damage: 60
  bleed-chance: 0.6
  bleed-damage: 4500

