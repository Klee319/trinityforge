# TrinityForge - Combat damage coefficients (M1 symmetric pipeline / physical component)
# All numbers here are provisional placeholders; tune after playtesting (IMPLEMENTATION_PLAN M7).
# Edit and run `/trinityforge reload` to apply without restart.
#
# The 8-step pipeline itself is structural (COMBAT_SYSTEM_SPEC section 2.1); these are the
# global, tunable knobs that feed it. Per-item / per-mob stats live in PDC, not here.
# 設定リファレンス(本文コメント移設先): docs/config-reference/combat/damage.md


physical:
  base-coefficient: 1
  min-component-damage: 1
melee-charge:
  enabled: true
  min-multiplier: 0.2
  exponent: 2.0
attack-speed:
  min-effective: 0.1
  reconcile-interval-ticks: 10
magical:
  base-coefficient: 1
  min-component-damage: 1
  scale-with-combat-level: true
weapon-base-formula:
  enabled: false
  a: 2
  b: 100
level-scaling:
  per-level: 0.01
defense:
  max-mitigation-rate: 0.9
  max-dodge-chance: 0.9
  max-crit-reduction: 1
  min-rate: 0
  max-rate: 1
  min-flat: 0
  max-flat: 1000000
  # 防護エンチャント(Protection/Projectile Protection)の再導出軽減率に掛ける倍率。
  # 1.0 = バニラ準拠(防護IVフルセット4部位で64%軽減)。
  # 既定を0.5にしている理由: max-mitigation-rate(上の0.9、被ダメ軽減%の全体上限)の枠を
  # 防護エンチャント1種だけで71%も食い潰し、TF自前の防具ステ(守備力・耐性等)が
  # ほぼ無意味になってしまうため。0.5なら防護IVフルセットでも32%に収まり、
  # 残りの枠をTFの防具ステに残せる。
  enchant-protection-scale: 0.5
bleed:
  tick-interval-ticks: 20
  ticks: 5
aoe:
  hit-players: false
# ---------------------------------------------------------------------------
# 【2026-07-27】PvP(player→player)専用の抑制
# ---------------------------------------------------------------------------
# TFのダメージ式はモブ向けに調整されており、それがそのまま対人にも乗っていた。
# モブはHPを 150×1.066^L で釣り合わせているのに対し、プレイヤーの最大体力は
# バニラ20＋powerツリー(+10)＋プレステージで概ね33が上限。一方 Lv100帯のプレイヤー攻撃力は
# 約1052あるため、この節が無いと「先に当てた側が確定で即死させる」状態になる。
#
# enabled: false にすると下の2つは一切参照されず、対人も従来どおりモブと同じ計算になる。
#
# damage-multiplier: PvPダメージに掛ける倍率。低レベル帯(下の割合上限にまだ届かない帯)の
#   手触りを調整するためのつまみ。0 にすると対人ダメージが完全に0になる(=実質PvP禁止)。
#
# max-damage-percent-of-max-health: 1発で削れる量を「被弾者の最大体力の◯割」までに制限する。
#   既定0.15 = 最大体力の15%までなので、どれだけ攻撃力が伸びても倒すのに最低7発かかる。
#   倍率だけに頼らずこの上限を置いているのは、根本原因が「攻撃力は指数で伸びるのに
#   プレイヤーの体力はほぼ一定」という構造だから — 倍率は攻撃カーブを触るたびに調整し直しに
#   なるが、割合上限はスケールフリーなので調整漏れで即死ゲーに戻ることがない。
#   0 にすると上限なし(倍率だけが効く)。
#
# 適用範囲: 主命中・AoEスプラッシュの両方。出血DoTは主命中の最終ダメージから算出されるので
#   自動的に抑制後の値を引き継ぐ。モブ→プレイヤーのダメージには掛からない。
pvp:
  enabled: true
  damage-multiplier: 0.5
  max-damage-percent-of-max-health: 0.15
vanilla-armor:
  defense-rate-per-point: 0.015
  defense-rate-max: 0.8
  armor-strength-per-point: 0
# ---------------------------------------------------------------------------
# 【2026-07-28】日光による炎上ダメージ
# ---------------------------------------------------------------------------
# バニラの炎上ダメージは1発1.0固定。一方 TF のモブ最大HPは Lv0 のゾンビでも 400 あるため、
# 「朝になっても敵が炎上で死なない」(400秒以上燃え続ける)状態だった。日光で燃えている間の
# 1発だけを「被弾モブの最大HP × damage-percent-of-max-health」へ置き換える。
#
# enabled: false で完全にバニラ挙動へ戻る。
#
# damage-percent-of-max-health: 1発あたりのダメージを最大HPの割合で指定する。
#   既定0.10 = 最大HPの10%。バニラの炎上は1秒に1回なので、日光下では約10秒で焼き切れる。
#   算出値がバニラのダメージより小さい場合はバニラ値のまま(下げる方向には決して働かない)。
#
# mobs: 置換の対象とする EntityType 名。既定はバニラで日光焼却される種別のみ。
#   空リストにすると全モブが対象になるが、その場合「野外・昼間に火属性エンチャントで着火した
#   だけ」のボスまで毎秒10%ずつ溶けるため、意図的に種別を絞ってある。
#   未知の EntityType 名は警告してスキップし、他のエントリは読み込みを継続する。
#
# 適用条件(すべて満たしたときだけ置換): 通常世界 / 昼 / 天候が晴れ / 立っているブロックの
#   空からの明るさが15(=空が見えている) / DamageCause が FIRE_TICK(炎上の継続ダメージ)。
#   夜間や屋内で燃えている場合、ネザー/エンドの場合はバニラのままになる。
sunlight-burn:
  enabled: true
  damage-percent-of-max-health: 0.10
  mobs:
    - ZOMBIE
    - ZOMBIE_VILLAGER
    - DROWNED
    - GIANT
    - SKELETON
    - STRAY
    - BOGGED
    - PHANTOM
    - ZOMBIE_HORSE
    - SKELETON_HORSE
# ---------------------------------------------------------------------------
# 【2026-07-28】序盤(低レベル帯)モブの火力緩和
# ---------------------------------------------------------------------------
# モブの attack-power は combat/mob-types.yml で指数カーブ(base 5.5〜6.6 × 1.033^Lv)として
# 校正されている。この節はそのカーブ自体を触らずに、レベルの低いモブだけ火力を落とすための
# 後掛け倍率。base を直接下げると全レベル帯が下がって中盤以降の校正がやり直しになるため、
# 「序盤だけ」を独立したつまみとして分離してある。
#
#   multiplier(Lv) = Lv >= until-level ? 1.0 : level-0-multiplier
#                                              + (1 - level-0-multiplier) × Lv / until-level
#
# 既定では Lv0 で0.7倍、Lv5 で0.85倍、Lv10以上で等倍(=従来どおり)。
# 適用範囲: モブ→プレイヤーの物理/魔法の基本ダメージ(防御計算より前)。
#   プレイヤー→モブ、およびEliteMobsが最終ダメージを直接渡してくる経路には掛からない。
early-level-attack:
  enabled: true
  until-level: 10
  level-0-multiplier: 0.7
# ---------------------------------------------------------------------------
# 【2026-07-30】TF独自の装備耐久ペナルティ
# ---------------------------------------------------------------------------
# EliteMobs のインスタンスダンジョンでは、致死ダメージが EliteMobs 側でキャンセルされ
# 「ダウン状態」へ移行するため PlayerDeathEvent が一度も発火しない。その結果、
#   ・死亡時の耐久ペナルティが一切かからない(EliteMobs 自前のペナルティは EliteMobs 製
#     アイテムにしか効かないので TF 装備は無傷)
#   ・キャンセルされた致死の一撃分のバニラ防具耐久消費も消える
# という状態だった。この節はそれを TF 側で明示的に補うためのもの。
#
# on-hit: 被弾1回ごとに「最大耐久 × percent-of-max(最低 min-damage)」を防具4部位から追加で
#   減らす。バニラの防具耐久消費は消さずに上乗せする(致死でキャンセルされた一撃は
#   キャンセル済みイベントを無視するため対象外 = 死亡ペナルティ側で回収する)。
# on-death: 死亡(ダンジョンのダウンを含む)時に「最大耐久 × percent-of-max」を防具4部位
#   ＋両手(include-hands)から減らす。
#
# dungeon-only: true = インスタンスダンジョンワールドの中でのみ適用(既定)。false で全ワールド。
# respect-unbreaking: 耐久力(UNBREAKING)エンチャントを尊重する。減少量を 1/(Lv+1) に縮め、
#   端数は確率で切り上げる(バニラと同じ期待値。Lv3・減少量1なら25%の確率で1減る)。
# prevent-break: true = この耐久ペナルティでは装備を壊さない(残耐久1で止まる)。false にすると
#   ペナルティだけで装備が消滅しうる。バニラの通常使用による破壊はこの設定に影響されない。
durability:
  dungeon-only: true
  respect-unbreaking: true
  prevent-break: true
  on-hit:
    enabled: true
    percent-of-max: 0.001
    min-damage: 1
    # オフハンド(盾など)も被弾時の対象に含めるか。
    include-offhand: true
  on-death:
    enabled: true
    percent-of-max: 0.1
    min-damage: 1
    # メインハンド/オフハンドの装備も死亡ペナルティの対象に含めるか。
    include-hands: true
# 2026-07-25 (CMB-31): attack-stat-keys / defense-stat-keys ブロックは削除した。
# 14個すべてが「スキーマ既定値 == 出荷yml値 == ハードコード名」で一致しており、
# StatCategoryInference/PercentStatNormalize/StatVocabulary/editorがキー名変更に追随しないため
# 実質リネーム不可能だった(見せかけのconfig駆動)。ステキー名は
# combat/AttackStatKeys.java・combat/DefenseStatKeys.java の定数として固定されている。
# 旧バージョンのこのファイルにこれらのブロックが残っていても、スキーマに存在しないキーは
# 無視されるだけで読み込みエラーにはならない。
