# TrinityForge - Combat damage coefficients (M1 symmetric pipeline / physical component)
# All numbers here are provisional placeholders; tune after playtesting (IMPLEMENTATION_PLAN M7).
# Edit and run `/trinityforge reload` to apply without restart.
#
# The 8-step pipeline itself is structural (COMBAT_SYSTEM_SPEC section 2.1); these are the
# global, tunable knobs that feed it. Per-item / per-mob stats live in PDC, not here.
# 設定リファレンス(本文コメント移設先): docs/config-reference/combat/damage.md

physical:
  base-coefficient: 1
  min-component-damage: 1
melee-charge:
  enabled: true
  min-multiplier: 0.1
  exponent: 1.6
attack-speed:
  min-effective: 0.1
  reconcile-interval-ticks: 10
magical:
  base-coefficient: 1
  min-component-damage: 1
  scale-with-combat-level: true
  attack-power-scale: 1
weapon-base-formula:
  enabled: false
  a: 2
  b: 100
level-scaling:
  per-level: 0.01
defense:
  max-mitigation-rate: 0.9
  max-dodge-chance: 0.9
  max-crit-reduction: 1
  min-rate: 0
  max-rate: 1
  min-flat: 0
  max-flat: 1000000
  enchant-protection-scale: 0.5
bleed:
  tick-interval-ticks: 20
  ticks: 5
aoe:
  hit-players: false
pvp:
  # enabled は「抑制を掛けるか」。false にすると対人もモブと同じ計算 = 即死になる。
  # 出荷は抑制 ON + 倍率 0 = 対人ダメージ無し(PvP無し)。
  enabled: true
  damage-multiplier: 0
  max-damage-percent-of-max-health: 0.15
vanilla-armor:
  defense-rate-per-point: 0.015
  defense-rate-max: 0.8
  armor-strength-per-point: 0
sunlight-burn:
  enabled: true
  damage-percent-of-max-health: 0.1
  mobs:
    - ZOMBIE
    - ZOMBIE_VILLAGER
    - DROWNED
    - GIANT
    - SKELETON
    - STRAY
    - BOGGED
    - PHANTOM
    - ZOMBIE_HORSE
    - SKELETON_HORSE
early-level-attack:
  enabled: true
  until-level: 10
  level-0-multiplier: 0.7
# レベル差による経験値・ドロップの足きり(低レベル狩りの抑制 / 高レベルモブのドロップ制限)。
# ⚠ over/under はモブではなく【プレイヤー】が主語。over-level はプレイヤーのほうが高レベルなときに
#   効く側で、「格上狩り」と読むと向きが逆になるのでその言い方はしない。
# over-level: 自分(戦闘レベル)が threshold 以上モブより高いと発動。exp-rate/drop-rate は発動直後の初期倍率
# (-1で完全遮断、1で無干渉)。exp-decay-per-level/drop-decay-per-level は閾値超過1レベルごとに
# その初期倍率からさらに引く量(既定0=減衰なし=従来どおり固定レートのまま)。rate-floor は減衰後の下限。
# under-level: モブが自分より item-threshold 以上高いと発動。2026-08-18 に over-level と完全対称にした
# (以前は「TF追加ドロップを一切付けない」の全か無かだけで、経験値には一切効かなかった)。狙いは
# 低レベルのままハメ殺しやデスルーラーで高レベルのモブを狩る行為の抑制。撃破EXPはモブのレベルで伸びるので、
# 経験値に効かないことが一番大きな抜け穴だった。
# ⚠ アイテム側の閾値のキー名は item-threshold のまま据え置き(リネームすると配備済み config の値が
#   無言で既定値に化けるため)。経験値だけ別の起点から絞りたいときは exp-threshold を書く
#   (未設定/-1 なら item-threshold を使う = 従来どおり1本の閾値で両方が発動する)。
# ⚠ パーティでの同行は区別しない。レベル差だけで判定するので、高レベルの人にダンジョンへ連れて行って
#   もらった低レベルも同じだけ削られる(免除を入れると低レベルを連れて行くだけで抑制を回避できるため)。
# ⚠⚠ 【比較に使うレベルは対象で3種類に分かれる】(2026-08-22 ユーザー指示で職業EXPだけ切り替えた)。
#   ・職業(スキル)EXP  → 【そのEXPが入る職業のレベル】。軽武器の撃破EXPなら軽武器スキルのレベル、
#                        魔法の撃破EXPなら ARS_MAGIC のレベル。
#   ・バニラの経験値オーブ → 【戦闘レベル】。帰属する職業が無いのでこれしか基準が無い。
#   ・TF追加ドロップ      → 【戦闘レベル】。同上。
#   閾値と逓減は経験値の2種で共通(exp-threshold / exp-decay-per-level)。違うのは比較する数だけ。
#
#   なぜ職業EXPだけ切り替えたか: 戦闘レベルは progression/combat-level.yml の pillar 写像で
#   全スキルを1つに畳んだ値で、単一特化のプレイヤーでは最高スキルの約 2/3 にしかならない
#   (top1 の divisor が 1.5)。つまり【畳んだ結果とEXPの帰属先が別物】だった。
#   ・直感に反する側: 軽武器100 の純特化プレイヤーの戦闘レベルは 67 なので、軽武器スキルが
#     ちょうど100でも Lv100 モブとのレベル差は 0 ではなく【33】と判定され、軽武器EXPが削られていた。
#   ・抑制が効かない側: 伸びている柱に引っ張られて【遅れている職業ほど足きりが甘くなる】。
#     軽武器80・魔法1の人が高レベルダンジョンで魔法を振っても、判定は魔法1ではなく戦闘Lv53で行われ、
#     本来抑制したい「高レベル帯での新スキル一気育て」が素通りしていた。
#   職業レベル基準にすると両方の向きが同時に直る。
#
# ⚠ 2026-08-19 W-148 の教訓は【バニラEXPとTF追加ドロップ側では今も有効】── そちらは戦闘レベルのままなので、
#   閾値をいじるときは /tf status の戦闘レベルを基準に考えること。スキルレベルで考えると
#   常に 1/3 ぶん甘く見積もることになる。
#
# 下の既定値: TF追加ドロップは20レベル差で完全遮断。経験値(職業/バニラとも)は15差から絞り始め、
# 超過1レベルごとに0.067ずつ落ちて30差で0になる(=15〜30差の区間をかけて0へ)。
# 目安: 15差=満額 / 20差=0.67倍 / 25差=0.33倍 / 30差以上=0。
#
# 2026-08-22: 25 / 0.04(50差で0)から 15 / 0.067(30差で0)へ戻した。25 は 2026-08-19 に
# 「戦闘レベルは構造的にスキルレベルより約1/3低い」ぶんを吸収するための水増しとして置いた値で、
# 職業EXPを職業レベル基準にした時点でその理由が消えた(据え置くと足きりが当初意図より大幅に緩くなる)。
# 15/0.067 は 2026-08-18 に最初に決めた形そのもので、今回ようやく意図どおりの意味になった。
level-cutoff:
  over-level:
    threshold: -1
    exp-rate: 1
    drop-rate: 1
    exp-decay-per-level: 0
    drop-decay-per-level: 0
    rate-floor: 0
  under-level:
    item-threshold: 20
    exp-threshold: 15
    exp-rate: 1
    drop-rate: -1
    exp-decay-per-level: 0.067
    drop-decay-per-level: 0
    rate-floor: 0
    bonus-per-level: 0
    bonus-cap: 0
# ダンジョンの挑戦レベルに応じた報酬の増減(2026-08-18 W-80)。
# EMダイナミックダンジョンは入場時に挑戦レベルと難易度を自分で選ぶ。選んだレベルはインスタンス内の
# モブ全員のレベルになるので敵の強さには効いていたが、報酬にはほとんど効いていなかった ── TF追加ドロップの
# chance は combat/mob-overrides.yml の固定値でレベル項が無く、撃破EXPもモブレベルに対して
# 1.008 乗の緩い傾斜しか持たない。結果「選べる中で一番低いレベルを選んで最速で回す」のが常に最適で、
# 高いレベルを選ぶ理由がどこにも無かった。
# ⚠ ここが効くのはダンジョンワールド(EMのインスタンス)で倒したモブだけ。オーバーワールドの
#   高レベルモブを倒しても一切効かない。判定に使うのは「倒したモブのレベル」= 選んだレベル±難易度補正で、
#   プレイヤーとのレベル差ではない(レベル差で書くと上の under-level の狙いと正面衝突するため)。
# ⚠ 上の足きりを掛けたあとに乗る。足きりが完全遮断(0)を返したキルは増減しても0のまま。
# ⚠ 難易度 normal/hard/mythic は EM 側でモブレベルを -5/±0/+5 動かす(fork の DynamicDungeonInstance)。
#   step を 5 にしてあるので「難易度1段 = 報酬1段」で対応する。
# 出荷値でのモブレベル別の倍率(ドロップ / EXP):
#   15以下 0.70 / 0.80(下限)  20 0.76 / 0.88  30 0.92 / 0.96  35 1.00 / 1.00(等倍)
#   40 1.08 / 1.04  50 1.24 / 1.12  60 1.40 / 1.20  70以上 1.50 / 1.25(上限)
dungeon-level-reward:
  enabled: true
  # 倍率がちょうど1.00(規定値)になるモブレベル。これより低いダンジョンは規定値より少なく、
  # 高いダンジョンは多くなる。片側の上乗せだけにすると頭打ちの倍率を大きく取らないと差が出ないので、
  # 低い側を減らすことで頭打ちを下げている(2026-08-18 ユーザー指示)。
  pivot-level: 35
  # 何レベルごとに1段変えるか。EMの難易度が相対 levelSync ±5 で定義されているので5にしてある。
  step: 5
  # 1段ごとにTF追加ドロップ確率へ足す/引く割合。0.08 なら1段につき ±8%。
  drop-bonus-per-step: 0.08
  # ドロップ側の増加の頭打ち。0.5 なら最大 +50%(=1.5倍)。0 にすると増加側は無効。
  drop-bonus-cap: 0.5
  # ドロップ側の減少の頭打ち。0.3 なら最小 -30%(=0.7倍)。0 にすると減少側は無効。
  drop-penalty-cap: 0.3
  # 撃破EXPの1段あたりの割合。EXPはモブレベル自体でも伸びるのでドロップより緩やかにしてある。
  exp-bonus-per-step: 0.04
  # EXP側の増加の頭打ち。0.25 なら最大 +25%。
  exp-bonus-cap: 0.25
  # EXP側の減少の頭打ち。0.2 なら最小 -20%(=0.8倍)。
  exp-penalty-cap: 0.2
durability:
  dungeon-only: true
  respect-unbreaking: true
  prevent-break: true
  on-hit:
    enabled: true
    percent-of-max: 0.001
    min-damage: 1
    include-offhand: true
  on-death:
    enabled: true
    percent-of-max: 0.1
    min-damage: 1
    include-hands: true
