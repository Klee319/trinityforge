# TrinityForge - Combat damage coefficients (M1 symmetric pipeline / physical component)
# All numbers here are provisional placeholders; tune after playtesting (IMPLEMENTATION_PLAN M7).
# Edit and run `/trinityforge reload` to apply without restart.
#
# The 8-step pipeline itself is structural (COMBAT_SYSTEM_SPEC section 2.1); these are the
# global, tunable knobs that feed it. Per-item / per-mob stats live in PDC, not here.
# 設定リファレンス(本文コメント移設先): docs/config-reference/combat/damage.md

physical:
  base-coefficient: 1
  min-component-damage: 1
melee-charge:
  enabled: true
  min-multiplier: 0.1
  exponent: 1.6
attack-speed:
  min-effective: 0.1
  reconcile-interval-ticks: 10
magical:
  base-coefficient: 1
  min-component-damage: 1
  scale-with-combat-level: true
  attack-power-scale: 1
weapon-base-formula:
  enabled: false
  a: 2
  b: 100
level-scaling:
  per-level: 0.01
defense:
  max-mitigation-rate: 0.9
  max-dodge-chance: 0.9
  max-crit-reduction: 1
  min-rate: 0
  max-rate: 1
  min-flat: 0
  max-flat: 1000000
  enchant-protection-scale: 0.5
bleed:
  tick-interval-ticks: 20
  ticks: 5
aoe:
  hit-players: false
pvp:
  enabled: true
  damage-multiplier: 0.5
  max-damage-percent-of-max-health: 0.15
vanilla-armor:
  defense-rate-per-point: 0.015
  defense-rate-max: 0.8
  armor-strength-per-point: 0
sunlight-burn:
  enabled: true
  damage-percent-of-max-health: 0.1
  mobs:
    - ZOMBIE
    - ZOMBIE_VILLAGER
    - DROWNED
    - GIANT
    - SKELETON
    - STRAY
    - BOGGED
    - PHANTOM
    - ZOMBIE_HORSE
    - SKELETON_HORSE
early-level-attack:
  enabled: true
  until-level: 10
  level-0-multiplier: 0.7
# レベル差による足きり(2026-08-09、combat/mob-overrides.yml の level-cutoff から移設)。
# 以前はダンジョンモブ(EliteMobsスタンプ済み)にしか効かなかったため、ここへ移して全モブ共通にした。
# diff = プレイヤーの戦闘レベル - モブのレベル。over-level と under-level は独立に判定される。
#
#   over-level  … 自分が格上のとき。diff >= threshold で発動。
#     threshold : 発動するレベル差。負値(既定 -1)= この足きりは無効。
#     exp-rate  : 発動時に経験値へ掛ける倍率 [0.0, 1.0]。1.0 = 無干渉。-1 = 経験値0(完全に入手不可)。
#                 掛かる先は「バニラ経験値オーブ」と「TFの戦闘スキルEXP」の両方。
#     drop-rate : 発動時にTF追加ドロップの確率へ掛ける倍率 [0.0, 1.0]。1.0 = 無干渉。
#                 -1 = TF追加ドロップを一切付けない(完全に入手不可)。
#   under-level … 自分が格下のとき。(モブLv - プレイヤーLv) >= item-threshold でTF追加ドロップを
#     item-threshold : 遮断する。負値(既定 -1)= この足きりは無効。経験値には一切影響しない。
#
# 【対象外】バニラ本来のドロップには一切関与しない。止めるのはTFが追加したドロップ
#   (mob-overrides.yml の drops: / mob-level-table.yml の add-drops / mob-types.yml の drops)だけ。
#   バニラドロップまで止めるとモブトラップが完全に死んで「足きり」の域を超えるため(2026-07-27 設計判断)。
# 【対象外】レベルの刻印が無いモブ(TF管理下でない野良モブ)は判定しない。刻印が無いと
#   モブLv=0 として扱われ、格上判定が常に発動してしまうため。
level-cutoff:
  over-level:
    threshold: -1
    exp-rate: 1.0
    drop-rate: 1.0
  under-level:
    item-threshold: -1
durability:
  dungeon-only: true
  respect-unbreaking: true
  prevent-break: true
  on-hit:
    enabled: true
    percent-of-max: 0.001
    min-damage: 1
    include-offhand: true
  on-death:
    enabled: true
    percent-of-max: 0.1
    min-damage: 1
    include-hands: true
