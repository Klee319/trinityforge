# TrinityForge - Per-mob defender profiles (concern: bulk-convert distributed EliteMobs mobs).
# Generated by `/trinityforge importmobs <folder>` from EliteMobs custombosses files, keyed by mob
# id (the EliteMobs file name without extension). The EliteMobs fork stamps these onto each mob's
# PDC at spawn (MobData); they then drive the symmetric damage pipeline (defense-rate%/resistance%/
# damage-reduction%/flat-defense + shared armor-strength). Editing here + /trinityforge reload
# re-tunes mobs live. Running importmobs again MERGES into this file: only the ids produced by that
# run are replaced; every other id already here — mobs from a different dungeon imported earlier, or
# a hand-authored counter-theme exception mob (TRINITY_SPEC 2) — is left untouched.
#
# Each entry:
#   level            (int) combat level -> MOB_LEVEL
#   dungeon-theme    (str) attribute theme, or "" for none
#   source-name      (str) informational: the EliteMobs display name (ignored at runtime)
#   entity-type      (str) informational: the EliteMobs entityType (ignored at runtime)
#   armor-strength   (double) 防具強度, shared across components
#   max-health       (double) TrinityForge-driven max HP. 0 (or absent) = the EliteMobs fork keeps
#                    the mob's own level-scaled HP; > 0 overrides it (敵HPをTF化). Requires
#                    hp-delegation: true in the fork's trinityforge.yml (default on).
#   physical / magical: { defense-rate, resistance, damage-reduction, flat-defense }
#   attack           (optional) attacker-side stats stamped at spawn (mob→player pipeline):
#                    { attack-power, flat-bonus-damage, percent-bonus-damage, crit-chance,
#                      crit-damage, penetration, damage-modifier, fixed-damage }
#                    absent = the mob keeps its vanilla/EliteMobs damage untouched
#
# Example (hand-authored ids like this survive re-import; only ids re-imported from source are
# replaced):
# profiles:
#   debt_collector:
#     level: 10
#     dungeon-theme: ""
#     source-name: "&cDebt Collector"
#     entity-type: "ZOMBIE"
#     armor-strength: 0.0
#     max-health: 70.0
#     physical: { defense-rate: 0.0, resistance: 0.0, damage-reduction: 0.0, flat-defense: 0.0 }
#     magical:  { defense-rate: 0.0, resistance: 0.0, damage-reduction: 0.0, flat-defense: 0.0 }

profiles: {}
