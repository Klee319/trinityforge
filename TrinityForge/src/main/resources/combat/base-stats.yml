# TrinityForge - プレイヤー基礎ステータス (player base stats)
#
# 装備・スキル・バフを一切持たない素のプレイヤーへ、全員一律で加算されるステータスの初期値。
# ここに書いたステータスは、装備/スキルツリー/ロールバフ等の合算に「もう1レイヤ」として加わる。
#
# ● キーは lore.yml の stats に出るステータス名 (例: crit-chance, phys-flat-defense, max-health)。
# ● 値の書き方は item-stats.yml と同じ (PERCENT系は「5」=5%、FLAT系はそのままの数値)。
# ● 0 は「加算なし」= 未記載(空欄)と完全に同じ扱い(BaseStatsConfig がロード時に0値を捨てるため)。
#   このファイルは stats/lore.yml の全ステータスキーを、0のものも含めて明示的に列挙している
#   (2026-07-25: 「どのステが対象で今いくつか」を一覧できるようにする方針)。
# ● 編集後は /trinityforge reload で即時反映。
#
# ⚠ attack-power (攻撃力) は特殊: これは「武器の基本ダメージを置き換える」ステなので、ここに基礎値を
#    入れると全プレイヤーの素手/バニラ武器の基本ダメージが置き換わり、エンチャント(ダメージ系)も
#    無効化されます。通常は空欄(0)のままにしてください。
#
# ⚠ move-speed / attack-reach / knockback-resistance / max-health (StatVocabulary の ATTRIBUTE
#    チャネル) だけは他のキーと意味が異なり、「絶対値方式」です(2026-07-25 config editor T1)。
#    ここに書いた値は、プレイヤーの最終的な絶対値そのものを意味します。例えば attack-reach に 6 と
#    書けば実際のリーチが 6 ブロックになります(加算ではありません)。
#    ● 0 および未記載(空欄)は、これまで通り「バニラのまま(何も加算しない)」を意味します。
#      このため、この4キーに限り「バニラ既定値より小さい値」を書いた場合はその通りの絶対値になりますが、
#      「バニラ既定値と厳密に一致する値」は 0 と区別できず「未記載」と同じ扱いになります(実質バニラの
#      ままなので実害はありません)。
#    ● バニラ既定値(出典: Minecraft Wiki "Attribute"): attack-reach=3.0 / max-health=20.0 /
#      move-speed=0.1 / knockback-resistance=0.0
#    ● 実装は読み込み時に (書いた値 - バニラ既定値) へ変換して内部保持するため、装備/スキルツリー/
#      ロールバフ等の加算レイヤとの合算ロジックは変更していません(BaseStatsConfig 参照)。
#
# ⚠ attack-speed-bonus(割合・全ソース横断)は「加算レイヤ」のままです(絶対値方式ではありません)。
#    バニラ既定が0のため、書いた値がそのまま加算量になります。装備/スキルツリー/ロールバフ/
#    item-stats.yml側のattack-speed-bonusと合算され、PerkAttributeApplier が最終適用します。
#
# ⚠ attack-speed(絶対値・メインハンド専用)は 2026-07-26 の stat-scope 境界引き直しで、
#    総合ステ(base-stats含む)から「アイテム固有ステ」へ降格しました。このファイルにはもう存在せず、
#    武器の stats/item-stats.yml 側の attack-speed(その武器をメインハンドで持ったときにだけ効く絶対値)
#    でのみ設定できます。プレイヤー全体へ一律の絶対値を課す欄は廃止されました
#    (誤って1.6等バニラ武器の速度をここへ書いてしまう事故が過去にあったため、根本的に排除した設計判断)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/combat/base-stats.md

