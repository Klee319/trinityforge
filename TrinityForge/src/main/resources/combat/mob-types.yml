  # 同ファイル側の mobs: フィルタでこの群を一度も列挙していない。
  # 【2026-07-27】B群(中立)のうち繁殖・建造で無限に増やせるもの
  # (BEE/GOAT/LLAMA/TRADER_LLAMA/PANDA/WOLF/IRON_GOLEM)も、同じ理由で
  # mob-level-table.yml の mobs: から外した。牧場を殴るのが最効率のEXP稼ぎに
