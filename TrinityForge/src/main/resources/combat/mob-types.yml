# ============================================================================
# combat/mob-types.yml
# バニラモブ(EntityType単位)へレベル/HP/防御ステータス/座標係数/レベル係数/追加ドロップを付与する設定。
#
# 既存の combat/mob-profiles.yml (EliteMobs輸入モブ向け、MobProfileConfigが読む) とは完全に独立した
# 別系統のconfigです。mob-profiles.yml / MobProfileConfig / MobProfile は一切変更・参照しません。
#
# defaults: プロファイル無し(未タグ付け)モブの既定防御・任意の最大HPもこのファイルで編集します。
#   combat/mob-defaults.yml は後方互換のため残存しますが、編集の正は defaults: です。
#   ※ defaults は動物・村人など非戦闘Entityにも効く。フィールド戦闘カーブは mob-types の敵対モブへ載せる。
#
# 各キーは大文字の EntityType 名 (例: ZOMBIE)。存在しないEntityType名は警告してスキップされ、
# 他のエントリの読み込みは継続します。
# 個別エントリは defaults を継承しない（欠けた項目は0/未設定）。役割差はベースと係数の両方に掛ける。
#
# 項目説明:
#   max-level               : 距離由来の実効レベル(effectiveLevel = level + floor(距離 ×
#                             coordinate-coefficient))の上限(整数、既定100)。上限が無いと
#                             ワールドスポーンから非常に遠い地点でLv1000等に達し、貫通が1.0へ
#                             飽和して防御ステが全て無意味になる(CMB-21)。既定100は本ファイル/
#                             combat/mob-import.yml の成長式がLv100を想定して設計されているため
#                             (コメントに「Lv100で約134.5」等の記述がある)。タグ付き/未タグ付け
#                             (defaults)問わず全モブに一律で効く。
#   defaults                : 未タグ付けモブの既定 (level / coordinate-coefficient / max-health /
#                             armor-strength / physical / magical / level-coefficients / attack)。
#                             max-health 省略時はバニラHPのまま。
#                             level と coordinate-coefficient は mob-types 各エントリと同じ意味。
#                             いずれも 0 かつ防御・係数・HPが空なら刻印せず従来の戦闘合算パスを維持。
#   level                   : 基準となる戦闘レベル (整数、0以上)
#   coordinate-coefficient  : ワールドスポーン地点からの距離1ブロックあたりのレベル加算係数
#                             (effectiveLevel = level + floor(距離 * coordinate-coefficient))
#   max-health              : 最大HP基準 (省略可)。省略時はバニラHP。設定時はスポーンで Attribute.MAX_HEALTH を上書き
#   armor-strength          : 防具強度 (物理/魔法で共有、0以上)
#   physical / magical      : 防御率(defense-rate) / 耐性(resistance) / 被ダメージ軽減(damage-reduction)
#                             (いずれも0.0〜1.0) / 守備力(flat-defense、0以上)
#   attack                  : 攻撃側 (attack-power / flat-bonus-damage / percent-bonus-damage /
#                             crit-chance / crit-damage / penetration / damage-modifier / fixed-damage /
#                             magic-ratio)。damage-modifier の中立値は 1.0（0.0 にするとダメージが半減する）。
#     magic-ratio (2026-08-02新設): このモブの通常攻撃(近接/投射)を魔法として解決する割合 [0.0, 1.0]。
#       既定 0.0 = 完全物理(従来どおり、未設定なら挙動は1ミリも変わらない)。1.0 = 完全魔法。
#       中間値(例: 0.5)は物理/魔法の2コンポーネントへ分割し、回避ロールは1回のまま両方へ通す
#       (プレイヤーの物理防具と魔法防御がそれぞれ担当分だけ効く「半分魔法」モブが作れる)。
#       真偽値ではなく比率にした理由: 「半分物理・半分魔法」の中間モブを表現でき、0.0既定のまま
#       完全な後方互換になるため。
#     【割り当ての方針】「魔法モブ4割・物理モブ6割」を満たすため、バニラで元から魔法的な手段
#       (術・ビーム・火球・弾・呪い)で攻撃するモブ17種に設定した。これは既存モブの性質を
#       書き換えたのではなく、【機構が無かったせいで表現できていなかった性質を、やっと表現できる
#       ようになった】もの。魔女がポーションを投げて物理ダメージになっていた方がおかしい。
#       純粋な近接モブ(ゾンビ/スケルトン/クリーパー/ピグリン等)は完全物理のまま一切変えていない。
#       内訳: 敵対モブ41種のうち magic-ratio >= 0.5 が14種。これに mob-overrides.yml の
#       派生カスタムボス6種(全て >= 0.5)を足して 20/47 = 42.6% が「主に魔法で殴るモブ」。
#       比率で重み付けした魔法ダメージのシェアは 35.7%。どちらの数え方でもおおよそ4割。
#       残る STRAY/BOGGED/WITHER_SKELETON の3種は 0.3〜0.4 で「主に物理・一部魔法」側に数えている。
#   level-coefficients      : レベル1あたりの各ステ加算係数
#                             実効値 = 基準 + 係数 × effectiveLevel
#                               max-health / armor-strength / physical{...} / magical{...} / attack{...}
#                             max-health と attack.attack-power のみ任意で指数成長に対応:
#                               実効値 = (基準 + 係数 × effectiveLevel)
#                                        × growth ^ (effectiveLevel / growth-interval)
#                               max-health          → max-health-growth / max-health-growth-interval
#                               attack.attack-power → attack.attack-power-growth /
#                                                      attack.attack-power-growth-interval
#                               growth 省略 or 1.0 = 従来どおりの線形 (後方互換)。
#                               growth-interval は growth 1回分あたりのレベル幅 (省略時 1.0)。
#                             さらに max-health と attack.attack-power は「高レベル区間」を持てる
#                             (加算専用の第2区間。ConversionPolicy.Ramp と同じ意味):
#                               level >= high-level-from のとき
#                                 実効値 += high-level-per-level × (level − high-level-from)
#                               max-health          → max-health-high-level-from /
#                                                      max-health-high-level-per-level
#                               attack.attack-power → attack.attack-power-high-level-from /
#                                                      attack.attack-power-high-level-per-level
#                               ※ combat/mob-import.yml(ダンジョン側)の
#                                 attack-power: { ..., high-level-from, high-level-per-level } と
#                                 同じ意味・同じ出荷値。あちらはランプを1つのマップに畳む書式なので
#                                 入れ子キー名が短いだけで、意味は完全に同じ。
#                               両キーとも省略時は「発動しない」(from = 無限大 / per-level = 0)
#                               = 従来どおり完全に無干渉 (後方互換)。
#                               乗算ではなく加算なのは、基準カーブが0のステでも効かせられるため。
#                               level == from ちょうどでは0を足す (境界で不連続にならない)。
#   drops                   : 追加ドロップ一覧 (省略可)。各要素は以下を持つ:
#                               material: Material名 または custom:<カスタムアイテムID> (必須)
#                                         (2026-08-01 U13) custom: は items/catalog.yml の ID と
#                                         ArsPaper materials.yml の ID の両方を引ける。解決できない
#                                         IDはその1件だけWARNINGを出して捨てる(他のドロップは出る)。
#                                         mob-overrides.yml の drops[].item /
#                                         mob-level-table.yml の add-drops[].material と同じ書式。
#                               chance  : 1死亡あたりのドロップ確率 [0,1] (必須)
#                               min/max : ドロップ個数の範囲 (両方0以上、min<=max、必須)
#                               quality : 固定品質値 (省略可。省略時はモブレベル駆動で自動決定)
#                                         ※ custom: のときは無効 (カタログ品の品質は生成側が決める)
#
# バランス方針 (2026-07-24 / item-stats 装備帯アンカー):
#   - 主戦場は use-lv 0〜40（木〜金）。同帯ライトソードで約6ヒット、同帯軽〜中防具で約12〜20ヒット耐え。
#   - coordinate-coefficient 0.02 → 約500ブロックで +10レベル（装備帯の刻みに合わせる）。
#   - Lv55+ フィールドはエンド装備より柔らかめ（高難易度の本命はダンジョン/Elite）。
#   - Golden フル（flat守備が大きい）はフィールド線形火力ではほぼ無敵に近い — 仕様上の割り切り。
#
# バランス方針 (2026-07-25 v2 / 指数プレイヤー火力への追従 + 装備帯ギャップ強化):
#   プレイヤーの武器 tier は木63→インフィニティ51,408と約800倍の指数的伸び。フィールドモブHPが
#   従来どおり線形(380+55×Lv)だと高レベルで一撃即死になる。一方プレイヤー最大HPは仕様上
#   20(バニラ)→60(♡3列, 防具合算含む)で頭打りにする方針が確定している。
#   さらに校正要件が「同帯装備の厳選度で難度が決まり、帯が1つ足りない装備では基本的に勝てない」
#   に確定したため、攻撃力も準線形ではなく指数にして、装備帯間のギャップを守備力の伸びより
#   大きくする(準線形だと1帯下の防具でも守備力が足りてしまい、適正帯未厳選<1帯下理論値という
#   逆転が起きるため)。よって:
#     - max-health: growth 1.055 の指数(旧線形係数は0にして二重計上を回避)。変更なし。
#       プレイヤー最大HP 20→60・4部位守備力合計 5.4→66.2 という帯別調整と組み合わせ、
#       「被弾 = (敵攻撃−守備力)×%軽減」が全帯で概ね HPの1/10 = 同帯装備で約10発耐える設計。
#     - attack.attack-power: base 5.5 (線形項なし) / growth 1.03 の指数へ変更(旧: 準線形
#       base6/per-level0.6を撤回)。Elite側(base7.0/growth1.03)の約8割の攻撃力。
#       Lv100で約105.7(Elite Lv100≈134.5の約8割)。
#   プレイヤー側の守備力・最大HPカーブは別作業で同時に調整される(Lv100で守備力 111→126、
#   最大HP 50→60 の想定)。attack-power の指数はその前提と噛み合うよう校正した値。
#   base の大小関係(役割差=ENDERMAN>SPIDER系>SKELETON系>ZOMBIE系)は max-health については
#   写像後も維持している。attack-power も役割差を復元した: base はモブごとに 5.5〜6.6
#   (HPの低いモブほど高い：骸骨系6.05 / 蜘蛛系6.325 / エンダーマン6.6)、growth 1.03 は共通。
#   (mob-types.yml 全エントリの検算はセッションレポート参照)。
#
# バランス方針 (2026-07-27 v3 / 防御係数の圧縮):
#   なぜ変えたか: 防御4種(defense-rate/resistance/damage-reduction/flat-defense、物理・魔法とも)
#   と防具強度に一律 level-coefficients 0.007 が掛かり、レベルとともに乗算で積み上がって
#   Lv100 で複合軽減率が 97% に達していた。combat/damage.yml の
#   defense.max-mitigation-rate: 0.9 はキー個別の上限であり、複数キーの積を止められない。
#   結果、表示HP 80,358 に対し実効HPが約266万まで膨らみ、同帯装備での撃破打撃数が
#   Lv0 6.5発 → Lv100 41.1発 まで単調に膨張していた。
#
#   何をしたか(案2: 防御係数を圧縮して表示HPと体感を一致させる、ユーザー承認済み):
#     - level-coefficients の防御係数(armor-strength / physical・magical の
#       defense-rate・resistance・damage-reduction・flat-defense): 0.007 → 0.0025
#     - level-coefficients.attack.penetration: 0.008 → 0.002
#     - level-coefficients.max-health-growth: 1.055 → 1.048
#     - 各エントリの基準 max-health(defaults 含む): ×1.0526(小数第1位四捨五入)
#       例: defaults 380→400 / 323→340 / 190→200 / 2280→2400
#     - level-coefficients.attack.attack-power-growth: 1.03 → 1.033(後述)
#
#   attack-power-growth を 1.03→1.033 に上げた理由(2026-07-27、ユーザー決定):
#     被ダメージは「モブ攻撃力 − プレイヤー守備力」という2つの指数の引き算で決まる。
#       モブ攻撃力     = 5.5   × g^L
#       守備力(重装フル) = 2.71 × 1.0378^L
#     g=1.03 だと守備力の伸びの方がわずかに速く、Lv95付近で追い越して被ダメージが
#     min-component-damage の床(1.0)に張り付いていた(Lv100 のゾンビは文字通り1ダメージ=50発耐える)。
#
#     ▼ 各帯の「適正帯フル装備(厳選なし)で ZOMBIE 同レベルに何発耐えるか」(実測・対角線):
#       g       革Lv0  銅Lv10  鎖Lv20  鉄Lv30  金Lv40  ダイヤLv55  ネザLv70
#       1.03     8.1    -       -       -       -       8.5(Lv55)  8.7(Lv70)  ※Lv85で13.8/Lv100で50に発散
#       1.031    8.1    6.9     8.0     6.2     7.6     7.1        6.7
#       1.033    8.1    6.6     7.2     5.5     6.2     4.8        4.0   ← 採用
#       1.035    8.1    6.4     6.5     5.0     5.2     3.5        2.7
#     1.033 を選んだ理由: 1.031 は全帯 6.2〜8.1発でほぼ平坦だが「同帯装備でちょっと強い」には
#     緩すぎる。1.035 は高帯(ダイヤ3.5/ネザ2.7)が事故死域まで落ちる。1.033 はLv0〜40を
#     5.5〜8.1発に保ったまま高帯を4.0〜4.8発へ引き締める中間点。
#
#     ⚠️ この値は「引き算がほぼ相殺する領域」にあるため極めて敏感で、上表のとおり
#     0.002 の差が高帯で 1.5〜2倍の被弾数差になる。**stats/item-stats.yml の
#     phys-flat-defense(守備力)を変更したら、この値も必ず再校正すること。**
#     再校正用のスクリプト: tmp/dmg-table.js (config を直接読んで上表を再生成する)
#     恒久解は combat/damage.yml の pvp 節にある max-damage-percent-of-max-health と同型の
#     「最大体力に対する割合の下限」をモブ→プレイヤー経路にも置くこと(スケールフリーで
#     装備数値の変更に強い)だが、コード変更が要るため今回は見送っている。
#
#   効果: Lv100 の複合軽減率が 97% → 約57% に下がり、「表示HPと実効HPの乖離」が
#   約33倍から約2.3倍へ縮小する。撃破打撃数は Lv0 6.8 / Lv20 12.0 / Lv55 8.1 / Lv100 7.4 と
#   帯間で平坦化する見込み。
#
#   貫通係数を下げた理由: モブの貫通が高いとプレイヤーの防具値(防御率)が高レベルで
#   無意味になり、被ダメージが「守備力の引き算」だけで決まる一本足打法になっていたため。
#
#   残る既知の課題:
#     - Lv20 と Lv40 は武器ラダー側が平坦(石10→銅20 が 1.0134/Lv、鉄30→金40 が 1.0302/Lv)
#       なため、この変更後も撃破打撃数が他帯より多めに残る。武器側(stats/item-stats.yml)の
#       是正は別課題。
#     - coordinate-coefficient: 0.02 なので Lv100 のモブに会うにはスポーンから
#       5,000 ブロック必要。実際に遭遇しやすいのは Lv0〜55(0〜2,750ブロック)帯である。
#
# バランス方針 (2026-08-03 v4 / 高レベル区間の攻撃力 — 要件#63「被弾もうちょっと痛くていい」):
#   何が壊れていたか: 2026-08-03 の「45+難易度修正」で max-health 側には
#   max-health-high-level-from/per-level(Lv45以降の加算専用の第2区間)が入り、フィールドモブのHPは
#   Lv60 で約3.08倍まで積み増された。ところが【攻撃力側には同じキーがそもそも存在しなかった】
#   (リポジトリ全体で attack-power-high-level-* の grep がゼロ件)。ダンジョン側の
#   combat/mob-import.yml には attack.attack-power の high-level-from: 45 /
#   high-level-per-level: 0.25 が入っていたので、フィールドだけが
#   「硬いだけで痛くない(＝殴り合いが長引くだけ)」方向へ片寄っていた。
#
#   何をしたか: mob-import.yml と同じ意味・同じ出荷値のキーを新設し、
#   level-coefficients.attack へ全50エントリ(敵対41種＋反撃してくる中立9種)に一律で入れた。
#     attack-power-high-level-from: 45 / attack-power-high-level-per-level: 0.25
#   Lv45未満は 1 ミリも変わらない(第2区間は level == 45 でちょうど 0 を足す)。
#
#   ▼ ZOMBIE(base 5.5 / growth 1.033)の実効攻撃力:
#     Lv45  23.7 → 23.7  (±0、境界で連続)
#     Lv60  38.6 → 42.3  (+9.7%)
#     Lv80  73.9 → 82.6  (+11.8%)
#     Lv100 141.4 → 155.1 (+9.7%)
#   base の役割差(5.5〜16.5)には掛からず全モブに同じ量を足すので、弱いモブほど相対的に強くなる。
#   これは意図的 — 高レベル帯で「雑魚だけ無害」になるのを潰すのが目的で、強モブ側は既に痛い。
#
#   なぜ攻撃力だけを小さく回すのか: 被ダメージは「モブ攻撃力 − プレイヤー守備力」を先に引いてから
#   率を掛けるため、攻撃力の増分は"守備力を引いた残り"に対して何倍にも効く(mob-import.yml の
#   同じ節の解説と同じ理屈)。よってここは 0.05 刻みで動かすレバーであり、大きく回すと即詰みになる。
#   attack-power 以外(fixed-damage 等)を上げるのは禁じ手 —— 守備力で減らせない = 対策不能になる。
#   ⚠️ 上表は式からの計算値。「同帯装備で何発耐えるか」は stats/item-stats.yml の
#   phys-flat-defense と噛み合って決まるので、実測は tmp/dmg-table.js を回して確認すること。
# ============================================================================

max-level: 100

# dimensions: ディメンション別の基準(初期)レベルの下駄(2026-08-02導入)。
#   effectiveLevel = (levelまたはdefaults.level + dimensions.<ENV>.base-level)
#                    + floor(ワールドスポーンからの距離 × coordinate-coefficient)
#   キーは World.Environment 名(NORMAL / NETHER / THE_END / CUSTOM)。ワールド名では引かない
#   (ネザー/エンドのワールド名はサーバー構成依存で一致せず、EliteMobsのインスタンスワールドは
#   毎回名前が変わるため — forks-and-mobs.md 既知の罠と同じ理由)。
#
#   【適用範囲】バニラモブ(mob-types 配下のタグ付き・defaults の未タグ付けの両方)に加え、
#   EliteMobs 由来モブ(CustomBoss/取り込んだダンジョンモブ)の base-level にも乗る
#   (2026-08-02修正、MobTypeSpawnListener#applyDimensionLevelBonus)。ただし EliteMobs モブには
#   次の2点で「一律加算」ではない:
#     - base-level だけを「EM側が既に決めた MOB_LEVEL」に加算する。EM 自身が刻んだ防御/攻撃/HPの
#       値は一切上書きしない(EM のレベル決定ロジック自体を壊さないため)。
#     - coordinate-coefficient の上書きは EliteMobs モブには適用されない。EM は座標距離ではなく
#       自前のダンジョンレベル/SpawnRadiusDifficultyIncrementer で難度を決める別系統のため。
#
#   base-level: 整数、既定0(未設定/セクション自体を書かなくてもよい)。
#   coordinate-coefficient: 省略可。指定した場合のみ、そのディメンションのバニラモブ全体で
#     (mob-types各エントリ/defaults の)coordinate-coefficient を上書きする(EliteMobsモブには
#     効かない、上記参照)。
#     ⚠️ ネザーはオーバーワールド換算で距離が1/8になる(同じ体感距離でも実ブロック距離は1/8)。
#     このファイルの実装は「その場のワールド内の生のブロック距離」に係数を掛けるだけで、
#     8倍のような自動換算は一切行わない(据え置き)。ネザーでも通常世界と同じ体感カーブに
#     揃えたい場合は、この coordinate-coefficient を明示的に引き上げて運用側で補正すること
#     (ただし「8倍にする」は下の NETHER の節に書いたとおり max-level への飽和が早すぎるので非推奨)。
#   未設定(このセクション自体が無い、または個々のキーが無い)は必ず「従来どおり無干渉」
#   (下駄0・係数はモブ側の値のまま)になる。後方互換を壊さない。
#
# 【2026-08-03 ⚠️ここを空でなくするのは「バランスの大改造」であって設定作業ではない】
#   空のままだと MobTypeSpawnListener#applyDimensionLevelBonus の `if (bonus == 0) return;` で
#   必ず早期returnするため、その直後の reapplyDimensionBonusMaxHealth(「次元の下駄が攻撃力だけ
#   上げてHPを上げていない」という指摘への修正)へ制御が一度も到達しない。
#   ＝【下駄をHPへ反映する修正は、値を入れるまで死んだままである】。これは既知の状態。
#
#   一度 NETHER 20 / THE_END 45 を入れてみて、検算した結果【出せないと判断して戻した】:
#     ・下駄は各モブの level に加算され、その level が max-health-high-level-from(=45)を
#       またぐと per-level(モブごとに 554〜1293)が【毎レベル加算】される指数区間へ入る。
#       THE_END 45 は「エンドの全モブを高レベル区間の発火点ちょうどに置く」設定になる。
#       ENDERMAN(level:0 / 560HP / growth 1.048 / per-level 1293.02)で本島 ≒Lv47 の場合、
#       615HP → 7,653HP(約12倍)。外周1,000ブロック(≒Lv65)なら 1,422HP → 37,665HP(約26倍)。
#     ・ネザーは【二重計上】になる。ネザーのモブは既に level に難度が入っている
#       (BLAZE/GHAST/HOGLIN/WITHER_SKELETON 35、PIGLIN_BRUTE 40、PIGLIN/MAGMA_CUBE 25)。
#       オーバーワールドのモブが 0 なのに対し、そこへさらに +20 する意味は薄い。
#     ・副作用として MOB_LEVEL は EXP 帯と drops[].quality(省略時はモブレベル駆動)も動かすので、
#       取得EXPとドロップ品質も同時に跳ね上がる。
#   本当に必要なのは ENDERMAN/SKELETON のような「両次元に湧く level:0 モブ」だけなので、
#   入れるならモブ個別の level を見直す方が筋がよい。全体に効く下駄で解くなら、
#   まず THE_END を 45 ではなく 20〜30(高レベル区間に入らない範囲)から刻むこと。
dimensions: {}

# summoned: 召喚モブ(Ars の召喚魔法で出るモブ)のレベルを、召喚者のスキルレベルで決める。
#
# なぜ要るか: 召喚モブは特別扱いされておらず、周囲の野良モブとまったく同じ
# 「ワールドスポーンからの距離 × coordinate-coefficient」でレベルが決まっていた。
# 召喚は普通は拠点や戦闘中のその場で行うので、実際には【ほぼ常に Lv0】になり、
# 魔法使いがどれだけ熟練しても使い魔が強くならなかった。
#
# ここを有効にすると、召喚モブのレベルは召喚位置と無関係に
#   level = base-level + floor(召喚者の skill のレベル × level-per-skill-level)
# になる(max-level でクランプ)。HPと攻撃力はこのレベルから
# そのEntityTypeの通常の係数でスケールするので、召喚された骨は
# 「骨としての素の強さ」を保ったままレベルだけが召喚者に追随する。
#
# ⚠ 召喚モブの判別は ArsPaper が刻む PDC (arspaper:summoned / arspaper:summoner_uuid) に
#    依存している。フォーク側でこのキー名を変えると【無言で効かなくなる】。
# ⚠ 召喚者がオフライン等で引けない場合は、従来どおりの距離ベースへ落ちる。
summoned:
  # false なら従来どおり(召喚モブも周囲のモブと同じ距離ベース)。
  enabled: true
  # 参照するスキルid。ARS_MAGIC = 魔法。
  skill: ARS_MAGIC
  # 召喚者のスキルレベル1につき、召喚モブのレベルをいくつ上げるか。
  # 1.0 = 召喚者のレベルがそのまま召喚モブのレベルになる。
  level-per-skill-level: 1.0
  # スキルレベル0でも保証する下駄。0 のままだと初心者の使い魔が Lv0 のまま = 修正前と同じになる。
  base-level: 1
  # 召喚モブ専用の上限。0 なら上の max-level に従う。
  max-level: 0

# tamed: 手懐けた友好モブ(狼/猫/馬等、Bukkit の Tameable#isTamed())のレベルを、
# 飼い主の"スキル"ではなく総合戦闘レベル(progression/combat-level.yml の pillar式)で決める(M-2)。
#
# なぜ単一スキルを参照しないか(= summoned: との違い):
#   summoned: は Ars の召喚魔法という出所が決まっているので、参照するスキル(ARS_MAGIC)が
#   自然に1つに定まる。一方、テイムには「テイム専用スキル」というものがそもそも存在しない。
#   summoned: と同じ形式で単一スキルを指定するなら候補は ARS_MAGIC しかないが、それだと
#   「魔法を上げないと狼が育たない」という筋の通らない依存になってしまう
#   (弓/採掘/近接戦闘などを幾ら伸ばしても懐いた狼が全く育たない)。
#   飼い主の総合的な強さに追随させるべきものなので、単一スキルではなく
#   progression/combat-level.yml が出す総合戦闘レベルをそのまま見る。
#   (このセクションに summoned.skill に相当する skill: キーは存在しない。単一スキル方式を
#    採らないことの表明として意図的に省略している。将来 skill: を書いても無視される)
#
# level = base-level + floor(飼い主の総合戦闘レベル × level-per-skill-level) (max-level でクランプ)。
# HPと攻撃力はこのレベルからそのEntityTypeの通常の係数でスケールする(summoned: と同じ考え方)。
#
# ⚠ EliteMobs 所有のモブ(MOB_PROFILE_ID/MOB_DUNGEON_THEME を持つ個体)には適用しない。
# ⚠ 飼い主が特定できない場合(Tameable#getOwner()がnull等)は従来どおり無干渉。
# ⚠ 飼い主の総合戦闘レベルが後から上がった場合、次にそのモブのチャンクが読み込まれた時点
#   (EntitiesLoadEvent)で追随する。PlayerJoinEvent での全ワールド走査は
#   「そのプレイヤーが飼い主であるモブ一覧」を得る仕組みが無く重すぎるため採用していない。
tamed:
  # false なら従来どおり(手懐けモブはEntityTypeごとの通常のバニラ/mob-types値のまま)。
  enabled: true
  # 飼い主の総合戦闘レベル1につき、手懐けモブのレベルをいくつ上げるか。
  # 1.0 = 飼い主の総合戦闘レベルがそのまま手懐けモブのレベルになる。
  level-per-skill-level: 1.0
  # 飼い主の総合戦闘レベルが0でも保証する下駄。0のままだと駆け出しの狼がLv0のまま(修正前と同じ)。
  base-level: 1
  # 手懐けモブ専用の上限。0 なら上の max-level に従う。
  max-level: 0

