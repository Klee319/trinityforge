# TrinityForge - 頭上表示(HP/ダメージ)設定
# ---------------------------------------------------------------------------
# EliteMobs フォーク側の頭上表示(HPバー/数値HP/ボスバー/ダメージポップアップ/nametag)は
# fork の設定で全 OFF にしてある(TF の表示と二重になるため)。ここでは TF 独自の頭上表示を制御する。
# reload で反映される(表示エンティティは非永続・毎tick再構築のため次tickから効く)。
# ---------------------------------------------------------------------------

# 視線を向けた対象モブの頭上に Lv/名前/現HP/最大HP を出す表示(既存 FocusHpDisplay)。
focus-hp:
  # false にすると視線HP表示を止める。
  enabled: true

# プレイヤーがモブへダメージを与えたとき、実際に適用された TF ダメージ量を頭上へ一瞬ポップアップする。
# EliteMobs 独自のダメージ数値(TF戦闘に一本化した現在は不正確)の代替。数値は最終適用ダメージそのもの。
damage-popup:
  # false にするとダメージポップアップを出さない(パーティクル/軽量化目的)。
  enabled: true
  # ポップアップの表示時間(tick, 20tick=1秒)。短いほど画面が散らからず軽い。
  duration-ticks: 15
  # この値未満のダメージはポップアップしない(0=全て表示)。細かい削りで数字が溢れるのを防ぐ。
  min-damage: 1.0
