  # ---------------------------------------------------------------------------
  # 属性違いの対（2026-08-21 W-183）
  # ボスが「属性の違う技を撃ち分ける」ようにするため、既存アーキタイプの逆属性版を足した。
  # 片方の防御だけ積んだビルドが全部の技を受け流せてしまう状態を崩すのが目的。
  # ---------------------------------------------------------------------------

  flare_slam:
    display-name: "<red>灼熱踏み込み</red>"
    type: ground_slam
    damage-type: magical      # shockwave の魔法版
    damage-percent: 1.45
    cooldown-seconds: 10
    chance: 0.28
    range: 5
    radius: 5
    knockback: 0.5
    effects:
      - type: SLOWNESS
        duration-seconds: 3
        amplifier: 0
    particle: FLAME
    particle-count: 30
    sound: ENTITY_BLAZE_SHOOT

  void_lunge:
    display-name: "<red>虚無踏み込み</red>"
    type: charge
    damage-type: magical      # bull_rush の魔法版
    damage-percent: 1.7
    cooldown-seconds: 13
    chance: 0.26
    range: 14
    radius: 2.5
    knockback: 1.0
    particle: WITCH
    particle-count: 24
    sound: ENTITY_ENDERMAN_TELEPORT

  searing_lance:
    display-name: "<light_purple>貫きの刺突</light_purple>"
    type: beam
    damage-type: physical     # piercing_beam の物理版
    damage-percent: 1.7
    cooldown-seconds: 15
    chance: 0.25
    range: 22
    radius: 1.2
