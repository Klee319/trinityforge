# =============================================================================
# combat/mob-abilities.yml — 敵の特殊攻撃テンプレート
# =============================================================================
# 【何のためのファイルか】
#   敵の違いが「HPと攻撃力の数値だけ」だと、どのモブも同じ殴り合いになる。ここでは
#   攻撃手法と演出のバリエーションを「テンプレート」として定義し、
#   combat/mob-overrides.yml の各モブに abilities: [id, ...] で貼り付ける。
#
# 【なぜテンプレート方式なのか】
#   モブは 396 体ある。個別に数値を書き下すと、バランス調整のたびに 396 箇所を直すことになる。
#   テンプレート側の数値を 1 つ変えれば、それを貼った全モブに同時に効く。
#
# 【EliteMobs の powers との関係】
#   EM の powers はサーバの plugins/EliteMobs/custombosses/*.yml にしか無く、
#   リポジトリからは触れない。このファイルは TF 側で完結する別系統で、
#   EM モブにもバニラモブにも同じように貼れる。
#
# 【型 (type)】
#   ground_slam       自分の足元を中心にした全方位 AoE。「読んで離れる」動きを作る
#   projectile_volley 対象方向へ扇状に投射物を撒く。遮蔽物を使う動きを作る
#                     ※扇は【中央の1発以外は最初から相手を向いていない】。spread-degrees を
#                       広げるほど当たらなくなるので、20 度を超える値は「当てない演出」だと思うこと
#   projectile_rain   対象の頭上から投射物を降らせる。着弾まで約1秒あるので、
#                     その場に立っていると複数本当たり、動けば外れる（読んで動く技）
#                     radius=頭上にばら撒く円の半径 / count=本数 / projectile=降らせる EntityType
#   charge            対象へ突進し、着地後に周囲判定。突進線から外れる動きを作る
#   aura              一定時間、周囲に継続ダメージ/効果を撒く。立ち位置を強制する
#   teleport_strike   対象の背後へ転移して斬る。逃げ切りを許さない
#   beam              自分の向きへ直線状に判定を伸ばす。横に避ける動きを作る
#   summon            増援を呼ぶ。単体火力より範囲処理を要求する
#   repulse           全方位へ強く吹き飛ばす(上へも飛ぶ)。位置を崩すのが本体
#   vortex_pull       周囲を自分の方へ引き寄せる(repulse の逆向き)。遠距離の張り付かない立ち回りを崩す
#   delayed_zone      対象の足元へ印を置き、遅れて着弾する。予告を見て動けば避けられる代わりに高倍率
#   fixed_zone        （2026-09-04追加）対象の足元へ【床に固定された持続領域】を作る。aura との違いは
#                     「aura は術者を追従する、fixed_zone は展開後の位置が動かない」。詠唱(cast-seconds、
#                     未指定なら1.5秒)の間は輪の予告だけで無ダメージ、展開後は duration-seconds(既定6秒)
#                     の間 1 秒ごとに判定を刻む。予告予算は【展開までを予告として数え、展開時に解放する】
#                     ── 展開後の領域は「予告済みの一撃」ではなく床の持続効果として別枠で扱うため。
#                     術者が展開後に死んでも領域自体は残る(床に固定されているのが本質)。
#
# 【共通パラメータ】
#   display-name      発動時に周囲へアクションバーで出す技名（空なら無表示）。MiniMessage 可
#                     頭上表示ではなくアクションバーなのは統合版でも読めるため
#   damage-type       physical / magical。magical は魔法防御で受ける（防御の作り分けが意味を持つ）
#   damage-percent    そのモブの攻撃力に対する倍率。0 にすると「ダメージなしの演出＋効果だけ」
#   cooldown-seconds  同じモブが再発動できるまでの秒数
#   chance            判定 1 回あたりの発動率 [0,1]。判定間隔は下の check-interval-ticks
#   range             発動を試みる対象までの距離。これより遠い相手には撃たない
#   radius            AoE 半径 / beam の太さ / summon の湧き半径
#   count             投射数 / 召喚数 / beam の刻み数（= 射程 m）
#   spread-degrees    扇の開き角（projectile_volley、count>=2 のときだけ意味を持つ）
#   projectile        飛ばす EntityType 名（ARROW / SMALL_FIREBALL / WITHER_SKULL など）
#   summon-type       召喚する EntityType 名
#   duration-seconds  aura の持続秒数。1 秒ごとに damage-percent 分を刻むので、伸ばすほど総量が増える
#                     delayed_zone では「印を置いてから着弾までの予告秒数」(0.5〜5 秒に丸める。
#                     未設定は 1.5 秒。0 を即着弾にすると"避けられる技"が書き忘れで回避不能技に化けるため)
#   knockback         吹き飛ばし強度（0 なら吹き飛ばさない）。vortex_pull では【引き寄せ】の強さ
#                     ※ここの 0〜5 はそのままの速度ではない。Bukkit の速度はブロック/tick なので
#                       生の値を入れると場外まで飛ぶ(バニラのノックバックは約 0.4)。
#                       repulse は水平 0.4 倍・垂直 0.18 倍(上限 0.9)へ換算して適用する
#   effects           命中した相手へ付けるポーション効果のリスト
#   particle          演出パーティクル名。※データ必須の種類（FLASH / DUST / BLOCK / ITEM /
#                     ENTITY_EFFECT / SHRIEK / SCULK_CHARGE / VIBRATION 等）は受け付けない。
#                     書いても無視される（データ引数なしで撃つと例外になり戦闘処理を道連れにするため）
#   particle-count    パーティクル個数。1 未満は演出そのものをスキップ（0 は「消える」ではない）
#   sound             効果音名（ENTITY_GENERIC_EXPLODE など）
#   health-below      【自分の残HP割合がこの値以下のときだけ撃つ】(既定 1.0 = 制限なし)
#                     「瀕死になると出す大技」を作るための門。倍率を上げた技をここで縛ると、
#                     戦闘の最後だけ緊張が跳ね上がり、盾・回復・退避という対策の出番ができる。
#                     倍率だけ上げて門を付けないと、開幕から即死技が飛ぶ理不尽になるので必ずセットで書く
#   health-above      自分の残HP割合がこの値以上のときだけ撃つ (既定 0.0 = 制限なし)。
#                     health-below と組み合わせると「HP 40〜70% の中盤だけ出る技」も書ける
#   cast-seconds      予告（詠唱）時間（既定 0.0 = 予告なし＝現行どおり即時発動）。
#                     0.5 未満を書くと 0.5 へ切り上げる（書き間違いで"予告付きのつもり"が
#                     回避不能技に化けるのを防ぐため。0 だけは例外で予告なしのまま）。上限 2.5 秒。
#                     delayed_zone は cast-seconds 未指定なら duration-seconds を予告時間として読む
#                     （後方互換）。両方書くと cast-seconds を優先し、読み込み時に警告を出す。
#                     ※ 第1波では yml に実際の値を書かない（挙動変更は次段階。今はフィールドだけ用意）
#   lethal            致命予告かどうか（既定 false）。予告予算（同時に持てる予告の枠）を
#                     致命1本・合計2本に絞るための分類でしかなく、最終ダメージの計算には効かない
#   vertical-radius   AbilityShapes の垂直判定半径（既定 3.0、0.5〜8.0 に丸める）。
#                     「同じ床にいる」を表す値で、段差1〜2ブロックは拾い上の階へは効かない。
#                     radius へはフォールバックしない（フォールバックすると垂直判定が
#                     水平半径と同じ大きさになり、「半径6の技が上下6ブロックにも当たる」理不尽に戻る）
#   interruptible     （2026-09-04追加）殴る／スタンで詠唱を中断できるか（既定 false）。
#                     中断されると不発になり、同じ技に interrupt-lockout-seconds のロックがかかる。
#                     【中断可にしてよいのは放置すると悪化する技だけ】── 増援・召喚・自己強化・
#                     領域展開(fixed_zone/delayed_zone)・回復。火力技(ground_slam/beam/charge等)は
#                     中断可にしない。殴れば止まる火力技にすると、その技自体の意味が無くなるため
#   interrupt-damage-fraction
#                     中断に必要な累積被ダメージ（自身の最大HPに対する割合。既定 0.03、0.005〜0.5）
#   interrupt-lockout-seconds
#                     中断された技が再詠唱できるまでの秒数（既定 8.0、0〜60）
#   whiff-stagger-seconds
#                     （2026-09-04追加）詠唱付きの技が誰にも当たらなかった(空振り)ときに、術者自身へ
#                     掛ける硬直(鈍足255＝実質移動停止)の秒数（既定 0＝無し、0〜5）。同じモブが
#                     8秒以内に連続で硬直することはない。【雑魚に付けないこと】── 硬直は「大技を外した
#                     隙」を作る演出で、雑魚に付けると空振りのたびに無力化されて緊張感が消える
#
# 【damage-percent の水準】(2026-08-21 W-183 「技ダメの耐発数が通常より多いのは違和感」)
#   技にはテンプレごとのクールダウン(8〜45秒)とモブ共通クールダウン(12秒)と発動率があり、
#   通常攻撃より発生頻度が桁違いに低い。だから【技は必ず通常攻撃より痛い】のが正しい。
#   倍率は「避けられるほど高く」の一本の物差しで決める:
#     delayed_zone(足元に印 -> 予告後に着弾。見て動けば当たらない) 2.0〜2.1  ← 最高倍率
#     beam / charge / teleport_strike(向きと軌道が読める)          1.55〜1.70
#     ground_slam / repulse(自分の周囲。距離で外せる)              1.25〜1.45
#     aura(踏み続けた秒数だけ蓄積。総量で見る)                     0.40〜0.42 x 秒数
#     効果が本体の技(拘束・引き寄せ)                               1.10 前後
#   上限の目安は【1発が最大HPの 3/4 を超えないこと】(基準は Lv100・品質5・ツリー未投資)。
#   例外は health-below を持つ瀕死技で、そこだけ 5/6 まで許す(発動条件が限定されているため)。
#   ただし瀕死技を配ってよいのは【難易度6以上のダンジョンだけ】(W-184)。下の節を見ること。
#
# 【安全弁】数値は Java 側で範囲に丸める（半径 32 / クールダウン 0.5〜600 秒 / 投射数 64 など）。
#   書き間違いでサーバが止まるより静かに丸める方を選んでいる。
# =============================================================================

# 機能全体のスイッチ。false にすると周期タスクそのものを回さない。
enabled: true

# 発動判定を回す間隔（tick）。短くすると負荷が直線的に増えるので 5〜200 に丸める。
# ここは「抽選をどれだけ細かく行うか」だけを決め、実際の発動頻度は各テンプレートの
# cooldown-seconds と chance で決まる。
check-interval-ticks: 20

# 【同じモブが技と技の間に必ず空ける秒数】(2026-08-17 追加)
# 技ごとの cooldown-seconds だけでは頻度を抑えられない。技を2〜3個持つモブでは
# 「どれか1つはクールダウン明け」の状態がほぼ途切れないので、判定のたびに chance を引き、
# 【技を足すほど発動間隔が短くなる】(3個持たせると平均3秒に1回=常時発動しているように見える)。
# ここは技の種類によらずモブ単位で効く共通の間合いで、
# 「バニラの通常行動の合間に技が 1〜3 回挟まる」テンポを作るための摘み。
# 12 秒 + chance 0.3 なら、実際の発動間隔は概ね 15 秒前後になる。
# 0 にすると 2026-08-17 以前の挙動(＝常時発動)に戻る。
global-cooldown-seconds: 12

# 【交戦条件】(2026-08-18 追加。ユーザー報告「死角（壁の裏）や非追跡状態でも発動する」)
# 発動判定の走査は【プレイヤー起点で半径32m以内の全 LivingEntity を舐めるだけ】なので、
# ここで絞らないと「こちらに気づいてすらいないモブが壁越しに撃ってくる」。
#
# require-target: true にすると、AI を持つモブは getTarget() がその相手本人のときだけ撃つ。
#   ＝索敵していない／別の相手を狙っているモブは撃たない。
#   AI を持たない LivingEntity には「狙う対象」の概念が無いのでこの条件は課されない
#   (課すと AI を切ったボスや実体だけのギミックモブが一生撃たなくなる)。
# require-line-of-sight: true にすると、視線が通らない相手には撃たない。
#   ＝「壁に隠れて凌ぐ」という回避手段が成立する。
#
# どちらも false にすると 2026-08-18 以前の挙動（常に発動）へ戻る。
require-target: true
require-line-of-sight: true

# 【技の属性の決め方】(2026-08-21 W-181 「格下レベルのボスにワンパンされる」)
# 2026-08-21 以前、技のダメージは damage-type の側へ【100%】寄せて解決していた。これはモブの
# magic-ratio(通常攻撃の物理/魔法の配分)を完全に素通りする経路で、実害が2つあった:
#   ・magic-ratio の上限 0.45 が効かない。あの上限は「魔法防御を持たないプレイヤーが何発耐えるか」
#     で校正した安全弁なのに、damage-percent 2.0 の魔法技は実質 magic-ratio 2.0 相当で飛んでいた。
#     難易度1のダンジョンのボスでも、1発で最大HPの7割以上を奪っていた。
#   ・コンセプトと逆属性の技が理不尽になる。「敵は物理型(magic-ratio 0.10)」のダンジョンで、
#     正しく物理防御を積んだプレイヤーが【魔法技1発だけで即死】する。対策のしようが無い。
#
# そこで技のダメージも【そのモブの magic-ratio で物理/魔法へ分割する】ようにし、damage-type は
# 「そこからどれだけ自分の属性側へ引き寄せるか」という偏りに格下げした。実効の魔法割合は
#     魔法技: r + (1 - r) * bias   /   物理技: r * (1 - bias)      (r = そのモブの magic-ratio)
# 0 にすると技もモブと完全に同じ配分になり、1 にすると 2026-08-21 以前の挙動へ戻る。
# 既定 0.35 では magic-ratio 0.10 のダンジョンの魔法技が 41.5% 魔法 / 58.5% 物理になり、
# 物理防御を積んだプレイヤーにも受け止める余地が残る。
# 刻印を持たないバニラモブ(magic-ratio 0)でも魔法技は bias ぶんだけ魔法で入るので、
# ウィザーのビームが完全物理に化けることはない。
ability-element-bias: 0.35

# 【致命予約の原子化】(2026-09-04追加、Codex UXレビュー #10)
# 致命(lethal: true)の予告は、既定では脅威圏内の主対象【全員ぶん】の予告予算枠が取れないと詠唱を
# 始めない(取れた分は release して撃たない)。false にすると従来どおりベスト・エフォート
# (主対象だけ枠が取れれば撃ち、他の人は表示だけ出て予算は消費しない)。
# 非致命の予告はこのキーに関わらず常にベスト・エフォート。
telegraph-lethal-atomic: true

# 【予告バーの文字表記】(2026-09-04追加、Codex UXレビュー #3)
# block: ▮▯ (既定) / ascii: [###--] 形式。統合版の一部フォント／解像度で ▮▯ が欠落表示になる
# 対策として ascii を選べるようにしてある。
telegraph-bar-style: block

abilities:

  # ---------------------------------------------------------------------------
  # 近接型 — 「張り付き続けると死ぬ」を作る
  # ---------------------------------------------------------------------------
  shockwave:
    display-name: "<red>震脚</red>"
    type: ground_slam
    damage-type: physical
    damage-percent: 1.45   # 自分の周囲AoE。距離で外せるので中倍率(W-183)
    cooldown-seconds: 9
    chance: 0.30
    range: 5
    radius: 5
    knockback: 0.9
    particle: EXPLOSION
    particle-count: 24
    sound: ENTITY_GENERIC_EXPLODE

  # 足を止めさせる版。ダメージは軽いが鈍足が乗るので、逃げ足で解決させない。
  crippling_stomp:
    display-name: "<red>足砕き</red>"
    type: ground_slam
    damage-type: physical
    damage-percent: 1.15
    cooldown-seconds: 14
    chance: 0.25
    range: 4
    radius: 4
    knockback: 0.2
    effects:
      - type: SLOWNESS
        duration-seconds: 4
        amplifier: 1
    particle: CRIT
    particle-count: 30
    sound: ENTITY_IRON_GOLEM_ATTACK

  # ---------------------------------------------------------------------------
  # 遠距離型 — 「遮蔽を使う」を作る
  # ---------------------------------------------------------------------------
  # ⚠️ 2026-08-17 修正 (ユーザー報告「矢の雨のダメージが少ない上に当たらない」):
  # 以前は projectile_volley（モブの目線から水平に扇状発射）だった。開き角 50 度なので
  # 5本のうち中央の1本以外は最初から相手を向いておらず、射程 24m では端の矢が 10m 横を通り過ぎる。
  # さらに水平発射した矢は落下でも下へ逸れるため、【まず当たらない＝当たっても1本ぶん】だった。
  # 技名どおり頭上から降らせる projectile_rain へ変更する。矢1本あたりのダメージは
  # モブの通常攻撃と同じ(TF のパイプラインを通る)ので、当たる本数がそのまま威力になる。
  arrow_fan:
    display-name: "<light_purple>矢の雨</light_purple>"
    type: projectile_rain
    damage-type: physical
    damage-percent: 0.0   # 投射物のダメージは矢の着弾側で計算される（ここで二重取りしない）
    cooldown-seconds: 8
    chance: 0.35
    range: 24
    count: 7      # 立ち止まっていれば 3〜4 本当たる本数
    radius: 1.6   # 頭上にばら撒く円の半径。広げるほど当たらなくなる
    projectile: ARROW
    particle: CLOUD
    particle-count: 12
    sound: ENTITY_SKELETON_SHOOT

  ember_spray:
    display-name: "<light_purple>火の粉</light_purple>"
    type: projectile_volley
    damage-type: magical
    damage-percent: 0.0
    cooldown-seconds: 10
    chance: 0.30
    range: 20
    count: 3
    # 2026-08-17: 30 度(＝端が±15度)だと 20m 先では 5m 横を通り過ぎて当たらなかった。
    # 「扇に見える」最低限まで絞る。当てない演出にしたいならここを広げる。
    spread-degrees: 12
    projectile: SMALL_FIREBALL
    particle: FLAME
    particle-count: 20
    sound: ENTITY_BLAZE_SHOOT

  # ---------------------------------------------------------------------------
  # 接近強制型 — 「距離を取り続ける」を封じる
  # ---------------------------------------------------------------------------
  bull_rush:
    display-name: "<red>突進</red>"
    type: charge
    damage-type: physical
    damage-percent: 1.7   # 突進線から外れれば当たらないので高め(W-183)
    cooldown-seconds: 12
    chance: 0.28
    range: 14
    radius: 2.5
    knockback: 1.2
    particle: SWEEP_ATTACK
    particle-count: 8
    sound: ENTITY_RAVAGER_ROAR

  shadow_step:
    display-name: "<light_purple>影渡り</light_purple>"
    type: teleport_strike
    damage-type: physical
    damage-percent: 1.55
    cooldown-seconds: 16
    chance: 0.25
    range: 20
    radius: 1.5
    knockback: 0.3
    particle: PORTAL
    particle-count: 40
    sound: ENTITY_ENDERMAN_TELEPORT

  # ---------------------------------------------------------------------------
  # 立ち位置強制型 — 「そこに居続けられない」を作る
  # ---------------------------------------------------------------------------
  withering_aura:
    display-name: "<red>枯死の霧</red>"
    type: aura
    damage-type: magical
    damage-percent: 0.4
    cooldown-seconds: 22
    chance: 0.22
    range: 8
    radius: 6
    duration-seconds: 6
    effects:
      - type: WEAKNESS
        duration-seconds: 3
        amplifier: 0
    particle: SMOKE
    particle-count: 30
    sound: ENTITY_WITHER_AMBIENT

  frost_field:
    display-name: "<red>凍気</red>"
    type: aura
    damage-type: magical
    damage-percent: 0.42
    cooldown-seconds: 20
    chance: 0.22
    range: 8
    radius: 5
    duration-seconds: 5
    effects:
      - type: SLOWNESS
        duration-seconds: 3
        amplifier: 0
    particle: SNOWFLAKE
    particle-count: 26
    sound: BLOCK_GLASS_BREAK

  # ---------------------------------------------------------------------------
  # 直線型 — 「横に避ける」を作る
  # ---------------------------------------------------------------------------
  piercing_beam:
    display-name: "<light_purple>貫通光</light_purple>"
    type: beam
    damage-type: magical
    damage-percent: 1.7   # 直線。横へ避けられるので高め(W-183)
    cooldown-seconds: 15
    chance: 0.25
    range: 22
    radius: 1.2
    count: 18          # 刻み数 = ほぼ射程(m)。壁で止まるので遮蔽が意味を持つ
    particle: END_ROD
    particle-count: 4
    sound: ENTITY_GUARDIAN_ATTACK

  # ---------------------------------------------------------------------------
  # 増援型 — 「単体火力だけでは処理しきれない」を作る
  # ---------------------------------------------------------------------------
  call_the_horde:
    display-name: "<green>招集</green>"
    type: summon
    damage-percent: 0.0
    cooldown-seconds: 40
    chance: 0.20
    range: 16
    radius: 3
    count: 3
    summon-type: ZOMBIE
    particle: SOUL
    particle-count: 20
    sound: ENTITY_ZOMBIE_VILLAGER_CONVERTED

  call_the_swarm:
    display-name: "<green>群れを呼ぶ</green>"
    type: summon
    damage-percent: 0.0
    cooldown-seconds: 45
    chance: 0.18
    range: 16
    radius: 3
    count: 4
    summon-type: ENDERMITE
    particle: PORTAL
    particle-count: 24
    sound: ENTITY_ENDERMITE_AMBIENT

  # ---------------------------------------------------------------------------
  # 吹き飛ばし型（2026-08-16 追加）— 「密着し続ける」を物理的に不可能にする
  # ---------------------------------------------------------------------------
  # ground_slam の knockback は「当たったついでに少し押す」味付けだが、こちらは
  # 吹き飛ばしそのものが技。ダメージは控えめにして、位置を崩されること自体を脅威にする。
  # 崖・溶岩・奈落のある部屋では、この技が事実上の最大火力になる点に注意。
  gale_smash:
    display-name: "<aqua>烈風叩き</aqua>"
    type: repulse
    damage-type: physical
    damage-percent: 1.25
    cooldown-seconds: 11
    chance: 0.28
    range: 6
    radius: 6
    knockback: 4.5      # 水平 1.8 / 垂直 0.81 ブロックtick へ換算される
    particle: EXPLOSION
    particle-count: 20
    sound: ENTITY_GENERIC_EXPLODE

  # ---------------------------------------------------------------------------
  # 引き寄せ型（2026-08-16 追加）— 「遠くから撃ち続ける」を封じる
  # ---------------------------------------------------------------------------
  # charge(突進)は敵が動くので遮蔽で切れるが、これは相手を動かすので遮蔽では切れない。
  # ダメージはほぼ無く、引きずり込んだ先の近接技で殺すための布石として使う。
  abyssal_grip:
    display-name: "<aqua>深淵の手</aqua>"
    type: vortex_pull
    damage-type: magical
    damage-percent: 1.1
    cooldown-seconds: 13
    chance: 0.30
    range: 20
    radius: 16          # この半径内のプレイヤーを引き寄せる
    knockback: 1.6      # 引き寄せの強さ（距離に応じて最大 12m で最大強度）
    effects:
      - type: SLOWNESS
        duration-seconds: 2
        amplifier: 0
    particle: PORTAL
    particle-count: 30
    sound: ENTITY_ENDERMAN_STARE

  # ---------------------------------------------------------------------------
  # 予告設置型（2026-08-16 追加）— 「見てから動く」を作る
  # ---------------------------------------------------------------------------
  # 印は発動時点の足元に固定され、追尾しない。避けられる代わりに倍率を高くできる。
  # 逆に言うと、逃げ場の無い狭い部屋のモブに付けると回避不能な高倍率技になるので付けない。
  meteor_mark:
    display-name: "<gold>星降りの徴</gold>"
    type: delayed_zone
    damage-type: magical
    # 予告付きなので全テンプレ中の最高倍率を置いてよい。ただし【最大HPの 3/4 を超えないこと】。
    # 超えると「避けそこねた1回で即死」＝実質ワンショットになり、防具の投資が意味を失う。
    damage-percent: 2.1   # 予告2秒。見て動けば完全に避けられるので最高倍率(W-183)
    cooldown-seconds: 18
    chance: 0.26
    range: 24
    radius: 3.5
    duration-seconds: 2   # 予告時間
    knockback: 1.0
    particle: LAVA
    particle-count: 24
    sound: ENTITY_GENERIC_EXPLODE

  quake_spikes:
    display-name: "<gold>地烈の棘</gold>"
    type: delayed_zone
    damage-type: physical
    damage-percent: 2.0   # 予告1.8秒。同上(W-183)
    cooldown-seconds: 15
    chance: 0.28
    range: 18
    radius: 3
    duration-seconds: 1.8
