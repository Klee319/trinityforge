    range: 8
    radius: 6
    duration-seconds: 6
    particle: DAMAGE_INDICATOR
    particle-count: 12
    sound: ENTITY_PLAYER_HURT

  # ---------------------------------------------------------------------------
  # 瀕死技（2026-08-21 W-183）
  # health-below で「残HPが減ってから」しか出ないようにしてある。予告時間を長めに取り、
  # 見てから避ける / 盾で受ける / 離れる の余地を残したうえで倍率を上げている。
  # ※ health-below を外すと開幕から飛ぶ即死技になる。倍率と門は必ずセットで動かすこと。
  #
  # ★ 配ってよいのは【難易度6以上のダンジョンだけ】(2026-08-21 W-184)。
  #   瀕死技は「盾やダメージ軽減を用意しておく」という前提知識の上に成り立つ大技で、
  #   その前提がまだ無い難易度1〜5 では対策不能な事故にしかならない
  #   (W-183 では難易度1の闇の大聖堂にも 2.3 倍の last_stand_quake が乗っていた)。
  #   低難易度へ技を足すときは【本数を減らさず】同じ属性を埋める通常技へ差し替えること。
  #   減らすと「どのボスも物理と魔法の両方を持つ」が崩れ、片側の防御だけで受かるボスへ戻る。
  #   この縛りは ShippedDungeonBurstAndElementTest が許可スコープの名前で固定している。
  # ---------------------------------------------------------------------------

  desperation_nova:
    display-name: "<gold><bold>崩落の詠唱</bold></gold>"
    type: delayed_zone
    damage-type: magical
    damage-percent: 2.5       # 瀕死技の枠(最大HPの 5/6 まで)
    cooldown-seconds: 30
    chance: 0.5
    range: 24
    radius: 4.5
    duration-seconds: 2.5     # 予告2.5秒。全テンプレ中いちばん長い
    knockback: 1.2
    health-below: 0.3         # 残HP30%以下でのみ発動
    particle: SOUL_FIRE_FLAME
    particle-count: 36
    sound: ENTITY_WITHER_SPAWN

  last_stand_quake:
    display-name: "<gold><bold>断末の震え</bold></gold>"
    type: delayed_zone
    damage-type: physical
    damage-percent: 2.3
    cooldown-seconds: 26
    chance: 0.45
    range: 20
    radius: 4
    duration-seconds: 2.2
    knockback: 1.8
    health-below: 0.35        # 残HP35%以下でのみ発動
    particle: CRIT
    particle-count: 36
    sound: ENTITY_RAVAGER_ROAR
