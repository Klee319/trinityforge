      # 浮遊のスレッド
      - { material: "custom:thread_slow_falling", chance: 0.01, chance-by-level: { from-level: 1, from-chance: 0.01, to-level: 100, to-chance: 0.10 }, min: 1, max: 1, mobs: [SHULKER], where: field }
      # 詠唱効率のスレッド
