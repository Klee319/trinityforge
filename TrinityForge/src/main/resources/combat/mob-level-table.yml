    # 必ず custom:<id> で書く — 素のidはバニラMaterial扱いになり解決に失敗して無言で消える。
    # 帯が上がるほど確率が上がる(Lv45 2% -> Lv65 5% -> Lv85 10%)。フィールドモブのレベルは
    # ワールド原点からの距離で決まる(coordinate-coefficient 0.02 = 50ブロックで+1)ため、
    # 実質「原点から2250ブロック以上離れて狩る」ことが下限条件になる。近場で無限に湧かせる
    # 稼ぎ方を潰しつつ、資源サーバの遠方バイオームへ出る動機を作るのが狙い。
    # EMダンジョンのモブは見た目替えのZOMBIE等なのでEntityTypeでは狙い撃ちできない。
    # ダンジョン限定の素材/武器は mob-overrides.yml の drops: 側で配線している。
    add-drops:
    # 【ガチャ券ドロップ】 2026-07-31 追加
    # mobs: を書かない = この帯の対象モブ全部。帯自体の mobs: が敵性モブ43種に絞られているので
    # 牧場の家畜では出ない。採掘(mining-gimmick)・釣り(fishing-gimmick)に続く3本目の入手経路で、
    # 「戦闘しかしない人」にもガチャの周回ループが回るようにするのが狙い。
    # 素の券(tf_gacha_ticket / standard プール)はここが唯一の入手経路。
      - material: custom:tf_gacha_ticket
        chance: 0.02
        min: 1
        max: 1
      - material: custom:tf_gacha_ticket_3
        chance: 0.004
        min: 1
        max: 1
