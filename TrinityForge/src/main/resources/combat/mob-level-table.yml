      # ピリジャーの鎧片
      - { material: "custom:pillager_plate", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [PILLAGER], where: field }
      # ウィッチの秘薬
      - { material: "custom:witch_elixir", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [WITCH], where: field }
      # ピグリンの耳
      - { material: "custom:piglin_ear", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [PIGLIN], where: field }
      # ストレイの布片
