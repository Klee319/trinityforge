      # 素の券 gacha_ticket_0 の【唯一の恒常入手経路】。where: を書かない(=既定の any)ので
      #   フィールドでもダンジョンでも出る。ダンジョンではガチャ券【I】と両方が抽選される。
      #   chance はこの帯だけの値(帯が上がるほど上がる階段。6帯で 0.005/0.008/0.012/0.016/0.02/0.025)。
      #   帯ごとに値が違うのは意図どおり —— 詳しい理由はファイル冒頭の【ガチャ券の入手経路】参照。
      - { material: "custom:gacha_ticket_0", chance: 0.025, min: 1, max: 1 }
      #
      # ---- ガチャ券【IV】(この帯だけ) ---------------------------------------------------
      # Lv45 帯の【II】と同じ扱い(2026-08-14 に HEAD の値で復元)。理由の全文は Lv45 帯の
      #   同じブロックのコメントを参照。踏破ボスドロップ(0.05〜0.45)との併存は意図どおりで、
      #   こちらは 0.4% の細い保険経路。券の番号は帯に対応させているのでこの帯だけに置く。
      - { material: "custom:gacha_ticket_4", chance: 0.004, min: 1, max: 1 }
      #
      # ---- 2026-08-14 討伐素材/スレッド/ガチャ券のドロップ配線 ----------------------------
      # 【この23エントリは6帯すべてに同じ内容で置く】帯の解決は floor lookup(min-level <= L を満たす
      #   最大の帯が1つだけ選ばれる)で、上の帯から下の帯へ継承されない。min-level: 0 の帯にだけ
      #   書くと Lv0〜9 のモブでしか抽選されず、Lv10 以上では1個も落ちない(=無言の no-op)。
      #   確率そのものは chance-by-level が討伐したモブの実レベルで補間するので、6帯へ複製しても
      #   帯境界で段差にはならない。ShippedFieldDropWiringTest が「複数の帯に載るエントリは
      #   6帯すべてに同一内容で載っていること」を固定する(上のガチャ券【II〜IV】のように
      #   意図して1帯だけに置くエントリは、単帯であること自体を別の検査が固定する)。
      # 詳細な設計意図(0〜2個の1/3空振り・where/baby の意味)はファイル冒頭のコメント参照。
      #
      # 【討伐素材16種】フィールドのみ / 0〜2個 / Lv1 5% → Lv100 50%。
      # ラヴェジャーの革
      - { material: "custom:ravager_hide", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [RAVAGER], where: field }
