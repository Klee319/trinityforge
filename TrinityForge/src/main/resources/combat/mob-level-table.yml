      #   実績値(帯ごとに 0.005〜0.025)を基準にしている。
      # ガチャ券【I】(ダンジョン限定。mobs: 未指定 = 帯の対象モブ全部)
      - { material: "custom:gacha_ticket_1", chance: 0.005, chance-by-level: { from-level: 10, from-chance: 0.005, to-level: 100, to-chance: 0.05 }, min: 1, max: 1, where: dungeon }
