      # ストレイの布片
      - { material: "custom:stray_cloth", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [STRAY], where: field }
      # スケルトンホースの骨
      - { material: "custom:skeleton_horse_bone", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [SKELETON_HORSE], where: field }
      # エンダーマイトの煤
      - { material: "custom:endermite_soot", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [ENDERMITE], where: field }
      # ガーディアンの棘
