      # 速攻のスレッド(子ゾンビ限定)
      - { material: "custom:thread_swiftcast", chance: 0.01, chance-by-level: { from-level: 1, from-chance: 0.01, to-level: 100, to-chance: 0.10 }, min: 1, max: 1, mobs: [ZOMBIE], where: field, baby: true }
      # 猛攻のスレッド(PILLAGER)
      - { material: "custom:thread_onslaught", chance: 0.01, chance-by-level: { from-level: 1, from-chance: 0.01, to-level: 100, to-chance: 0.10 }, min: 1, max: 1, mobs: [PILLAGER], where: field }
      # 堅陣のスレッド(ZOMBIE)
      - { material: "custom:thread_bulwark", chance: 0.01, chance-by-level: { from-level: 1, from-chance: 0.01, to-level: 100, to-chance: 0.10 }, min: 1, max: 1, mobs: [ZOMBIE], where: field, baby: false }
      #
      # 【ガチャ券【I】】ダンジョン内の討伐のみ(where: dungeon)。1個固定なのでドロップ増加ステは
      #   確率側に乗る。難易度D のダンジョンは推奨Lv = D×10 なので、実質 p = 0.005×D
