      # 砂まみれの骨
      - { material: "custom:parched_sandy_bone", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [PARCHED], where: field }
      # エルダーガーディアンの棘
