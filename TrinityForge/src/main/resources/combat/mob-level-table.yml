      # ボグドの苔むした骨
      - { material: "custom:bogged_mossy_bone", chance: 0.05, chance-by-level: { from-level: 1, from-chance: 0.05, to-level: 100, to-chance: 0.50 }, min: 0, max: 2, mobs: [BOGGED], where: field }
      # ホグリンの牙
