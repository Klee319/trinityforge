      #
      # 【エンダードラゴンの鱗】レベルが Lv60 前後に張り付く(mob-types.yml の level: 60 +
      #   座標係数がほぼ効かない)ため、レベル比例にすると事実上の固定値になる。そこで
      #   chance-by-level を使わず 100% にし、個数側(0〜2個)だけを揺らす。
      # エンダードラゴンの鱗
      - { material: "custom:dragon_scale", chance: 1.0, min: 0, max: 2, mobs: [ENDER_DRAGON], where: field }
      # 【ドラゴンの卵】エンダードラゴンの討伐で 100% 1個(2026-08-19 / W-128 → 2026-08-20 / W-178 で改訂)。
      #   hero 武器(Lv100)の儀式コア素材が DRAGON_EGG なのに、バニラでは「ジ・エンドの初回討伐1個きり」で
      #   再入手できず、上位帯が事実上作れなかった。
      #   2026-08-19 は environment: [NORMAL](オーバーワールド限定)を付けていたが、実サーバには
      #   オーバーワールドへエンダードラゴンが出る経路が無く、この行は一度も発火できていなかった
      #   (資源鯖に EliteMobs は無く、導入データパックにも湧きは無い。EM 側の ENDER_DRAGON は
      #    束縛者のダンジョンボスなので where: field から外れる)。2026-08-20 に environment: を外し、
      #   【どのディメンションでも落ちる】ようにした。
      #   where: field は残す —— ダンジョンインスタンス(束縛者)のボスからは落とさないため。
      #   ジ・エンドではエンドクリスタルで復活させれば反復入手できる(クリスタル4個/回が実質のコスト)。
      - { material: DRAGON_EGG, chance: 1.0, min: 1, max: 1, mobs: [ENDER_DRAGON], where: field }
      #
      # 【スレッド5種】フィールドのみ / 1個固定 / Lv1 1% → Lv100 10%。
      #   min:1,max:1 は意図的 ——【1個固定のエントリだけドロップ増加ステが"抽選確率"側に乗る】
      #   (MobDropRoller#isSingleFixed → boostedChance)。min<max にすると同じステが
      #   "個数への加算"に化け、レアドロップとしての意味が消える。
      # 昏倒のスレッド
      - { material: "custom:thread_concussion", chance: 0.01, chance-by-level: { from-level: 1, from-chance: 0.01, to-level: 100, to-chance: 0.10 }, min: 1, max: 1, mobs: [VINDICATOR], where: field }
