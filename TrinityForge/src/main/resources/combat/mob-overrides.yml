  # enchantment_challenge_1_sanctum (INSTANCED_DUNGEON) — custombosses/enchantment_challenge_1 / 1体
  # ▼コンセプト: 【通る武器=物理】(魔法防御が厚い) — エンチャント課題1。課題ごとに要求ビルドが入れ替わる
  em_id_enchantment_challenge_1:
    display-name: "エンチャント試練 1"
    # 【コンセプト】通る武器=物理 / 敵の攻撃=魔法寄り(magic-ratio 0.45)。
    # つまり物理武器で攻め、物理防御より魔法防御を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度1 の係数 = 1.173(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1.173
      # 【エンチャント試練】倍率ではなく【絶対値】で書く(2026-08-14)。この試練群は contentLevel: 1 固定で、
      # 共通ランプ(combat/mob-import.yml)が Lv1 でしか評価されず倍率をいくら掛けても効かないため。
      # scope 直下に置くのは他ダンジョンと同じ理由で【雑魚にも効かせるため】。
      # 2026-08-20(W-179): W-175 のダンジョン攻撃力圧縮から【この試練群だけ漏れていた】。
      #   旧 101.5 は同レベルのフィールドモブ(Lv100 で 34.8)の 2.92 倍。Lv100 の厳選装備でも実質1発で沈む水準だった。
      #   他 18 ダンジョンと同じ尺度へ揃える: 共通ランプ Lv100(44.32) × 難易度係数(1.0〜1.4 を 10 段で割った 1 段目) = 44.32。
      #   絶対値のままなのは元の理由どおり —— この試練群は contentLevel 固定でランプが動かず、倍率が効かない。
      # 【攻撃ステの型】2026-08-21 W-183 —— 貫通型: 防御率を 80% 抜いてくる。防御率で受ける重装が不利になり、最大HPと守備力が効く
