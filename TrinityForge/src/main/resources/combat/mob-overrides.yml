  em_id_the_palace:
    display-name: "宮殿"
    # 【コンセプト】通る武器=魔法 / 敵の攻撃=半々(magic-ratio 0.25)。
    # つまり魔法武器で攻め、物理防御と魔法防御を両方を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度4 の係数 = 1.236(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1.236
      # 【難易度 4/10・推奨戦闘Lv 40】このダンジョン全体の攻撃力倍率(2026-08-14)。
      # 2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため係数を解き直した。
      # 2026-08-21(W-183): 防具を住み分け設計へ引き直したので【同じ耐発数を保つように】もう一度解き直した。
      #   基準は重装1式(世界を繋ぐ・品質5)。軽装/魔法装は防具側で同じ被ダメージ期待値へ揃えてある。
      # ここは雑魚の耐発数を決める層。ボス・中ボスは per-mob 側で上乗せしている(2つで1組)。
      # scope 直下に置くのは【雑魚にも効かせるため】—— mobs: に書くとそのモブ1体にしか効かず、
      # 雑魚の被ダメージが床値(min-component-damage)に張り付いたままになる。
      # 倍率にしているのは level: dynamic(入場時にプレイヤーがレベルを選ぶ)と両立させるため。
      # 絶対値だと Lv1 でも Lv100 でも同じ値になり、選んだレベルへの追従が死ぬ。
      attack-power-multiplier: 0.8773
