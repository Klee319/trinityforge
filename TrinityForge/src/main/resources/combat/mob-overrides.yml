  # the_nether_bell_sanctum (DYNAMIC_DUNGEON) — custombosses/em_id_the_nether_bell / 28体
  # ▼コンセプト: 【通る武器=魔法】(物理装甲が厚い) — 儀式の鐘。鳴り響く術式そのものが本体で、打撃では崩れない
  em_id_the_nether_bell:
    display-name: "ネザーの鐘"
    # 【コンセプト】通る武器=魔法 / 敵の攻撃=魔法寄り(magic-ratio 0.45)。
    # つまり魔法武器で攻め、物理防御より魔法防御を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度5 の係数 = 1.193(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1.193
      # 【難易度 5/10・推奨戦闘Lv 50】このダンジョン全体の攻撃力倍率(2026-08-14)。
      # 2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため係数を解き直した。
      # 2026-08-21(W-183): 防具を住み分け設計へ引き直したので【同じ耐発数を保つように】もう一度解き直した。
      #   基準は重装1式(世界を繋ぐ・品質5)。軽装/魔法装は防具側で同じ被ダメージ期待値へ揃えてある。
      # ここは雑魚の耐発数を決める層。ボス・中ボスは per-mob 側で上乗せしている(2つで1組)。
      # scope 直下に置くのは【雑魚にも効かせるため】—— mobs: に書くとそのモブ1体にしか効かず、
      # 雑魚の被ダメージが床値(min-component-damage)に張り付いたままになる。
      # 倍率にしているのは level: dynamic(入場時にプレイヤーがレベルを選ぶ)と両立させるため。
      # 絶対値だと Lv1 でも Lv100 でも同じ値になり、選んだレベルへの追従が死ぬ。
      attack-power-multiplier: 0.8828
      # 【攻撃ステの型】2026-08-21 W-183 —— 会心型: 30% で会心(x2)。防具強度(会心軽減)を持つ重装が有利で、薄い軽装は事故る
      #   型を足したぶんは攻撃力側で相殺してあるので、3ビルド平均の耐えられる発数は W-182 と同じ。
      #   変えるのは【どのビルドが有利か】だけ。型を消すときは攻撃力も戻すこと(2つで1組)。
      attack: { magic-ratio: 0.45, crit-chance: 0.3, crit-damage: 1 }
    mobs:
      em_id_the_nether_bell_beam_boss_green_1_speed:   # ボス第1段階 — EXP Lv1:42 / Lv50:149 / Lv100:355
        display-name: "光を抱く者 (俊敏)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度5 の上乗せ = 1.125。
          max-health-multiplier: 1.125
          # 2026-08-20(W-179 第2波): ボス係数 MINIBOSS = ×1.2。
          #   このダンジョンの EM ファイルには bossType: キーが無く、分類は name の
          #   $bossLevel / $minibossLevel / $eventBossLevel プレースホルダで表現されている。
          #   bossType だけを見て係数を配ると【このダンジョンだけ丸ごと素通り】して、
          #   ボスが自分の配下の雑魚と同じ攻撃力のまま残る。実際 1 回そうなりかけた。
          attack-power-multiplier: 1.066
          physical: { defense-rate: 0.33, resistance: 0.435 }
          magical:  { defense-rate: 0.06, resistance: 0.05 }
        vanilla-exp: { base: 40.0, per-level: 1.2, growth: 1.008, growth-interval: 1.0 }
