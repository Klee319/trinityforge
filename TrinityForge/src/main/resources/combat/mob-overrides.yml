  # binder_of_worlds_sanctum (INSTANCED_DUNGEON) — custombosses/the_binder_of_worlds / 18体
  # ▼コンセプト: 物理ビルドが活きる(魔法防御が厚い) — 次元術師。魔法を吸収する
  #
  # ▼【2026-08-01】束縛者だけ max-health / attack-power を明示する(柱2 / K-22(1))
  #   このファイルは 405 モブすべてで level / max-health / attack が未設定 = combat/mob-import.yml の
  #   共通ランプ任せだった。そのため「最終ボスなのに他ダンジョンの最終ボスと同じ強さ」になっていた。
  #   束縛者は contentLevel: 50 固定(level-sync が無い)ので、共通ランプを Lv50 で評価した実値
  #       max-health   = 150 × 1.072^50 = 4850.99
  #       attack-power = 7.0 × 1.03^50  =   30.69
  #   に、段階ごとの倍率を掛けた「絶対値」をここへ書く。
  #   ※ mob-overrides.yml のスキーマ(MobStatOverride)は倍率キーを持たず絶対値しか受け取らないため、
  #     設計書が倍率で書いている値は上記ランプ実値との積へ展開してある(割り戻せば倍率に戻る)。
  #
  #   段階            max-health              attack-power          意図
  #   第2段階 phase_1  4850.99×2.5 = 12127     30.69×1.3 = 39.89     「ここから別格」を最初の一撃で伝える
  #   第3段階 phase_2  4850.99×3.0 = 14553     30.69×1.4 = 42.96     魔法寄り(既存の耐性配分を維持)
  #   第4段階 phase_3  4850.99×3.5 = 16978     30.69×1.5 = 46.03
  #   最終    phase_4  4850.99×6.0 = 29106     30.69×1.8 = 55.24     「ソロで頑張ればぎりぎり行ける」の上限
  #   ミニボス×3       4850.99×1.8 =  8732     30.69×1.2 = 36.82
  #   増援×11          変更しない               変更しない            増援は数で圧をかける役。個体を強くすると事故る
  #
  #   ・すべて初期値。実機校正で詰める前提(設計書 §10-4)。
  #   ・【重要】ここに絶対値を書くと個体ばらつき ±15% は消える。オーバーライドは variance を
  #     掛けた後に適用され、置換であって乗算ではないため(ConfigManager#resolveRuntimeProfile →
  #     MobStatOverride#applyTo)。つまり束縛者7体だけは毎回まったく同じ HP/攻撃になる。
  #     実機校正で「実測が上下にぶれるはず」と考えないこと。ぶれない。
  #   ・fixed-damage(全防御貫通)は使わない(設計書 §10-3 のユーザー確定)。難度は HP と手数で作る。
  #   ・vanilla-exp は一切触らない。EXP を HP と同じ伸びにすると「所要時間が変わらないのに報酬だけ
  #     跳ね上がる」破綻を再現するため、EXP は共通 1.008 + 役割係数のままにしてある。
  em_id_binder_of_worlds:
    display-name: "世界を繋ぐ者の聖所"
    # 【コンセプト】物理推奨(敵は魔法型) —— 次元を繋ぐ術者の聖所。物理武器が通り、魔法防御が要る。
