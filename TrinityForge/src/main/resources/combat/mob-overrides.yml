          # 実HP = ここの値 × EM の healthMultiplier(EliteEntity#setMaxHealth が後段で掛ける)。
          max-health: 4020000
        vanilla-exp: { base: 40.0, per-level: 1.2, growth: 1.008, growth-interval: 1.0 }
        # 2026-08-02 特殊攻撃(柱2-1 の積み残し): 低難度ダンジョンの踏破ボス。
        # 技は1つだけにして立ち位置の強制にとどめる。動かない塊。近寄った相手だけを弾く
        abilities: [shockwave, meteor_mark, bleeding_aura]
        # 【ドロップ】踏破ボス(2026-08-14)。
        # 印(dungeon_seal_*)は chance 1.0 / 1個固定 = 踏破の証明。複数落ちると図鑑の重複と
        # key_binder の「印5個」要求が壊れるので、個数は絶対に増やさない。
        # スレッド等の min:1,max:1 は意図的:【個数が1個固定のエントリだけ、ドロップ増加ステが
        # 抽選"確率"側に乗る】(MobDropRoller#isSingleFixed → boostedChance)。min<max にすると
        # 同じステが"個数への加算"に化け、狙いである「レア遭遇率を上げる」が効かなくなる。
        drops:
          - { item: "custom:dungeon_seal_enchant_trial_3", chance: 1.0, min: 1, max: 1 }
          - { item: "custom:gacha_ticket_2", chance: 0.15, min: 1, max: 1 }
          - { item: "custom:key_enchant_trial_4", chance: 1.0, min: 1, max: 1 }

