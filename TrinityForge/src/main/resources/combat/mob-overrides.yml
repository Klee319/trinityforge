      attack: { magic-ratio: 0.25, crit-chance: 0.3, crit-damage: 1 }
    mobs:
      the_palace_old_stone_king_p1:   # ボス第1段階 — EXP Lv1:42 / Lv50:149 / Lv100:355
        display-name: "古き石の王 (第1段階)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
