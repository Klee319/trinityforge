        # 仕掛け(Royal Spellcaster の檻を割る係)で踏破ボスではない。
        # 物理装甲が厚いダンジョンの踏破ボス。近接で張り付かせ、剣闘士の貫通に価値を持たせる
        abilities: [shockwave, bull_rush]
        # 【ドロップ】踏破ボス(2026-08-14)。
        # 印(dungeon_seal_*)は chance 1.0 / 1個固定 = 踏破の証明。複数落ちると図鑑の重複と
        # key_binder の「印5個」要求が壊れるので、個数は絶対に増やさない。
        # スレッド等の min:1,max:1 は意図的:【個数が1個固定のエントリだけ、ドロップ増加ステが
