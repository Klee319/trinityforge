  # hallosseum_lair (DYNAMIC_DUNGEON) — custombosses/the_hallosseum / 4体
  # ▼コンセプト: 【通る武器=魔法】(物理装甲が厚い) — 呪われた闘技場。亡霊は実体が薄く、刃より祓いの術が効く
  em_hallosseum:
    display-name: "ハロウィン闘技場"
    # 【コンセプト】通る武器=魔法 / 敵の攻撃=魔法寄り(magic-ratio 0.45)。
    # つまり魔法武器で攻め、物理防御より魔法防御を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度2 の係数 = 1.327(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1.327
      # 【難易度 2/10・推奨戦闘Lv 20】このダンジョン全体の攻撃力倍率(2026-08-14)。
      # 2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため係数を解き直した。
      # 2026-08-21(W-183): 防具を住み分け設計へ引き直したので【同じ耐発数を保つように】もう一度解き直した。
      #   基準は重装1式(世界を繋ぐ・品質5)。軽装/魔法装は防具側で同じ被ダメージ期待値へ揃えてある。
      # ここは雑魚の耐発数を決める層。ボス・中ボスは per-mob 側で上乗せしている(2つで1組)。
      # scope 直下に置くのは【雑魚にも効かせるため】—— mobs: に書くとそのモブ1体にしか効かず、
      # 雑魚の被ダメージが床値(min-component-damage)に張り付いたままになる。
      # 倍率にしているのは level: dynamic(入場時にプレイヤーがレベルを選ぶ)と両立させるため。
      # 絶対値だと Lv1 でも Lv100 でも同じ値になり、選んだレベルへの追従が死ぬ。
      attack-power-multiplier: 0.6868
      # 【攻撃ステの型】2026-08-21 W-183 —— 固定型: 全ての防御段を貫通する固定ダメージ。守備では減らせないので最大HPだけが効く
      #   型を足したぶんは攻撃力側で相殺してあるので、3ビルド平均の耐えられる発数は W-182 と同じ。
      #   変えるのは【どのビルドが有利か】だけ。型を消すときは攻撃力も戻すこと(2つで1組)。
      attack: { magic-ratio: 0.45, fixed-damage: 2.01 }
    mobs:
      halloween_event_boss_mount:   # ボス第1段階 — EXP Lv1:42 / Lv50:149 / Lv100:355
        display-name: "命知らず (騎乗体)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度2 の上乗せ = 1.208。
          # 2026-08-24: ただしこの騎乗体は EliteMobs 側が healthMultiplier: 50 を持っており、
          #   それが【TFが計算し終えたHPに後段で掛かる】ため、上乗せを足すと騎乗体の実効80.2倍が
          #   乗り手のボス(実効64.1倍)を追い越していた。EliteMobs の custombosses はリポジトリに無く
          #   配備先でしか直せないので、W-181 の上乗せをここで打ち消して
          #   【ボス最大の60%】= 実効38.5倍へ落とす。1.208 → 0.58
          #   (1.327[スコープ] x 0.58 x 50[EM] = 38.5)。60% なのは「先に騎乗体を落として
          #   乗り手を降ろす」という EliteMobs 側の設計を残すため(雑魚扱いの25%にはしない)。
          #   EM 側の healthMultiplier を将来変えるならこの値も解き直すこと(2つで1組)。
          max-health-multiplier: 0.58
          # 【ボス係数】MINIBOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.069
          physical: { defense-rate: 0.33, resistance: 0.435 }
          magical:  { defense-rate: 0.06, resistance: 0.05 }
        vanilla-exp: { base: 40.0, per-level: 1.2, growth: 1.008, growth-interval: 1.0 }
        drops: []
      halloween_event_boss_p1:   # ボス第1段階 — EXP Lv1:42 / Lv50:149 / Lv100:355
        display-name: "デュラハン (第1段階)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度2 の上乗せ = 1.208。
          max-health-multiplier: 1.208
          # 【ボス係数】BOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.102
          physical: { defense-rate: 0.33, resistance: 0.435 }
          magical:  { defense-rate: 0.06, resistance: 0.05 }
        vanilla-exp: { base: 40.0, per-level: 1.2, growth: 1.008, growth-interval: 1.0 }
        drops: []
      halloween_event_boss_p2:   # ボス第2段階 — EXP Lv1:58 / Lv50:209 / Lv100:497
        display-name: "デュラハン (第2段階)"
        stats:
          # 【ボス係数】BOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.102
          physical: { defense-rate: 0.374, resistance: 0.482 }
          magical:  { defense-rate: 0.068, resistance: 0.05 }
          # 【踏破ボスのHP】目標TTK 20秒。根拠は「厳選済みLv100プレイヤーのDPS 730,229 × 実効係数 0.50」
          # = 実効 365,115 DPS。目標実HP ≒ 7.30M。
          # この倍率は EliteMobs の healthMultiplier より【前段】に掛かる:
          #   実HP = ランプ(選ばれたLv) × ここの倍率 × EM の healthMultiplier
          # 右辺の EM 側の値(6.0〜120.0 とモブごとにバラバラ)は織り込み済みなので、この値を素で書く。
          max-health-multiplier: 1.087   # W-181: 難易度2 の上乗せ x1.208 を畳み込み済み
        vanilla-exp: { base: 56.0, per-level: 1.68, growth: 1.008, growth-interval: 1.0 }
        # 2026-08-01 特殊攻撃(柱2-1): 魔法防御が厚いダンジョンの踏破ボス。直線と持続で「避ける」を要求し、魔術師の割合追加に価値を持たせる
        abilities: [piercing_beam, withering_aura, meteor_mark, crippling_stomp]
        # 踏破の証明 + 高位ダンジョン限定素材 (2026-07-31 追加)。印は chance 1.0 = 必ず1個。
        # 極級ガチャ券(gacha_ticket_5)は釣りギミック以外の入手経路がここだけ。
        # 「釣りをしない人が極級プールに触れない」状態を解消するために踏破ボスへ載せている。
        # 【ドロップ】踏破ボス(2026-08-14)。
        # 印(dungeon_seal_*)は chance 1.0 / 1個固定 = 踏破の証明。複数落ちると図鑑の重複と
        # key_binder の「印5個」要求が壊れるので、個数は絶対に増やさない。
        # スレッド等の min:1,max:1 は意図的:【個数が1個固定のエントリだけ、ドロップ増加ステが
        # 抽選"確率"側に乗る】(MobDropRoller#isSingleFixed → boostedChance)。min<max にすると
        # 同じステが"個数への加算"に化け、狙いである「レア遭遇率を上げる」が効かなくなる。
        drops:
          - { item: "custom:dungeon_seal_hallosseum", chance: 1.0, min: 1, max: 1 }
          - { item: "custom:thread_harvest", chance: 0.01, chance-by-level: { from-level: 10, from-chance: 0.01, to-level: 100, to-chance: 0.3 }, min: 1, max: 1 }
      halloween_event_boss_reinforcement:   # 召喚体/騎乗体 — EXP Lv1:2 / Lv50:7 / Lv100:18
        display-name: "不気味なスケルトン (増援)"
        stats:
          physical: { defense-rate: 0.11, resistance: 0.402 }
          magical:  { defense-rate: 0.02, resistance: 0.05 }
        vanilla-exp: { base: 2.0, per-level: 0.06, growth: 1.008, growth-interval: 1.0 }
        drops: []

  # binder_of_worlds_sanctum (INSTANCED_DUNGEON) — custombosses/the_binder_of_worlds / 18体
  # ▼コンセプト: 【通る武器=物理】(魔法防御が厚い) — 次元術師。魔法を吸収する
  #
  # ▼【2026-08-01】束縛者だけ max-health / attack-power を明示する(柱2 / K-22(1))
  #   このファイルは 405 モブすべてで level / max-health / attack が未設定 = combat/mob-import.yml の
  #   共通ランプ任せだった。そのため「最終ボスなのに他ダンジョンの最終ボスと同じ強さ」になっていた。
  #   束縛者は contentLevel: 50 固定(level-sync が無い)ので、共通ランプを Lv50 で評価した実値
  #       max-health   = 150 × 1.072^50 = 4850.99
  #       attack-power = 10.2 × 1.0148^50 =  21.26  (2026-08-12 にランプを寝かせたので再計算)
  #   に、段階ごとの倍率を掛けた「絶対値」をここへ書く。
  #   ※ mob-overrides.yml のスキーマ(MobStatOverride)は倍率キーを持たず絶対値しか受け取らないため、
  #     設計書が倍率で書いている値は上記ランプ実値との積へ展開してある(割り戻せば倍率に戻る)。
  #
  #
  # ▼【2026-08-14】攻撃力はさらにスコープ直下の attack-power-multiplier: 1.4 を畳み込んだ値へ更新した。
  #   理由は下の attack-power-multiplier: 1.4 のコメントを参照(絶対値を持つ個体では倍率が捨てられるため)。
  #   HP はスコープ倍率が無いので畳み込みは無い。phase_4 の HP だけは踏破ボスの実HP基準へ差し替えてある。
  #
  #   段階            max-health              attack-power                     意図
  #   第2段階 phase_1  4850.99×2.5 = 12127     21.26×1.3=27.64 ×1.4 = 38.7    「ここから別格」を最初の一撃で伝える
  #   第3段階 phase_2  4850.99×3.0 = 14553     21.26×1.4=29.77 ×1.4 = 41.68    魔法寄り(既存の耐性配分を維持)
  #   第4段階 phase_3  4850.99×3.5 = 16978     21.26×1.5=31.89 ×1.4 = 44.65
  #   最終    phase_4  578100(踏破ボスの実HP基準) 21.26×1.8=38.27 ×1.4 = 53.58  「ソロで頑張ればぎりぎり行ける」の上限
  #   ミニボス×3       4850.99×1.8 =  8732     21.26×1.2=25.52 ×1.4 = 35.73
  #   増援×11          変更しない               絶対値は書かない(スコープ倍率 1.4 だけが効く。9.99 → 13.986)
  #                                                                  増援は数で圧をかける役。個体を強くすると事故る
  #
  #   ・すべて初期値。実機校正で詰める前提(設計書 §10-4)。
  #   ・【重要】ここに絶対値を書くと個体ばらつき ±15% は消える。オーバーライドは variance を
  #     掛けた後に適用され、置換であって乗算ではないため(ConfigManager#resolveRuntimeProfile →
  #     MobStatOverride#applyTo)。つまり束縛者7体だけは毎回まったく同じ HP/攻撃になる。
  #     実機校正で「実測が上下にぶれるはず」と考えないこと。ぶれない。
  #   ・fixed-damage(全防御貫通) — 2026-08-25 のユーザー判断で【束縛者では少量なら使ってよい】に
  #     変わった(エンドコンテンツなので全防御貫通が少し混ざるのは許容する)。現在 2.42 を入れている。
  #     以前ここには「設計書 §10-3 のユーザー確定で使わない」と書いてあり、下の attack: と 8 月中ずっと
  #     矛盾していた。⚠ 量を増やすと守備で減らせない=対策不能になるので、増やすなら攻撃力側で
  #     相殺すること(下の【攻撃ステの型】の注記と 2 つで 1 組)。難度の主役は今も HP と手数。
  #   ・vanilla-exp は一切触らない。EXP を HP と同じ伸びにすると「所要時間が変わらないのに報酬だけ
  #     跳ね上がる」破綻を再現するため、EXP は共通 1.008 + 役割係数のままにしてある。
  em_id_binder_of_worlds:
    display-name: "世界を繋ぐ者の聖所"
    # 【コンセプト】通る武器=物理 / 敵の攻撃=魔法寄り(magic-ratio 0.45)。
    # つまり物理武器で攻め、物理防御より魔法防御を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度10 の係数 = 1(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1
      # 【難易度 10/10・推奨戦闘Lv 100】このダンジョン全体の攻撃力倍率(2026-08-14)。
      # 2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため係数を解き直した。
      # 2026-08-21(W-183): 防具を住み分け設計へ引き直したので【同じ耐発数を保つように】もう一度解き直した。
      #   基準は重装1式(世界を繋ぐ・品質5)。軽装/魔法装は防具側で同じ被ダメージ期待値へ揃えてある。
      # ここは雑魚の耐発数を決める層。ボス・中ボスは per-mob 側で上乗せしている(2つで1組)。
      # scope 直下に置くのは【雑魚にも効かせるため】—— mobs: に書くとそのモブ1体にしか効かず、
      # 雑魚の被ダメージが床値(min-component-damage)に張り付いたままになる。
      # 倍率にしているのは level: dynamic(入場時にプレイヤーがレベルを選ぶ)と両立させるため。
      # 絶対値だと Lv1 でも Lv100 でも同じ値になり、選んだレベルへの追従が死ぬ。
      #
      # 【重要】この倍率が「倍率のまま」効くのは、mobs: 側に attack.attack-power の絶対値を持たない
      # 増援 11 体だけ(9.99 → 13.986)。ボス 4 体 + ミニボス 3 体の計 7 体は絶対値を持っており、
      # MobStatOverride#applyTo が「scope 層の倍率 → mob 層の絶対値で置換」の順に走るので、
      # 1.4 を掛けた結果が丸ごと捨てられる。そのため 7 体には 1.4 を掛けた値を絶対値として
      # 畳み込んである。この倍率を動かすときは 7 体の attack-power も同じ比で直すこと
      # (畳み込み忘れは ShippedBossStrengthDriftTest の束縛者 pin が検出する)。
      attack-power-multiplier: 0.8315
      # 【攻撃ステの型】2026-08-21 W-183 —— 固定型: 全ての防御段を貫通する固定ダメージ。守備では減らせないので最大HPだけが効く
      #   型を足したぶんは攻撃力側で相殺してあるので、3ビルド平均の耐えられる発数は W-182 と同じ。
      #   変えるのは【どのビルドが有利か】だけ。型を消すときは攻撃力も戻すこと(2つで1組)。
      attack: { magic-ratio: 0.45, fixed-damage: 2.42 }
    mobs:
      binder_of_worlds_phase_1_endermite_reinforcement:   # 召喚体/騎乗体 — EXP Lv1:2 / Lv50:7 / Lv100:18
        display-name: "現実を汚す者 (第2段階) (増援)"
        stats:
          physical: { defense-rate: 0.02, resistance: 0.05 }
          magical:  { defense-rate: 0.11, resistance: 0.402 }
        vanilla-exp: { base: 2.0, per-level: 0.06, growth: 1.008, growth-interval: 1.0 }
        drops: []
      em_id_binder_of_worlds_phase_1:   # ボス第2段階 — EXP Lv1:58 / Lv50:209 / Lv100:497
