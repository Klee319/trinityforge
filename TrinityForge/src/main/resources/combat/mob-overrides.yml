        drops:
          - { item: "custom:dungeon_seal_north_pole", chance: 1.0, min: 1, max: 1 }
          - { item: "custom:thread_fire_resistance", chance: 0.01, chance-by-level: { from-level: 10, from-chance: 0.01, to-level: 100, to-chance: 0.3 }, min: 1, max: 1 }
