        # 踏破の証明 + 高位ダンジョン限定素材 (2026-07-31 追加)。印は chance 1.0 = 必ず1個。
        # 極級ガチャ券(gacha_ticket_5)は釣りギミック以外の入手経路がここだけ。
        # 「釣りをしない人が極級プールに触れない」状態を解消するために踏破ボスへ載せている。
        # 【ドロップ】踏破ボス(2026-08-14)。
