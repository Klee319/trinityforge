  # fireworks_lair (DYNAMIC_DUNGEON) — custombosses/the_fireworks / 5体
  # ▼コンセプト: 【通る武器=物理】(魔法防御が厚い) — 火薬技師の機械仕掛け。抱えた火薬は打撃で誘爆する
  em_fireworks:
    display-name: "花火工房"
    # 【コンセプト】通る武器=物理 / 敵の攻撃=ほぼ物理(magic-ratio 0.1)。
    # つまり物理武器で攻め、魔法防御より物理防御を積む。
    # 2026-08-21(W-182): 攻めと受けは【独立に】割り当てている(以前の「必ず逆」ルールは廃止)。
    # 片方だけ書き換えると組み合わせの配分が崩れるので、変えるならファイル冒頭の分布表も直すこと。
    stats:
      # 2026-08-21(W-181): 難易度別のHP底上げ。ここは【雑魚も含めこのダンジョンの全モブ】に効く。
      # 難易度6 の係数 = 1.152(難易度1が最大・難易度10で 1.0 の逓減梯子)。
      # 「攻撃力を下げたぶんをHPへ振り替える」ための層で、ボスにはさらに per-mob 側で上乗せする。
      max-health-multiplier: 1.152
      # 【難易度 6/10・推奨戦闘Lv 60】このダンジョン全体の攻撃力倍率(2026-08-14)。
      # 2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため係数を解き直した。
      # 2026-08-21(W-183): 防具を住み分け設計へ引き直したので【同じ耐発数を保つように】もう一度解き直した。
      #   基準は重装1式(世界を繋ぐ・品質5)。軽装/魔法装は防具側で同じ被ダメージ期待値へ揃えてある。
      # ここは雑魚の耐発数を決める層。ボス・中ボスは per-mob 側で上乗せしている(2つで1組)。
      # scope 直下に置くのは【雑魚にも効かせるため】—— mobs: に書くとそのモブ1体にしか効かず、
      # 雑魚の被ダメージが床値(min-component-damage)に張り付いたままになる。
      # 倍率にしているのは level: dynamic(入場時にプレイヤーがレベルを選ぶ)と両立させるため。
      # 絶対値だと Lv1 でも Lv100 でも同じ値になり、選んだレベルへの追従が死ぬ。
      attack-power-multiplier: 0.6883
      # 【攻撃ステの型】2026-08-21 W-183 —— 固定型: 全ての防御段を貫通する固定ダメージ。守備では減らせないので最大HPだけが効く
      #   型を足したぶんは攻撃力側で相殺してあるので、3ビルド平均の耐えられる発数は W-182 と同じ。
      #   変えるのは【どのビルドが有利か】だけ。型を消すときは攻撃力も戻すこと(2つで1組)。
      attack: { magic-ratio: 0.10, fixed-damage: 2.17 }
    mobs:
      fireworks_level_50_boss_phase_1:   # ボス第2段階 — EXP Lv1:58 / Lv50:209 / Lv100:497
        display-name: "スパーキー (第2段階)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度6 の上乗せ = 1.099。
          max-health-multiplier: 1.099
          # 【ボス係数】BOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.11
          physical: { defense-rate: 0.068, resistance: 0.05 }
          magical:  { defense-rate: 0.374, resistance: 0.482 }
        vanilla-exp: { base: 56.0, per-level: 1.68, growth: 1.008, growth-interval: 1.0 }
        drops: []
      fireworks_level_50_boss_phase_2:   # ボス第3段階 — EXP Lv1:83 / Lv50:298 / Lv100:710
        display-name: "スパーキー (第3段階)"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度6 の上乗せ = 1.099。
          max-health-multiplier: 1.099
          # 【ボス係数】BOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.11
          physical: { defense-rate: 0.076, resistance: 0.05 }
          magical:  { defense-rate: 0.418, resistance: 0.529 }
        vanilla-exp: { base: 80.0, per-level: 2.4, growth: 1.008, growth-interval: 1.0 }
        drops: []
      fireworks_level_50_boss_phase_3:   # ボス第3段階 — EXP Lv1:83 / Lv50:298 / Lv100:710
        display-name: "スパーキー (第4段階)"
        stats:
          # 【ボス係数】BOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.11
          physical: { defense-rate: 0.076, resistance: 0.05 }
          magical:  { defense-rate: 0.418, resistance: 0.529 }
          # 【踏破ボスのHP】目標TTK 20秒。根拠は「厳選済みLv100プレイヤーのDPS 730,229 × 実効係数 0.50」
          # = 実効 365,115 DPS。目標実HP ≒ 7.30M。
          # この倍率は EliteMobs の healthMultiplier より【前段】に掛かる:
          #   実HP = ランプ(選ばれたLv) × ここの倍率 × EM の healthMultiplier
          # 右辺の EM 側の値(6.0〜120.0 とモブごとにバラバラ)は織り込み済みなので、この値を素で書く。
          max-health-multiplier: 3.627   # W-181: 難易度6 の上乗せ x1.099 を畳み込み済み
        vanilla-exp: { base: 80.0, per-level: 2.4, growth: 1.008, growth-interval: 1.0 }
        # 2026-08-01 特殊攻撃(柱2-1): 物理装甲が厚いダンジョンの踏破ボス。近接で張り付かせ、剣闘士の貫通に価値を持たせる
        abilities: [shockwave, bull_rush, quake_spikes, desperation_nova]
        # 踏破の証明 + 高位ダンジョン限定素材 (2026-07-31 追加)。印は chance 1.0 = 必ず1個。
        # 極級ガチャ券(gacha_ticket_5)は釣りギミック以外の入手経路がここだけ。
        # 「釣りをしない人が極級プールに触れない」状態を解消するために踏破ボスへ載せている。
        # 【ドロップ】踏破ボス(2026-08-14)。
        # 印(dungeon_seal_*)は chance 1.0 / 1個固定 = 踏破の証明。複数落ちると図鑑の重複と
        # key_binder の「印5個」要求が壊れるので、個数は絶対に増やさない。
        # スレッド等の min:1,max:1 は意図的:【個数が1個固定のエントリだけ、ドロップ増加ステが
