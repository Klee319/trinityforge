          attack-power-multiplier: 1.067
          physical: { defense-rate: 0.33, resistance: 0.435 }
          magical:  { defense-rate: 0.06, resistance: 0.05 }
          # 【踏破ボスのHP】目標TTK 20秒。根拠は「厳選済みLv100プレイヤーのDPS 730,229 × 実効係数 0.50」
          # = 実効 365,115 DPS。目標実HP ≒ 7.30M。
