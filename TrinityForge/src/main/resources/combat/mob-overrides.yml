# ============================================================================
# combat/mob-overrides.yml
# EliteMobsダンジョンインスタンス内の「カスタムモブ」ごとに、個別の「強さ」(レベル/HP/防御/攻撃)と
# 「ドロップテーブル」を設定できるオーバーライド層。
#
# 【位置づけ】 combat/mob-profiles.yml (/trinityforge importmobs が生成する自動生成ファイル。手編集禁止・
# 再importで上書きされる)は直接触らない。このファイルは mob-profiles.yml の"上に重ねる"オーバーレイで、
# 再importが走っても手で調整した値は絶対に失われない。
#
# 【階層】 overrides.<ワールド名>.mobs.<モブid> の2階層。特別なキー "default" は全ダンジョン共通の
# フォールバック(そのワールド専用の指定が無いモブに使われる)。モブidは EliteMobs のカスタムボス設定
# ファイル名(拡張子なし) — /trinityforge importmobs が combat/mob-profiles.yml のキーに使うものと同じ。
#
# 【ワールド名の書き方(重要)】 インスタンスダンジョンの実ワールド名は EliteMobs が入場のたびに
# 「<設計図ワールド名>_<連番>」(例: em_the_shattered_gate_1, _2, _3 ...)と番号を増やして作るため、
# 実ワールド名をそのまま書いても1インスタンスにしか当たらない。ここには「設計図ワールド名」
# (連番を除いた部分。EliteMobsのダンジョン設定 worldName: の値)を書くこと。そのダンジョンの全
# インスタンスに当たる。実ワールド名の完全一致が優先され、無ければ設計図名として照合される
# (複数該当する場合はより長い=より具体的なキーが勝つ)。
#
# 【前提】 モブが TrinityForge の管理下(スポーン時にPDCスタンプ済み)である必要がある。無料DL枠の
# ダンジョンを新規に落とした場合も combat/mob-import.yml の unknown-mobs.synthesize: true(既定)で
# 自動的に管理下に入るので、そのまま指定できる。false にしている場合は先に
# /trinityforge importmobs plugins/EliteMobs/custombosses を実行すること。
#
# 【解決優先順位(強さ)】 次の5層を「項目単位」でマージする(書いた項目だけが上書きされ、書いていない
# 項目は下位層の値がそのまま生きる):
#   1. overrides.<実ワールド名>.mobs.<モブid>.stats  (最優先)
#   2. overrides.<実ワールド名>.stats                (そのダンジョン全体の既定、2026-08-03)
#   3. overrides.default.mobs.<モブid>.stats
#   4. overrides.default.stats                       (全ダンジョン共通の既定、2026-08-03)
#   5. combat/mob-profiles.yml の該当エントリ (mob-profiles.ymlが空扱いなら mob-defaults.yml)
#
# 【ダンジョン単位の stats:(2026-08-03)】 mobs: と同じ階層に stats: を書くと、そのダンジョンの
# 「全モブ」に効く既定値になる。mobs: に1件も書いていないモブにも効くのがこの層の存在意義で、
# 「このダンジョンの敵は魔法型」といったコンセプトを396体に1体ずつ書かずに済ませるためにある
# (キー体系は mobs.<モブid>.stats と完全に同一)。個別のモブだけ違う値にしたい場合は、これまで
# どおり mobs.<モブid>.stats に書けばそちらが勝つ(項目単位なので、書いた項目だけが上書きされる)。
#
# 【解決優先順位(ドロップ)】 マージではなく「置換」。実ワールド指定に drops: があればそれを丸ごと使い、
# 無ければ default 指定の drops: を丸ごと使う(どちらにも無ければ何も追加しない)。このドロップは
# combat/mob-level-table.yml の add-drops とは独立した別の追加ドロップ源として共存する(どちらか一方が
# 他方を消すことはない。詳細は MobOverrideDropListener のJavadoc参照)。
#
# 【display-name (表示名)】 (省略可、2026-07-26 追加)
#   ・overrides.<ワールド名>.display-name          … そのダンジョンの日本語名
#   ・overrides.<ワールド名>.mobs.<モブid>.display-name … そのモブの日本語名
#   config-editor が生のワールド名/EliteMobsモブidの代わりに表示するためだけの「表示用メタデータ」。
#   戦闘の計算にもスコープ解決にも一切影響しない(ここを変えてもゲーム挙動は変わらない)。
#   既定EliteMobsダンジョンのワールド名/モブidは変更するとオーバーライドが当たらなくなるため、
#   editor 側では編集不可にしてある。名前を分かりやすくしたい場合はこの display-name を使うこと。
#
# 【stats の項目一覧】 (すべて省略可。省略した項目は下位層の値のまま)
#   level           : 戦闘レベル(整数)
#   max-health      : 最大HP
#   armor-strength  : 防具強度(会心軽減率%、physical/magicalの両方に同じ値が適用される)
#   physical        : 物理防御の個別項目(下記4項目、省略可)
#   magical         : 魔法防御の個別項目(下記4項目、省略可)
#     defense-rate     : 防御率% [0,1]
#     resistance       : 耐性% [0,1]
#     damage-reduction : 被ダメージ軽減% [0,1]
#     flat-defense     : 守備力(固定値)
#   attack          : 攻撃側の個別項目(省略可)
#     attack-power         : 基礎ダメージ(combat/mob-profiles.yml/mob-types.ymlと同じキー名)
#     flat-bonus-damage    : 固定追加ダメージ
#     percent-bonus-damage : 割合追加ダメージ%
#     crit-chance          : 会心率
#     crit-damage          : 会心ダメージ%
#     penetration          : 貫通率%
#     damage-modifier      : ダメージ補正
#     fixed-damage         : 固定ダメージ(全防御貫通)
#     magic-ratio           : このモブの通常攻撃を魔法として解決する割合 [0.0, 1.0](2026-08-02新設)。
#                              既定0.0=完全物理。1.0=完全魔法。中間値は物理/魔法へ分割し回避ロールは
#                              1回のまま両方へ通す(hybrid攻撃)。単独指定でき、他の attack 項目を
#                              一切書かなくても効く(hasAttack判定には影響しない)。
#
# 【drops の項目一覧】 (このモブを倒したときに追加で出るアイテムの一覧)
#   item   : Material名、または custom:<items/catalog.ymlのID / ArsPaper素材ID> (必須)
#   chance : 1死亡あたりのドロップ確率 [0,1] (必須)
#   min/max: ドロップ個数の範囲 (両方0以上、min<=max、必須)
#
# 【vanilla-exp (モブごとのレベル依存EXP式)】 (省略可)
#   このモブを倒したときに落とすバニラ経験値(オーブ)を、そのモブの戦闘レベルの式で決める。
#   式は combat/mob-import.yml のランプと完全に同じ形:
#       exp(level) = (base + per-level * level) * growth^(level / growth-interval)
#   結果は四捨五入して0以上に丸められる。書き方は2通り:
#       vanilla-exp: 25                                   # レベル非依存の固定量
#       vanilla-exp: { base: 5, per-level: 1.5, growth: 1.03, growth-interval: 1.0 }
#   growth を省略(または 1.0)にすると線形 (base + per-level * level) になる。
#   ※「絶対値でなく式」なのが重要: 導入済みダンジョンモブの多く(396体中265体)は level: dynamic で、
#     プレイヤーが入場時に選んだレベルに追従する。固定値で書くとLv1でもLv100でも同じEXPになる。
#   解決優先順位はドロップと同じ「置換」: <実ワールド> の指定があればそれ、無ければ default の指定、
#   どちらにも無ければ何もしない(バニラ/他プラグインのEXP量がそのまま残る。0EXPにはならない)。
#   combat/mob-level-table.yml のレベル帯単位 vanilla-exp より後に走るので、両方に該当するモブは
#   こちらの「モブごとの式」が勝つ(帯指定は、式を書いていないモブのための広い既定として残る)。
#
# 【level-cutoff は 2026-08-09 にこのファイルから撤去した】
#   「レベル差による足きり」は combat/damage.yml の level-cutoff: へ移設した。ここに書いても
#   もう読まれない(未知キーとして無視される)ので、書いてある場合は消すこと。
#   移設の理由: この設定はダンジョン(ワールド)単位で解決していたため、EliteMobs がプロファイルを
#   刻印したモブ = ダンジョンモブにしか掛からず、フィールドの野良モブがレベル差いくらでも
#   素通りしていた。共通設定へ移したことで全モブに効くようになっている。
#   ダンジョンごとの入場制限が要るなら dungeon/gates.yml の required-combat-level を使う。
#
# 【後方互換(コードの挙動)】 overrides: が空/存在しなければ、コード側(MobOverridesConfig)は一切何も
# しない — 強さ・ドロップとも combat/mob-profiles.yml 由来の挙動を完全に維持する。これはロジックの
# 保証であって、この出荷ファイルの中身が空という意味ではない(下記参照)。
#
# 【この出荷ファイルの実際の中身】 このファイルは overrides: が空のサンプルではなく、396体分の
# モブオーバーライドが既に書き込まれた状態で出荷されている(2026-07-26時点)。サーバーの
# plugins/TrinityForge/ 配下に combat/mob-overrides.yml がまだ存在しない初回起動時、
# plugin.saveResource() によってこのファイルがそのままコピーされ、次のロードで即座に有効になる
# (=「編集して初めて動く空のテンプレート」ではなく、初回起動から396体分の設定がライブで効いている)。
# 既にファイルが存在するサーバーでは、このリソース内の変更は再配布されるだけで自動上書きはされない。
#
# 記入例(コメントアウト状態。使う場合はコメントを外して調整すること):
# overrides:
#   default:
#     mobs:
#       goblin_chief:
#         stats:
#           level: 50
#           max-health: 1200
#         vanilla-exp:
#           base: 5
#           per-level: 1.5
#           growth: 1.03
#           growth-interval: 1.0
#         drops:
#           - item: "custom:source_gem"
#             chance: 0.25
#             min: 1
#             max: 3
#   my_dungeon_world:
#     mobs:
#       goblin_chief:
#         stats:
#           max-health: 2000
# ============================================================================
# 【ダンジョンのコンセプト(物理/魔法)】 2026-08-03 / 2026-08-21(W-182)で組み合わせ方を変更
# ダンジョンごとに「敵がどちらの型か」を割り当てている。表現は【2層に分かれている】:
#
#   (1) 受け = 各モブの stats.physical / stats.magical (per-mob)。【プレイヤーのどの属性の武器が通るか】。
#       各ダンジョン先頭の `# ▼コンセプト:` コメントがその要約。
#   (2) 攻め = ダンジョン直下の stats.attack.magic-ratio (scope)。【敵の通常攻撃の何割が魔法成分か】。
#       `# 【コンセプト】` コメントがその要約。0.10=ほぼ物理 / 0.25=半々 / 0.45=魔法寄り。
#
# 【(1)と(2)は独立。逆向きに固定しない(2026-08-21 W-182 で変更)】
# 2026-08-21 以前は「攻めと受けを必ず逆にする」ルールだった(魔法で殴ってくる敵は必ず物理が通る)。
# その結果、組み合わせは 23 ダンジョン中 2 種類しか存在せず、攻撃属性を見た瞬間に持つべき武器が
# 決まってしまっていた。W-182 で【4通りを均等に配る】方式へ変更:
#
#   魔法寄りの攻撃 × 物理が通る : 6 ダンジョン   魔法寄りの攻撃 × 魔法が通る : 5 ダンジョン
#   ほぼ物理の攻撃 × 物理が通る : 6 ダンジョン   ほぼ物理の攻撃 × 魔法が通る : 6 ダンジョン
#   半々の攻撃     × 物理が通る : 3 ダンジョン   半々の攻撃     × 魔法が通る : 2 ダンジョン
#
# 攻めと受けが同じ属性になるダンジョン(例: 魔法で殴ってきて魔法が通る)は【意図的】。
# その帯は魔法一本で押し切れる代わりに、逆側の帯では丸ごと通用しない —— という起伏を作るため。
# 全ダンジョンを逆向きに固定すると「攻撃属性を見れば武器が決まる」ので、選択が消える。
#
# 【属性差の下限は 1.70 倍】通る側と硬い側で与ダメージが 1.70 倍以上開くようにしてある
# (通る側 resistance 0.05 / 硬い側 0.24〜0.55)。2026-08-21 以前は中央値 1.29 倍しかなく、
# 396 体中 43 体は物理と魔法が完全に同値 = 属性を選ぶ意味がゼロだった。
# ShippedDungeonBurstAndElementTest が下限と組み合わせの分布を守っている。
#
# 【magic-ratio の上限を 0.45 に抑えている理由(重要)】
# 被ダメージは「守備力(flat-defense)を引いてから率を掛ける」ので、物理/魔法に分割された各成分は
# それぞれ別の守備力で減算される。Lv60 のネザライト一式は phys-flat-defense を約49持つ一方、
# バニラ系防具の magic-flat-defense は【全部位ゼロ】(魔法防御を持つのは守護/魔織シリーズだけ)。
# つまり魔法成分は無対策のプレイヤーには ほぼ素通り する。Lv60 のダンジョンモブの攻撃力を
# 66 とすると、magic-ratio 0.60 では魔法成分だけで約40 —— 最大HP(約50)の8割で、事実上2発以下。
# 「対策すれば無傷・しなければ即死」という両極端になるため、上限は 0.45 に留めている。
# ここを上げ下げする場合は、必ず「無対策のプレイヤーが何発耐えるか」で確認すること
# (率ではなく守備力の絶対値との比較でしか判断できない)。
#
# flat-defense はここでは上書きしない。Lv45以降の加算(combat/mob-import.yml の
# high-level-from/high-level-per-level)を殺してしまうため —— resistance/defense-rate/
# damage-reduction は mob-import.yml 側が per-level 0 の定数なので、定数で置き換えても
# レベル追随を壊さない。
#
# 【攻撃ステの型(2026-08-21 W-183)】ダンジョンごとに stats.attack へ1種類だけ「型」を配ってある。
# 通常攻撃の【総量】は型を配る前と同じ(型が増やしたダメージぶんは attack-power を下げて相殺した)。
# 変わるのは【どのビルドが有利か】だけ:
#
#   貫通型 penetration: 0.8      … 防御率を8割抜く。防御率で受ける重装が不利、最大HPと守備力が効く。
#   会心型 crit-chance/crit-damage … 30% で会心(x2)。防具強度(会心軽減)を持つ重装が有利、薄い軽装は事故る。
#   固定型 fixed-damage           … 全ての防御段を貫通する純加算。守備では減らせず最大HPだけが効く。
#   振れ型 damage-modifier: 1.4   … ダメージが 1.0〜1.4 で振れる。期待値は同じで、上振れの事故だけが増える。
#
# 【型と attack-power は2つで1組】。型を消すなら攻撃力も戻すこと(片方だけ触ると難易度が動く)。
# 型があるので【attack-power の生値でダンジョン同士を比べてはいけない】——
# 貫通型のダンジョンは同じ強さでも生値が 2 割低く出る。比較するときは型を打ち消した
# 「素換算」で見ること(ShippedBossStrengthDriftTest#signatureNeutralAttackPower が実装例)。
#
# 【技(abilities)の配り方(2026-08-21 W-183)】ボス/中ボスは 3〜5 種を持ち、
# 【物理と魔法の両方】と【瀕死技(mob-abilities.yml の health-below)】が必ず混ざるようにしてある。
# 片方の属性だけ盛っても受け切れないようにして、防具の住み分け(軽装=HP/重装=守備)を攻略へ効かせるため。
# 雑魚には配らない(同時湧きの頭数ぶん AoE が重なって被ダメージが設計不能になる)。
# 多段フェーズのボスは【最終段だけ】が技を持つ(途中段は残HP割合ですぐ通過するため)。
# ============================================================================

# ============================================================================
# 【2026-08-20 ダンジョン攻撃力の再圧縮】ユーザー報告「EMのダンジョンがオーバーワールドに比べて
# 強すぎる。オーバーワールドの同レベルのモブより少し強いくらいに抑えてほしい」への対処。
#
# 何が起きていたか(出荷 yml から計算した実測。検算は tmp/em-vs-field.js):
#   ダンジョンモブの攻撃力 = 共通ランプ(combat/mob-import.yml、フィールドの約1.27倍)
#     × ここのダンジョン単位 attack-power-multiplier(2026-08-14 に入った 2.3〜4.8)
#   の積なので、同レベルのフィールドモブの【5.4〜7.8倍】を殴っていた。品質9の帯最良装備でも
#   Lv30/60/100 のどこでも【雑魚1発で即死】(耐えられる発数 0.8/1.0/0.9)。
#   一方フィールドは同じ装備で 5.8/7.9/5.0 発耐える。HP はむしろダンジョンの方が低く、
#   「硬い」のではなく「一方的に殴り殺される」状態だった。
#   原因は順序: 2026-08-12 に火力カーブを寝かせ(プレイヤー最大HPを50ハートへ固定)、その【後で】
#   2026-08-14 の難易度設計がこの倍率を載せたため、較正後の数値と突き合わされていない。
#
# どう直したか: 難易度1〜10の【順序は保ったまま】倍率を 2.3〜4.8 → 1.0〜1.4 へ線形圧縮した。
#   2.3→1.0 / 2.5→1.03 / 2.7→1.06 / 2.9→1.10 / 3.2→1.14 / 3.4→1.18 / 3.7→1.22 /
#   4.1→1.29 / 4.4→1.34 / 4.8→1.40
#   結果、同レベルのフィールド比は【難易度1で約1.25倍・難易度10で約2.3倍】、耐えられる発数は
#   難易度1で4〜6発・難易度10で2〜3発になる(フィールドは5〜8発)。
#   ※ エンチャント試練10本はもともとこの倍率を持たず 1.0 相当で動いていた。今回の圧縮後の
#     難易度1と同じ水準なので、28ダンジョンが初めて1本の尺度に載ったことになる。
# ⚠️ HP側(踏破ボスの max-health / max-health-multiplier)は【意図的に触っていない】。
#    報告は「強すぎる=即死する」であって「硬すぎる」ではなく、TTK は元からフィールドより
#    短い(0.24〜0.64倍)。ここを削ると踏破ボスが一瞬で溶ける。
# ⚠️ 倍率を動かすときは、束縛者の絶対値7体も同じ比で直すこと(下の該当コメント参照)。
#    畳み込み忘れは ShippedBossStrengthDriftTest が検出する。
# ============================================================================

overrides:
  # 全ダンジョン共通のフォールバック(ワールド個別指定が無いモブに使われる)
  default:
    # 2026-07-31: バニラモブの特殊攻撃(abilities)。テンプレート定義は combat/mob-abilities.yml。
    # 【EliteMobs の mob id を持たないモブは EntityType 名がキーになる】ので、ここに小文字の
    # EntityType 名を書けばオーバーワールドのモブにも技が付く。
    #
    # 【⚠️ EntityType 名キーが効くのは abilities: だけ(2026-08-03 に実際に踏んだ罠)】
    # 同じキーに drops: や vanilla-exp: を書いても【1個も落ちないし EXP も変わらない】。
    # EntityType 名へフォールバックするのは MobAbilityTask だけで、drops:/vanilla-exp: を読む
    # MobOverrideDropListener / MobOverrideExpListener は【MOB_PROFILE_ID が刻まれた個体】でしか
    # 動かず、その PDC は EliteMobs フォークが CustomBoss へ刻むもの。バニラのウォーデンや
    # ウィザーには最初から存在しないので、リスナーは profileId 不在で即 return する。
    # 警告もログも出ないため「設定したのに出ない」に気づけない。
    # 【バニラモブに追加ドロップを配りたいときの正しい置き場】
    #   ・combat/mob-level-table.yml の add-drops: (mobs: [WARDEN] のように EntityType で絞る)
    #     — custom:ravager_hide / custom:guardian_spine 等で既に実運用している経路。
    #   ・combat/mob-types.yml の <ENTITY_TYPE>.drops:
    # このファイルの drops: は「EliteMobs ダンジョンのモブ限定」と割り切って使うこと。
    #
    # 【なぜゾンビ/スケルトンには付けていないか】序盤の手触りを変えないため。Lv0 の装備で
    # AoE を撒くモブと戦わせると「カジュアルが最初の1時間で折れる」。技を付けたのは
    # 「もともと危険」と認識されているモブだけで、しかも既存の挙動を裏切らない技を選んでいる
    # (ラヴェジャーは突進する / ピリジャーは撃つ / ブレイズは火を吐く)。
    mobs:
      ravager:
        abilities: [bull_rush]
      pillager:
        abilities: [arrow_fan]
      witch:
        abilities: [frost_field]
      blaze:
        abilities: [ember_spray]
      wither_skeleton:
        abilities: [crippling_stomp]
      warden:
        abilities: [shockwave]
      elder_guardian:
        abilities: [piercing_beam]
      wither:
        abilities: [piercing_beam, call_the_swarm]
      ender_dragon:
        abilities: [shockwave, call_the_swarm]

