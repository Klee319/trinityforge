      #   変えるのは【どのビルドが有利か】だけ。型を消すときは攻撃力も戻すこと(2つで1組)。
      attack: { magic-ratio: 0.45, attack-power: 29.83, penetration: 0.8 }
    mobs:
      enchantment_boss_dark_flame:   # ボス第1段階 — EXP Lv1:42 / Lv50:149 / Lv100:355
        display-name: "暗黒の炎"
        stats:
          # 2026-08-21(W-181): ボス/中ボスはスコープの底上げに加えてここでも上乗せする
          #   (雑魚より多くHPを持たせるため)。難易度1 の上乗せ = 1.112。
          max-health-multiplier: 1.112
          # 【ボス係数】MINIBOSS。scope 直下の難易度倍率にこれが掛かる(倍率は層ごとに掛け算)。
          #   これが無いとボスの攻撃力が配下の雑魚と完全に同じになる —— 121 体がその状態だった(W-179)。
          #   2026-08-21(W-182): 「耐えられる通常攻撃の回数」を全ダンジョン一律 +1.5 発にするため、
          #   scope 側の係数とセットでこの値も解き直した。半端な数値なのはそのため(手で丸めないこと)。
          attack-power-multiplier: 1.07
          physical: { defense-rate: 0.06, resistance: 0.05 }
          magical:  { defense-rate: 0.33, resistance: 0.435 }
          # 【踏破ボスのHP】目標TTK 20秒。根拠は「厳選済みLv100プレイヤーのDPS 730,229 × 実効係数 0.50」
          # = 実効 365,115 DPS。目標実HP ≒ 7.30M。
          # 倍率ではなく絶対値なのは、この敵のレベルが固定でランプが動かないため。
          # 実HP = ここの値 × EM の healthMultiplier(EliteEntity#setMaxHealth が後段で掛ける)。
          max-health: 2430000
        vanilla-exp: { base: 40.0, per-level: 1.2, growth: 1.008, growth-interval: 1.0 }
