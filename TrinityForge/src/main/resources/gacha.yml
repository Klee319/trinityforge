        weight: 4
        amount: 1
      # 2026-08-01 追加: ダンジョンの鍵(ガチャ枠3種のうち初級)。
      # 鍵をルート限定にする配分で、低難度ダンジョン=低ティアのガチャに対応させている。
      - item: "key_fireworks"
