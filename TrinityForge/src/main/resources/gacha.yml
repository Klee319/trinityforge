# ガチャ設定 (gacha.yml)
# 「ガチャ券」アイテムを右クリックすると、景品プールから1点だけ抽選され、券が1個消費される。
# 券の判定はitemCatalog ID (PDCタグ)で行われ、表示名では判定しない。
#
# tickets: 券アイテムの定義。
#   キー = 券アイテムのID。TFカタログID または ArsPaper materials.yml のID
#          (現行の券6種は materials.yml 側に定義されている)。表示名では判定されない。
#   pool = 参照する景品プールID (下の pools セクションのキー)
#
# 【重要・item の書き方】このファイルの entries[].item には custom: を付けない。
#   CrossPluginItemResolver が「TFカタログ → ArsPaper registry → バニラMaterial」の順に
#   素のIDで解決するため。custom: を付けると3経路すべてを外して解決失敗する。
#   (mob-overrides の drops やレシピ素材とは逆の規約なので注意)
#
# 【重要・解決失敗は券を消費しない】景品IDが解決できないと券が減らずに終わる fail-safe のため、
#   存在しないIDを書くと「当たるまで無料で引き直せる」状態になる。
#   2026-07-30 修正: example_sword ×2 / example_bow ×1 が実在せず、
#   standard 59% / tier2 28% / tier3 28% がこの状態だった。
#
# 【重要・天井(pity)の確定排出先】天井到達時に必ず出るのは「そのプールで weight が最小のエントリ」。
#   同値タイがあると天井がその中でランダムに割れる。
#   2026-07-30 修正: tier5 は ANCIENT_DEBRIS と防具が同 weight 1 で、天井の約半分が
#   古代の残骸になっていた。各プールのジャックポットは必ず単独最小 weight にすること。
#   レートアップ(gacha_rate_bonus)の対象も同じ「最小 weight のエントリ」。
#
# quality-random: true は TFカタログ品にだけ効く(0〜最大品質をランダム付与)。
#   ArsPaper 素材やバニラMaterialに書いても無視される。
#
# 設定リファレンス(本文コメント移設先): docs/config-reference/gacha.md

tickets:
  gacha_ticket_0:
    pool: standard

  gacha_ticket_1:
    pool: tier1
  gacha_ticket_2:
    pool: tier2
  gacha_ticket_3:
    pool: tier3
  gacha_ticket_4:
    pool: tier4
  gacha_ticket_5:
    pool: tier5

pools:
  # 序盤の汎用プール。素材寄りで、装備は「その帯で自作できる物」に留める
  # (ガチャを縦強化のショートカットにしないため)。
  standard:
    pity:
      threshold: 30
    entries:
      - item: "tf_scrap"
        weight: 20
        amount: 4
      - item: "COAL"
        weight: 18
        amount: 8
      - item: "IRON_INGOT"
        weight: 14
        amount: 4
      - item: "iron_dagger"
        weight: 8
        amount: 1
        quality-random: true
      # 空のスレッド = 厳選コンテンツへの入口
      - item: "thread_empty"
        weight: 5
        amount: 1
      - item: "gacha_ticket_1"
        weight: 3
        amount: 1
      # ジャックポット(単独最小 weight = 天井の確定排出先)
      - item: "core_wood"
        weight: 1
        amount: 1

  tier1:
    pity:
      threshold: 20
    entries:
      - item: "GOLD_INGOT"
        weight: 15
        amount: 2
      - item: "tf_scrap"
        weight: 14
