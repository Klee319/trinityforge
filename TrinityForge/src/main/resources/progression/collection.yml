# TrinityForge - コレクション図鑑 (M7, DUNGEON_SPEC §5 / SERVER_CONTENT_SPEC §7)
#
# 収集記録(図鑑)→ 段階的報酬解放。報酬は 称号 / コスメ / 恒久QoL に限定し、
# 縦強化(戦闘ステータス)にしないこと(スペック上の憲法。中身はこの config の運用で守る)。
#
# ============================================================================
# 2026-08-16: 全カタログ品・全モブ規模へ拡充した (現在 816 エントリ)
# ============================================================================
# アチーブメント再構築(冒険者の道が図鑑コンプリートで終わる形)に合わせて、
# 140 件だった図鑑を出荷 yml から機械生成し直した。生成スクリプトは tmp/gen-collection.js。
#
# 【手で書かない理由】600 件超を手で並べると必ず綴り違いが混ざり、混ざったエントリは
# 「絶対に埋まらない枠」になる。しかも症状は「図鑑の 100% が構造的に到達不能」という
# 気づきにくい形で出る。生成元は items/catalog.yml(draft: true は除外) /
# ArsPaper の materials・threads・sourcejars・sourcelinks・functional-items。
#
# 【重複を作らないこと】scope: all の分母はカテゴリ entries の総和なので、同じIDを
# 2 つのカテゴリに書くと分母だけ増えて 100% に到達できなくなる。生成側は既存カテゴリ
# (infinity / dungeon / source / mob_parts)にあるIDを除外している。
#
# 【カテゴリ別コンプリート】achievements.yml から
#   collection.scope: category + percent: true + threshold: 100
# と書くと「このカテゴリを全部埋めた」を条件にできる(新機構は不要)。
#
# 【バニラ品】CollectionListener は「設定から参照されている Material」しか記録しない
# (全 Material を載せるとプレイヤーPDCが青天井になる)。つまり vanilla_* カテゴリに
# 書いた分だけが図鑑に載る。
#
# 記録されるエントリ:
#   item:<catalogId>   items/catalog.yml のアイテムを入手した(取得/クラフト/釣り/ガチャ等)
#   item:<MATERIAL>    バニラアイテムを入手した(上記の理由で参照されている物だけ)
#   mob:<ENTITY_TYPE>  そのEntityTypeのモブをプレイヤーが討伐した
#
# 進捗はプレイヤーPDC(trinityforge:collection_entries / collection_claimed_tiers)に保持。
# 報酬ティアは図鑑登録数(エントリ種類数)のしきい値で解放され、解放済みティアは再付与されない。
# /tf collection で進捗と解放状況を確認できる(表示時にも未付与ティアを再評価する)。
#
# categories: (2026-07-23追加。図鑑GUIの表示分類。未分類エントリは自動で「その他」表示)
#   items.<catId>: { display-name: "武器", order: 1, entries: [<catalogId>...] }
#   mobs.<catId>:  { display-name: "ボス", order: 1, entries: [<ENTITY_TYPE|mobTypeId>...] }

