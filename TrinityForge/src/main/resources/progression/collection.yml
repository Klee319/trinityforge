# reward-tiers: (2026-07-31 設定) 図鑑の登録エントリ数がしきい値に達したとき一度だけ解放される。
#
# 【憲法】報酬は 称号 / コスメ / 恒久QoL に限定し、縦強化(戦闘ステータス)にしない。
#   items / job-exp / permanent-buffs / vanilla-exp も受け付けるが意図的に使わない
#   ("図鑑を埋めないと戦えない"を作らないため。図鑑は横の楽しみに留める)。
#
# 【前提】special に書くIDは progression/special-rewards.yml の titles / particles に
#   定義されていないと無言で何も配らない。さらに special-rewards.yml は
#   prune-orphaned-grants: true なので、後からIDを消すと保持している全員から剥奪される。
#
# 【しきい値の根拠】記録対象は下の categories だけではない。sources の通りカタログ品(286種)と
#   モブ討伐(敵性EntityTypeほぼ全部)が自動で記録され、バニラ品は「どこかで参照されているものだけ」が
#   記録される。合計の母数は概ね 360 前後。素材を集めるだけでも 50 前後には自然に届く。
#   t4(120) は「複数系統を並行して埋めた」水準、t5(200) は母数の 5 割超 =「万象」の名に見合う水準。
#   2026-07-31: 深淵/束縛者の30種を足して母数が増えたので t4/t5 を 100/150 から引き上げた。
reward-tiers:
  t1:
    threshold: 10
    title: "<gray>収集家</gray>"
    special:
      - title_collector
  t2:
    threshold: 30
    title: "<white>探究者</white>"
    special:
      - title_seeker
      - particle_sparkle
  t3:
    threshold: 60
    title: "<aqua>記録者</aqua>"
    broadcast: true
    special:
      - title_archivist
      - particle_ember_aura
  t4:
    threshold: 120
    title: "<gradient:#7f5af0:#2cb67d>世界渡り</gradient>"
    broadcast: true
    special:
      - title_worldwalker
      - particle_void_aura
  t5:
    threshold: 200
    title: "<gradient:#ffd700:#ff8c00:#ffd700>万象を知る者</gradient>"
    broadcast: true
    special:
      - title_completionist
      - particle_dragon_aura
