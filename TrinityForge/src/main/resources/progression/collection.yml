    #   MANNEQUIN — Mob ではなく LivingEntity(プレイヤー像の設置物)で、討伐という概念が無い。
    # どちらも載せると「永久に埋まらない枠」が分母に入り、collection の percent: 100 系
    # アチーブメント(goal_completionist)を到達不能にする。K-11 と同じ形の事故になるので入れない。
# 報酬ティア。2026-08-16 に図鑑を 140 → 750 件規模へ拡充したのに合わせて引き直した。
# 旧しきい値(10/30/60/120/200)のままだと t5「万象を知る者」が全体の 26% で解放されてしまい、
# 最終目標の称号が序盤の称号に化ける。おおむね 4% / 13% / 33% / 60% / 93% になるよう置いた。
reward-tiers:
  t1:
    threshold: 30
    title: <gray>収集家</gray>
    special:
      - title_collector
  t2:
    threshold: 100
    title: <white>探究者</white>
    special:
      - title_seeker
      - particle_sparkle
  t3:
    threshold: 250
    title: <aqua>記録者</aqua>
    broadcast: true
    special:
      - title_archivist
      - particle_ember_aura
  t4:
    threshold: 450
    title: <gradient:#7f5af0:#2cb67d>世界渡り</gradient>
    broadcast: true
    special:
      - title_worldwalker
      - particle_void_aura
  t5:
    threshold: 700
    title: <gradient:#ffd700:#ff8c00:#ffd700>万象を知る者</gradient>
    broadcast: true
    special:
      - title_completionist
      - particle_dragon_aura
