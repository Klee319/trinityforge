# TrinityForge - コレクション図鑑 (M7, DUNGEON_SPEC §5 / SERVER_CONTENT_SPEC §7)
#
# 収集記録(図鑑)→ 段階的報酬解放。報酬は 称号 / コスメ / 恒久QoL に限定し、
# 縦強化(戦闘ステータス)にしないこと(スペック上の憲法。中身はこの config の運用で守る)。
#
# 記録されるエントリ:
#   item:<catalogId>   items/catalog.yml のアイテムを入手した(取得/クラフト/釣り/ガチャ等)
#   item:<MATERIAL>    バニラアイテムを入手した(2026-07-29追加)。ただし記録されるのは
#                      「下の categories.items.*.entries に書いたMaterial」か
#                      「achievements.yml のアイテム条件(collection.scope: item)に書いたMaterial」
#                      だけ。参照されていないバニラ品は記録しない(全Material分までPDCが膨らむため)。
#   mob:<ENTITY_TYPE>  そのEntityTypeのモブをプレイヤーが討伐した
#
# 進捗はプレイヤーPDC(trinityforge:collection_entries / collection_claimed_tiers)に保持。
# 報酬ティアは図鑑登録数(エントリ種類数)のしきい値で解放され、解放済みティアは再付与されない。
# /tf collection で進捗と解放状況を確認できる(表示時にも未付与ティアを再評価する)。
#
# categories: (2026-07-23追加。図鑑GUIの表示分類。未分類エントリは自動で「その他」表示)
#   items.<catId>: { display-name: "武器", order: 1, entries: [<catalogId>...] }
#   mobs.<catId>:  { display-name: "ボス", order: 1, entries: [<ENTITY_TYPE|mobTypeId>...] }

enabled: true
sources:
  catalog-items: true
  mob-kills: true
# gui: (2026-07-27追加) 図鑑GUIの見た目。
#   locked-icon: 未発見エントリに使う「錠前」アイコンのMaterial名(既定 BARRIER)。
#                解決できない名前を書いた場合は既定へ自動フォールバックする。
gui:
  locked-icon: BARRIER
# display-names: (2026-07-27追加、任意) 図鑑での表示名の明示上書き。既定は空でよい。
#   items.<catalogId>: アイテムは通常 display-name がそのまま出るので、書く必要はほぼ無い。
#   mobs.<ENTITY_TYPE>: モブは翻訳キー(entity.minecraft.*)で表示するため画面には日本語が出るが、
#                       サーバー側は日本語名を知らないので「名前検索/名前ソート」は英名基準になる。
#                       日本語で検索・整列させたいモブだけここへ書く。
display-names:
  items: {}
  mobs: {}
categories:
  items:
    infinity:
      # 2026-07-31: インフィニティ専用タブだったが、深淵(abyss_*)/束縛者(binder_*)を足して
      # 「最上位装備」タブに広げた。GUIは自動ページ送りなので件数上限は無い。
      display-name: 最上位装備
      order: 1
      entries:
        - infinity_axe
        - infinity_axe_tool
        - infinity_boots
        - infinity_bow
        - infinity_wand
        - infinity_chestplate
        - infinity_crossbow
        - infinity_dagger
        - infinity_grate_sword
        - infinity_greataxe
        - infinity_helmet
        - infinity_hoe
        - infinity_leggings
        - infinity_mace
        - infinity_pickaxe
        - infinity_rapier
        - infinity_scythe
        - infinity_shovel
        - infinity_spear
        - infinity_sword
        - infinity_trident
        - infinity_warhammer
        - abyss_sword
        - abyss_dagger
        - abyss_rapier
        - abyss_spear
        - abyss_trident
        - abyss_scythe
        - abyss_mace
        - abyss_warhammer
        - abyss_grate_sword
        - abyss_axe
        - abyss_greataxe
        - abyss_bow
        - abyss_crossbow
        - binder_sword
        - binder_dagger
        - binder_rapier
        - binder_spear
        - binder_trident
        - binder_scythe
        - binder_mace
        - binder_warhammer
        - binder_grate_sword
        - binder_axe
        - binder_greataxe
        - binder_bow
        - binder_crossbow
        - binder_helmet
        - binder_chestplate
        - binder_leggings
        - binder_boots
    # 2026-07-31 追加。GUIのタブ枠は9個までで、items/mobs それぞれに自動の「その他」タブが
    # 1個ずつ付くので、書けるカテゴリは合計7個が上限(超えた分は無言で表示されない)。
    # 現在: items 5 + mobs 2 = 7 + その他2 = ちょうど9。増やすときは必ずどれかを畳むこと。
