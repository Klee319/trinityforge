# TrinityForge — ロールバフ (ROLE_SYSTEM_SPEC)
# 獣使い(beast_tamer)はスコープ外。戦闘職 + 補助職の内部ステ注入のみ。
# 設定リファレンス(本文コメント移設先): docs/config-reference/progression/role-buffs.md
#
# 【2026-07-28 追加 / 2026-07-29 更新】label / icon / description
#   label       : GUIとチャットに出す職業名。MiniMessage 記法(<gold>等)が使える。
#   icon        : ロール選択GUI(/tf status のロールアイコンから開く)でこのロールを表すアイテム(Material名)。
#                 省略・不正な名前のときは既定アイコン(戦闘職=鉄の剣 / 補助職=本)へフォールバックする。
#   description : GUIと /tf role のチャット表示に添える説明。アイテムカタログの lore と同じく
#                 複数行で書けて、各行に MiniMessage 記法が使える。省略可。
#                 1行の文字列で書いた既存の書き方もそのまま読める(1行の lore として扱う)。
#                   description:
#                     - "<gray>物理ダメージが敵の防御力を20%貫通する</gray>"
#   label / icon / description はロールの効果には一切影響しない表示専用の項目。
#
# 【2026-08-05 追加(W-28)】role-change.allow-change (旧 allow-command)
#   職業(ロール)の変更を許可するか。
#     true  : 下の cooldown-minutes による通常の待ち時間(CT)制。
#     false : 「初回の無料就職以外はアイテム消費でのみ変更可」
#             ・まだ就いていない枠への初回就職だけ無料で通る(first-choice-free: true のとき)
#             ・それ以降は「転職の証」(role_reselect_ticket)を手に持って右クリックしたときだけ変更できる
#             ・解除(/tf role clear)は塞がる — 枠を空にできると「初回無料」を無限に再利用できるため
#   旧キー allow-command は allow-change が書かれていないときだけ読む(配備済みconfigが無言で
#   「許可」へ反転しないようにするため)。旧キーの false は「初回の就職すら不可」だった。
#   変更の動線は /tf status の「職業(ロール)」アイコンだけ(/tf menu と /tf role set は廃止)。

combat-roles:
  swordfighter:
    label: 剣闘士
    icon: IRON_SWORD
    attack-buffs:
      penetration: 0.2
    defense-buffs: {}
    description:
      - <gray>物理ダメージが敵の防御率を 20% 貫通する。</gray>
      - <white>守りの厚い敵ほど恩恵が大きい。</white>
      - <white>「世界を繋ぐ者」第2段階は物理寄りの壁なので、ここが一番楽になる。</white>
      - "<yellow>向く武器: 重量武器・軽量武器</yellow>"
  mage:
    label: 魔術師
    icon: BLAZE_ROD
    attack-buffs:
      percent-bonus-damage: 0.3
    defense-buffs: {}
    description:
      - <gray>魔法ダメージに 30% の割合追加ダメージが乗る。</gray>
      - <white>敵の最大体力に比例するので、体力の多いボスに強い。</white>
      - <white>「世界を繋ぐ者」第3段階は魔法寄りの壁なので、ここが一番楽になる。</white>
      - "<yellow>向く武器: 魔導書(Ars魔法)</yellow>"
  tank:
    label: 守衛
    icon: SHIELD
    description:
      - <gray>被ダメージを 10% 軽減し、ヘイトが 1.5 倍になる。</gray>
      - <white>敵の狙いを自分へ集めるので、複数人なら味方の生存率がそのまま上がる。</white>
      - <white>「世界を繋ぐ者」第4段階は増援が同時に湧くので、ここが一番効く。</white>
      - "<yellow>向く装備: 重装・盾</yellow>"
    defense-buffs:
      damage-reduction: 0.1
    hate-threat-multiplier: 1.5
    attack-buffs: {}
support-roles:
  farmer:
    label: 農家
    description:
      - <gray>農業EXP +25% / 村人との取引価格が常時有利になる。</gray>
      - <white>コア系(ベジタブル/ミート)の素材は畑と牧場からしか出ない。</white>
      - "<yellow>次: /tf skill farming</yellow>"
    exp-skill: FARMING
    exp-multiplier: 1.25
    potion-buff:
      type: HERO_OF_THE_VILLAGE
      duration: 999999
      amplifier: 0
    icon: IRON_HOE
  fisher:
    label: 漁師
    description:
      - <gray>釣りEXP +35% / 常時 幸運。</gray>
      - <white>釣りは待ち時間で稼ぎが決まるので倍率を最も高くしている。</white>
      - <white>ガチャ券(特級・極級)は釣りギミックからしか出ない。</white>
      - "<yellow>次: /tf skill fishing</yellow>"
    exp-skill: FISHING
    exp-multiplier: 1.35
    potion-buff:
      type: LUCK
      duration: 999999
      amplifier: 0
    icon: FISHING_ROD
  miner:
    label: 鉱夫
    icon: IRON_PICKAXE
    description:
      - <gray>採掘EXP +15% / 常時 採掘速度上昇。</gray>
      - <white>採掘は単位時間の稼ぎが最も大きいので倍率は控えめ。</white>
      - <white>ガチャ券(初級〜上級)とジュエリーコアは採掘から。</white>
      - "<yellow>次: /tf skill mining</yellow>"
    exp-skill: MINING
    exp-multiplier: 1.15
    potion-buff:
      type: HASTE
      duration: 999999
      amplifier: 0
  digger:
    label: 土工
    description:
      - <gray>切削EXP +35% / 常時 移動速度上昇。</gray>
      - <white>掘った土そのものに使い道が少ないぶん倍率を高くしている。</white>
      - <white>遺跡のスレッドとダートコアは切削から。</white>
      - "<yellow>次: /tf skill digging</yellow>"
    exp-skill: DIGGING
    exp-multiplier: 1.35
    potion-buff:
      type: SPEED
      duration: 999999
      amplifier: 0
    icon: IRON_SHOVEL
  woodcutter:
    label: きこり
    description:
      - <gray>伐採EXP +15% / 常時 火炎耐性。</gray>
      - <white>一括伐採が乗ると稼ぎが跳ねるので倍率は控えめ。</white>
      - <white>ウッドコアと圧縮木材(耐久回復)は伐採から。</white>
      - "<yellow>次: /tf skill woodcutting</yellow>"
    exp-skill: WOODCUTTING
    exp-multiplier: 1.15
    potion-buff:
      type: FIRE_RESISTANCE
      duration: 999999
      amplifier: 0
    icon: IRON_AXE
role-change:
  allow-change: false
  cooldown-minutes: 120
  first-choice-free: true
  nearby-enemy-radius: 0
