disassembly:
  percent-per-level: 25
  items:
    copper_*:
      - input: COPPER_INGOT
        output: custom:copper_ingot_scrap
        multiplier: 2
    iron_*:
      - input: IRON_INGOT
        output: custom:iron_ingot_scrap
        multiplier: 2
    golden_*:
