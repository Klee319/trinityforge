# TrinityForge — スキルツリー動的ゲート(feature:/brew:/trade:/recipe:/overenchant: 等)の
# 機能本体チューニング (2026-07-23 動的ID方式改修)。
# カタログレシピ (trinityforge:catalog_<id>) のゲートは skilltree 側 `recipe:<catalogId>` の
# 参照有無で決まる(未参照=解放済み扱い)。ここには対応するレシピ挙動チューニングのみを書く。

# 武器コーティング (weapon-coating-unlock / coating-stack-increase)
# materials: catalog id → 1スタックあたりダメージ / その素材使用時のスタック上限

coating:
  base-max-stacks: 3
  materials:
    source_gem:
      bonus-damage: 5
      max-stacks: 10
wood-repair:
  materials:
    compressed_wood_1x:
      durability: 200
      quick-repair: true
disassembly:
  percent-per-level: 25
  items:
    wooden_*:
      - input: list:planks
        output: custom:plank_scrap
        multiplier: 2
    copper_*:
      - input: COPPER_INGOT
        output: custom:copper_ingot_scrap
        multiplier: 2
    iron_*:
      - input: IRON_INGOT
        output: custom:iron_ingot_scrap
        multiplier: 2
    golden_*:
      - input: GOLD_INGOT
        output: custom:gold_ingot_scrap
        multiplier: 2
    diamond_*:
      - input: DIAMOND
        output: custom:diamond_scrap
        multiplier: 2
    netherite_*:
      - input: NETHERITE_INGOT
        output: custom:netherite_ingot_scrap
        multiplier: 2
    leather_*:
      - input: LEATHER
        output: custom:leather_scrap
        multiplier: 2
    turtle_*:
      - input: TURTLE_SCUTE
        output: custom:turtle_scute_scrap
        multiplier: 2
    ROTTEN_FLESH:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 6
          - item: custom:plank_scrap
            weight: 3
          - item: custom:iron_ingot_scrap
            weight: 1
    STICK:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 9
          - item: custom:copper_ingot_scrap
            weight: 1
    STRING:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 7
          - item: custom:plank_scrap
            weight: 3
    BONE:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 5
          - item: custom:turtle_scute_scrap
            weight: 4
          - item: custom:iron_ingot_scrap
            weight: 1
    INK_SAC:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 8
          - item: custom:copper_ingot_scrap
            weight: 2
    LILY_PAD:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 10
    BOWL:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 10
    TRIPWIRE_HOOK:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:iron_ingot_scrap
            weight: 6
          - item: custom:plank_scrap
            weight: 4
    FISHING_ROD:
      - base-amount: 2
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 6
          - item: custom:leather_scrap
            weight: 3
          - item: custom:copper_ingot_scrap
            weight: 1
potion-merge:
  max-effects: 5
  max-duration-seconds: 960
# 醸造アンロック (brew:<グループID>)
# 【重要】グループを「どのノードからも参照しない」と永久ロックになる
# (BrewUnlockListener は未参照グループを開放扱いしない)。逆に skilltree 側が
# 存在しないグループIDを指しているとそのノードは完全な無効果になる。
# 2026-07-30 修正: skilltree/alchemy.yml C-1-upper の brew:swiftness-jump に
# 対応するグループが無く、healthboost-haste-2 は逆に未参照で永久ロックだった。
#
# base はビン(AWKWARD/THICK/MUNDANE/WATER)、ingredient は醸造素材。
# バニラで既に成立する組み合わせを書くとバニラのレシピを上書きしてしまうので、
# 「バニラでは何も出ない組み合わせ」に割り当てること。
brew-unlocks:
  # skilltree/alchemy.yml C-1-upper「俊敏・跳躍の調合」(Lv40)
  # THICK ベースはバニラでは何も生まないので、グロウストーン無しで II 相当を作れる枠にした。
  swiftness-jump:
    potions:
      - base: THICK
        ingredient: SUGAR
        result:
          type: SPEED
          duration: 3600
          amplifier: 1
      - base: THICK
        ingredient: RABBIT_FOOT
        result:
          type: JUMP_BOOST
          duration: 3600
          amplifier: 1
  # skilltree/alchemy.yml C-2-upper「体力増強の調合」(Lv60)
  healthboost-haste:
    potions:
      - base: AWKWARD
        ingredient: GLISTERING_MELON_SLICE
        result:
          type: HEALTH_BOOST
          duration: 3600
          amplifier: 0
      - base: THICK
        ingredient: GOLDEN_CARROT
        result:
          type: HASTE
          duration: 3600
          amplifier: 0
      - base: AWKWARD
        ingredient: GOLDEN_APPLE
        result:
          type: LUCK
          duration: 3600
          amplifier: 0
  # skilltree/alchemy.yml E-1-1「回復・体力増強の調合」(Lv80)
  healthboost-haste-2:
    potions:
      - base: THICK
        ingredient: GLISTERING_MELON_SLICE
        result:
          type: HEALTH_BOOST
          duration: 3600
          amplifier: 1
      - base: THICK
        ingredient: GOLDEN_CARROT
        result:
          type: HASTE
          duration: 3600
          amplifier: 1
      - base: AWKWARD
        ingredient: GOLDEN_APPLE
        result:
          type: LUCK
          duration: 3600
          amplifier: 1
  # ===========================================================================
  # 討伐素材を使う調合 (2026-07-31 追加)
  # ---------------------------------------------------------------------------
  # 高レベル帯の特定モブだけが落とす素材(combat/mob-level-table.yml の add-drops)を
  # 醸造の入口にする。「素材を集める理由」と「その素材でしか作れない効果」を1対1で結ぶのが狙いで、
  # どれもバニラのポーションでは作れない効果に寄せている(既存の調合を置き換えない)。
  #
  # 【custom: が効く前提】ingredient の custom:<id> は 2026-07-31 に
  # CrossPluginItemResolver.idOf へ寄せた。それまでは TF カタログの PDC だけを見ていたため、
  # ArsPaper の materials.yml 側で定義した素材を書いても永久に一致しなかった。
  #
  # 【base の選び方】バニラが同じ (base, ingredient) から何かを作る組み合わせは避ける。
  # 重なるとバニラ側のレシピが先に成立して、こちらの結果で上書きする形になり挙動が読みにくい。
  # THICK は「バニラでは何も生まない」ので、独自効果の置き場として一番安全。
  # ---------------------------------------------------------------------------
  # skilltree/alchemy.yml C-2-lower「衰弱の術」(Lv60) — 妨害寄りの調合
  hunter-hex:
    potions:
      # ウィッチの秘薬: 魔女しか落とさない小瓶。バニラでは作れない強さの弱体化。
      - base: THICK
        ingredient: custom:witch_elixir
        result:
          type: WEAKNESS
          duration: 3600
          amplifier: 2
      # エンダーマイトの煤: 次元の隙間の粉。視界を奪う。
      - base: THICK
        ingredient: custom:endermite_soot
        result:
          type: BLINDNESS
          duration: 1200
          amplifier: 0
      # ストレイの布片: 凍てついた布。移動を止める。
      - base: THICK
        ingredient: custom:stray_cloth
        result:
          type: SLOWNESS
          duration: 1800
          amplifier: 2
  # skilltree/alchemy.yml E-2-1「呪詛の術」(Lv80) — 生存寄りの調合
  survivor-brew:
    potions:
      # ガーディアンの棘: 海底神殿の番人。水中呼吸と暗視をまとめて長時間。
      - base: THICK
        ingredient: custom:guardian_spine
        result:
          type: CONDUIT_POWER
          duration: 6000
          amplifier: 0
      # ラヴェジャーの革: 分厚い皮。被ダメージ軽減(バニラのポーションには無い効果)。
      - base: THICK
        ingredient: custom:ravager_hide
        result:
          type: RESISTANCE
          duration: 2400
          amplifier: 1
      # ハスクの布片: 渇きに晒された衣。空腹の進行を止める。
      - base: THICK
        ingredient: custom:husk_cloth
        result:
          type: SATURATION
          duration: 200
          amplifier: 0
  # skilltree/alchemy.yml E「変換の大錬金術師」(Lv90) — 攻めの調合(最上位)
  apex-brew:
    potions:
      # ホグリンの牙: 折れてなお鋭い。攻撃力上昇の最上位。
      - base: THICK
        ingredient: custom:hoglin_tusk
        result:
          type: STRENGTH
          duration: 3600
          amplifier: 2
      # ピグリンブルートの鎧片: 砦の守り手の黄金。ダメージ耐性と引き換えの重さ(遅鈍込み)ではなく
      # 純粋な体力増強にして、装備で殴り合う型の受け皿にする。
      - base: THICK
        ingredient: custom:piglin_brute_plate
        result:
          type: HEALTH_BOOST
          duration: 3600
          amplifier: 3
      # ボグドの苔むした骨: 沼の骨。再生の最上位。
      - base: THICK
        ingredient: custom:bogged_mossy_bone
        result:
          type: REGENERATION
          duration: 1200
          amplifier: 2
      # 砂まみれの骨: 乾き切った骨。跳躍の最上位(移動系ビルドの受け皿)。
      - base: THICK
        ingredient: custom:parched_sandy_bone
        result:
          type: JUMP_BOOST
          duration: 3600
          amplifier: 3
# オーバーエンチャント (overenchant:<プロファイルID>)
# 【重要】ここのキーがそのままゲートIDになる。skilltree 側の
# dedicated-effects `overenchant:<id>` と綴りが一致していないと、
# OverEnchantListener / EnchantLuckListener の該当経路が丸ごと無効になる
# (2026-07-30 修正: 旧 attack_1 / util_lv1 / attack_2 が
#  skilltree の overenchant:lv1 / lv2 / lv3 と食い違い機構全体が死んでいた)。
# 複数プロファイルを同時に持つ場合、各エンチャントの上限は
# プロファイル横断の Math.max で合成される(格下げは起きない)。
over-enchant:
  # skilltree/enchanting.yml C-1「オーバーエンチャントI」(Lv40)
  lv1:
    enchants:
      SHARPNESS: 6
      SMITE: 6
      BANE_OF_ARTHROPODS: 6
      POWER: 6
      IMPALING: 6
      PROTECTION: 5
      BLAST_PROTECTION: 5
      PROJECTILE_PROTECTION: 5
      FIRE_PROTECTION: 5
      FEATHER_FALLING: 5
  # skilltree/enchanting.yml C-3「オーバーエンチャントIII」(Lv80)
  # 攻撃系をさらに+1する段。軽減系は lv1 の方が高い値を持つが、
  # 上限はプロファイル横断の Math.max なので lv1 の 5 が維持される。
  lv3:
    enchants:
      SHARPNESS: 7
      SMITE: 7
      BANE_OF_ARTHROPODS: 7
      POWER: 7
      IMPALING: 7
      PROTECTION: 3
      BLAST_PROTECTION: 6
      PROJECTILE_PROTECTION: 6
      FIRE_PROTECTION: 6
      FEATHER_FALLING: 6
  # skilltree/enchanting.yml C-2「オーバーエンチャントII」(Lv60)
  lv2:
    enchants:
      EFFICIENCY: 6
      FORTUNE: 4
      UNBREAKING: 4
      LOOTING: 4
      LUCK_OF_THE_SEA: 4
      LURE: 4
enchant-bookshelf-power:
  max-bookshelves: 15
  power-per-bookshelf: 0.8
# スレッド(糸)装着枠のカテゴリ別上限。item-stats の thread-slots はここで clamp され、
# 上限 0 のカテゴリでは【キーごと削除される】(ThreadSlotPolicy#applyCategoryCap)。
# ⚠ ここを Java 側の既定値(CraftingFeaturesConfig#DEFAULT_THREAD_SLOT_CAP)とずらしてはいけない。
#   2026-07-31 まで Java 既定が weapon/tool/other=0 のままこの yml だけ 5 になっていたため、
#   武器・触媒 78 件が「lore に『スレッド枠 N枠』と出るのに装着 GUI も効果も無い飾り」になっていた。
#   現在は fork の /ars thread(手持ち装備)と防具のスニーク+右クリックの両方で機能する。
#   other は触媒(BLAZE_ROD の杖など)が属するカテゴリなので、0 にすると杖の枠が消える。
thread-slots:
  max-by-category:
    armor: 5
    weapon: 5
    tool: 5
    other: 5
removed-vanilla-recipes: []
removed-vanilla-items:
  - ANY:MENDING
gated-catalog-recipes: {}
