# エンチャントテーブルの「本棚パワー」config化(2026-07-26新設)
# バニラ仕様: エンチャントテーブル周囲の本棚(規定の配置)は最大15個までがエンチャントパワーとして
# 有効(Bukkit/Paper API の PrepareItemEnchantEvent#getEnchantmentBonus() が返す値)。
# バニラでは本棚15個で頭打ちになり、それ以上置いても効果は増えない。この「15」という上限と
# 「本棚1個=パワー1」という係数を、ここで調整できるようにする。
#
# 既定値(max-bookshelves: 15, power-per-bookshelf: 1.0)ではバニラ実効パワーと完全に一致するため、
# 挙動は一切変化しない(EnchantCostReductionListener が本棚パワー由来の補正倍率=1.0のときは
# 何も書き換えずに終わる)。
#
# 注意: 上限を極端に上げる/係数を大きくすると、少ない本棚数でも高コスト・高レベルの提示が
# 出やすくなり、エンチャントが簡単になりすぎる。バランス調整は慎重に。
enchant-bookshelf-power:
  # 考慮する本棚の最大数。バニラ既定は15(これを超えて本棚を置いても本来は無効)。
  max-bookshelves: 15
  # 本棚1個あたりのエンチャントパワー係数。バニラは常に1.0固定(本棚1個=パワー1)。
  power-per-bookshelf: 1.0
