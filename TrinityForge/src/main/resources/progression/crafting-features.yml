  # 以下2件は 2026-08-25、ArsPaper フォークの items.yml に最後まで残っていたバニラ結果レシピを
  # ここへ移設したもの(editor が items.yml の items: セクションを描画できず編集不能だったため)。
  # 素材は移設元と完全に同一。added-recipes は resolveGateId が(namespace=trinityforge かつ
  # path が catalog_ で始まらない)キーをゲート対象外として扱うため、常時解放のまま出荷する
  # (元がゲートされていなかった=解放条件を持たなかったのと同じ挙動)。
  - result: TRIDENT
    amount: 1
    method: workbench
    type: shaped
    shape:
      - " CP"
      - " AC"
      - "D  "
    ingredients:
      P: PRISMARINE_SHARD
      C: PRISMARINE_CRYSTALS
      D: DIAMOND_BLOCK
      A: COPPER_BLOCK
  # 移設元は儀式(ritual)クラフトだった(コア: APPLE、ペデスタル: GOLD_BLOCK x4 / TOTEM_OF_UNDYING x2 /
  # NETHERITE_INGOT x2、マナ3000)。作業台レシピには「マナ消費」を表現する手段が無いため、
  # コア+ペデスタルの実素材(計9個)をそのまま shapeless の材料としてのみ引き継ぐ(マナ3000分の
  # 価値は素材の希少さ側にそのまま残る=totem x2 + netherite x2 が実質の代替コスト)。
  - result: ENCHANTED_GOLDEN_APPLE
    amount: 1
    method: workbench
    type: shapeless
    ingredients:
      - APPLE
      - GOLD_BLOCK
      - GOLD_BLOCK
      - GOLD_BLOCK
      - GOLD_BLOCK
      - TOTEM_OF_UNDYING
      - TOTEM_OF_UNDYING
      - NETHERITE_INGOT
      - NETHERITE_INGOT
