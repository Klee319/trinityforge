disassembly:
  percent-per-level: 25
  items:
    copper_*:
      - input: COPPER_INGOT
        output: custom:copper_ingot_scrap
        multiplier: 2
    iron_*:
      - input: IRON_INGOT
        output: custom:iron_ingot_scrap
        multiplier: 2
    golden_*:
      - input: GOLD_INGOT
        output: custom:gold_ingot_scrap
        multiplier: 2
    diamond_*:
      - input: DIAMOND
        output: custom:diamond_scrap
        multiplier: 2
    netherite_*:
      - input: NETHERITE_INGOT
        output: custom:netherite_ingot_scrap
        multiplier: 2
    leather_*:
      - input: LEATHER
        output: custom:leather_scrap
        multiplier: 2
    turtle_*:
      - input: TURTLE_SCUTE
        output: custom:turtle_scute_scrap
        multiplier: 2
  tiers:
    "1":
      percent: 10
    "2":
      percent: 30
    "3":
      percent: 50
scrap-conversion:
  tf_scrap:
    base-amount: 4
    outputs:
