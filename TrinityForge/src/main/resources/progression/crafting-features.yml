# TrinityForge — スキルツリー動的ゲート(feature:/brew:/trade:/recipe:/overenchant: 等)の
# 機能本体チューニング (2026-07-23 動的ID方式改修)。
# カタログレシピ (trinityforge:catalog_<id>) のゲートは skilltree 側 `recipe:<catalogId>` の
# 参照有無で決まる(未参照=解放済み扱い)。ここには対応するレシピ挙動チューニングのみを書く。

# 武器コーティング (weapon-coating-unlock / coating-stack-increase)
# materials: catalog id → 1スタックあたりダメージ / その素材使用時のスタック上限

coating:
  base-max-stacks: 3
  materials:
    source_gem:
      bonus-damage: 5
      max-stacks: 10
wood-repair:
  materials:
    compressed_wood_1x:
      durability: 200
      quick-repair: true
disassembly:
  percent-per-level: 25
  items:
    wooden_*:
      - input: list:planks
        output: custom:plank_scrap
        multiplier: 2
    copper_*:
      - input: COPPER_INGOT
        output: custom:copper_ingot_scrap
        multiplier: 2
    iron_*:
      - input: IRON_INGOT
        output: custom:iron_ingot_scrap
        multiplier: 2
    golden_*:
      - input: GOLD_INGOT
        output: custom:gold_ingot_scrap
        multiplier: 2
    diamond_*:
      - input: DIAMOND
        output: custom:diamond_scrap
        multiplier: 2
    netherite_*:
      - input: NETHERITE_INGOT
        output: custom:netherite_ingot_scrap
        multiplier: 2
    leather_*:
      - input: LEATHER
        output: custom:leather_scrap
        multiplier: 2
    turtle_*:
      - input: TURTLE_SCUTE
        output: custom:turtle_scute_scrap
        multiplier: 2
    ROTTEN_FLESH:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 6
          - item: custom:plank_scrap
            weight: 3
          - item: custom:iron_ingot_scrap
            weight: 1
    STICK:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 9
          - item: custom:copper_ingot_scrap
            weight: 1
    STRING:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 7
          - item: custom:plank_scrap
            weight: 3
    BONE:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 5
          - item: custom:turtle_scute_scrap
            weight: 4
          - item: custom:iron_ingot_scrap
            weight: 1
    INK_SAC:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:leather_scrap
            weight: 8
          - item: custom:copper_ingot_scrap
            weight: 2
    LILY_PAD:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 10
    BOWL:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 10
    TRIPWIRE_HOOK:
      - base-amount: 1
        multiplier: 1
        outputs:
          - item: custom:iron_ingot_scrap
            weight: 6
          - item: custom:plank_scrap
            weight: 4
    FISHING_ROD:
      - base-amount: 2
        multiplier: 1
        outputs:
          - item: custom:plank_scrap
            weight: 6
          - item: custom:leather_scrap
            weight: 3
          - item: custom:copper_ingot_scrap
            weight: 1
