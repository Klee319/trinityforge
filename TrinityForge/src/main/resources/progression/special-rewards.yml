# TrinityForge - 特殊報酬レジストリ (2026-07-23-stat-gate-overhaul.md §6.1/§6.7)
#
# 称号(titles) / パーティクル(particles) / パーティクルシード(particle-seeds) を
# ID単位で定義する。ここで定義したIDは以下の3箇所から共通参照される:
#   - スキルツリー: 解放効果 reward:<id> (動的ゲート)
#   - 図鑑(collection.yml) reward-tiers.<tierId>.special: [<id>...]
#   - アチーブメント(achievements.yml) achievements.<id>.rewards.special: [<id>...]
#
# titles.<id>:
#   display: MiniMessage文字列。プレイヤーのネームタグ(名前)に連結して表示する称号テキスト。
#     例: "<gradient:#ff0000:#ffff00>竜殺し</gradient>"
#
# particles.<id>:
#   particle:       Bukkit Particle 名 (例: FLAME, CRIT, END_ROD)
#   count:          1回の発生あたりのパーティクル数
#   radius:         発生半径(ブロック)
#   interval-ticks: 発生間隔(tick)
#   shape:          circle(周囲に円形散布) | aura(自分の周りにまとわりつく)
#
# particle-seeds.<id>: (ツール/武器合成用の「種」アイテム)
#   seed-item: 合成素材。Material名 または custom:<カタログID>
#   particle:  Bukkit Particle 名
#   count:     ブロック破壊/攻撃時に発生させる数
#
# display.nametag-clearance: 称号の行を頭上のどこに出すか (2026-08-03)
#   称号は「プレイヤー名(ネームタグ)の上の別行」に出す。この値は、そのネームタグの上端から
#   さらに何ブロック上へ離すかの余白(既定 0.4)。0 で真上に接し、大きくするほど離れる。
#
#   ⚠ 2026-08-24(W-212)から【負値も書ける】(下限 -0.35)。報告「称号のy座標をあと0.3くらい
#     下げたい」への対応。それまでは負値を既定 0.4 へ戻していたので、0 まで下げた人が
#     さらに下げようとすると【逆に 0.4 上がる】という最悪の挙動だった。
#     この式の「1行の高さ 0.25」は見積りであって実測ではないので、見積りが過大なら
#     余白 0 でも実機では隙間が残る ── そのぶんを負の余白で詰める。
#   ⚠ 下げすぎると W-174「称号がネームタグを消す(名前が読めない)」へ近づく。
#     名前が読みにくくなったら 0 へ戻すこと。下限より下は下限として扱い、警告を出す。
#
# display.title-teleport-duration: 称号が頭を追いかける補間の長さ(tick、既定 3)
#   ⚠ 2026-08-24(W-212)追加。報告「称号の位置がネームタグと同期しておらず、遅れて追従して
#     いる感じになっている」への対応。
#   クライアントは【プレイヤー本体の位置を約3tickかけて補間】する(移動パケットが届くたびに
#   やり直す)。一方 TextDisplay の位置は teleport_duration ぶんで補間される。ここを 1 にすると
#   称号だけが先に目的地へ着くので、走り出し・停止・方向転換のたびに頭からズレる。
#   本体と同じ 3 にすると同じ法則で動くので、他人を見たときのズレが最小になる。
#     0     … 補間なし(20Hzで段階的に動く。カクつくが遅れは最小)
#     1     … 2026-08-19〜08-24 の挙動(称号が先に着く)
#     3     … 既定(本体の補間と同じ長さ)
#     10まで… 長くすると滑らかだが、揺れて見えたら短くする(W-135)
#   ⚠ 自分の称号を F5(三人称)で見たときの遅れは、ここを何にしても消えない。自分の本体だけは
#     クライアントが予測して即座に描くのに対し、称号はサーバ由来で必ず往復ぶん遅れる。
#     他人から見えている位置はズレていない。
#   ⚠ プレイヤーへ騎乗させれば構造的にズレは消えるが、【ネームタグが消える】ので戻さないこと
#     (W-153 → W-174 で実際にやって撤去した)。
#
#   【なぜ「余白」で持つのか】 バグ報告「称号を付けている人にネームタグが表示されなかった」の
#   真因は、旧実装が値を「パッセンジャーのマウント点からの相対オフセット」として扱っていたこと。
#   マウント点はバニラ既定で 高さ×0.75 = 1.35、ネームタグは 高さ+0.5 = 2.3 に出るので、
#     ・0.35 → 称号は 1.70(ネームタグのはるか下)
#     ・0.75 → 称号は 2.10。1行の文字高は約0.25なので 1.98〜2.23 に描かれ、
#              ネームタグ(2.18〜2.43)と 2.18〜2.23 で重なって名前を隠していた
#   ── どちらの当て推量も「ネームタグより上」に届いていなかった。
#   現在は 高さ+0.5+この余白 という足元からの絶対座標へ毎tick追従させるので、
#   マウント点という未知数が式から消え、余白が負でない限り必ず名前より上に出る。
#   /trinityforge reload で反映される。
#
# prune-orphaned-grants: (安全弁)
#   true(既定) にすると、このファイルから削除した報酬IDを、プレイヤーの保持分
#   (直接付与リスト/装備中の称号・パーティクル)からも自動で取り除く(参加時 + /trinityforge reload 時)。
#   YAML構文エラー等でこのファイル自体の読み込みに失敗した回は「全部未定義」と誤判定して
#   全員の報酬を消し飛ばす事故を防ぐため、読み込み失敗時は自動でプルーン処理そのものをスキップする
#   (直前の設定値を維持する既存の挙動と同じ安全側フォールバック)。
#   運用上どうしても自動剥奪を止めたい場合は false にすること(削除したIDが古いまま残り続ける)。

# 【パーティクル名の制約】 2026-07-31
#   ここに書けるのは「追加データを要らない種類」だけ。演出側はデータ引数なしで spawnParticle を
#   呼ぶので、FLASH / DUST / DUST_COLOR_TRANSITION / BLOCK / ITEM / ENTITY_EFFECT / SHRIEK /
#   SCULK_CHARGE / VIBRATION / TRAIL のようにデータ必須の種類は指定しても弾かれる(WARNING)。
#   実在する名前でも読み込み時に落ちるので、起動ログの
#   「particle '<id>' has invalid/missing particle name」を必ず確認すること。
#   Paper 1.21.11 で FLASH が Color 必須化したとき戦闘処理ごと落ちた実績があるため、
#   SpecialRewardsConfig 側で設定を読む時点で弾いている。
#
# 【付与の憲法】 2026-07-31
#   称号/パーティクルは「縦強化にしない報酬」の受け皿。図鑑(collection.yml reward-tiers)と
#   アチーブメントの報酬をここへ集約し、戦闘ステータスは一切配らない。
#   ⚠ prune-orphaned-grants: true なので、ここからIDを消すと保持している全員から剥奪される。
#   一度出荷したIDは名前を変えず、要らなくなっても display を差し替えるだけにすること。

prune-orphaned-grants: true
display:
  # 2026-08-24: 0(ネームタグ上端に接する)でも実機では高いという報告により -0.3。
  nametag-clearance: -0.3
  # 2026-08-24: 本体の補間(約3tick)と同じ長さにして追従のズレを最小化する。
  title-teleport-duration: 3
