# TrinityForge - 特殊報酬レジストリ (2026-07-23-stat-gate-overhaul.md §6.1/§6.7)
#
# 称号(titles) / パーティクル(particles) / パーティクルシード(particle-seeds) を
# ID単位で定義する。ここで定義したIDは以下の3箇所から共通参照される:
#   - スキルツリー: 解放効果 reward:<id> (動的ゲート)
#   - 図鑑(collection.yml) reward-tiers.<tierId>.special: [<id>...]
#   - アチーブメント(achievements.yml) achievements.<id>.rewards.special: [<id>...]
#
# titles.<id>:
#   display: MiniMessage文字列。プレイヤーのネームタグ(名前)に連結して表示する称号テキスト。
#     例: "<gradient:#ff0000:#ffff00>竜殺し</gradient>"
#
# particles.<id>:
#   particle:       Bukkit Particle 名 (例: FLAME, CRIT, END_ROD)
#   count:          1回の発生あたりのパーティクル数
#   radius:         発生半径(ブロック)
#   interval-ticks: 発生間隔(tick)
#   shape:          circle(周囲に円形散布) | aura(自分の周りにまとわりつく)
#
# particle-seeds.<id>: (ツール/武器合成用の「種」アイテム)
#   seed-item: 合成素材。Material名 または custom:<カタログID>
#   particle:  Bukkit Particle 名
#   count:     ブロック破壊/攻撃時に発生させる数
#
# display.nametag-clearance: 称号の行を頭上のどこに出すか (2026-08-03)
#   称号は「プレイヤー名(ネームタグ)の上の別行」に出す。この値は、そのネームタグの上端から
#   さらに何ブロック上へ離すかの余白(既定 0.4)。0 で真上に接し、大きくするほど離れる。
#   0未満を書いた場合は既定値へ戻す(負にすると名前へ重なって隠すため)。
#
#   【なぜ「余白」で持つのか】 バグ報告「称号を付けている人にネームタグが表示されなかった」の
#   真因は、旧実装が値を「パッセンジャーのマウント点からの相対オフセット」として扱っていたこと。
#   マウント点はバニラ既定で 高さ×0.75 = 1.35、ネームタグは 高さ+0.5 = 2.3 に出るので、
#     ・0.35 → 称号は 1.70(ネームタグのはるか下)
#     ・0.75 → 称号は 2.10。1行の文字高は約0.25なので 1.98〜2.23 に描かれ、
#              ネームタグ(2.18〜2.43)と 2.18〜2.23 で重なって名前を隠していた
#   ── どちらの当て推量も「ネームタグより上」に届いていなかった。
#   現在は 高さ+0.5+この余白 という足元からの絶対座標へ毎tick追従させるので、
#   マウント点という未知数が式から消え、余白が負でない限り必ず名前より上に出る。
#   /trinityforge reload で反映される。
#
# prune-orphaned-grants: (安全弁)
#   true(既定) にすると、このファイルから削除した報酬IDを、プレイヤーの保持分
#   (直接付与リスト/装備中の称号・パーティクル)からも自動で取り除く(参加時 + /trinityforge reload 時)。
#   YAML構文エラー等でこのファイル自体の読み込みに失敗した回は「全部未定義」と誤判定して
#   全員の報酬を消し飛ばす事故を防ぐため、読み込み失敗時は自動でプルーン処理そのものをスキップする
#   (直前の設定値を維持する既存の挙動と同じ安全側フォールバック)。
#   運用上どうしても自動剥奪を止めたい場合は false にすること(削除したIDが古いまま残り続ける)。

# 【パーティクル名の制約】 2026-07-31
#   ここに書けるのは「追加データを要らない種類」だけ。演出側はデータ引数なしで spawnParticle を
#   呼ぶので、FLASH / DUST / DUST_COLOR_TRANSITION / BLOCK / ITEM / ENTITY_EFFECT / SHRIEK /
#   SCULK_CHARGE / VIBRATION / TRAIL のようにデータ必須の種類は指定しても弾かれる(WARNING)。
#   実在する名前でも読み込み時に落ちるので、起動ログの
#   「particle '<id>' has invalid/missing particle name」を必ず確認すること。
#   Paper 1.21.11 で FLASH が Color 必須化したとき戦闘処理ごと落ちた実績があるため、
#   SpecialRewardsConfig 側で設定を読む時点で弾いている。
#
# 【付与の憲法】 2026-07-31
#   称号/パーティクルは「縦強化にしない報酬」の受け皿。図鑑(collection.yml reward-tiers)と
#   アチーブメントの報酬をここへ集約し、戦闘ステータスは一切配らない。
#   ⚠ prune-orphaned-grants: true なので、ここからIDを消すと保持している全員から剥奪される。
#   一度出荷したIDは名前を変えず、要らなくなっても display を差し替えるだけにすること。

prune-orphaned-grants: true
display:
  nametag-clearance: 0.4

titles:
  # --- 図鑑(collection.yml reward-tiers)の段階報酬 ---
  title_collector:
    display: "<gray>収集家</gray>"
  title_seeker:
    display: "<white>探究者</white>"
  title_archivist:
    display: "<aqua>記録者</aqua>"
  title_worldwalker:
    display: "<gradient:#7f5af0:#2cb67d>世界渡り</gradient>"
  # --- 指南(achievements.yml)の章クリア報酬 ---
  title_first_step:
    display: "<gray>はじまりの者</gray>"
  title_gatherer:
    display: "<green>糧を得る者</green>"
  title_sourcewright:
    display: "<blue>ソースの職人</blue>"
  title_delver:
    display: "<dark_aqua>深層に潜る者</dark_aqua>"
  title_refiner:
    display: "<gold>厳選者</gold>"
  # --- 最終目標3種(束縛者 / 1億ソース / 図鑑コンプ) ---
  title_worldbinder_slayer:
    display: "<gradient:#ff4d4d:#ffd166>世界を解いた者</gradient>"
  title_infinite_source:
    display: "<gradient:#00c2ff:#7f5af0>無限の器</gradient>"
  title_completionist:
    display: "<gradient:#ffd700:#ff8c00:#ffd700>万象を知る者</gradient>"

particles:
  # radius は「発生半径(ブロック)」。aura は自分の周りにまとわりつき、circle は円周上へ等間隔で配置する
  # (circle は count がそのまま円周上の点数になるので、count を上げすぎると視界が潰れる)。
  # interval-ticks は 20 = 1秒。常時演出なので 10 未満にはしない(描画負荷と視界の両方が壊れる)。
  particle_sparkle:
    particle: END_ROD
    count: 6
    radius: 0.8
    interval-ticks: 15
    shape: aura
  particle_ember_aura:
    particle: FLAME
    count: 8
    radius: 0.9
    interval-ticks: 12
    shape: aura
  particle_void_aura:
    particle: PORTAL
    count: 12
    radius: 1.0
    interval-ticks: 10
    shape: aura
  particle_soul_ring:
    particle: SOUL_FIRE_FLAME
    count: 10
    radius: 1.2
    interval-ticks: 14
    shape: circle
  particle_snow_ring:
    particle: SNOWFLAKE
    count: 12
    radius: 1.1
    interval-ticks: 14
    shape: circle
  particle_petal_ring:
    particle: CHERRY_LEAVES
    count: 10
    radius: 1.2
    interval-ticks: 16
    shape: circle
  particle_spark_ring:
    particle: ELECTRIC_SPARK
    count: 14
    radius: 1.0
    interval-ticks: 12
    shape: circle
  particle_dragon_aura:
    particle: DRAGON_BREATH
    count: 10
    radius: 1.0
    interval-ticks: 12
    shape: aura

particle-seeds:
  # 「種」を武器/道具に合成すると、その道具での攻撃/破壊時にパーティクルが出るようになる。
  # seed-item は Material名 または custom:<カタログID>。ここでは新規テクスチャを要らない
  # バニラ素材だけを使い、入手経路は儀式/ガチャ/ドロップ側で与える。
  seed_flame:
    seed-item: BLAZE_POWDER
    particle: FLAME
    count: 6
  seed_frost:
    seed-item: BLUE_ICE
    particle: SNOWFLAKE
    count: 6
  seed_soul:
    seed-item: SOUL_SAND
    particle: SOUL
    count: 6
  seed_spark:
    seed-item: COPPER_INGOT
    particle: ELECTRIC_SPARK
    count: 8
  seed_void:
    seed-item: ENDER_EYE
    particle: PORTAL
    count: 10
  seed_bloom:
    seed-item: PINK_PETALS
    particle: CHERRY_LEAVES
    count: 6
