  title_worldbinder_slayer:
    display: <gradient:#ff4d4d:#ffd166><b>世界を解いた者</b></gradient>
  title_infinite_source:
    display: <gradient:#00c2ff:#7f5af0><b>無限の器</b></gradient>
  title_completionist:
