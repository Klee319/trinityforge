particles:
  particle_sparkle:
    particle: END_ROD
    count: 6
    radius: 0.8
    interval-ticks: 15
    shape: aura
  particle_ember_aura:
    particle: FLAME
    count: 8
    radius: 0.9
    interval-ticks: 12
    shape: aura
  particle_void_aura:
    particle: PORTAL
    count: 12
    radius: 1
    interval-ticks: 10
    shape: aura
  particle_soul_ring:
    particle: SOUL_FIRE_FLAME
    count: 10
    radius: 1.2
    interval-ticks: 14
    shape: circle
  particle_snow_ring:
    particle: SNOWFLAKE
    count: 12
    radius: 1.1
    interval-ticks: 14
    shape: circle
  particle_petal_ring:
    particle: CHERRY_LEAVES
    count: 10
    radius: 1.2
    interval-ticks: 16
    shape: circle
  particle_spark_ring:
    particle: ELECTRIC_SPARK
    count: 14
    radius: 1
    interval-ticks: 12
    shape: circle
  particle_dragon_aura:
    # 2026-08-16: DRAGON_BREATH は Paper 1.21.11 で「追加データ(Float)が必須の粒子」になっており、
    # SpecialRewardsConfig#parseParticle の「データ不要(Void)のみ通す」判定で丸ごと弾かれていた
    # (起動時に警告1行が出るだけで、この特殊報酬は存在しないのと同じ状態だった)。
    # 見た目が近くてデータ不要な REVERSE_PORTAL(紫の粒が立ち昇る)へ差し替える。
    # 追加データが要る粒子は他にも DUST / FLASH / ENTITY_EFFECT / VIBRATION などがある。
    # ShippedSpecialRewardParticleDataTest がここを機械的に固定している。
    particle: REVERSE_PORTAL
    count: 10
    radius: 1
    interval-ticks: 12
    shape: aura
particle-seeds:
