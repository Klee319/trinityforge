  title_warrior_path:
    display: <color:red><b>練達</b></color>
  title_armsmaster:
    display: <gradient:#7df9ff:#ffffff><b>万刃の主</b></gradient>
  title_secret_keeper:
    display: <gradient:#8a2be2:#8f69b4><b>秘を知る者</b></gradient>
  title_ironbearer:
    display: <color:white><b>鉄を打つ者</b></color>
  title_ritual_novice:
    display: <color:dark_purple><b>儀式の徒</b></color>
  title_vault_keeper:
    display: <color:dark_aqua><b>深淵を蓄える者</b></color>
  title_flamewalker:
    display: <gradient:#ff8c00:#ffd166><b>灼熱を歩く者</b></gradient>
  title_patron:
