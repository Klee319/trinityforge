  title_worldwalker:
    display: <gradient:#7f5af0:#2cb67d><b>世界渡り</b></gradient>
  title_first_step:
    display: <color:gray><b>はじまりの者</b></color>
  title_gatherer:
    display: <color:green><b>糧を得る者</b></color>
  title_sourcewright:
    display: <color:blue><b>ソースの職人</b></color>
  title_delver:
    display: <color:dark_aqua><b>深層に潜る者</b></color>
  title_refiner:
