# TrinityForge - アチーブメント (2026-07-23-stat-gate-overhaul.md §6.2/§6.7)
#
# achievements.<id>:
#   display-name: プレイヤーへ表示する達成名
#   trigger:
#     type:      statistic(バニラ統計を周期ポーリング) | advancement(バニラ進捗達成イベント) | static(図鑑登録)
#     statistic: type=statistic のとき参照する Bukkit Statistic 名 (例: JUMP, MOB_KILLS)
#     threshold: type=statistic のとき到達判定するしきい値
#     advancement: type=advancement のとき対象の進捗キー (例: "minecraft:story/mine_diamond")
#     collection: type=static のとき scope(all/category/item/mob)、target/targets、threshold、percent を指定
#       target  : 単一の対象ID(従来キー。後方互換のため読み続ける)
#       targets : 複数の対象ID配列(2026-07-27追加)。候補は列挙した全対象の「和」になる。
#                 scope=item/mob かつ percent:false のとき threshold を省略すると
#                 「列挙した件数」が既定になる = 全部そろったら達成。
#                 例) 3種そろったら達成:
#                   collection:
#                     scope: item
#                     targets: [infinity_sword, infinity_bow, infinity_mace]
#       threshold: 到達に必要な登録数 (percent:true のときは百分率 1-100)
#   broadcast: true でサーバー全体へ達成をアナウンス
#   rewards:
#     special:  special-rewards.yml の titles/particles/particle-seeds のID配列
#     commands: コンソールから実行するコマンド配列。%player% がプレイヤー名に置換される
#
# vanilla-advancements: (2026-07-28)
#   サーバ側でバニラの進捗(advancement)解除自体を止める設定。TFは独自のアチーブメント(このファイル)を
#   持っているため、右上のトースト通知・進捗画面の達成をサーバ側で抑止したい場合に使う。
#   対象は minecraft: 名前空間の進捗だけ — データパックや他プラグインが登録した進捗は巻き込まない。
#
#   disabled: true(既定) でバニラ進捗の解除を止める。
#   keep-recipe-advancements: true(既定・推奨) で minecraft:recipes/ 配下だけは通す。
#     バニラは minecraft:recipes/... という隠し進捗でレシピ本の解禁を配っているため、
#     false にすると新しいレシピが一切解放されなくなる。基本的に false にしないこと。
#   keep: 上記以外で追加で通したい進捗キーの前方一致リスト(例: "minecraft:story/")。既定は空。
#
#   【相互作用の注意】achievements.<id>.trigger.type: advancement (バニラ進捗の完了で発火するTF
#   アチーブメント)は、vanilla-advancements.disabled: true にすると
#   PlayerAdvancementCriterionGrantEvent 自体がキャンセルされて発火しなくなり、
#   その型のTFアチーブメントは永久に達成不能になる。起動時に type: advancement の定義が
#   1件以上あるのに disabled: true だと WARNING がコンソールに出る。

vanilla-advancements:
  disabled: true
  keep-recipe-advancements: true
  keep: []

achievements:
  get_infinity:
    display-name: インフィニティ
    trigger:
      type: static
      statistic: JUMP
      threshold: 1
      advancement: ""
      collection:
        scope: item
        target: infinity_sword
        targets: []
        threshold: 1
        percent: false
    broadcast: true
    rewards:
      special:
        - new_particle
        - new_title
      commands: []
      items: []
      job-exp: []
      permanent-buffs: {}
      vanilla-exp: 0
