# TrinityForge - アチーブメント / 指南 (2026-08-16 全面再構築)
#
# ============================================================================
# このファイルの役割 = 「アチーブメントだけ見れば次の短期目標が分かる」
# ============================================================================
# 2026-08-16 にユーザー確定で全面置換した。旧版(34ノード/1起点5章)は
# 「章」の切り方が生活・戦闘・深層…と機能別だったため、プレイヤーから見ると
# 「今どの道を歩いているのか」が分からず、最終目標も枝葉に埋もれていた。
#
# 【全体の形】3本の「道」+ 1本の「秘された道」。道どうしに前提は無く、どこから始めてもよい。
#   戦士の道       … 武器/防具のティア → スキル → ダンジョンの印 →【最終目標】世界の束縛者
#   魔導士への道   … 儀式とグリフの手ほどき → ソースの階梯 →【最終目標】累計1億ソース
#   冒険者の道     … 生活と探索 → 図鑑 →【最終目標】図鑑コンプリート
#   秘された道     … 裏アチーブメント置き場。中身は達成するまで表示されない(hidden: true)
#
#   各道の起点ノードの lore に<b>その道の終着点を明記</b>してある。最初の1ノードを見た時点で
#   「この道は最後どこへ行くのか」が分かるようにするため(2026-08-16 のユーザー指摘への対応)。
#
# 【マイルストーンを置きすぎない】1道あたり15〜18ノード。道の中は直列なので「次に何をするか」は
#   常に1つに定まるが、道が3本並列なので「今日はどれを進めるか」は選べる。
#
# 【武器/防具ティアを gear-use で書く理由】(2026-08-16)
#   クラフト統計(CRAFT_ITEM)で書くと<b>使用可能レベルに達していなくても作っただけで解除できる</b>。
#   type: gear-use は「その武器でダメージを与えた」「その防具を着て被弾した」しか数えないので、
#   使用可能レベルの門を必ず通る。実データ上のティアは以下(剣で代表。use-level-requirement):
#     木0 / 石5 / 銅15 / 鉄25 / 金35 / ダイヤ45 / ネザライト60 / 星枢80 / 守護者100 / インフィニティ100
#   <b>ネザライトは中間点</b>で、その上に儀式製の3段がある。インフィニティ級は儀式に
#   2,000万ソースを要するので、戦士の道の終盤は必ず魔導士の道のソース階梯を通る。
#   ※ 束縛者専用の binder_* 19件は catalog.yml で draft: true(未出荷)なのでここでは使わない。
#
# 【gear-use.items に何を書くか】カタログID または Material 名。記録側(GearUseListener)は
#   1つのスタックから「カタログID」と「Material 名」の両方を照合するので、どちらで書いても効く。
#   バニラ段は<b>その段にしか存在しない Material</b>だけを書くこと ── BOW / TRIDENT / MACE は
#   全ティアで共通の Material なので、書くと石の弓でネザライト段が解けてしまう。
#
# 【counter の加算側】source_spent 以外は 2026-08-16 に ArsPaper フォークへ足したもの。
#   glyph_unlocked(解放したグリフの総数) / glyph_<key>(そのグリフを解放したら1) /
#   ritual_performed(儀式の実行回数) / ritual_effect_used(儀式エフェクトの発動回数) /
#   spell_augment_used(増強グリフを含む呪文の詠唱回数) / catalyst_cast(触媒で唱えた回数) /
#   enchant_book_shared(共有エンチャントの使用回数)。
#   加算実装の無いIDを書くと「条件を満たしようがないアチーブメント」になるので増やさないこと
#   (ShippedAchievementTreeTest.IMPLEMENTED_COUNTERS が固定している)。
#
# 【裏アチーブメント】hidden: true は<b>達成するまでGUIに一切出ない</b>(系統バーにも、
#   「この系統: N件」の分母にも入らない)。親の secrets_root だけは見えるので
#   「何かがある」ことは分かるが、条件は明かされない。
#
# 【報酬の憲法】(2026-07-31 ユーザー確定「束縛者だけ縦強化、他は称号/コスメ」)
#   縦強化(permanent-buffs)を持つのは goal_worldbinder ただ1つ。他は
#   称号 / パーティクル / ガチャ券 / 職業EXP に限る。ここが緩むと格差吸収に選んだ3本
#   (24時間EXP減衰 / 指数コスト / 横の選択肢)が全部無意味になる。
#
# 【trigger.type: advancement を使わない理由】下の vanilla-advancements.disabled: true と
#   噛み合わず、進捗解除イベント自体がキャンセルされて永久に達成不能になる。
#
# 【編集について】設定エディタ(ツリー編集画面)で編集できるが、保存すると
#   <b>この先頭コメント以外の本文コメントは消える</b>ので、残したい根拠はこのヘッダへ書くこと。
#
# ============================================================================
# 書式
# ============================================================================
# achievements.<id>:
#   display-name: プレイヤーへ表示する達成名
#   parent: 前提アチーブメントID(未指定=起点)。前提未達成の間は条件を満たしても達成にならない
#   parents-any: 代替前提の配列。parent か この中のどれか1つ を達成していれば前提を満たす(OR)
#   hidden: true で「達成するまで非表示」(裏アチーブメント)。既定 false
#   coords: GUI 上のノード座標 "x,y"。空欄なら parent 関係から自動配置する(通常は空欄でよい)
#   icon: /achievement GUI のアイコン。バニラ Material / カタログID / custom:<ArsのID>
#   lore: GUI の説明文(MiniMessage 可)
#   trigger:
#     type: statistic | static(図鑑登録) | counter | gear-use | skill-level
#           ※ advancement は上記の理由で使わない
#     statistic: type=statistic のとき参照する Bukkit Statistic 名 (例: JUMP, MOB_KILLS)
#     statistic-qualifier: 修飾子が必要な統計に添える「何を」
#       UNTYPED … JUMP / MOB_KILLS / FISH_CAUGHT など。書かない
#       BLOCK   … MINE_BLOCK。ブロックの Material 名 (例: DIAMOND_ORE)
#       ITEM    … CRAFT_ITEM / USE_ITEM / BREAK_ITEM / PICKUP / DROP。アイテムの Material 名
#       ENTITY  … KILL_ENTITY / ENTITY_KILLED_BY。EntityType 名 (例: ENDER_DRAGON)
#     threshold: type=statistic / counter のとき到達判定するしきい値
#     counter: type=counter のとき参照する累計カウンタID(上の「counter の加算側」参照)
#     collection: type=static のとき scope(all/category/item/mob)、targets、threshold、percent
#       ※ scope: all の母数は collection.yml の categories に書いた分だけ。
#         件数で書くと図鑑を増やすたびに意味がずれるので、この版では percent で書いている。
#       ※ scope: item に書いたIDは「設定から参照されている」ことになるので、
#         バニラ品や ArsPaper 側アイテムも図鑑に記録されるようになる(CollectionListener)。
#     gear-use: type=gear-use のとき
#       slot: weapon(手に持ってダメージを与えた) | armor(着たまま被弾した)
#       items: カタログID または Material 名の配列
#       threshold: items のうち何種類使えば達成か(既定1)
#     skill-level: type=skill-level のとき
#       skills: SkillId の配列。COMBAT を混ぜると総合戦闘レベルを見る
#       level: 必要レベル
#       count: skills のうち何種類がその水準に達している必要があるか(既定1)
#   broadcast: true でサーバー全体へ達成をアナウンス
#   rewards:
#     special / commands / items / job-exp / permanent-buffs / vanilla-exp
#
# vanilla-advancements: (2026-07-28) サーバ側でバニラ進捗の解除自体を止める設定。
#   keep-recipe-advancements: true は必須級 ── false にするとレシピ本が一切解放されなくなる。

vanilla-advancements:
  disabled: true
  keep-recipe-advancements: true
  keep: []
