# TrinityForge - アチーブメント / 指南 (2026-07-23-stat-gate-overhaul.md §6.2/§6.7)
#
# ============================================================================
# このファイルの役割 = 「マイルストーン」(2026-07-31 全面設定)
# ============================================================================
# コンテンツを一通り置き終えたので、最後にマイルストーンをここへ敷いた。
# 順番が逆でないのは意図的 ── 先にマイルストーンを決めると、集める対象が未確定のまま
# 目標を書くことになり、後から図鑑エントリを増やすたびに「達成条件が指すもの」がずれる。
#
# 【全体の形】1つの起点(main)から5本の道が下へ伸び、うち3本が最終目標で終わる。
#   main(初めの一歩)
#     ├ 糧の章   … 生活基盤(伐採/採掘/農業/釣り/精錬)。最終目標は持たない
#     ├ 戦の章   … 戦闘の実績(討伐数/レイド/三大ボス)。最終目標は持たない
#     ├ 深層の章 … ダンジョン踏破 → 【第1目標】世界の束縛者 討伐
#     ├ ソースの章 … ソースの階梯 → 【第2目標】累計1億ソース
#     └ 収集の章 … 図鑑と厳選 → 【第3目標】図鑑コンプリート
#
#   5本が並列なのは「目標にたどり着くための複数の経路」を作るため。どの章も main だけを
#   前提にしているので、どこから始めても詰まらない。章の中は直列なので「次に何をするか」は
#   常に1つに定まる(自由度と道標の両立)。
#
# 【数の根拠】全34ノード(起点1 + 糧6 + 戦6 + 深層6 + ソース7 + 収集8)。
#   置きすぎるとチュートリアルになって自由度を潰し、
#   少なすぎると何をしたらいいか分からず飽きる。1章=1プレイセッションで1〜2個進む密度を狙った。
#
# 【報酬の憲法】(2026-07-31 ユーザー確定「束縛者だけ縦強化、他は称号/コスメ」)
#   縦強化(permanent-buffs)を持つのは goal_worldbinder ただ1つ。他の34ノードは
#   称号 / パーティクル / ガチャ券 / 職業EXP に限る。作業厨が全ノードを埋めても
#   戦闘力の差が開かないようにするため ── 格差の吸収は
#   (a) 24時間EXP減衰 (b) 指数コスト (c) 横の選択肢 の3本で行う方針で、
#   マイルストーンで(縦に)配るとその3本が全部無意味になる。
#
# 【到達目安】作業厨で約1ヶ月 / カジュアルで数ヶ月(ユーザー確定)。
#   ソースの章のしきい値を 1万 → 100万 → 1000万 → 1億 と一桁刻みにしてあるのは、
#   1億が「あと少し」に見える瞬間を3回作るため(cookie clicker 型の桁上がり感)。
#
# 【trigger.type: advancement を使っていない理由】下の vanilla-advancements.disabled: true と
#   噛み合わず、進捗解除イベント自体がキャンセルされて永久に達成不能になる。
#   同じ内容は必ず statistic / static / counter のどれかで書き直すこと。
#
# 【編集について】このファイルは設定エディタ(ツリー編集画面)で完結して編集できる。
#   ただしエディタで保存すると<b>この先頭コメント以外の本文コメントは消える</b>ので、
#   残したい根拠はすべてこのヘッダへ書くこと。
#
# ============================================================================
# 書式
# ============================================================================
# achievements.<id>:
#   display-name: プレイヤーへ表示する達成名
#   parent: 前提アチーブメントID(未指定=起点)。前提未達成の間は条件を満たしても達成にならない
#   parents-any: 代替前提の配列。parent か この中のどれか1つ を達成していれば前提を満たす(OR)
#   coords: GUI 上のノード座標 "x,y"。空欄なら parent 関係から自動配置する(通常は空欄でよい)
#   icon: /achievement GUI のアイコン。バニラ Material / カタログID / custom:<ArsのID>
#   lore: GUI の説明文(MiniMessage 可)
#   trigger:
#     type:      statistic(バニラ統計を周期ポーリング) | advancement(バニラ進捗達成イベント)
#              | static(図鑑登録) | counter(TF独自の累計カウンタ)
#     statistic: type=statistic のとき参照する Bukkit Statistic 名 (例: JUMP, MOB_KILLS)
#     statistic-qualifier: (2026-07-30 追加) 修飾子が必要な統計に添える「何を」。
#       Bukkit の統計は 4 種類あり、UNTYPED 以外は修飾子を書かないと読めない(書かないとスキップされる):
#         UNTYPED … JUMP / MOB_KILLS / FISH_CAUGHT / DAMAGE_DEALT など。修飾子を書かない(書いても無視)。
#         BLOCK   … MINE_BLOCK。ブロックの Material 名を書く (例: DIAMOND_ORE)
#         ITEM    … CRAFT_ITEM / USE_ITEM / BREAK_ITEM / PICKUP / DROP。アイテムの Material 名を書く
#         ENTITY  … KILL_ENTITY / ENTITY_KILLED_BY。EntityType 名を書く (例: ENDER_DRAGON)
#       例) ダイヤ鉱石を 64 個掘る:
#         trigger:
#           type: statistic
#           statistic: MINE_BLOCK
#           statistic-qualifier: DIAMOND_ORE
#           threshold: 64
#       Material がブロック/アイテムとして不正な場合(例: MINE_BLOCK に DIAMOND_SWORD)は、起動時に
#       警告を出してそのアチーブメントだけをスキップする。実行時に毎分例外を出し続けないための安全側。
#     threshold: type=statistic / counter のとき到達判定するしきい値
#     advancement: type=advancement のとき対象の進捗キー (例: "minecraft:story/mine_diamond")
#     counter: type=counter のとき参照する累計カウンタID。現在の実装は source_spent のみ
#       (= 儀式で消費した累計ソース。ArsPaper 側 RitualManager が加算する)。
#       加算実装の無いIDを書くと「条件を満たしようがないアチーブメント」になるので増やさないこと。
#     collection: type=static のとき scope(all/category/item/mob)、target/targets、threshold、percent を指定
#       target  : 単一の対象ID(従来キー。後方互換のため読み続ける)
#       targets : 複数の対象ID配列(2026-07-27追加)。候補は列挙した全対象の「和」になる。
#                 scope=item/mob かつ percent:false のとき threshold を省略すると
#                 「列挙した件数」が既定になる = 全部そろったら達成。
#                 例) 3種そろったら達成:
#                   collection:
#                     scope: item
#                     targets: [infinity_sword, infinity_bow, infinity_mace]
#       threshold: 到達に必要な登録数 (percent:true のときは百分率 1-100)
#       ※ scope: all の母数は collection.yml の categories に書いた分だけ(現在140件)。
#         プレイヤーPDCに溜まる登録総数(カタログ品やモブ討伐を含む約360件)とは別物なので、
#         collection.yml の reward-tiers のしきい値とは直接比較できない。
#       ※ scope: item に書いたIDは「設定から参照されている」ことになるので、
#         ArsPaper 側アイテム(スレッド等)も図鑑に記録されるようになる(CollectionListener)。
#   broadcast: true でサーバー全体へ達成をアナウンス
#   rewards:
#     special:  special-rewards.yml の titles/particles/particle-seeds のID配列
#     commands: コンソールから実行するコマンド配列。%player% がプレイヤー名に置換される
#     items:    - { id: <カタログID/custom:<ArsのID>/Material>, amount: <個数> }
#     job-exp:  - { skill: MINING, amount: 1000 }  (SkillId: ALCHEMY ARCHERY ARS_MAGIC ARS_SMITHING
#               DIGGING ENCHANTING FARMING FISHING HEAVY_ARMOR HEAVY_WEAPONS LIGHT_ARMOR
#               LIGHT_WEAPONS MINING POWER SMITHING WOODCUTTING)
#     permanent-buffs: 達成が続く限り常時適用される永続ステータスバフ(上記「報酬の憲法」参照)
#     vanilla-exp: 達成時に付与するバニラ経験値
#
# vanilla-advancements: (2026-07-28)
#   サーバ側でバニラの進捗(advancement)解除自体を止める設定。TFは独自のアチーブメント(このファイル)を
#   持っているため、右上のトースト通知・進捗画面の達成をサーバ側で抑止したい場合に使う。
#   対象は minecraft: 名前空間の進捗だけ — データパックや他プラグインが登録した進捗は巻き込まない。
#
#   disabled: true(既定) でバニラ進捗の解除を止める。
#   keep-recipe-advancements: true(既定・推奨) で minecraft:recipes/ 配下だけは通す。
#     バニラは minecraft:recipes/... という隠し進捗でレシピ本の解禁を配っているため、
#     false にすると新しいレシピが一切解放されなくなる。基本的に false にしないこと。
#   keep: 上記以外で追加で通したい進捗キーの前方一致リスト(例: "minecraft:story/")。既定は空。
#
#   【相互作用の注意】achievements.<id>.trigger.type: advancement (バニラ進捗の完了で発火するTF
#   アチーブメント)は、vanilla-advancements.disabled: true にすると
#   PlayerAdvancementCriterionGrantEvent 自体がキャンセルされて発火しなくなり、
#   その型のTFアチーブメントは永久に達成不能になる。起動時に type: advancement の定義が
#   1件以上あるのに disabled: true だと WARNING がコンソールに出る。

