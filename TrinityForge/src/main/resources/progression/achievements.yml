        # テストが落ちる。逆にここを削ると、綴り間違いを誰も検出できなくなる。
        #
        # 内訳は入手経路別に 制作8 / ルート8 / ダンジョン8 / ガチャ5 + 既存16。
        # threshold は省略時「列挙件数」= 45 になる(AchievementsConfig の既定)。
