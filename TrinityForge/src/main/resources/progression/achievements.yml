# TrinityForge - アチーブメント (2026-07-23-stat-gate-overhaul.md §6.2/§6.7)
#
# achievements.<id>:
#   display-name: プレイヤーへ表示する達成名
#   trigger:
#     type:      statistic(バニラ統計を周期ポーリング) | advancement(バニラ進捗達成イベント) | static(図鑑登録)
#     statistic: type=statistic のとき参照する Bukkit Statistic 名 (例: JUMP, MOB_KILLS)
#     threshold: type=statistic のとき到達判定するしきい値
#     advancement: type=advancement のとき対象の進捗キー (例: "minecraft:story/mine_diamond")
#     collection: type=static のとき scope(all/category/item/mob)、target/targets、threshold、percent を指定
#       target  : 単一の対象ID(従来キー。後方互換のため読み続ける)
#       targets : 複数の対象ID配列(2026-07-27追加)。候補は列挙した全対象の「和」になる。
#                 scope=item/mob かつ percent:false のとき threshold を省略すると
#                 「列挙した件数」が既定になる = 全部そろったら達成。
#                 例) 3種そろったら達成:
#                   collection:
#                     scope: item
#                     targets: [infinity_sword, infinity_bow, infinity_mace]
#       threshold: 到達に必要な登録数 (percent:true のときは百分率 1-100)
#   broadcast: true でサーバー全体へ達成をアナウンス
#   rewards:
#     special:  special-rewards.yml の titles/particles/particle-seeds のID配列
#     commands: コンソールから実行するコマンド配列。%player% がプレイヤー名に置換される

achievements:
  get_infinity:
    display-name: インフィニティ
    trigger:
      type: static
      statistic: JUMP
      threshold: 1
      advancement: ""
      collection:
        scope: item
        target: infinity_sword
        targets: []
        threshold: 1
        percent: false
    broadcast: true
    rewards:
      special:
        - new_particle
        - new_title
      commands: []
      items: []
      job-exp: []
      permanent-buffs: {}
      vanilla-exp: 0
