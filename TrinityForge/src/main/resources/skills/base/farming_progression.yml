# TrinityForge-owned Valhalla progression base (SoT for experience curve + non-perk sections).
# Perk tree runtime SoT is skilltree/<skill>.yml (this file: curves + EXP producer rates).
# Source: vendored from ValhallaMMO jar defaults; edit curves via ConfigEditor skill-exp screen.

experience:
  max_level: 100
  exp_level_curve: (%level% + 75 * 2^(%level%/8)) + 300
  block_interact:
    BEEHIVE: 400
    BEE_NEST: 400
    SWEET_BERRY_BUSH: 40
    CAVE_VINES: 40
    CAVE_VINES_PLANT: 40
    PUMPKIN: 0
    KELP: 0
    TWISTING_VINES_PLANT: 0
    TWISTING_VINES: 0
    WEEPING_VINES: 0
    WEEPING_VINES_PLANT: 0
  # 【畑の作物は 2026-08-21(W-180)に現行の 40% へ圧縮した】
  # 対象は一括収穫(area-harvest)が拾う5種 = WHEAT / POTATOES / CARROTS / BEETROOTS /
  # NETHER_WART。一覧の実体は FarmingCropCatalog.CROPS で、【そちらが増えたらここも増やす】。
  # 圧縮した理由: 一括収穫は連鎖した1ブロックごとにこの値を丸ごと配る。半径4の tier では
  # 1回の収穫で最大81ブロックぶん入るので、単価をそのままにすると他の採取スキルと桁が変わる。
  # 48 → 19.2 のように小数で構わない(値は Number として読むので整数に丸められない)。
  #
  # ⚠️ この表の【ブロック名の行】だけが実際のEXP量になる。stats/skill-exp.yml の
  # gathering.exp-mode が block_value のため、下にある POTATO / CARROT / BEETROOT などの
  # 【ドロップ品の行は1度も読まれない】(drop_sum / max へ戻したときだけ効く)。
  # そちらを触っても実サーバのEXPは1も動かないので、調整はブロック名の行で行うこと。
  block_drops:
    TORCHFLOWER_CROP: 500
    PITCHER_CROP: 500
    WHEAT: 19.2
    POTATOES: 19.2
    CARROTS: 19.2
    BEETROOTS: 19.2
    COCOA: 80
    MELON: 80
    PUMPKIN: 80
    NETHER_WART: 19.2
    BROWN_MUSHROOM: 80
    RED_MUSHROOM: 80
    SUGAR_CANE: 24
    WARPED_FUNGUS: 96
    CRIMSON_FUNGUS: 96
