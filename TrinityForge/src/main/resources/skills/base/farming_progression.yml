  # ここは「倒した家畜が落とした品」1個あたりのEXPで、【個数ぶん掛かる】
  # (NativeSkillExperienceListener#onFarmingMobDeath → dropActionExp)。
  # 上の entity_breed は【繁殖のEXP】かつ討伐EXPのゲート(載っていない種は討伐EXP0)なので、
  # 討伐だけを弱めたいときにあちらを触ってはいけない —— 繁殖まで巻き添えになり、
