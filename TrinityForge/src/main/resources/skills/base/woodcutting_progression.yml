# TrinityForge-owned Valhalla progression base (SoT for experience curve + non-perk sections).
# Perk tree runtime SoT is skilltree/<skill>.yml (this file: curves + EXP producer rates).
# Source: vendored from ValhallaMMO jar defaults; edit curves via ConfigEditor skill-exp screen.

experience:
  max_level: 100
  exp_level_curve: (%level% + 75 * 2^(%level%/8)) + 300
  woodcutting_strip:
    STRIPPED_OAK_LOG: 20
    STRIPPED_SPRUCE_LOG: 20
    STRIPPED_BIRCH_LOG: 20
    STRIPPED_JUNGLE_LOG: 20
    STRIPPED_ACACIA_LOG: 20
    STRIPPED_DARK_OAK_LOG: 20
    STRIPPED_MANGROVE_LOG: 20
    STRIPPED_CHERRY_LOG: 20
    STRIPPED_PALE_OAK_LOG: 20
    STRIPPED_WARPED_STEM: 20
    STRIPPED_CRIMSON_STEM: 20
  woodcutting_break:
    OAK_LOG: 40
    SPRUCE_LOG: 40
    BIRCH_LOG: 40
    JUNGLE_LOG: 40
    ACACIA_LOG: 40
    DARK_OAK_LOG: 40
    MANGROVE_LOG: 40
    CHERRY_LOG: 40
    PALE_OAK_LOG: 40
    WARPED_STEM: 60
    CRIMSON_STEM: 60
