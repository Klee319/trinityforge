# TrinityForge-owned Valhalla progression base (SoT for experience curve + non-perk sections).
# Perk tree runtime SoT is skilltree/<skill>.yml (this file: curves + EXP producer rates).
# Source: vendored from ValhallaMMO jar defaults; edit curves via ConfigEditor skill-exp screen.
# 設定リファレンス(本文コメント移設先): docs/config-reference/skills/base/mining_progression.md
experience: 
  max_level: 100 
  exp_level_curve: '(%level% + 75 * 2^(%level%/7.6)) + 300'
  exp_multiplier_mine: 1 
  exp_multiplier_blast: 1.5 
  exp_per_break: false
  legacy:
  mining_break: # Blocks mined or exploded will grant the player the amount of experience noted based on the amount of items it dropped,
