# TrinityForge-owned Valhalla progression base (SoT for experience curve + non-perk sections).
# Perk tree runtime SoT is skilltree/<skill>.yml (this file: curves + EXP producer rates).
# Source: vendored from ValhallaMMO jar defaults; edit curves via ConfigEditor skill-exp screen.
# 設定リファレンス(本文コメント移設先): docs/config-reference/skills/base/enchanting_progression.md
experience:
  exp_level_curve: '(%level% + 75 * 2^(%level%/7.6)) + 300'
  max_level: 100
  legacy:
  exp_gain:
    experience_spent_conversion: 0.5 # The fraction of spent experience during enchanting that's converted into additional enchanting skill experience
    enchantment_base:
      power: 180
      efficiency: 180
      piercing: 180
      sharpness: 180
      bane_of_arthropods: 300
      smite: 300
      quick_charge: 330
      impaling: 360
      protection: 200
      feather_falling: 330
      fire_protection: 330
      projectile_protection: 330
      blast_protection: 300
      unbreaking: 350
      loyalty: 350
      sweeping: 450
      sweeping_edge: 450
      fortune: 450
      looting: 450
      riptide: 450
      luck_of_the_sea: 450
      lure: 450
      respiration: 450
      depth_strider: 450
      thorns: 600
      soul_speed: 600
      knockback: 350
      punch: 550
      fire_aspect: 550
      frost_walker: 550
      mending: 750
      multishot: 750
      aqua_affinity: 750
      flame: 750
      silk_touch: 1000
      infinity: 1000
      channeling: 1000
    enchantment_level_multiplier: # The original amount of EXP earned from the potion is further changed depending on what the player does after
      1: 1.0 # Multiplier of the base exp if the enchantment level is just I
      2: 2.2 # Multiplier of the base exp if the enchantment level is II
      3: 3.4 # Multiplier of the base exp if the enchantment level is III
      4: 4.6 # etc.
      5: 5.8
      6: 7.0
      7: 8.2
      8: 9.4
      9: 10.6
      10: 11.8
    enchantment_type_multiplier:
      BOW: 1.0
      CROSSBOW: 1.0
      WOOD: 1.0
      LEATHER: 1.0
      STONE: 1.0
      CHAINMAIL: 1.0
      IRON: 1.0
      GOLD: 1.0
      DIAMOND: 1.0
      NETHERITE: 1.0
      PRISMARINE: 1.0
      MEMBRANE: 1.0
    enchantment_item_multiplier:
      SWORD: 1.0
      PICKAXE: 1.0
      AXE: 1.0
      SHOVEL: 1.0
      HOE: 1.0
      BOOTS: 1.0
      LEGGINGS: 1.0
      CHESTPLATE: 1.0
      HELMET: 1.0
      SHEARS: 1.0
      TRIDENT: 1.0
      CROSSBOW: 1.0
      BOW: 1.0
      FISHING_ROD: 1.0