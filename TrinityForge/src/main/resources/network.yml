# =================================================================================================
#  network.yml — サーバをまたぐチャットと管理者 TP (2026-08-15)
#
#  【この config は 3 台で共有される】
#  plugins/TrinityForge は main の実体を resource / dev がジャンクションで指しているので、
#  サーバごとに違う値を書くことはできない。
#  「自分がどのサーバか」は config ではなくプロキシ(Velocity)に聞いているので、
#  ここには「プロキシ上のサーバ名 → 表示名」の対応表だけを置く。
#
#  【この yml は設定エディタに画面が無い】
#  直す場所は「リポジトリのこのファイル」だけ。配備先(plugins/TrinityForge/network.yml)を
#  直接書き換えても、次の config 配備でリポジトリの内容に上書きされる = ロールバックして見える。
#  2026-08-19 に実際に起きた(W-110)。2026-08-20 (W-177) からは配備スクリプトが
#  「配備先で書き換えられた yml」を検出してリポジトリへ取り込み直すので消えなくなったが、
#  取り込みは配備を1回走らせるまで起きない。最初からここを直すのが確実。
#
#  【動く条件】
#  - velocity.toml の bungee-plugin-message-channel = true（既定で true）
#  - 送信側のサーバにプレイヤーが 1 人以上居ること
#    プラグインメッセージはプレイヤーの接続に相乗りするので、無人のサーバは送受信できない。
#    「無人のサーバへは届かない」だけなので実害は無いが、原因不明に見えるので覚えておく。
# =================================================================================================

# false にすると、チャット共有も TP もまとめて止まる（プラグインメッセージも登録しない）。
enabled: true

chat:
  # 全サーバでチャットを共有する。
  # false にすると自分のサーバ内だけに戻る（表示の書き換えも行わない）。
  enabled: true

  # 発言の表示形式。MiniMessage 記法。
  #   %server%  … 下の servers で引いた表示名（メイン / 資源 / 開発）
  #   %player%  … 発言者の表示名
  #   %message% … 本文
  # 自分のサーバの発言も他サーバの発言も【同じ形】で出す。
  # 片方だけ書式を変えると「どこの発言か」が読み取れなくなる。
  format: "<color:aqua><b>【%server%】</b></color><color:white>%player%</color><color:dark_gray><b>: </b></color><color:white>%message%</color>"

  # プロキシ上のサーバ名（velocity.toml の [servers] に書いた名前）→ 表示名。
  # ここに無い名前はサーバ名がそのまま出る（設定漏れが目に見えるように、空表示にはしない）。
  servers:
    main: "メイン"
    resource: "資源"
    dev: "開発"

teleport:
  # 管理者用のサーバ間 TP（/tpto・/tphere）。権限は trinityforge.admin。
  # 一般プレイヤー向けの申請制 TP は用意していない。
  enabled: true

  # 相手を探す問い合わせの待ち時間（秒）。
  # この時間内に「居ました」の返事が無ければ「見つかりません」と返す。
  # 無人のサーバには問い合わせ自体が届かないので、そこに居る可能性は元々無い。
  timeout-seconds: 5

  # 移動先サーバに入ってから実際にテレポートするまでの遅延（tick）。
  # HuskSync がインベントリを復元し終える前に飛ばすと、復元処理と噛み合って
  # 座標が巻き戻ることがある。20 tick = 1 秒。
  arrival-delay-ticks: 20
