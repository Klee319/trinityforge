# TrinityForge スキルツリー正典config — Ars鍛冶 (ARS_SMITHING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド11.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n-m、X-alpha/beta=排他路線。
#
# ■このツリー固有の方針（設計§D / タスク指示）:
#   - buffs は付けない。
#   - 品質+1 等の数値 → native（★仮命名 arssmithing_*。実名は実装時に確定）。
#   - クラフト/儀式/スレッド/ソース系の解放 → commands（プレースホルダ）＋ effects。
#   - greek C-alpha(品質) / C-beta(スレッド欄) → native / effects。
#
# ■転写注記: B-1系(クラフト解放)が B-1-1/B-1-2/B-1-4 と番号飛び（B-1-3欠番。画像通り）。
# ============================================================================

