# ============================================================================
# TrinityForge スキルツリー正典config — 弓術 (ARCHERY)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド14.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。射撃精度/ホーミング/射撃速度等
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ★ギリシャ路線: alpha=距離ダメージ(distance-damage-bonus) / beta=会心率+矢速度(crit-chance/arrow-velocity) /
#   gamma=矢節約・矢貫通(ammo-save-chance/arrow-piercing) ※2026-07-26職業別草案準拠、
#   旧gamma=会心ダメージ(crit-damage)はα/βと同じ火力路線に戻ってしまうため廃止
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/archery.md
skill: ARCHERY
display-name: "弓術"
icon: BOW
starting-coords: "2,10"
prestige:
  enabled: true
  max-times: 1  # 周回上限(現在の実効値=1、詳細: config-reference)
  at-level: 100
  name: "弓聖の境地"
  effect-text: "ダメージ・命中精度・節約率が永続で増加"
  buffs:
    attack-power: 0.15
    bow_accuracy: 0.1        # 旧 archery_inaccuracy_add: -0.1 (符号反転)
    ammo_save_chance: 0.1

nodes:
  A:
    name: "弓引きの心得"
    level: 10
    role: main
    parent: null
    icon: BOW
    cost: 1
    effect-text: "ダメージ増加・射撃精度アップ"
    buffs:
      attack-power: 0.1
      bow_accuracy: 0.05      # 旧 archery_inaccuracy_add: -0.05 (符号反転)
  B:
    name: "追尾の射手"
    level: 30
    role: main
    parent: A
    icon: SPECTRAL_ARROW
    cost: 1
    effect-text: "射撃距離ボーナス・一定確率でホーミング"
    buffs:
      distance_damage_bonus: 0.1
      arrow_piercing: 1
    effects:
      - "一定確率で矢がホーミング"
  C:
    name: "速射の型"
    level: 50
    role: main
    parent: B
    icon: ARROW
    cost: 1
    effect-text: "射撃精度アップ(バニラと同等)・射撃速度アップ"
    buffs:
      bow_accuracy: 0.1        # 旧 archery_inaccuracy_add: -0.1 (符号反転)
      arrow_velocity: 0.1
  D:
    name: "剛弓の境地"
    level: 70
    role: main
    parent: C
    icon: CROSSBOW
    cost: 1
    effect-text: "ダメージ増加"
    buffs:
      attack-power: 0.1
      # 2026-07-31: bow_cooldown_reduction: 0.1 を削除。アイテムCT短縮(cooldown-reduction)と
      # 同じ Player#setCooldown を二重に掛ける設計で、BOW/CROSSBOW に item-cooldown が無いため
      # 残CTが常に0 = 完全な no-op だった。effect-text からも「チャージ速度短縮」を外した。
  E:
    name: "極意・貫空"
    level: 90
    role: main
    parent: D
    icon: TIPPED_ARROW
    cost: 1
    effect-text: "2弾チャージで確定ホーミング・節約率増加"
    buffs:
      arrow_piercing: 2
      ammo_save_chance: 0.1
    effects:
      - "2段チャージで確定ホーミング"

  C-1-1:
    name: "弾き矢"
    level: 50
    role: branch
    parent: C
    icon: STICK
    cost: 1
    effect-text: "ノックバック距離増加"
    buffs:
