# ============================================================================
# TrinityForge スキルツリー正典config — Ars魔法 (ARS_MAGIC)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド10.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n-m。
#
# ■このツリー固有の方針（設計§D / タスク指示）:
#   - マナ最大値 / Tier / グリフ配置数 / マナ回復量 → buffs（Ars profile stat）。
#   - 各グリフ解放ノード → commands（プレースホルダ `tf skilltree unlock <id>`）＋ effects。
#   - プレステージ永続ボーナスも buffs。
#
# ■転写注記: B-3(害悪が強力に)は効果ノード、B-3-1/B-3-2 は別のグリフ解放ノード
#   （同じ B-3 プレフィックスで系統分け。id は既に一意）。ギリシャ路線なし。
# ============================================================================

