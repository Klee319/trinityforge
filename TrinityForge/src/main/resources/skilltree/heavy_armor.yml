# ============================================================================
# TrinityForge スキルツリー正典config — 重装備 (HEAVY_ARMOR)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド16.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。セット効果/憤怒/ノックバック耐性等
#   commands    : 解放時に実行するコマンド。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ★ギリシャ路線: alpha=守備力(phys-flat-defense/magic-flat-defense) / beta=魔法耐性(magic-resistance) /
#   gamma=防具強度(会心軽減)+ノックバック耐性(armor-strength/knockback-resistance) ※2026-07-26職業別草案準拠、
#   旧beta=防御率(defense-rate)/旧gamma=被ダメージ軽減(damage-reduction)は軽装備側と役割が被るため廃止
# ★軽装備との差分: 主軸C=ノックバック耐性/憤怒(軽装備は回避率/アドレナリン)、D-1系=ノックバック耐性増加(軽装備は回避率増加)
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/heavy_armor.md

skill: HEAVY_ARMOR
display-name: 重装備
icon: IRON_CHESTPLATE
starting-coords: 2,10
prestige:
  enabled: true
  max-times: 5
  at-level: 100
  name: 鉄壁の境地
  effect-text: 守備力・防御率・被ダメージ軽減が永続で増加
  buffs:
    # 2026-08-15 再々較正。目標は combat の設計線 F(L)=0.5*A(L)。
    # Lv100 でモブ基準攻撃力 A=44.3 なので守備力の総量の目標は 22.2、
    # 出荷 item-stats の最良装備4部位が phys 13.8 なので、ツリーの取り分は 8.4 が上限。
    # (これ以上積むと残差が min-component-damage:1 に張り付いて全帯が「ゼロか爆発」になる)
    # 7ノード合計で phys 8.4 / magic 25.2 になるよう配る。魔法が3倍なのは装備側の土俵が
    # そもそも約3倍あるため(Lv100 の重装4部位で magic 62.6)。
    phys-flat-defense: 1.8
    magic-flat-defense: 5.4
    # 防御率([0,1]の乗算軽減)。旧 armor-defense-rate(防具値)は 2026-08-15 に廃止済み。
    defense-rate: 0.1
    damage-reduction: 0.1
