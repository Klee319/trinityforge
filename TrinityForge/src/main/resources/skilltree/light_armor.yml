    icon: FEATHER
    cost: 1
    effect-text: "回避率増加・回避率セットボーナス強化(4部位で更に強化)"
    buffs:
      dodge-chance: 0.05
    set-buffs:
      3: { dodge-chance: 0.05 }
      4: { dodge-chance: 0.08 }

  A-alpha-1:
    name: "迅・軽身"
    # 2026-07-26 職業別草案(戦闘)準拠: 旧名称「堅・軽身」を変更。中身が守備力(硬さ)から
    # 回避率(速さ)に変わったため。
    level: 10
    role: greek
    parent: A
    group: A-greek
    icon: FEATHER
    cost: 1
    effect-text: "回避率増加"
    # 2026-07-26 職業別草案(戦闘)準拠: α=回避型。守備力(重装備側の役割に一本化)からdodge-chanceへ。
    buffs: { dodge-chance: 0.02 }
  A-beta-1:
    name: "盾・軽身"
    level: 10
    role: greek
    parent: A
    group: A-greek
    icon: SHIELD
    cost: 1
    effect-text: "防御率増加"
    buffs: { armor-defense-rate: 0.02 }
  A-gamma-1:
    name: "減・軽身"
    level: 10
    role: greek
    parent: A
    group: A-greek
    icon: NETHERITE_SCRAP
    cost: 1
    effect-text: "被ダメージ軽減・移動速度増加"
    # 2026-07-26 職業別草案(戦闘)準拠: γ=遊撃生存型。move-speedを追加し、重装備γ(会心軽減)との
    # 性格差を作る。
    buffs: { damage-reduction: 0.01, move-speed: 0.01 }
  # 2026-07-26 路線固定(lane-lock): B〜E のギリシャノードは parent を「同じ路線の1つ前」に向ける。
  # 排他は『同じ親を持つ同group兄弟』にしか効かない仕様(NativePerkService / SkillTreeProgressionGenerator)
  # なので、親が路線ごとに分かれる B〜E に group を書いても no-op になり、AllSkillTreesLoadTest が
  # 警告で落ちる。路線の固定は parent 連鎖だけで担保し、group は A 段(同じ親A)にのみ置く。
