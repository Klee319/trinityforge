# ============================================================================
# TrinityForge スキルツリー正典config — 軽装備 (LIGHT_ARMOR)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド15.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。セット効果/アドレナリン等
#   commands    : 解放時に実行するコマンド。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ★ギリシャ路線: alpha=回避率(dodge-chance) / beta=防御率(armor-defense-rate) /
#   gamma=被ダメージ軽減+移動速度(damage-reduction/move-speed) ※2026-07-26職業別草案準拠、
#   旧alpha=守備力(phys-flat-defense/magic-flat-defense)は重装備側の役割に一本化するため廃止
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/light_armor.md
skill: LIGHT_ARMOR
display-name: "軽装備"
icon: LEATHER_CHESTPLATE
starting-coords: "2,10"
prestige:
  enabled: true
  max-times: 1  # 周回上限(現在の実効値=1、詳細: config-reference)
  at-level: 100
  name: "韋駄天の境地"
  effect-text: "守備力・防御率・被ダメージ軽減が永続で増加"
  buffs:
    phys-flat-defense: 0.15
    magic-flat-defense: 0.15
    armor-defense-rate: 0.1
    damage-reduction: 0.1

nodes:
  A:
    name: "軽身の心得"
    level: 10
    role: main
    parent: null
    icon: LEATHER_BOOTS
    cost: 1
    effect-text: "移動速度ペナルティ減少・空腹になりにくくなる"
    buffs:
      light-armor-move-speed-per-piece: 0.5
    effects:
      - "空腹になりにくくなる"
  B:
    name: "連携の装"
    level: 30
    role: main
    parent: A
    icon: LEATHER_LEGGINGS
    cost: 1
    # 2026-07-27: このノードは armor-set-bonus(セット効果の増幅率)だけを持ち、セットの「成立条件」は
    # 持たない。旧文言の「3部位でセットが成立」は誤りだったので削除した。成立条件は各ノードの
    # set-buffs の段(3/4)が持つ。
    effect-text: "セット効果量UP(3・4部位のセット効果がまとめて強化される)"
    buffs:
      armor-set-bonus: 0.1
    effects:
      - "セット効果の効果量が増加する"
  C:
    name: "回避の型"
    level: 50
    role: main
    parent: B
    icon: LEATHER_CHESTPLATE
    cost: 1
    effect-text: "回避率アップ・守備力増加・アドレナリン発動可能・軽装3部位で回避率セットボーナス成立(4部位で強化)"
    buffs:
      dodge-chance: 0.1
      phys-flat-defense: 0.1
      magic-flat-defense: 0.1
    # 2026-07-27: 4部位帯は3部位帯の約1.5倍。3部位の値は移行前と同一のまま据え置いて、
    # フル装備の報酬としてだけ上乗せしている(既存バランスを動かさないため)。
    set-buffs:
      3: { dodge-chance: 0.1 }
      4: { dodge-chance: 0.15 }
    effects:
      - "アドレナリンが発動可能になる"
      - "軽装3部位以上で回避率セットボーナスが成立し、4部位で更に強化される"
  D:
    name: "堅守の境地"
    level: 70
    role: main
    parent: C
    icon: LEATHER_HELMET
    cost: 1
    # 2026-07-27: このノードのバフはどちらも無条件で、set-buffs を持たない。
    # 旧文言の「3部位でセットが成立」は実装と一致していなかったので削除した。
    effect-text: "防御率・物理耐性UP"
    buffs:
      armor-defense-rate: 0.1
      phys-resistance: 0.1
  E:
    name: "極意・不動"
    level: 90
    role: main
    parent: D
    icon: DIAMOND_CHESTPLATE
    cost: 1
    effect-text: "被ダメージ軽減上昇・アドレナリン発動時バフ強化"
    buffs:
      damage-reduction: 0.1
    effects:
      - "アドレナリン発動時のバフが強化される"

  C-1-1:
    name: "魔除けの布"
    level: 50
    role: branch
    parent: C
    icon: ENDER_PEARL
    cost: 1
    effect-text: "魔法耐性増加"
    buffs:
      magic-resistance: 0.1
  C-1-2:
    name: "退魔の布"
    level: 70
    role: branch
    parent: C-1-1
    icon: ENDER_PEARL
    cost: 1
    effect-text: "魔法耐性増加"
    buffs:
