# ============================================================================
# TrinityForge スキルツリー正典config — 軽装備 (LIGHT_ARMOR)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド15.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。セット効果/アドレナリン等
#   commands    : 解放時に実行するコマンド。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ★ギリシャ路線: alpha=回避率(dodge-chance) / beta=防御率(defense-rate) /
#   gamma=被ダメージ軽減+移動速度(damage-reduction/move-speed) ※2026-07-26職業別草案準拠、
#   旧alpha=守備力(phys-flat-defense/magic-flat-defense)は重装備側の役割に一本化するため廃止
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/light_armor.md

skill: LIGHT_ARMOR
display-name: 軽装備
icon: LEATHER_CHESTPLATE
starting-coords: 2,10
prestige:
  enabled: true
  max-times: 1
  at-level: 100
  name: 韋駄天の境地
  effect-text: 守備力・防御率・被ダメージ軽減が永続で増加
  buffs:
    # 2026-08-15 再々較正。2026-08-14 はノード単価だけを「重装備の半分」に揃えたが、
    # 守備力を配るノードが軽装備は2個・重装備は7個なので、ツリー全取りの合計では
    # phys 0.8 / magic 2.4 = 重装備(4.6/13.8)の 17% にしかならず実質 no-op のままだった。
    # 土俵はレベル帯ごとの装備4部位合計(Lv100 で軽装 phys 13.95 / magic 45.0)。
    # 重装備ツリー全取り ≒ 装備1部位ぶん なので、軽装備は 0.5 部位ぶん
    # (= 重装備のちょうど半分 = phys 2.3 / magic 6.9)を目標にし、
    # プレステージ + 主軸 C/D/E の4ノードへ分散する(1ノードで持たせると
    # 同レベルの重装備ノードを単価で追い越してしまうため)。
    phys-flat-defense: 0.8
    magic-flat-defense: 2.4
    defense-rate: 0.1
    damage-reduction: 0.1
nodes:
  A:
    name: 軽身の心得
    level: 10
    role: main
    parent:
    icon: LEATHER_BOOTS
    cost: 1
    effect-text: 軽装3部位で移動速度アップ(4部位で強化)・空腹になりにくくなる
    set-buffs:
      "3":
        move-speed: 0.015
      "4":
        move-speed: 0.02
    effects:
      - 空腹になりにくくなる
  B:
    name: 連携の装
    level: 30
    role: main
    parent: A
    icon: LEATHER_LEGGINGS
    cost: 1
    effect-text: セット効果量UP(3・4部位のセット効果がまとめて強化される)
    buffs:
      armor-set-bonus: 0.1
    effects:
      - セット効果の効果量が増加する
  C:
    name: 回避の型
    level: 50
    role: main
    parent: B
    icon: LEATHER_CHESTPLATE
    cost: 1
    effect-text: 回避率アップ・守備力増加・アドレナリン発動可能・軽装3部位で回避率セットボーナス成立(4部位で強化)
    buffs:
      dodge-chance: 0.1
      # 2026-08-15 再々較正(プレステージのコメント参照)。同レベルの重装備ノード
      # (heavy_armor C = 0.6/1.8) を単価で超えない範囲で、D/E と3等分して合計を稼ぐ。
      # 物理と魔法で値が違うのは装備側の土俵が違うため(Lv100 の軽装4部位で phys 13.95 / magic 45.0)。
      phys-flat-defense: 0.5
      magic-flat-defense: 1.5
    set-buffs:
      "3":
        dodge-chance: 0.1
      "4":
        dodge-chance: 0.15
    effects:
      - アドレナリンが発動可能になる
      - 軽装3部位以上で回避率セットボーナスが成立し、4部位で更に強化される
  D:
    name: 堅守の境地
    level: 70
    role: main
    parent: C
    icon: LEATHER_HELMET
    cost: 1
    effect-text: 守備力・防御率・物理耐性UP
    buffs:
      # 2026-08-15: 「堅守の境地」なのに守備力を1も配っていなかった。主軸 C/D/E で3等分する。
      phys-flat-defense: 0.5
      magic-flat-defense: 1.5
      defense-rate: 0.1
      phys-resistance: 0.1
  E:
    name: 極意・不動
    level: 90
    role: main
    parent: D
    icon: DIAMOND_CHESTPLATE
    cost: 1
    effect-text: 守備力・被ダメージ軽減上昇・アドレナリン発動時バフ強化
    buffs:
      # 2026-08-15: 主軸 C/D/E の3等分ぶん(プレステージのコメント参照)。
      phys-flat-defense: 0.5
      magic-flat-defense: 1.5
      damage-reduction: 0.1
    effects:
      - アドレナリン発動時のバフが強化される
  C-1-1:
