    # 2026-07-26 職業別草案(戦闘)準拠: β=技巧型。crit-chance単体から攻撃速度も加えた複合へ。
    buffs: { crit-chance: 0.02, attack-speed-bonus: 0.01 }
  A-gamma-1:
    name: "冴・鋭刃"
    level: 10
    role: greek
    parent: A
    group: A-greek
    icon: LIGHT_BLUE_DYE
    cost: 1
    effect-text: "出血率・出血ダメージ増加"
