# ============================================================================
# TrinityForge スキルツリー正典config — 軽量武器 (LIGHT_WEAPONS)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド12.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。攻撃速度/ノックバック/受け流し等
#   commands    : 解放時に実行するコマンド（グリフ/レシピ解放ゲート等）。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/light_weapons.md

skill: LIGHT_WEAPONS
display-name: 軽量武器
icon: DIAMOND_SWORD
starting-coords: 2,10
prestige:
  enabled: true
  max-times: 3
  at-level: 100
  name: 剣聖の境地
  effect-text: ダメージ・会心率・会心ダメージが永続で増加
  # 2026-08-15(W-31): プレステージは3回まで積めるので、旧値では会心率だけで +0.3 と
  # ツリー本体(0.28)を上回っていた。ノード側と同じ比率で下げる。
  mainhand-buffs:
    crit-chance: 0.05
    crit-damage: 0.15
  mainhand-multipliers:
    layer_1:
      attack-power: 1.15
  description: |-
    攻撃力x1.15(永続)
    会心率+5%(永続)
    会心ダメージ+15%(永続)
nodes:
  A:
    name: 鋭刃の心得
    level: 10
    role: main
    parent:
    icon: WOODEN_SWORD
    cost: 1
    effect-text: ダメージ増加・一定確率で出血付与
    mainhand-multipliers:
      layer_1:
        attack-power: 1.1
    mainhand-buffs:
      crit-chance: 0.03
    description: |-
      攻撃力x1.1
      会心率+3%
  B:
    name: 疾風の太刀
    level: 30
    role: main
    parent: A
    icon: STONE_SWORD
    cost: 1
    effect-text: 攻撃速度・会心率増加
    mainhand-buffs:
      crit-damage: 0.1
      bleed-chance: 0.1
    description: |-
      会心ダメージ+10%
      出血率+10%
  C:
    name: 受け流しの型
    level: 50
    role: main
    parent: B
    icon: GOLDEN_SWORD
    cost: 1
    effect-text: 被ダメージ軽減・会心ダメージ増加・出血確率UP
    description: |-
      会心ダメージ+20%
      出血ダメージ率+5%
    # 2026-08-15(W-30): 出血ダメージを実数(bleed-damage)から率(bleed-damage-rate)へ移した。
    # 実数はアイテムの帯(Lv0で34 → Lv80以降で4,500)に対して固定なので、ツリー全取りの150は
    # Lv0で武器の+440%・Lv100で+3.3%という「低帯で壊れ・高帯でno-op」になっていた。
    # 率は「出血させた一撃の最終ダメージ」に対する割合なので全帯で同じ体感になる。
    mainhand-buffs:
      crit-damage: 0.2
      bleed-damage-rate: 0.05
  D:
    name: 連斬の境地
    level: 70
    role: main
    parent: C
    icon: IRON_SWORD
    cost: 1
    effect-text: 攻撃速度・出血量増加
    description: |-
      攻撃速度+10%
      ダメージ補正+5%
    mainhand-buffs:
      attack-speed-bonus: 0.1
      damage-modifier: 0.05
  E:
    name: 極意・飛燕
    level: 90
    role: main
    parent: D
    icon: DIAMOND_SWORD
    cost: 1
    effect-text: クリティカル(ジャンプ斬り)で確定出血付与・被ダメージ軽減
    effects:
      - ジャンプ斬りのクリティカルで確定出血
    mainhand-buffs:
      penetration: 0.1
      crit-chance: 0.05
    description: |-
      貫通率+10%
      会心率+5%
  C-1-1:
    name: 斬り
    level: 60
    role: branch
    parent: C
    icon: STICK
    cost: 1
    effect-text: ノックバック距離増加
    description: |-
      出血率+5%
      出血ダメージ率+2%
    mainhand-buffs:
      bleed-chance: 0.05
      bleed-damage-rate: 0.02
  C-1-2:
    name: 刺し
    level: 80
    role: branch
    parent: C-1-1
    icon: STICK
    cost: 1
    effect-text: ノックバック距離増加
    description: |-
      出血率+10%
      出血ダメージx1.2
      出血ダメージ率x1.2
    mainhand-buffs:
      bleed-chance: 0.1
    # 2026-08-15(W-30): 乗算レイヤは「1レイヤ=1ステ」で、基準ステと違うキーを書くと実行時に
    # 無言で捨てられる(PerkBuffResolver#withValidMultiplierLayers)。ツリーは率しか配らなく
    # なったので、率用の layer_4 を追加した上で実数(layer_2)側も残す ── 実数はアイテム由来の
    # 出血ダメージに掛かるので、消すとこのノードが従来持っていた効果まで失われる。
    mainhand-multipliers:
      layer_2:
        bleed-damage: 1.2
      layer_4:
        bleed-damage-rate: 1.2
