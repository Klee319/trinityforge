  A-alpha-1:
    name: "剛・鋭刃"
    level: 10
    role: greek
    parent: A
    group: A-greek
    icon: RED_DYE
    cost: 1
    effect-text: "追加ダメージ増加"
    # 2026-07-26 職業別草案(戦闘)準拠: 3路線の性格分化(α=火力型)。attack-power(乗算)から
    # percent-bonus-damage(加算防御貫通)へ差し替え。既存キーのまま据え置くと火力3種の
    # 「同じ物の3段階」になってしまうため。
    buffs: { percent-bonus-damage: 0.04 }
  A-beta-1:
