    # 軽量武器の持ち味である出血系(bleed-chance/bleed-damage)へ全面差し替え。
    buffs: { bleed-chance: 0.02, bleed-damage: 0.4 }
  # 2026-07-26 路線固定(lane-lock): B〜E のギリシャノードは parent を「同じ路線の1つ前」に向ける。
