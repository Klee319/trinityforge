# ============================================================================
# TrinityForge スキルツリー正典config — 軽量武器 (LIGHT_WEAPONS)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド12.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。攻撃速度/ノックバック/受け流し等
#   commands    : 解放時に実行するコマンド（グリフ/レシピ解放ゲート等）。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/light_weapons.md
skill: LIGHT_WEAPONS
display-name: "軽量武器"
icon: DIAMOND_SWORD
starting-coords: "2,10"
prestige:
  enabled: true
  max-times: 1  # 周回上限(現在の実効値=1、詳細: config-reference)
  at-level: 100
  name: "剣聖の境地"
  effect-text: "ダメージ・会心率・会心ダメージが永続で増加"
  buffs:
    attack-power: 0.15
    crit-chance: 0.1
    crit-damage: 0.3

nodes:
  A:
    name: "鋭刃の心得"
    level: 10
    role: main
    parent: null
    icon: WOODEN_SWORD
    cost: 1
    effect-text: "ダメージ増加・一定確率で出血付与"
    buffs:
      attack-power: 0.1
      bleed-chance: 0.1
  B:
    name: "疾風の太刀"
    level: 30
    role: main
    parent: A
    icon: STONE_SWORD
    cost: 1
    effect-text: "攻撃速度・会心率増加"
    buffs:
      crit-chance: 0.1
      # 2026-07-26 stat-scope 境界引き直し §2 (C→A 降格): attack_speed(絶対値)はStatVocabularyから
      # 外れ、perkのbuffsからは付与できなくなった(元々2026-07-25のattack-speed/attack-speed-bonus
      # 分離仕様の時点でPerkAttributeApplierが汎用attrs経路から明示的に除外しており、実際には
      # 既に効果が出ていなかった死にバフ)。
      # effect-textが「攻撃速度」と表示している以上、表示だけ残して効果が無いのは
      # 「無言で何も起きない」事故そのものなので、生きている割合キーへ置き換える。
      attack-speed-bonus: 0.08
  C:
    name: "受け流しの型"
    level: 50
    role: main
    parent: B
    icon: GOLDEN_SWORD
    cost: 1
    effect-text: "被ダメージ軽減・会心ダメージ増加・出血確率UP"
    buffs:
      crit-damage: 0.3
      bleed-chance: 0.05
      damage-reduction: 0.05
  D:
    name: "連斬の境地"
    level: 70
    role: main
    parent: C
    icon: IRON_SWORD
    cost: 1
    effect-text: "攻撃速度・出血量増加"
    buffs:
      bleed-damage: 2.0
      # 2026-07-26: 上記Bノードと同じ理由でattack_speedをattack-speed-bonusへ置換。
      attack-speed-bonus: 0.08
  E:
    name: "極意・飛燕"
    level: 90
    role: main
    parent: D
    icon: DIAMOND_SWORD
    cost: 1
    effect-text: "クリティカル(ジャンプ斬り)で確定出血付与・被ダメージ軽減"
    buffs:
      bleed-damage: 2.0
      damage-reduction: 0.03
    effects:
      - "ジャンプ斬りのクリティカルで確定出血"

  C-1-1:
    name: "打ち払い"
    level: 50
    role: branch
    parent: C
    icon: STICK
    cost: 1
    effect-text: "ノックバック距離増加"
    buffs:
