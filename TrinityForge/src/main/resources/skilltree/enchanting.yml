# ============================================================================
# TrinityForge スキルツリー正典config — エンチャント (ENCHANTING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド5.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。数値→effects、解放→commands+effects。
#
# ■このツリー固有の転写注記:
#   - A系ギリシャ路線(alpha=EXP増加/ポイント+30, beta=EXP減少/ポイント+10)は排他のトレードオフ。
#   - alpha/beta 各2ノードだが画像に明示Lv/列位置なし → -1=親主軸Lv, -2=+20 と推定（コメント明記）。
# ============================================================================

