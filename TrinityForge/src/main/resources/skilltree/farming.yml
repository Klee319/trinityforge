# ============================================================================
# TrinityForge スキルツリー正典config — 農業 (FARMING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド4.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。数値→effects、解放→commands+effects。
#
# ■このツリー固有の合流構造（重要・転写そのまま）:
#   ギリシャ路線が2系統（alpha=ゴミ食 / beta=健康食）に分岐し、末端の「完全食」で合流する。
#   画像表記「A-α/β-3」は alpha・beta どちらの路線からでも到達し得る最終ノード。
#   → 一意id `A-alphabeta-3` に正規化（原表記: A-α/β-3）。parentは alpha 側終端に接続し、
#     コメントで beta 側(A-beta-3)からも到達し得る合流である旨を明記。合流ノードは
#     排他group自体には含めない（どちらの路線からでも解放可能な共通末端のため）。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/farming.md

