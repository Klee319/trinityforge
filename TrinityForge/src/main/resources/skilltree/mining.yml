# ============================================================================
# TrinityForge スキルツリー正典config — 採掘 (MINING)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド2.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n（親から派生）
#   - X-alpha/beta-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# ■生産系ツリーの方針（設計§D）:
#   - buffs は基本なし（TF戦闘ステータスを持たない）。
#   - 品質/速度/ドロップ/EXP等の数値 → Valhalla native命名が未確定のため effects に
#     効果タグとして記載（値も文言に含める）。
#   - グリフ/レシピ/コア解放 → commands（プレースホルダ `tf skilltree unlock <id>`）＋ effects。
#
# 各ノードのフィールド:
#   name / level / role(main|intermediate|branch|greek) / parent / group(greekのみ)
#   / icon / cost / description / buffs / native / dedicated-effects
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
#
# ---- 要件⑤ (自由記述description) ----
#   description: がノードの自由記述説明の正式キーです（旧 effect-text は後方互換フォールバック
#   として読み込まれ続けます。両方あれば description が優先）。Valhalla progression の perk
#   description にはこの統合説明がそのまま出力されます。
#   ★非推奨: effects[] / commands[] はもう読まれません（表示・挙動どちらにも使われない死フィールド）。
#   新規ノードでは description のみ書いてください。既存の effects/commands は残っていても無視されます。
#
# ---- 要件⑥ (dedicated-effects) ----
#   dedicated-effects: はこのノードが解放する「専用効果」を、プレフィックス付き動的IDで記述します。
#   例: glyph:<glyphId> / recipe:<catalogId> / feature:<featureId>。
#     dedicated-effects:
#       - id: light-glyph-unlock       # param=none の効果は value 不要
#       - id: lapis-cost-reduction
#         value: 5                     # param=percent/int/level の効果は value 必須
#   ★カタログの「実ゲーム挙動」への配線はまだ無い基盤段階です（後続タスク）。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/mining.md
