# ============================================================================
# TrinityForge スキルツリー正典config — 重量武器 (HEAVY_WEAPONS)
# ----------------------------------------------------------------------------
# これは「TF独自の単一の真実」です。ここを編集すると、ビルド/リロード時に
# Valhalla用 progression YAML と lang が生成され、実行時に buffs が適用されます。
#
# エンコード規則（スライド草案 skilltree/skilltree/スライド13.PNG 準拠）:
#   - 主軸 A/B/C/D/E の解放レベル = 10 / 30 / 50 / 70 / 90
#   - レベル100でプレステージ可能
#   - 主軸の「間」ノード = 中間レベル(20/40/60/80)
#   - 派生ノード = X-n-m（親から派生）
#   - X-alpha/beta/gamma-1 = ギリシャ文字路線（group が同じものは排他＝いずれか1つのみ）
#
# 各ノードのフィールド:
#   name        : 解放要素の固有名（ゲーム内表示名。生成lang へ）
#   level       : 解放レベル
#   role        : main | intermediate | branch | greek
#   parent      : 前提ノードid（派生元）。根は null
#   group       : 排他グループid（greek のみ。同 group は相互排他）
#   icon        : スキルツリーメニューのアイコン(Material)
#   cost        : 消費スキルポイント
#   effect-text : 説明（wiki と生成lang の description へ）
#   buffs       : TFが所有・適用する数値バフ（TFステ辞書のkey→値）。★Valhalla側には渡さない（二重適用回避）
#   native      : Valhallaネイティブ機構の perk_rewards（Valhallaが適用）。攻撃速度/ノックバック/スタン等
#   commands    : 解放時に実行するコマンド（グリフ/レシピ解放ゲート等）。任意
#   effects     : 数値化しない効果タグ（wiki表示用の補足）。任意
# ★数値は暫定プレースホルダ。プレイテスト後に調整してください。
# ★ギリシャ路線: alpha=追加ダメージ(percent-bonus-damage) / beta=貫通率(penetration) /
#   gamma=範囲攻撃+スタン(aoe-radius/aoe-damage-rate/stun-chance) ※2026-07-26職業別草案準拠、
#   旧gamma=固定ダメージ(fixed-damage)は防御貫通が壊れやすいため廃止
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/heavy_weapons.md

