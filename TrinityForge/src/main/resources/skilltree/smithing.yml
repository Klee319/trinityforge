# ============================================================================
# TrinityForge スキルツリー正典config — 鍛冶 (SMITHING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド7.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。品質/速度/ボーナス→effects、クラフト/魔法解放→commands。
#
# ■このツリー固有の転写注記（画像そのまま・重複ノード注意）:
#   「B-3」表記が2箇所に存在する:
#     (1) 上段ギリシャ路線末端「B-3 解体解放」 → 一意id `B-3-upper` に正規化（原表記: B-3）。
#     (2) 下段の派生「B-3 鉱石の精錬ボーナス+30%」 → id `B-3` のまま。
#   両者は別ノード。画像通り両方を転写。
#
# ■主軸A〜Dのティア解放ゲート撤去 (2026-07-28、ユーザー決定)
#   草案の「主軸クラフトは武器と装備のみクラフト制限」(左上オレンジボックス)に従って、
#   A〜D には石/鉄/金/ダイヤ/ネザライトの `recipe:` ゲートが41件置かれていた。しかし
#   **ツール・防具側に既に「使用可能レベル」(stats/item-stats.yml)がある**ため、クラフト
#   側でもう一段ティアゲートを掛けても、作れる頃には使えるレベルに達しているだけで
#   進行に何も足していない — というのがデバッグで判明した(ユーザー確認済み)。
#   よって41件のゲートを撤去し、同じノードを「クラフトの当たりを引きやすくする」実効buffへ
#   置換した。配分の考え方:
#     - workbench_quality_bonus は品質mode加算。mode = skillLv/10 + bonus を
#       stats/quality.yml max-quality: 9 でクランプするため、**高レベルほど飽和して無駄になる**。
#       → 増分は低レベル側(A/B)に寄せる。
#     - workbench_upswing_bonus / craft_roll_up_bonus は分布の上側σを広げる stat で飽和しない。
#       → 増分は高レベル側(C/D)に寄せる。
#   なお `recipe:` ゲートはフェイルオープン(未配置=解放)なので、撤去してもロック事故は起きない
#   (FailCloseGateSkillTreePlacementTest の対象外である理由もこれ)。同時に、TF側カタログが
#   `*_axe_tf` へ改名済みで解決しなくなっていた [PRG-02] 警告4件(stone/iron/golden/diamond_axe)も解消する。
#   ※ ars_smithing / farming / mining / woodcutting 側の `recipe:` ゲート(コア・エンチャ本・
#     圧縮食料など17件)は「ツールのティア」ではないので撤去対象外。
# ============================================================================

