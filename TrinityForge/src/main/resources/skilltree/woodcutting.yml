# ============================================================================
# TrinityForge スキルツリー正典config — 伐採 (WOODCUTTING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド3.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、間ノード=中間Lv、派生=X-n。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。数値→effects、解放→commands+effects。
#
# ■このツリー固有の転写注記（画像そのまま）:
#   - A系の番号が A-1/A-2/A-4 と飛んでおり、A-3 は本スライドに存在しない（欠番）。
#   - B-3 の効果は画像上「効率破壊II」表記で B-2 と同名（ローマ数字II重複。IIIの誤記の
#     可能性があるが画像優先で II のまま転写）。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/woodcutting.md

skill: WOODCUTTING
