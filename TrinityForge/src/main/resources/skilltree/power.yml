# TrinityForge スキルツリー正典config — 総合 / POWER
# ----------------------------------------------------------------------------
# LD-9: Valhalla に攻撃倍率・防具加算・crit/bleed 層を渡さない。
# SP 源は skills/base/power_progression.yml の leveling_perks（毎Lv +1 SP）が権威。
# 本ツリーは生存・ユーティリティのパーク消費先のみ（Physique/Iron Skin 相当は置かない）。
#
# 主軸 A〜E = 活力（最大体力）。派生 = 足元/幸運/回復/持久/回収/俊敏。
# 2026-07-26 職業別草案(戦闘)準拠でプレステージを新規設計し有効化(旧: enabled: false)。
# 同日、ギリシャ路線(α=猛=体力特化型/β=癒=回復特化型/γ=盾=反撃特化型)をA〜E帯 各3ノード新設。
# 既存branch(A-1〜D-3: 足元強化/天恵/持久/回収/俊敏)は削除せず維持。
# ============================================================================

