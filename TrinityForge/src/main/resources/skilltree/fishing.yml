# ============================================================================
# TrinityForge スキルツリー正典config — 釣り (FISHING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド9.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。確率/経験値→effects、グリフ解放→commands+effects。
#
# ■このツリー固有の転写注記:
#   Bから上段=alpha路線(ゴミ/スクラップ経済)、下段=beta路線(ガチャ券/宝)に分岐。
#   スライド上に排他の明示ボックスは無いが、他ツリー同様 alpha/beta 排他と推定。
#   beta路線(B-beta)は転写で「派生ノード」欄に記載されるがギリシャ命名のため greek/排他として扱う。
#   alpha路線に明示Lvは無く、beta路線の推定Lv(40/40/60)に合わせて対称配置。
# ============================================================================

