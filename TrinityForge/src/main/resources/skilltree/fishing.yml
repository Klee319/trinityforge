# ============================================================================
# TrinityForge スキルツリー正典config — 釣り (FISHING)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド9.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。確率/経験値→effects、グリフ解放→commands+effects。
#
# ■このツリー固有の転写注記:
#   Bから上段=alpha路線(ゴミ/スクラップ経済)、下段=beta路線(ガチャ券/宝)に分岐。
#   スライド上に排他の明示ボックスは無いが、他ツリー同様 alpha/beta 排他と推定。
#   beta路線(B-beta)は転写で「派生ノード」欄に記載されるがギリシャ命名のため greek/排他として扱う。
#   alpha路線に明示Lvは無く、beta路線の推定Lv(40/40/60)に合わせて対称配置。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/fishing.md
skill: FISHING
display-name: "釣り"
icon: FISHING_ROD
starting-coords: "2,10"
prestige:
  enabled: true
  max-times: 1  # 周回上限(現在の実効値=1、詳細: config-reference)
  at-level: 100
  name: "大海の釣り王の栄光"
  effect-text: "同時ヒット確率 永続+10・宝釣りの確率 永続+10%"
  buffs:
    # 2026-08-13: 10(パーセントポイント記法)から 0.1(割合)へ。PercentStatNormalize が実行時に
    # 10 -> 0.1 と矯正しているので**ゲーム内の効果は変わらない**が、設定エディタは PERCENT 宣言の
    # ステを 値x100 で表示するため「1000%」と出ていた。他の割合ステ(skill-exp-bonus: 0.05 等)と
    # 同じ割合記法へ揃える。以下このファイルの fishing-bonus も同じ理由。
    fishing-bonus: 0.1
    fishing-luck: 0.1

nodes:
  A:
    name: "駆け出しの釣り人"
    level: 10
    role: main
    parent: null
    icon: FISHING_ROD
    cost: 1
    effect-text: "同時ヒット確率アップ・得られる経験値量アップ"
    effects:
      - "同時ヒット確率アップ"
      - "得られる経験値量アップ"
    buffs:
      fishing-bonus: 0.05
      skill-exp-bonus: 0.05
  B:
    name: "宝釣りの心得"
    level: 30
    role: main
    parent: A
    icon: COD
    cost: 1
    effect-text: "宝確率アップ・運+1・吸水・水源のグリフ開放"
    effects:
      - "宝確率アップ"
      - "運+1"
      - "吸水・水源のグリフを解放"
    buffs:
      loot_luck: 1   # 旧 native power_luckbonus_add (stat化)
