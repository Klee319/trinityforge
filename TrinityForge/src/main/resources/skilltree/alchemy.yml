# ============================================================================
# TrinityForge スキルツリー正典config — 錬金 (ALCHEMY)
# ----------------------------------------------------------------------------
# エンコード規則（スライド草案 skilltree/skilltree/スライド8.PNG 準拠）:
#   主軸 A/B/C/D/E = Lv10/30/50/70/90、Lv100でプレステージ、派生=X-n、X-alpha/beta=排他路線。
#
# ■生産系ツリーの方針（設計§D）: buffsなし。品質/速度→effects、魔法/グリフ/コーティング解放→commands。
#
# ■このツリー固有の転写注記（画像そのまま・同名重複ノード注意）:
#   C-1・C-2 が上段(魔法/グリフ系)と下段(グリフ開放系)で同名重複、E-1-1(上段)/E-2-1(下段)も上下分岐。
#   一意化: 上段 → `C-1-upper` / `C-2-upper`、下段 → `C-1-lower` / `C-2-lower`（原表記: C-1 / C-2）。
#   E-1-1(上段)・E-2-1(下段)は表記が既に一意なためそのまま。
# ============================================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/skilltree/alchemy.md
skill: ALCHEMY
display-name: "錬金"
icon: BREWING_STAND
starting-coords: "2,10"
prestige:
  enabled: true
  max-times: 1  # 周回上限(現在の実効値=1、詳細: config-reference)
  at-level: 100
  name: "大錬金術師の栄光"
  effect-text: "全ての品質 永続+3・ランダムステータスの上振れ率 永続+15%"
  buffs:
    potion_quality_bonus: 3
    # 2026-07-31: 旧 craft_upswing_bonus(作業台+儀式の両方に効いていた)を作業台側へ寄せた。
    # 儀式クラフトの品質は魔法鍛冶(ars_smithing)ツリーの担当なので錬金からは効かせない。
    workbench_upswing_bonus: 0.15

nodes:
  A:
    name: "醸造の見習い"
    level: 10
    role: main
    parent: null
    icon: GLASS_BOTTLE
    cost: 1
    effect-text: "品質+1・醸造速度UP"
    effects:
      - "品質+1"
      - "醸造速度UP"
    buffs:
      potion_quality_bonus: 1
      brew_speed_bonus: 0.05
  B:
    name: "調合の職人"
    level: 30
    role: main
    parent: A
    icon: POTION
    cost: 1
    effect-text: "品質+1・素材消費しない確率UP"
    effects:
      - "品質+1"
      - "素材を消費しない確率UP"
    buffs:
      potion_quality_bonus: 1
  C:
    name: "コーティング術士"
    level: 50
    role: main
    parent: B
    icon: SPLASH_POTION
    cost: 1
    effect-text: "武器コーティング解放・醸造速度UP・司祭解放"
    buffs:
      brew_speed_bonus: 0.05
      # 2026-07-26 coating-charges の C→A 降格に伴い移設した feature:coating-stack-increase を、
      # 2026-07-28(数値のギミックyml集約)でさらに通常stat coating_charges_bonus へ再移設(値3は変更なし)。
      # 単純加算しかしない feature は stat として扱うのが素直、という方針変更による。
      coating_charges_bonus: 3
    effects:
      - "武器コーティングを解放"
      - "醸造速度UP"
      - "司祭を解放"
    dedicated-effects:
      - id: "feature:weapon-coating-unlock"
      - id: "trade:CLERIC"
  D:
    name: "統合の錬金術師"
    level: 70
    role: main
    parent: C
    icon: LINGERING_POTION
    cost: 1
    effect-text: "品質+1・複数ポーションの統合を可能に・素材を消費しない確率UP(醸造台+アルケミカル)"
    effects:
      - "品質+1"
      - "複数ポーションの統合を可能に"
      - "素材を消費しない確率UP(醸造台+アルケミカル)"
    buffs:
      ingredient_save_chance: 0.15   # 醸造台+アルケミカル素材投入の両方に適用(2026-07-26)。既定値(要調整)
      potion_quality_bonus: 1
    dedicated-effects:
      - id: "feature:potion-merge"
  E:
    name: "変換の大錬金術師"
    level: 90
    role: main
    parent: D
    icon: DRAGON_BREATH
    cost: 1
    effect-text: "交換・色変換のグリフ解放・武器コーティングのスタック数増加・品質+3"
    buffs:
      potion_quality_bonus: 3
      # 2026-07-28(数値のギミックyml集約): feature:coating-stack-increase から移設(値10は変更なし)。
      # C ノードと同じ coating_charges_bonus stat へ加算する(PlayerStatAggregatorが全ソース合算)。
      coating_charges_bonus: 10
    effects:
      - "交換・色変換のグリフを解放"
      - "武器コーティングのスタック数増加"
      - "品質+3"
      - "極致の調合を解放"
    dedicated-effects:
      - id: "glyph:exchange"
      # 2026-07-31: 討伐素材(ホグリンの牙/ピグリンブルートの鎧片/ボグドの苔むした骨/砂まみれの骨)を
      # 使う最上位の調合。強化系の上限をここへ集約し、ツリー終端に「まだ先がある」感を残す。
      - id: "brew:apex-brew"

  C-1-upper:
    name: "俊敏・跳躍の調合"
    level: 40
    role: branch
    parent: C        # 線不明
    icon: SUGAR
    cost: 1
    effect-text: "俊敏・跳躍魔法開放・醸造速度UP"
    effects:
      - "俊敏・跳躍魔法を解放"
      - "醸造速度UP"
    buffs:
      brew_speed_bonus: 0.05
    dedicated-effects:
      - id: "brew:swiftness-jump"
  C-2-upper:
    name: "体力増強の調合"
    level: 60
    role: branch
    parent: C-1-upper   # 直列連結。線不明
    icon: GOLDEN_CARROT
    cost: 1
    effect-text: "体力増強と採掘速度上昇のポーションが利用可能に・泡"
    effects:
      - "体力増強と採掘速度上昇のポーションが利用可能に"
      - "泡"
    dedicated-effects:
      - id: "brew:healthboost-haste"
  E-1-1:
    name: "回復・体力増強の調合"
    level: 80
    role: branch
    parent: E        # 上段E系派生。線不明
    icon: GLISTERING_MELON_SLICE
    cost: 1
    effect-text: "回復・体力増強魔法開放・体力増強IIの調合・バフの品質UP"
    effects:
      - "回復・体力増強魔法を解放"
      - "体力増強II / 採掘速度上昇II / 幸運II のポーションが利用可能に"
      - "バフの品質UP"
    dedicated-effects:
      - id: "glyph:heal"
      - id: "glyph:journey"
      # C-2-upper の healthboost-haste の上位段(amplifier 1)。
      # 未参照のままだと BrewUnlockListener の仕様で永久ロックになるため、
      # 体力増強系の最上位ノードであるここへ配置している(2026-07-30)。
      - id: "brew:healthboost-haste-2"

  C-1-lower:
    name: "注入の術"
    level: 40
    role: branch
    parent: C        # 線不明
    icon: FERMENTED_SPIDER_EYE
    cost: 1
    effect-text: "注入のグリフ開放・デバフの品質UP"
    effects:
      - "注入のグリフを解放"
      - "デバフの品質UP"
    dedicated-effects:
      - id: "glyph:infuse"
  C-2-lower:
    name: "衰弱の術"
    level: 60
    role: branch
    parent: C-1-lower   # 直列連結。線不明
    icon: WITHER_ROSE
    cost: 1
    effect-text: "衰弱のグリフ開放・醸造速度UP"
    effects:
      - "衰弱のグリフを解放"
      - "醸造速度UP"
    buffs:
      brew_speed_bonus: 0.05
    dedicated-effects:
      - id: "glyph:wither"
      # 2026-07-31: 討伐素材(ウィッチの秘薬/エンダーマイトの煤/ストレイの布片)を使う妨害系の調合。
      # 素材は Lv45 以上のフィールドモブ限定ドロップなので、実質「遠くまで狩りに出る」が前提になる。
      - id: "brew:hunter-hex"
  E-2-1:
    name: "呪詛の術"
    level: 80
    role: branch
    parent: E        # 下段E系派生。線不明
    icon: DRAGON_BREATH
    cost: 1
    effect-text: "呪詛開放・生存の調合"
    effects:
      - "呪詛を解放"
      - "生存の調合を解放"
    dedicated-effects:
      - id: "glyph:hex"
      # 2026-07-31: 討伐素材(ガーディアンの棘/ラヴェジャーの革/ハスクの布片)を使う生存系の調合。
      # RESISTANCE と CONDUIT_POWER はバニラのポーションでは作れない。
      - id: "brew:survivor-brew"

  B-alpha-1:
    name: "節約の調合I"
    level: 30
    role: greek
    parent: B
    group: B-greek
    icon: HONEY_BOTTLE
    cost: 1
    effect-text: "素材を消費しない確率UP"
    effects:
      - "素材を消費しない確率UP"
  B-alpha-2:
    name: "節約の調合II"
    level: 50           # 画像に明示Lvなし。-2は+20と推定
    role: greek
    parent: B-alpha-1
    group: B-greek
    icon: HONEY_BOTTLE
    cost: 1
    effect-text: "品質+2・醸造速度アップ"
    effects:
      - "品質+2"
      - "醸造速度アップ"
    buffs:
      potion_quality_bonus: 2
      brew_speed_bonus: 0.05
  B-beta-1:
    name: "残留の調合I"
    level: 30
    role: greek
    parent: B
    group: B-greek
    icon: LINGERING_POTION
    cost: 1
    effect-text: "残留時間UP・スプラッシュ強度UP"
    effects:
      - "残留時間UP"
      - "スプラッシュ強度UP"
    buffs:
      potion_quality_bonus: 1
  B-beta-2:
    name: "残留の調合II"
    level: 50           # 画像に明示Lvなし。-2は+20と推定
    role: greek
    parent: B-beta-1
    group: B-greek
    icon: LINGERING_POTION
    cost: 1
    effect-text: "品質+2・武器コーティングのスタック数増加"
    buffs:
      potion_quality_bonus: 2
      # 2026-07-28(数値のギミックyml集約): feature:coating-stack-increase から移設(値5は変更なし)。
      coating_charges_bonus: 5
    effects:
      - "品質+2"
      - "武器コーティングのスタック数増加"

