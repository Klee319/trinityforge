# TrinityForge - スキルEXP獲得設定
# ---------------------------------------------------------------------------
# 【このファイルの役割】
# TrinityForge / ArsPaper が「独自に付与する」行動あたりEXPのみを書く。
#
# 【ダンジョン限定EXP】
# dungeon-only-exp: true にすると、下記の戦闘系スキル
#   重武器(HEAVY)/軽武器(LIGHT)/弓術(ARCHERY)/重装甲/軽装甲/ARS_MAGIC
# のEXPは「EliteMobsダンジョンのインスタンスワールド内」でのみ加算され、オーバーワールド等では
# 加算されない(トリガ: 軽・重武器と弓術と魔法=討伐、防具=被弾)。
# ※N5(2026-07-31): 以前は弓術だけが「命中ごとに与ダメージ比例」だったが、軽・重武器と同じ
#   討伐時ベースへ統一した(combat.kill-exp.base の ARCHERY 行が基礎値)。
# ダンジョンワールド判定は fork が生成/破棄時に TF の DungeonWorldRegistry へ登録した world UUID による。
# false = 従来どおりどこでも加算。※ars-smithing(クラフト)/採取/釣り等の非戦闘EXPはこのゲートの対象外。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/skill-exp.md

dungeon-only-exp: false
outside-dungeon-exp-rate: 0.25
daily-diminishing:
  enabled: true
  window-hours: 24
  per-amount: 100000
  decay-per-amount: 0.7
  floor: 0.3
  exempt-skills: []
# 【同一地点の逓減】TT・放置狩り対策。半径 radius 以内・直近 window-seconds 秒の【撃破数】で決まる。
# threshold 体までは倍率1.0、超えた1体につき decay-per-kill ずつ下がり floor で止まる。
#
# 2026-08-19 W-117「経験値がもらえない」の緩和(ユーザー指示「同一地点狩りを緩和する。
# TTを作っていなくてもエンダーマンやピグリンなど集めて刈り取りやすいモブで発生していそう」):
#   旧値 threshold:30 / decay:0.05 / floor:0.1 は【5分・半径16で30体】で減り始め【48体で10%】。
#   エンドのエンダーマンやネザーのピグリンを「集めて刈る」正常なプレイがこの密度に普通に届くため、
#   TTを作っていないプレイヤーが下限10%に張り付いていた。ダンジョン外倍率0.25と掛け合わさると
#   重量Lv39で25レベのピグリン ≒ 170EXP が 170×0.25×0.1 ≒ 4EXP まで落ちる(報告の「1〜10」に一致)。
#   新値は【80体までフルEXP・110体目で下限40%】。80体/5分 = 3.75秒に1体を1箇所から動かずに
#   維持し続ける密度で、手動で「集めて刈る」プレイでは届かず、湧き機構のある farm では確実に届く。
# ※下限を0.1→0.4へ上げたのは、この機構の狙いが「稼げなくする」ではなく「割に合わなくする」ため。
#   総量の頭打ちは daily-diminishing 側の役目で、こちらは1箇所固定を相対的に不利にするだけでよい。
spot-diminishing:
  enabled: true
  radius: 16
  window-seconds: 300
  threshold: 80
  decay-per-kill: 0.02
  floor: 0.4
  exempt-dungeon-worlds: true
gathering:
  exp-mode: block_value
# 【破壊時バニラEXP】2026-08-18 ユーザー要望「もらえるバニラ経験値が多すぎる。現状の1/4程度にして
# 設定もできるようにして」。スキルツリーの feature:break-vanilla-exp-<スキル> を解放したプレイヤーが
# 採取扱いのブロックを壊したときに落ちる【バニラのEXPオーブ】の量。TFのスキルEXPとは別物。
#
# base-exp: 1回の破壊あたりのベース量。実際の付与量は base-exp × (1 + 倍率ステの合計)。
#   0.25 = 旧実装(1.0)の1/4。0 にすると解放しても一切増えない(機能OFFと同じ)。
#   小数を書いてよい —— giveExp は整数しか受け取れないが、端数はプレイヤーごとに持ち越して
#   1貯まったぶんだけ渡す(0.25 なら「4回壊して1EXP」)。四捨五入ではないので、
#   小さな値にしても「常に0に丸められて機能が死ぬ」ことは無い。
# per-skill-base-exp: 採取スキル別の上書き(省略可)。書いたスキルだけ base-exp より優先される。
#   例: 採掘だけ多めにする  ->  per-skill-base-exp: { MINING: 0.5 }
break-vanilla-exp:
  base-exp: 0.25
  per-skill-base-exp: {}
  # 【連鎖破壊分にも配る上限ブロック数】(2026-08-19 W-143 実サーバ報告
  # 「一括伐採発動時に1個分しか経験値が入らない」)
  # 一括伐採 / 一括破壊 / 範囲収穫 の連鎖分にも破壊時バニラEXPを配る。1バースト
  # (=同tick・同プレイヤー = 斧1振りぶん)でここまでのブロック数を数える。
  # 【0 を書くと連鎖分には配らない】= 2026-07-28 以来の旧挙動へ戻る。
  # 上限を設けている理由: 無制限にすると一括破壊がそのままバニラEXP増殖装置になる
  # (これが旧仕様で連鎖分を切っていた理由そのもの)。
  # 64 の根拠: 出荷 tier の一括伐採は tier1=16 / tier2=64 / tier3=128 本なので、
  # 通常の伐採はほぼ全部数えつつ、最上位の1振りでも 64 ブロック分で止まる。
  # 段階破壊される葉はそもそも採取扱いにならない(出荷ymlに葉の行が無い)ので数に入らない。
  chain-max-blocks: 64
power:
  # 総合(POWER)を何レベル進めるごとにスキルポイントを1点与えるか。
  # 1 = 1レベルごとに1点(従来の挙動)。2 なら2レベルで1点、5 なら5レベルで1点。
  # ポイント総数 = 初期3点 + 総合レベル ÷ この値(切り捨て)。
  # 0 以下を書いても 1 として扱う(ゼロ除算とポイント無限増加の防止)。
  # ⚠️ この値を大きくすると既存プレイヤーの獲得済みポイントが減る。既に使った分が新しい上限を
  # 超える場合は「使った分はそのまま・残りを0」に整えられる(取得済みパークは剥がさない)。
  # ⚠️ 変更後は必ず /trinityforge reload を打つこと。全員のポイント残高を新しい値で書き直すのは
  # reload の中の再計算処理だけで、ログインでは走らない(打たないと次のレベルアップまで旧残高のまま)。
  levels-per-skill-point: 1
ars-smithing:
  # 儀式で実際に消費したソース1あたりの追加EXP。0 = ソースを加味しない。
  # 下の exp-per-material の合計に「消費ソース量 × この値」を足したものが儀式1回のEXP。
  # ⚠️ ソース要求量は階梯とともに桁で増える(ソースの欠片100 → 無限のソース核45,000,000)ので、
  # 1.0 のような値を入れると上位儀式1回で最大レベルに届く。0.001 程度から様子を見ること。
  exp-per-source: 0.01
  # 儀式・Ars作業台で消費した素材1個あたりのEXP。表に無い素材は 0(＝その素材ぶんが乗らないだけ)。
  #
  # ⚠️ この表は通常鍛冶(smithing.exp-per-material)とは【別物】。2026-08-17 に分離した
  #    ―― それまで共用だったので、editor で通常鍛冶の素材リストを編集すると Ars 側の
  #    儀式EXPまで一緒に動いていた。初期値は分離時点の通常鍛冶の表の複製なので、
  #    以後はどちらか片方だけ編集して構わない。
  #
  # ⚠️ 定額 exp-per-craft は 2026-08-17 に機能ごと廃止した(書いても読まれない)。
  #    定額があった間は「1つでも表に無い素材があれば合計を捨てて定額へ戻す」という
  #    全か無かの分岐が必要で、素材を1つ足すとEXPが100分の1に落ちる向きの不整合が出ていた。
  #    いまは「消費ソースぶん + この表の合計」の2項だけで決まる。
  #
  # キーの語彙: バニラは Material 名 / カスタム品は custom:<id>(大小を潰さない)。
  # 圧縮素材(custom:<id>_Nx)は 0。圧縮するだけでEXPが増える経路を作らないため(J-12)。
