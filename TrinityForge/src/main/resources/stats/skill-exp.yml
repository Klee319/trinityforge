level-diminishing:
  gathering-enabled: false
  combat-enabled: false
  formula: 1 / (1 + %level% / 50)
  floor: 0.2
exp-display:
  mode: bossbar
  bossbar-seconds: 4
  max-concurrent-bossbars: 4
level-up:
  chat: true
  sound-enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  title-every-levels: 10
use-level-scaling:
  enabled: true
  max-multiplier: 100
  per-level:
    ars-smithing: 0.1
    smithing: 1.3
    woodcutting: 0.01
    mining: 0.01
    digging: 0.01
