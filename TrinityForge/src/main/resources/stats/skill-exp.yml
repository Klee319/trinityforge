# TrinityForge - スキルEXP獲得設定
# ---------------------------------------------------------------------------
# 【このファイルの役割】
# TrinityForge / ArsPaper が「独自に付与する」行動あたりEXPのみを書く。
#
# 【ダンジョン限定EXP】
# dungeon-only-exp: true にすると、下記の戦闘系スキル
#   重武器(HEAVY)/軽武器(LIGHT)/弓術(ARCHERY)/重装甲/軽装甲/ARS_MAGIC
# のEXPは「EliteMobsダンジョンのインスタンスワールド内」でのみ加算され、オーバーワールド等では
# 加算されない(トリガ: 軽・重武器と弓術と魔法=討伐、防具=被弾)。
# ※N5(2026-07-31): 以前は弓術だけが「命中ごとに与ダメージ比例」だったが、軽・重武器と同じ
#   討伐時ベースへ統一した(combat.kill-exp.base の ARCHERY 行が基礎値)。
# ダンジョンワールド判定は fork が生成/破棄時に TF の DungeonWorldRegistry へ登録した world UUID による。
# false = 従来どおりどこでも加算。※ars-smithing(クラフト)/採取/釣り等の非戦闘EXPはこのゲートの対象外。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/skill-exp.md

dungeon-only-exp: false
outside-dungeon-exp-rate: 0.25
# daily-diminishing: (2026-07-31 追加) 直近24時間に【そのスキルで】稼いだ総量に応じて
#   EXP 取得量を薄める。1日12時間プレイする層と週末だけの層の差を縮めるための機構。
#
#   ここが spot-diminishing と違う点: あちらは「同じ場所で狩り続ける」ことへの抑制(半径16/300秒)で、
#   総量には一切効かない。1日単位で稼ぎを薄める仕組みはこれまで存在しなかった。
#
#   仕組みは指数移動窓。付与のたびに「蓄積 x exp(-経過/window) + 今回の量」を計算する。
#   ・window-hours = 時定数。24 なら 24 時間で蓄積が約37%まで戻る(0 にはならない)。
#   ・日付でリセットしないのは意図的 ── 「23:59 に溜めて 00:00 から全開」が最適解になるのを防ぐため。
#   ・スキルごとに独立。採掘を掘り切った日でも伐採は等倍で入る(縦を伸ばさず横へ促す)。
#   ・サーバ再起動で蓄積は消える(DB を増やさない判断。プレイヤーは再起動を選べないので悪用にならない)。
#
#   per-amount / decay-per-amount: (2026-08-01 仕様変更) 時間窓での総獲得量が per-amount に
#     達するたびに、EXP取得量が「現在の decay-per-amount 倍」になる。0.7 なら1段ごとに30%減。
#     段数は切り捨て(離散)なので、プレイヤー側で「あと何EXPで1段落ちるか」を数えられる。
#     旧 threshold / step / decay-per-step(段数を丸めない連続式)は廃止した ── 連続だと
#     気づかないうちにじわじわ減るだけで、何をすれば戻るのかが伝わらなかったため。
#     ※旧キーは読まない。残っていても無視されるので、書き換え漏れは挙動に出る。
#   floor: 倍率の下限。0 にすると完全に稼げなくなるので必ず 0 より大きくする。
#   exempt-skills: 逓減しないスキルID(例: [FISHING])。
#
#   現行値の意味: 15万までは等倍 -> 15万到達で0.7倍 -> 30万で0.49倍 -> 45万で0.343倍 ->
#   それ以降は下限0.3倍。レベル50前後の1レベルが約6千EXP、レベル80前後で約7.7万EXPなので、
#   カジュアル(1日5万程度)はまったく影響を受けず、長時間層だけが薄まる水準。
daily-diminishing:
  enabled: true
  window-hours: 24
  per-amount: 150000
  decay-per-amount: 0.7
  floor: 0.3
  exempt-skills: []
spot-diminishing:
  enabled: true
  radius: 16
  window-seconds: 300
  threshold: 30
  decay-per-kill: 0.05
  floor: 0.1
  exempt-dungeon-worlds: true
gathering:
  exp-mode: block_value
ars-smithing:
  # Ars鍛冶(儀式)のEXP。2026-08-01 以降、儀式が消費した素材を下の smithing.exp-per-material で
  # 合計した値が優先される(素材ごとの価値を二重管理しないため、表は鍛冶と共用)。
  # 消費素材が【1つでも】表に無ければ、合計を捨ててこの定額へ戻る(2026-08-02 修正)。
  # (作業台側と違い「表に無い＝0」にしないのは、儀式素材は ArsPaper の materials.yml 由来が多く、
  #  表が未整備なサーバで儀式EXPが丸ごと消えるほうが害が大きいため)
  # 【重要】ここを「合計が0のときだけ定額」にしてはいけない。表を部分的にしか引けないと
  # 「表に載っている安い素材ぶんだけ」が合計になり、素材を1つ足すとEXPが100分の1に落ちる。
  # 実際 binder_spear が 100 -> 1 になっていた(同格の binder_sword は全素材が表に無く 100 のまま)。
  exp-per-craft: 100
smithing:
  # 素材表(exp-per-material)が空のときだけ使われる定額フォールバック。
  # 表に1行でも書いてあれば、この値は無視され「盤面の素材の合計」で決まる。
  exp-per-craft: 15
  # クラフト盤面に置いた素材 1 個あたりの鍛冶EXP。3x3 の全マスを合計し、
  # さらに完成品の使用可能レベル倍率(use-level-exp-multipliers)と同時クラフト回数を掛ける。
  # キーは Material 名(大文字)、custom:<ID> は TFカタログ品と ArsPaper のカスタム品の両方
  # (2026-08-01 修正: 以前は TF カタログの刻印しか読んでおらず、下の custom: 行の大半を占める
  #  ArsPaper 由来ID(source_gem / magebloom_fiber / hard_metal …)が1行も引けず常に0だった)。
  # ここに無い素材は 0(=無報酬)。
  # 【重要】完成品に「使用可能レベル」が設定されていないアイテムには EXP を一切付与しない。
  # 解体で素材へ戻せるアイテムを作り直し続ける無限EXP経路(unzipサイクル)を塞ぐため。
  exp-per-material:
    # --- 木材・繊維 ---
    STICK: 0.5
    OAK_PLANKS: 1
    SPRUCE_PLANKS: 1
    BIRCH_PLANKS: 1
    JUNGLE_PLANKS: 1
    ACACIA_PLANKS: 1
    DARK_OAK_PLANKS: 1
    MANGROVE_PLANKS: 1
    CHERRY_PLANKS: 1
    PALE_OAK_PLANKS: 1
    BAMBOO_PLANKS: 1
    CRIMSON_PLANKS: 1
    WARPED_PLANKS: 1
    STRING: 1
    LEATHER: 3
    # --- 石材 ---
    COBBLESTONE: 1.5
    STONE: 1.5
    COBBLED_DEEPSLATE: 2
    DEEPSLATE: 2
    BLACKSTONE: 2
    # --- 金属・宝石 ---
    COPPER_INGOT: 4
    IRON_INGOT: 8
    GOLD_INGOT: 8
    AMETHYST_SHARD: 6
    DIAMOND: 25
    NETHERITE_SCRAP: 30
    NETHERITE_INGOT: 120
    # --- モブ素材 ---
    BLAZE_ROD: 8
    BREEZE_ROD: 20
    PHANTOM_MEMBRANE: 6
    PRISMARINE_SHARD: 4
    PRISMARINE_CRYSTALS: 5
    SHULKER_SHELL: 20
    ECHO_SHARD: 30
    HEART_OF_THE_SEA: 60
    NETHER_STAR: 200
    # --- TFカタログ素材 ---
    custom:stone_2x: 3
    custom:netherrack_2x: 2
    custom:thread_empty: 4
    custom:magebloom_fiber: 8
    custom:reinforced_fiber: 10
    custom:wither_rose_1x: 10
    custom:amethyst_block_2x: 12
    custom:reinforced_leather: 12
    custom:blaze_rod_2x: 16
    custom:source_gem: 20
    custom:shulker_shell_1x: 20
    custom:blaze_rod_3x: 24
    custom:dragon_breath_3x: 30
    custom:breeze_rod_2x: 40
    custom:shulker_shell_2x: 40
    custom:hard_metal: 40
    custom:heavy_metal: 40
    custom:elder_guardian_spike: 40
    custom:wither_skull_fragment: 40
    custom:tf_core_jewelry: 60
    custom:dragon_scale: 80
    custom:warden_tendril: 90
    custom:source_gem_block: 180
    # --- 以下は儀式(Ars鍛冶)で消費される素材 (2026-08-02 追加) ---
    # 儀式は「全素材が表に引けたときだけ」合計を使い、1つでも欠けると ars-smithing.exp-per-craft の
    # 定額へ戻る。つまり下の行が欠けると、そのレシピは素材価値と無関係な定額に落ちる。
    # 出荷の儀式レシピ121件が全カバーであることは ShippedRitualMaterialExpCoverageTest が保証する。
    # 値の導き方(既存の尺度をそのまま延長したもの):
    #   ブロック = 素材9個ぶん(QUARTZ_BLOCK だけ4個) / 装備 = 使用インゴット数ぶん(兜5・胴8・脚7・靴4)
    #   圧縮素材 custom:<id>_Nx = 素材N個ぶん / 加工品 = 材料の合計
    # --- 鉱石ブロック・圧縮 ---
    LAPIS_LAZULI: 1
    LAPIS_BLOCK: 9
    REDSTONE: 1
    REDSTONE_BLOCK: 9
    QUARTZ: 2
    QUARTZ_BLOCK: 8
    EMERALD: 10
    EMERALD_BLOCK: 90
    IRON_BLOCK: 72
    GOLD_BLOCK: 72
    DIAMOND_BLOCK: 225
    NETHERITE_BLOCK: 1080
    # --- 農作物・雑貨 ---
    WHEAT: 1
    HAY_BLOCK: 9
    WHITE_WOOL: 4
    FEATHER: 1
    FLINT: 2
    SUGAR: 0.5
    SLIME_BALL: 2
    GLOWSTONE_DUST: 2
    BLAZE_POWDER: 4
    MAGMA_CREAM: 6
    PUFFERFISH: 4
    GOLDEN_CARROT: 10
    GOLDEN_APPLE: 72
    RABBIT_FOOT: 8
    CHEST: 8
    TRIPWIRE_HOOK: 5
    SHIELD: 20
    # --- エンド・深層 ---
    ENDER_PEARL: 5
    CHORUS_FRUIT: 4
    ENDER_EYE: 10
    ENDER_CHEST: 90
    CRYING_OBSIDIAN: 12
    GHAST_TEAR: 20
    END_CRYSTAL: 90
    SEA_LANTERN: 25
    NAUTILUS_SHELL: 20
    TOTEM_OF_UNDYING: 200
    ELYTRA: 250
    HEAVY_CORE: 150
    # 入手が1個限りで再取得コストが桁違いなので、素材合計ではなく単独で最上位帯に置く。
    DRAGON_EGG: 300
    # --- バニラ防具(魔導士シリーズの土台) ---
    IRON_HELMET: 40
    IRON_CHESTPLATE: 64
    IRON_LEGGINGS: 56
    IRON_BOOTS: 32
    GOLDEN_HELMET: 40
    GOLDEN_CHESTPLATE: 64
    GOLDEN_LEGGINGS: 56
    GOLDEN_BOOTS: 32
    DIAMOND_HELMET: 125
    DIAMOND_CHESTPLATE: 200
    DIAMOND_LEGGINGS: 175
    DIAMOND_BOOTS: 100
    # --- 圧縮素材(氷芯・熾鉄シリーズの儀式で消費する) ---
    # custom:<id>_Nx = 素材N個ぶん。既存の custom:blaze_rod_2x=16 / _3x=24 (BLAZE_ROD=8) と同じ尺度。
    custom:stone_5x: 7.5
    custom:wither_rose_2x: 20
    custom:breeze_rod_3x: 60
    custom:emerald_block_4x: 360
    custom:netherite_block_1x: 1080
    # --- 儀式専用の上位素材 ---
    custom:echo_shard_2x: 60
    custom:abyssal_ingot: 250
    custom:dungeon_seal_binder: 300
    custom:reality_thread_core: 350
    custom:binder_fragment: 400
    # --- 魔導士シリーズの中間段(下位ティアを素材にして上げていく) ---
    custom:spell_book_novice: 40
    custom:spell_book_apprentice: 80
    custom:mage_arcane_novice_helmet: 60
    custom:mage_arcane_novice_chestplate: 90
    custom:mage_arcane_novice_leggings: 80
    custom:mage_arcane_novice_boots: 50
    custom:mage_arcane_apprentice_helmet: 120
    custom:mage_arcane_apprentice_chestplate: 180
    custom:mage_arcane_apprentice_leggings: 160
    custom:mage_arcane_apprentice_boots: 100
    custom:mage_weaver_novice_helmet: 60
    custom:mage_weaver_novice_chestplate: 90
    custom:mage_weaver_novice_leggings: 80
    custom:mage_weaver_novice_boots: 50
    custom:mage_weaver_apprentice_helmet: 120
    custom:mage_weaver_apprentice_chestplate: 180
    custom:mage_weaver_apprentice_leggings: 160
    custom:mage_weaver_apprentice_boots: 100
    custom:mage_guardian_novice_helmet: 60
    custom:mage_guardian_novice_chestplate: 90
    custom:mage_guardian_novice_leggings: 80
    custom:mage_guardian_novice_boots: 50
    custom:mage_guardian_apprentice_helmet: 120
    custom:mage_guardian_apprentice_chestplate: 180
    custom:mage_guardian_apprentice_leggings: 160
    custom:mage_guardian_apprentice_boots: 100
