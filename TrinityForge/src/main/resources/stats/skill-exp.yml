# ---------------------------------------------------------------------------
# 【2026-07-26 EXP調整タスク3】後半ヌルゲー化への栓: スキルレベル逓減カーブ(既定OFF)
# ---------------------------------------------------------------------------
# レベルが上がるほど1回あたりのEXP取得量を減らしたい場合に使う。既定は gathering-enabled/
# combat-enabled とも false = 常に倍率1.0(現行挙動そのまま)。「使うかどうかはユーザーが決める」
# 方針でオプトインにしてある。有効にすると "後半の伸びが鈍る"(同じ作業を繰り返しても
# 得られるEXPが徐々に減っていく)効果になる — 後半ヌルゲー化対策として使うことを想定している。
#   gathering-enabled : MINING/FARMING/WOODCUTTING/DIGGING(タスク1の採取系)へ適用するか。
#   combat-enabled    : HEAVY_WEAPONS/LIGHT_WEAPONS/ARCHERY/HEAVY_ARMOR/LIGHT_ARMOR/ARS_MAGIC
#                        (武器/魔法の討伐、弓命中、防具被弾)へ適用するか。
#                        どちらか片方だけ有効化することもできる。
#   formula           : exp_level_curve と同じ書式(%level% が現在レベルに置き換わる四則演算/べき乗式)。
#                        評価結果がそのまま倍率になる(1.0=減衰なし)。既定は
#                        "1 / (1 + %level% / 50)" — レベル0で1.0、レベル50で0.5、レベル150で0.25と、
#                        なだらかに減っていく緩やかな逓減カーブ。急に0まで落ちない設計。
#   floor             : 倍率の下限(これ未満には下がらない)。既定0.2 = どれだけレベルが上がっても
#                        最低20%のEXPは入り続ける(完全に稼げなくなることを防ぐ安全弁)。
level-diminishing:
  gathering-enabled: false
  combat-enabled: false
  formula: '1 / (1 + %level% / 50)'
  floor: 0.2

exp-display:
  mode: bossbar
  bossbar-seconds: 4.0
  max-concurrent-bossbars: 4

level-up:
  chat: true
  sound-enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  title-every-levels: 10

# ---------------------------------------------------------------------------
# 【2026-07-28】使用可能レベル連動EXP(Ars鍛冶・鍛冶・伐採・採掘・切削)
# ---------------------------------------------------------------------------
# 「使用したツールの使用可能レベル(鍛冶は作成したツール/装備の使用可能レベル)が高いほど、
# そのぶん得られるEXPも増える」ための倍率設定。式は単純な線形:
#   倍率 = 1 + 使用可能レベル × per-level
# item-stats.yml で実際に使われている使用可能レベルは 0/10/20/30/40/55/70/85/100 の9段のみで、
# per-level の既定値 0.01 のときの倍率は次のとおり:
#   Lv0(素手・バニラツール・item-statsにプロファイル無し) = 1.00倍(＝現状維持)
#   Lv10 = 1.10倍 / Lv20 = 1.20倍 / Lv30 = 1.30倍 / Lv40 = 1.40倍
#   Lv55 = 1.55倍 / Lv70 = 1.70倍 / Lv85 = 1.85倍 / Lv100 = 2.00倍
#
# 【使用可能レベル0＝倍率1.0の意味】
# 素手・バニラの無印ツール・item-stats.ymlに使用制限プロファイルが無いアイテムは、すべて
# 使用可能レベル0として扱われ、倍率は常に1.0になる。つまりこの機能を有効にしても、
# 従来どおりバニラ相当の道具でプレイしている限りEXP取得量は1ビットも変わらない。
#
# 【鍛冶と採取3種の違い】
#   ars-smithing: Ars作業台/儀式で完成した装備・触媒そのものの使用可能レベルを見る。
#   smithing    : 「クラフトして完成した」ツール/装備そのものの使用可能レベルを見る。
#   woodcutting/mining/digging : 「ブロックの破壊に使ったメインハンドのアイテム」の
#                 使用可能レベルを見る(そのブロックの採取分類とツールのuse-skillが
#                 一致している必要はない。例: シャベルでDIGGING扱いのブロックを掘った場合)。
#
# 【農業(FARMING)は対象外】
# per-levelにfarmingの行が無いため、FARMINGへ付与されるEXPはこの機能の影響を一切受けない
# (ユーザー要件どおり、農業は今回のスコープ外)。
#
# 【爆破採掘(EntityExplodeEvent経由)には掛からない】
# TNT等での爆破破壊は「ツールで壊した」わけではないため、この倍率は掛からない(常に1.0)。
# ツルハシを持ったままTNTを起爆するだけで倍率が乗る抜け道を防ぐ意図もある。
#
# enabled: false でこの機能自体を無効化できる(既定true)。
# max-multiplier: per-levelを大きくした際の暴走止め(既定3.0)。倍率がこの値を超えることはない。
# per-level: スキルごとの係数。行が無いスキル(farming等)は常に1.0(未対象)。
#   後から鍛冶だけ・採取系だけ個別に強さを変えられるようキーを分けてあるが、
#   要件どおり初期値はすべて同じ強さ(0.01)にしてある。
use-level-scaling:
  enabled: true
  max-multiplier: 3.0
  per-level:
    ars-smithing: 0.01
    smithing: 0.01
    woodcutting: 0.01
    mining: 0.01
    digging: 0.01
