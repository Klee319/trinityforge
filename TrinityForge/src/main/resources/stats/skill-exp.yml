      MAGMA_CUBE: 1.3
      PARCHED: 1.2
      PHANTOM: 1.3
      PIGLIN: 1.1
      PIGLIN_BRUTE: 1.8
      PILLAGER: 1.2
      POLAR_BEAR: 1.3
      RAVAGER: 2.5
      SHULKER: 1.5
      SILVERFISH: 1.0
      SKELETON: 1.1
      SLIME: 1.0
      SPIDER: 1.0
      STRAY: 1.3
      VEX: 1.4
      VINDICATOR: 1.4
      WARDEN: 7.0
      WITCH: 1.5
      WITHER: 6.0
      WITHER_SKELETON: 1.8
      ZOGLIN: 1.8
      ZOMBIE: 1.0
      ZOMBIE_VILLAGER: 1.0
      ZOMBIFIED_PIGLIN: 1.2
      # mob-level-table.yml の no-skill-exp-mobs。明示的な0でEditor上も抑止を可視化する。
      BEE: 0.0
      GOAT: 0.0
      LLAMA: 0.0
      TRADER_LLAMA: 0.0
      PANDA: 0.0
      WOLF: 0.0
      IRON_GOLEM: 0.0
  # 魔法破壊されたブロックを farming/woodcutting/digging/mining progression の
  # 編集可能な素材EXPへ照合し、最大の一致値にこの倍率を掛けてARS_MAGICへ付与する。
  block-break-exp:
    enabled: true
    source-multiplier: 1.0


# 軽武器/重武器は命中EXPを廃止し、討伐確定時のEXPへ一本化。
combat:
  # HEAVY_WEAPONS/LIGHT_WEAPONS専用。命中時には付与せず、敵の死亡が確定した時に1回だけ付与。
  # (skill別base + mobLevel*per-mob-level + 最大体力*per-max-health) * entity-type倍率
  kill-exp:
