ars-magic:
  kill-exp:
    enabled: true
    base: 20
    per-mob-level: 1.5
    per-max-health: 0.25
    unlisted-entity-multiplier: 0
    # 非敵対モブは載せない（方針は combat.kill-exp 側の注記を参照）。
    entity-type-multipliers:
      BLAZE: 1.7
      BOGGED: 1.2
      BREEZE: 1.6
      CAVE_SPIDER: 1.2
      CREAKING: 1.5
      CREEPER: 1.3
