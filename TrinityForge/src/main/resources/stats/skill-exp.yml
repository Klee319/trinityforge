outside-dungeon-exp-rate: 0.25
daily-diminishing:
  enabled: true
  window-hours: 24
  per-amount: 100000
  decay-per-amount: 0.7
  floor: 0.3
  exempt-skills: []
spot-diminishing:
  enabled: true
  radius: 16
  window-seconds: 300
  threshold: 30
  decay-per-kill: 0.05
  floor: 0.1
  exempt-dungeon-worlds: true
gathering:
