# TrinityForge - スキルEXP獲得設定
# ---------------------------------------------------------------------------
# 【このファイルの役割】
# TrinityForge / ArsPaper が「独自に付与する」行動あたりEXPのみを書く。
#
# 【ダンジョン限定EXP】
# dungeon-only-exp: true にすると、下記の戦闘系スキル
#   重武器(HEAVY)/軽武器(LIGHT)/弓術(ARCHERY)/重装甲/軽装甲/ARS_MAGIC
# のEXPは「EliteMobsダンジョンのインスタンスワールド内」でのみ加算され、オーバーワールド等では
# 加算されない(トリガ: 軽・重武器と魔法=討伐、弓術=命中、防具=被弾)。
# ダンジョンワールド判定は fork が生成/破棄時に TF の DungeonWorldRegistry へ登録した world UUID による。
# false = 従来どおりどこでも加算。※ars-smithing(クラフト)/採取/釣り等の非戦闘EXPはこのゲートの対象外。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/skill-exp.md

dungeon-only-exp: false
outside-dungeon-exp-rate: 0.25
spot-diminishing:
  enabled: true
  radius: 16
  window-seconds: 300
  threshold: 30
  decay-per-kill: 0.05
  floor: 0.1
  exempt-dungeon-worlds: true
gathering:
  exp-mode: block_value
ars-smithing:
  exp-per-craft: 100
smithing:
  exp-per-craft: 15
ars-magic:
  kill-exp:
    enabled: true
    base: 20
    per-mob-level: 1.5
    per-max-health: 0.25
    unlisted-entity-multiplier: 0
    entity-type-multipliers:
      BLAZE: 1.7
      BOGGED: 1.2
      BREEZE: 1.6
      CAVE_SPIDER: 1.2
      CREAKING: 1.5
      CREEPER: 1.3
      DROWNED: 1.2
      ELDER_GUARDIAN: 3
      ENDERMAN: 1.5
      ENDERMITE: 1.1
      ENDER_DRAGON: 8
      EVOKER: 2
      GHAST: 1.8
      GIANT: 4
      GUARDIAN: 1.4
      HOGLIN: 1.5
      HUSK: 1.1
      ILLUSIONER: 2
      MAGMA_CUBE: 1.3
      PARCHED: 1.2
      PHANTOM: 1.3
      PIGLIN: 1.1
      PIGLIN_BRUTE: 1.8
      PILLAGER: 1.2
      RAVAGER: 2.5
      SHULKER: 1.5
      SILVERFISH: 1
      SKELETON: 1.1
      SLIME: 1
      SPIDER: 1
      STRAY: 1.3
      VEX: 1.4
      VINDICATOR: 1.4
      WARDEN: 7
      WITCH: 1.5
      WITHER: 6
      WITHER_SKELETON: 1.8
      ZOGLIN: 1.8
      ZOMBIE: 1
      ZOMBIE_VILLAGER: 1
      ZOMBIFIED_PIGLIN: 1.2
  block-break-exp:
    enabled: true
    source-multiplier: 1
combat:
  kill-exp:
    base:
      HEAVY_WEAPONS: 30
      LIGHT_WEAPONS: 20
    per-mob-level: 2
    per-max-health: 0.25
    unlisted-entity-multiplier: 0
    entity-type-multipliers:
      BLAZE: 1.7
      BOGGED: 1.2
      BREEZE: 1.6
      CAVE_SPIDER: 1.2
      CREAKING: 1.5
      CREEPER: 1.3
      DROWNED: 1.2
      ELDER_GUARDIAN: 3
      ENDERMAN: 1.5
      ENDERMITE: 1.1
      ENDER_DRAGON: 8
      EVOKER: 2
      GHAST: 1.8
      GIANT: 4
      GUARDIAN: 1.4
      HOGLIN: 1.5
      HUSK: 1.1
      ILLUSIONER: 2
      MAGMA_CUBE: 1.3
      PARCHED: 1.2
      PHANTOM: 1.3
      PIGLIN: 1.1
      PIGLIN_BRUTE: 1.8
      PILLAGER: 1.2
      RAVAGER: 2.5
      SHULKER: 1.5
      SILVERFISH: 1
      SKELETON: 1.1
      SLIME: 1
      SPIDER: 1
      STRAY: 1.3
      VEX: 1.4
      VINDICATOR: 1.4
      WARDEN: 7
      WITCH: 1.5
      WITHER: 6
      WITHER_SKELETON: 1.8
      ZOGLIN: 1.8
      ZOMBIE: 1
      ZOMBIE_VILLAGER: 1
      ZOMBIFIED_PIGLIN: 1.2
level-diminishing:
  gathering-enabled: false
  combat-enabled: false
  formula: 1 / (1 + %level% / 50)
  floor: 0.2
exp-display:
  mode: bossbar
  bossbar-seconds: 4
  max-concurrent-bossbars: 4
level-up:
  chat: true
  sound-enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  title-every-levels: 10
use-level-scaling:
  enabled: true
  max-multiplier: 100
  per-level:
    ars-smithing: 0.1
    smithing: 1.3
    woodcutting: 0.01
    mining: 0.01
    digging: 0.01
