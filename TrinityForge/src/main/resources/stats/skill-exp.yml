# TrinityForge - スキルEXP獲得設定
# ---------------------------------------------------------------------------
# 【このファイルの役割】
# TrinityForge / ArsPaper が「独自に付与する」行動あたりEXPのみを書く。
#
# 【ダンジョン限定EXP】
# dungeon-only-exp: true にすると、下記の戦闘系スキル
#   重武器(HEAVY)/軽武器(LIGHT)/弓術(ARCHERY)/重装甲/軽装甲/ARS_MAGIC
# のEXPは「EliteMobsダンジョンのインスタンスワールド内」でのみ加算され、オーバーワールド等では
# 加算されない(トリガ自体は従来どおり: 武器=命中/防具=被弾/魔法=詠唱。範囲だけをゲートする)。
# ※2026-07-26: このうち ARS_MAGIC は長らく実装側でゲートされておらず素通りしていた
#   (ArsProgressionBridge.grantMagicExp がワールドを見ていなかった)。記述どおりになるよう
#   実装を修正済み。魔法だけ他の戦闘スキルより速く伸びる状態は解消されている。
# ダンジョンワールド判定は fork が生成/破棄時に TF の DungeonWorldRegistry へ登録した world UUID による。
# false = 従来どおりどこでも加算。※ars-smithing(クラフト)/採取/釣り等の非戦闘EXPはこのゲートの対象外。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/skill-exp.md

dungeon-only-exp: false

# ---------------------------------------------------------------------------
# 【2026-07-26 オーバーワールドEXP開放】ダンジョン外の戦闘スキルEXP倍率
# ---------------------------------------------------------------------------
# dungeon-only-exp: false のとき、ダンジョンワールドの「外」で得られる戦闘スキルEXP
# (武器=命中 / 防具=被弾 / 魔法=詠唱)に掛かる倍率。ダンジョン内は常に 1.0 のまま。
#   1.0 = ダンジョンと同率(オーバーワールドで育て切れてしまうので非推奨)
#   0.25(既定) = ダンジョンの1/4。オーバーワールドでも育つが、4倍速いダンジョンが主戦場になる
#   0.0 = dungeon-only-exp: true と同じ完全遮断
# ※dungeon-only-exp: true のときはそちらが優先され、この値は参照されない。
# ※採取/釣り/クラフト等の非戦闘EXPは元々このゲートの対象外なので、ここの影響も受けない。
outside-dungeon-exp-rate: 0.25

# ---------------------------------------------------------------------------
# 【2026-07-26 TT・放置対策】同一地点の逓減
# ---------------------------------------------------------------------------
# 「直近 window-seconds 秒のあいだに、半径 radius ブロック以内で何回EXPを得たか」を数え、
# threshold 回を超えたぶんだけ1回あたり decay-per-kill ずつ倍率を下げる(floor で下げ止まり)。
# 武器EXP(命中)・防具EXP(被弾)・バニラ経験値オーブ(撃破)の3経路が同じカウンタを共有する
# — 経路ごとに別勘定にすると、経路を混ぜるだけで逓減を回避できてしまうため。
#
# 狙いはTTを「潰す」ことではなく「割に合わなくする」こと。floor を0にしないのはそのため。
# 既定値(threshold 30 / decay 0.05 / floor 0.1)の意味:
#   同じ場所で5分以内に30回まではフルEXP。31回目から5%ずつ落ち、48回目で下限10%に到達する。
#   探索しながら戦う普通のプレイでは1箇所に30回も留まらないので、まず引っかからない。
#
# exempt-dungeon-worlds: true(既定) = ダンジョン内では逓減しない。ダンジョンは湧き潰しではなく
#   有限のスポーンを消化する場所で、アリーナ型だと1箇所に留まって戦うのが正常な遊び方なので、
#   ここで逓減させると本来推奨したい遊び方を罰することになる。
spot-diminishing:
  enabled: true
  radius: 24.0
  window-seconds: 300.0
  threshold: 30
  decay-per-kill: 0.05
  floor: 0.1
  exempt-dungeon-worlds: true

# ---------------------------------------------------------------------------
# 【2026-07-26 EXP調整タスク1】採取EXPの算出方式
# ---------------------------------------------------------------------------
# 鉱石側の値(skills/base/mining_progression.yml の experience.mining_break、47種類)は元々
# 存在するが、旧実装は「ブロックが対象として登録されているか」の判定だけに使い、実際に付与する量は
# 常に「ドロップ品(素材側)の値の合計」だった。そのため DIAMOND_ORE(ブロック側400) も
# DEEPSLATE_DIAMOND_ORE(ブロック側600) も、ドロップが同じ DIAMOND(素材側200) なのでどちらも
# 200になり、「深層岩バリアントは掘るのが大変な分EXPが高い」という設計が死んでいた。
# exp-mode でこれを選べるようにする(採取全スキル=MINING/FARMING/WOODCUTTING/DIGGING 共通)。
#   drop_sum(既定)   : 従来どおりドロップ品の値の合計。現行の実サーバ挙動と完全に同じ結果になる。
#   block_value       : ブロックそのものに設定された値をそのまま使う(DEEPSLATE系が高くなる等、
#                        ブロック側の意図がそのまま反映される)。
#   max               : ドロップ合計とブロック値の大きい方。
# どのモードでも次の2点は変わらない(壊さないこと、という制約どおり):
#   ・同一素材のドロップは1回だけ加算(スタック数は無視=幸運エンチャで増殖しない)
#   ・素手等、要求ツールを満たさずドロップが空になった破壊はEXP 0
gathering:
  exp-mode: drop_sum

ars-smithing:
  exp-per-craft: 100

# SMITHING (2026-07-25 PRG-13): 耐久消耗による付与を廃止し、武器/防具/ツールをクラフトした瞬間に
# exp-per-craft を1回だけ付与する方式に一本化した(ars-smithingと同じ仕組み)。耐久消耗ベースだと
# 「壊れる寸前まで使って修理」を繰り返すだけで実質無限にEXPを稼げてしまうため。
# シフトクリックでの一括クラフトでも、クラフトイベント1回につき exp-per-craft ぶんのみ付与される
# (作成した個数には比例しない — ars-smithingと同じ挙動)。
smithing:
  exp-per-craft: 15

ars-magic:
  exp-per-cast: 2.0
  exp-per-mana: 0.1


# ---------------------------------------------------------------------------
# 【2026-07-26 EXP調整タスク2】戦闘EXPを与ダメージ比例+モブレベル係数にする
# ---------------------------------------------------------------------------
# 旧実装は命中1回で常に exp-per-hit の固定値(既定1.0)——与えたダメージ量にもモブの強さにも
# 一切連動していなかった。mode: damage_scaled に切り替えると、1ヒットのEXPが
#   (与ダメージ × damage-scale) × (1 + モブレベル × mob-level-scale)
# で決まるようになる。モブレベルは EliteMobs/ダンジョン連携が使っているのと同じ MobData の
# レベル(PDC)を読む。レベル情報を持たないモブ(平地の通常モブ等)は0扱い=倍率1.0。
#   mode: flat(既定)         : 従来どおり exp-per-hit / by-skill の固定値。実サーバ挙動は不変。
#   mode: damage_scaled       : 上記の与ダメージ比例+モブレベル係数。
# damage-scale/mob-level-scale は mode: damage_scaled のときのみ使われる。既定値の根拠:
#   damage-scale=0.1     : TF標準武器の与ダメージは概ね5〜10前後(item-stats.yml参照)なので、
#                           1ヒットあたり0.5〜1.0程度になり、旧来のexp-per-hit=1.0と近い体感値になる
#                           ように選んだ(「いきなり別ゲーにならないように」の指示どおり)。
#   mob-level-scale=0.02  : モブレベル50で+100%(2倍)、レベル100で+200%(3倍)。ダンジョン深部の
#                           強モブほど旨みが出るが、極端な指数爆発は避けた保守的な値。
combat:
  # 後方互換キー。mode: flat のときだけ使われる固定値(既定挙動そのもの)。
  exp-per-hit: 1.0
  mode: flat
  damage-scale: 0.1
  mob-level-scale: 0.02
  same-target-cooldown-seconds: 10

# ---------------------------------------------------------------------------
# 【2026-07-26 EXP調整タスク3】後半ヌルゲー化への栓: スキルレベル逓減カーブ(既定OFF)
# ---------------------------------------------------------------------------
# レベルが上がるほど1回あたりのEXP取得量を減らしたい場合に使う。既定は gathering-enabled/
# combat-enabled とも false = 常に倍率1.0(現行挙動そのまま)。「使うかどうかはユーザーが決める」
# 方針でオプトインにしてある。有効にすると "後半の伸びが鈍る"(同じ作業を繰り返しても
# 得られるEXPが徐々に減っていく)効果になる — 後半ヌルゲー化対策として使うことを想定している。
#   gathering-enabled : MINING/FARMING/WOODCUTTING/DIGGING(タスク1の採取系)へ適用するか。
#   combat-enabled    : HEAVY_WEAPONS/LIGHT_WEAPONS/ARCHERY/HEAVY_ARMOR/LIGHT_ARMOR/ARS_MAGIC
#                        (タスク2の武器命中+既存の防具被弾+魔法詠唱)へ適用するか。
#                        どちらか片方だけ有効化することもできる。
#   formula           : exp_level_curve と同じ書式(%level% が現在レベルに置き換わる四則演算/べき乗式)。
#                        評価結果がそのまま倍率になる(1.0=減衰なし)。既定は
#                        "1 / (1 + %level% / 50)" — レベル0で1.0、レベル50で0.5、レベル150で0.25と、
#                        なだらかに減っていく緩やかな逓減カーブ。急に0まで落ちない設計。
#   floor             : 倍率の下限(これ未満には下がらない)。既定0.2 = どれだけレベルが上がっても
#                        最低20%のEXPは入り続ける(完全に稼げなくなることを防ぐ安全弁)。
level-diminishing:
  gathering-enabled: false
  combat-enabled: false
  formula: '1 / (1 + %level% / 50)'
  floor: 0.2

exp-display:
  mode: bossbar
  bossbar-seconds: 4.0
  max-concurrent-bossbars: 4

level-up:
  chat: true
  sound-enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  title-every-levels: 10
