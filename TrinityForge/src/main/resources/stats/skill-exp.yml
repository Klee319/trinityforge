    enabled: true
    source-multiplier: 1
combat:
  kill-exp:
    base:
      HEAVY_WEAPONS: 30
      LIGHT_WEAPONS: 20
      # 弓術は「軽武器 < 弓術 < 重武器」に収める(遠距離で安全な代わりに手数と弾薬コストがある)。
      # 30 にすると重武器と同値になり、SkillExpConfigTest が固定しているこの順序が崩れる。
      ARCHERY: 25
    per-mob-level: 2
    # 2026-08-12: 0.25 -> 0.188(x0.75)。理由は ars-magic.kill-exp 側の注記と同じ。
    per-max-health: 0.188
    unlisted-entity-multiplier: 0
    # 非敵対モブ（Paper の Enemy インターフェースを持たないモブ）は討伐EXPの対象外。
    # unlisted-entity-multiplier: 0 なので「行を書かない＝EXPゼロ」であり、0 で明示する必要も無い。
    # 2026-08-03 に一掃した行: BEE / DOLPHIN / GOAT / IRON_GOLEM / LLAMA / PANDA /
    # POLAR_BEAR / SKELETON_HORSE / TRADER_LLAMA / WOLF。
    # イルカやホッキョクグマは「そもそも敵対ではない」ので、討伐EXPを持たせない方針。
    # ここに新しい行を足すときは、そのモブが Paper の Enemy を実装しているか必ず先に確認すること。
