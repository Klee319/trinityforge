# TrinityForge - 採掘ギミック(各 skilltree/*.yml ノードの dedicated-effects: フィールドが付与する flag系consumer)チューニング
# 対象effectId: vein-mining / haste-active-mining
# ドロップテーブル(drop-tables)は「鉱脈破壊」トリガー型の追加ドロップ(2026-07-23 stat-gate-overhaul §4)。
# fortune は旧 stats/gathering.yml mining.* を統合したもの(§D廃止)。
# 数値は全て暫定(要調整)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/mining-gimmick.md

suspicious-block-respawn:
  loot-tables:
    suspicious-sand: DESERT_PYRAMID_ARCHAEOLOGY
    suspicious-gravel: TRAIL_RUINS_ARCHAEOLOGY_COMMON
vein-mining:
  ore-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
  max-extra-blocks: 32
haste-active-mining:
  amplifier: 5
  duration-ticks: 200
  cooldown-ticks: 600
  tiers:
    "1":
      amplifier: 3
      duration-ticks: 100
    "2":
      amplifier: 4
      duration-ticks: 200
    "3":
      amplifier: 5
      duration-ticks: 300
drop-tables:
  categories: {}
fortune:
  fortune-per-level: 0
  fortune-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
    - GLOWSTONE
    - GILDED_BLACKSTONE
    - NETHER_WART
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - MELON
    - PUMPKIN
    - SEA_LANTERN
    - COCOA
