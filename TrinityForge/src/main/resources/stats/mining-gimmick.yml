# TrinityForge - 採掘ギミック(各 skilltree/*.yml ノードの dedicated-effects: フィールドが付与する flag系consumer)チューニング
# 対象effectId: vein-mining / haste-active-mining
# ドロップテーブル(drop-tables)は「鉱脈破壊」トリガー型の追加ドロップ(2026-07-23 stat-gate-overhaul §4)。
# fortune は旧 stats/gathering.yml mining.* を統合したもの(§D廃止)。
# 数値は全て暫定(要調整)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/mining-gimmick.md


suspicious-block-respawn:
  loot-tables:
    suspicious-sand: DESERT_PYRAMID_ARCHAEOLOGY
    suspicious-gravel: TRAIL_RUINS_ARCHAEOLOGY_COMMON

vein-mining:
  ore-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
  max-extra-blocks: 32
haste-active-mining:
  amplifier: 5
  duration-ticks: 200
  cooldown-ticks: 600
  tiers:
    1: { amplifier: 3, duration-ticks: 160 }
    3: { amplifier: 4, duration-ticks: 200 }
    5: { amplifier: 5, duration-ticks: 240 }
drop-tables:
  categories:
    gacha_tier1:
      display-name: ガチャ券(初級)
      trigger-chance-percent: 3
      entries:
        - item: tf_gacha_ticket_1
          weight: 1
          amount: 1
    gacha_tier2:
      display-name: ガチャ券(中級)
      trigger-chance-percent: 2
      entries:
        - item: tf_gacha_ticket_2
          weight: 1
          amount: 1
    gacha_tier3:
      display-name: ガチャ券(上級)
      trigger-chance-percent: 1
      entries:
        - item: tf_gacha_ticket_3
          weight: 1
          amount: 1
    ancient_debris:
      display-name: 古代のがれき
      trigger-chance-percent: 5
      entries:
        - item: ANCIENT_DEBRIS
          weight: 1
          amount: 1
fortune:
  # 追加ドロップの期待個数 = 採掘運(mining-fortune、割合。0.15 = 「ドロップ増加+15%」)
  #                        + MINING Lv × fortune-per-level
  # 整数部は確定ドロップ、小数部はその確率で+1個(期待値方式)。
  # 【2026-07-28】以前は上式全体に × 0.30 が掛かっており、skilltree の「ドロップ増加+15%」が
  #   実際には +4.5% にしかならなかった。係数を撤去したぶん、レベル項の増加量を従来と同じに
  #   保つため 0.01 → 0.003 (= 0.01 × 0.30) へ下げてある。Lv100 で +30% 相当。
  fortune-per-level: 0.003
  fortune-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
    - GLOWSTONE
    - GILDED_BLACKSTONE
    - NETHER_WART
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - MELON
    - PUMPKIN
