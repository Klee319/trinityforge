# TrinityForge - 採掘ギミック(各 skilltree/*.yml ノードの dedicated-effects: フィールドが付与する flag系consumer)チューニング
# 対象effectId: vein-mining / haste-active-mining
# ドロップテーブル(drop-tables)は「鉱脈破壊」トリガー型の追加ドロップ(2026-07-23 stat-gate-overhaul §4)。
# fortune は旧 stats/gathering.yml mining.* を統合したもの(§D廃止)。
# 数値は全て暫定(要調整)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/mining-gimmick.md

suspicious-block-respawn:
  loot-tables:
    suspicious-sand: DESERT_PYRAMID_ARCHAEOLOGY
    suspicious-gravel: TRAIL_RUINS_ARCHAEOLOGY_COMMON
vein-mining:
  ore-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
  max-extra-blocks: 32
  # 一括破壊1回あたりに「連鎖分」で追加で引く drop-tables の上限回数(2026-08-24、既定は 32)。
  # 連鎖で壊した鉱石は BlockBreakEvent を発火しないため、これが無いと鉱脈を一括で掘っても
  # 起点1ブロック分しか抽選されない(1個ずつ手で掘るより損をする)。
  # 実際に引く回数は「連鎖で壊した自然生成ブロックの数」とこの値の小さいほう。
  # 手で設置した鉱石は数に入れない(起点の抽選が設置ブロックを除外しているのと同じ規約)。
  # 0以下にするとこの経路の抽選を行わない(2026-08-24 以前の挙動)。
  chain-drop-rolls-max: 32
haste-active-mining:
  amplifier: 5
  duration-ticks: 200
  cooldown-ticks: 600
  tiers:
    "1":
      amplifier: 3
      duration-ticks: 100
    "2":
      amplifier: 4
      duration-ticks: 200
    "3":
      amplifier: 5
      duration-ticks: 300
drop-tables:
  categories: {}
fortune:
  fortune-per-level: 0
  fortune-blocks:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - NETHER_GOLD_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
    - GLOWSTONE
    - GILDED_BLACKSTONE
    - NETHER_WART
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - MELON
    - PUMPKIN
    - SEA_LANTERN
    - COCOA
