# ============================================================================
# TrinityForge — エンチャント運(stat: enchant_luck)の重み付け設定
# ----------------------------------------------------------------------------
# エンチャントテーブルで良いエンチャント(高レベル・オーバーエンチャント上限突破結果含む)が
# 出やすくなる度合いを、stat "enchant_luck"(スキルツリー enchanting.yml の buffs で蓄積する
# ポイント値)から算出するための係数。バニラのエンチャント抽選自体にプレイヤー側の運パラメータは
# 存在しない(本棚数=提示レベルとアイテム固有enchantability、重み付き抽選のみ)ため、
# TrinityForgeは EnchantItemEvent で確定した結果に対して追加の補正抽選を行う。
#
# 運が vanilla-parity-luck 未満: バニラ結果を弱める(レベル-1、下限1。格上げはしない)。
# 運がパリティ以上: 従来どおり格上げ・追加・上限突破。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/enchant-luck.md
# ============================================================================

# 1回のエンチャント抽選で、確定した各エンチャントのレベルを+1格上げできるかどうかの判定確率。
# 実際の適用確率 = min(1.0, level-boost-chance-per-luck * enchant_luck)。
# バニラ上限(Enchantment#getMaxLevel)に達するまでの格上げにのみ使う。パリティ未満では使わない。

level-boost-chance-per-luck: 0.02
level-boost-max-steps: 3
overenchant-bonus-chance-per-luck: 0.02
extra-enchant-chance-per-luck: 0.02
# この値未満の運では格上げせず弱体化する。0 でナーフ無効(旧挙動)。
vanilla-parity-luck: 10
# 運0のときのレベル-1 試行確率。パリティ直前では 0 に近づく。
level-nerf-chance-at-zero: 0.5
# 1回の抽選でレベルを-1できる最大回数。下限はレベル1。
level-nerf-max-steps: 2
