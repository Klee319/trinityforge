# TrinityForge - 掘削(シャベル適正ブロック破壊)ギミック チューニング
# 設計書 2026-07-23-stat-gate-overhaul.md §4 準拠。
# 対象判定は digging_progression.yml の digging_break 表を流用する DiggingGimmickListener が担う。
# ruins-thread ドロップは旧 fork ArsPaper loot/RuinsThreadDropListener(ruins-thread-drop dedicated-effect)
# の挙動移植: 同リスナーがドロップするのと同じ空スレッド item id (thread_empty、Ars item registry) を使う。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/digging-gimmick.md

drop-tables:
  categories:
    ruins_thread:
      display-name: "遺跡の空スレッド"
      trigger-chance-percent: 5.0
      entries:
        - item: thread_empty
          weight: 1
          amount: 1

durability-exp:
  durability-per-percent: 100     # 全 tier 共通の既定（tier 側で個別上書き可）
  # 2026-07-28 (数値のギミックyml集約): 旧 durability-exp.tiers は「上限%(50/25)をそのままtier番号として
  # 流用する」アンチパターンだった — C-1(バニラEXP)とC-2(職業EXP)が同じ数値空間を共有していたため、
  # tierを足すと%の意味が壊れる(例: 50+αのtierを定義するとC-1/C-2どちらのつもりかが曖昧になる)。
  # 廃止し、feature別(vanilla-exp/job-exp)に独立した tiers表 + cap-percent へ置き換えた。
  # tierはスキルツリーのノード value から決まる(digging-durability-vanilla-exp/job-exp は
  # FeatureEffectParam.SCALE、DedicatedEffectsConfig#valueMaxで解決)。該当tier未満の行しか無い場合は
  # より小さいtierの行へフォールバックし、どの行にも満たない場合は cap-percent 0(無効)として扱う。
  # durability-per-percent は各行で個別上書き可能(省略時は上のグローバル既定値を使う)。
  vanilla-exp:
    tiers:
      1: { cap-percent: 50 }
  job-exp:
    tiers:
      1: { cap-percent: 25 }
