      crit-damage: 0.02
      penetration: 0.004
      durability: 6
    use-level-requirement: 0
    use-skill: LIGHT_WEAPONS
    quality-mode-offset: 0
    random:
      attack-power:
        min: -10
        max: 13
      crit-damage:
        min: -0.12
        max: 0.18
      crit-chance:
        min: -0.04
        max: 0.06
  WOODEN_SPEAR:
    fixed:
      attack-power: 97
      attack-speed: 0.9
      attack-reach: 1
      crit-chance: 0.05
      crit-damage: 0.48
      penetration: 0.24
      damage-modifier: 0.59
      durability: 35
      fixed-damage: 1.1
    per-quality:
      attack-power: 4.7
      crit-chance: 0.003
      crit-damage: 0.02
      penetration: 0.004
      durability: 6
    use-level-requirement: 0
    use-skill: LIGHT_WEAPONS
    quality-mode-offset: 0
