# ============================================================================
# 2026-08-10 防具ラダーの引き直し — 守備力を「攻撃力の一定割合」に固定する
#
# 旧: phys-flat-defense が 6.5 -> 288(x44)で、モブ攻撃力(x40)とほぼ同じ勾配だった。
#     守備力は引き算で効くので、勾配が揃っていると残差が消えるか爆発するかの二択になり、
#     全帯で min-component-damage=1 の床値に張り付いていた(= クランプ頼みのバランス)。
# 新: 帯 L ごとに F(L) = 0.5 x A(L)。A(L) = 8.0 x 1.0148^L は combat/mob-types.yml の
#     基準モブ(ゾンビ)の攻撃力カーブそのもので、Lv10未満は early-level-attack の緩和も掛ける。
#     最大HPは HP(L) = 8 x (A - F) x k で「通常モブ8発で落ちる」量に置く。
#     目標がバニラの20を下回る低帯だけは据え置く(装備の最大HPを0にすると序盤が理不尽になるため)。
#
# 2026-08-12 追補(ユーザー指示「最大レベルで50ハートぐらいにとどめたい」):
#     指数を 1.02 -> 1.0148 へ寝かせた。F も HP も A に完全比例するので、
#     A(100) が 0.6 倍になると Lv100 のプレイヤー最大HPが 166.7 -> 100.1(50ハート)へ縮む。
#     ★ 耐えられる発数は変わらない。攻撃力・守備力・最大HPが同じ比で縮むだけなので、
#       「HPバーの見た目だけを畳んだ」変更であって、脆くなったわけではない。
#     ★ 何発で落ちる設計かを変えたいときのつまみは HP(L) の係数 8 ただ1つ。
#     さらに物理素材の防具は magic-flat-defense / magic-resistance を1つも持たず、
#     ウォーデン(魔法比率0.6)の魔法成分が防御率以外まったく素通りしていたので、
#     物理値の50%を最低保証として補った(魔織/守護など自前の値を持つ品は据え置き)。
#
# ⚠️ combat/mob-types.yml の攻撃力カーブと対で校正されている。片方だけ動かさないこと。
#    検算は tmp/balance-model.js。
# ============================================================================
# 2026-08-19 W-126 / W-127 — 武器種ごとの「尖り」を1つずつ決める
#
# なぜ変えたか: 全 tier を横に並べると(検算は tmp/audit-weapon-dps.js)、
#   ・大剣は単体の秒間火力が【全近接で最下位】なのに、範囲は対象上限3体で鎌と同じだった。
#     低速(攻撃速度1.0)のぶんを取り返す手段が無く「重武器が弱い」という実プレイ報告どおりだった。
#   ・剣は尖ったステが1つも無いのに秒間火力は【最上位】という、設計不在のまま最強枠だった。
#   ・斧も「高火力・低速」以外に手が無く、槍(リーチ)・短剣(会心率)・メイス(落下)と比べて薄かった。
# どう変えたか — 1武器種につき1つだけ突出させる:
#   大剣 …… 範囲の主役。対象上限を 5(最下位tier)→10(最上位tier)、半径 3→4、倍率 0.35。
#   鎌   …… 手数側の範囲。対象上限 4→7、半径3、倍率0.2 で【必ず大剣より下】に置く。
#   剣   …… 万能枠。全 tier 一律で 半径2 / 3体 / 倍率0.15 の小さい巻き込みだけ持つ(段では伸びない)。
#   斧   …… 会心の重さ。crit-damage を 1.0 にして「短剣=会心率 / 斧=会心倍率」で棲み分ける。
#   槍(リーチ2.0+貫通) / 短剣(会心率0.192+最速) / メイス(落下ボーナス) / トライデント(投擲) は据え置き。
#   杖   …… W-127「強すぎる」への微ナーフ。全10本の attack-power を一律 x0.87
#            (fixed / per-quality / random の min-max とも)。
#            ★ 基準は【メイスではなく剣】。既存の較正契約 WeaponTierParityTest が杖を
#              「同系統の剣に対する詠唱DPS 40〜60%(狙い47.5%)」で縛っており、実測した出荷値は
#              48〜49% = 狙いどおりの位置だった。最初は「同 tier のメイスの1.3倍」で揃えたが
#              35〜39% まで落ちて下限を割ったので取り下げている。
#            そこで帯の中で下寄せする方針にし、42〜43%(帯の下端側)へ置いた。
#            「遠距離・高単発・手数最少」という杖の性格自体は変えない。
# ⚠️ MATERIAL#CMD エントリは素の MATERIAL を【置き換える】(マージしない。ItemStatsConfig#profileFor)。
#    素の *_SWORD に足した AoE は、同じ材質でも CMD を持つ短剣・杖・大剣には波及しない。
# 回帰は ShippedWeaponIdentityTest。
