  # 杖(触媒)シリーズのCT(item-cooldown)は2026-08-02導入。「杖が強すぎる」対策。
  # 火力ランキング(このファイル内のattack-power実値による): wooden<stone<copper<iron<golden<diamond<netherite
  # <wither<dragon<infinity。CTはこの順に 3.0s → 1.8s へ緩やかに下げる。
  #
  # 【この刻み幅にした理由 — 逆効果になる罠がある】
  # 「上位ほどCTを大きく短くする」設計にすると、CTが火力差を抑えるどころか【広げる】。
  # 攻撃力の開きは 17.6 → 10584 の約601倍だが、当初案(6.0s → 1.5s)だと秒間火力の開きは
  # 2.9 → 7056 の約2434倍まで膨らみ、抑えたかった最上位帯がいちばん抑えられない結果になる。
  # そこでCTの幅を 3.0s → 1.8s(1.67倍)まで詰め、増幅を最小限にした。
  # ⚠️ 最上位帯を【本当に】頭打ちにしたいなら、CTは全シリーズ一律にするか、上位ほど長くする必要がある
  #    (一律にすると秒間火力の開きは攻撃力の開き=601倍と一致する)。ここは運用判断で切り替えられる。
  # 下位を6秒台にしなかったのは、初期杖が「17.6ダメージを6秒に1回」になり序盤が成立しないため。
  # 値を変えるときはこのブロックのfixed.item-cooldownだけを編集すればよい(SpellCaster.java:274-284が
  # TrinityForgeBridge.itemCooldownSeconds/startItemCooldown経由でこの値を読み、詠唱成功後にCTを開始する)。
  # 上限は stats/lore.yml の item-cooldown.limits.max-duration-ticks-ref (72000tick=1時間、CombatListener.
  # ITEM_COOLDOWN_MAX_TICKS) で、ここで書く数秒オーダーの値には無関係。
  # cooldown_reduction(アイテムCT短縮ステ)は現状ArsPaperフォーク側のTrinityForgeBridge.startItemCooldownが
  # 適用しない(近接専用CombatListener.startItemCooldownだけがこの乗算を行う)ため、触媒CTは現時点では
  # cooldown_reductionの影響を受けない。したがって「短縮ステでCTが0になる」懸念は今は発生しないが、
  # 将来フォーク側にcooldown_reduction適用を足す場合は近接側と同じ下限クランプ(Math.max(0.05, 1.0-min(0.9,r)))
  # を必ず入れること。
