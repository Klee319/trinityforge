# TrinityForge - アイテム個別ステ (item-stats.yml)
# ここが「アイテムのステータス」の唯一の定義元です（旧 stats/roll.yml のロール表と素材別 material-base は廃止）。
# 各装備のステを1品ずつ個別に設定できます。焼き付けはしない: 編集 + /trinityforge reload で既存品にも即再導出。
#
# ■ キーの形式
#   MATERIAL      … そのバニラMaterialのステ（例: DIAMOND_SWORD）。CMDを持たない=そのMaterialの全品(バニラ含む)に適用。
#   MATERIAL#CMD  … CustomModelData が一致するカスタム個別品に適用（例: "EMERALD#5104" は#付きなのでクオート）。
#                   MATERIAL#CMD エントリが 素の MATERIAL エントリより優先される。
#                   未知のMaterialや非整数CMDのキーは警告してスキップ（構文エラー時は直前の設定を維持）。
#
# ■ 各アイテムの中身
#   fixed:        ステ値を直接指定（その値に上書き）。rollSeedの有無に関係なく全アイテムに適用。
#   per-quality:  品質1段あたりの増分。最終値 = fixed + (step × 品質Lv)。品質は敵ドロップ/制作/釣りで決まる。
#   random:       ここに書いたステだけが「ランダムロール」される。レンジ {min, max} を指定すると、その幅を
#                 「範囲=1」として品質に応じたロール分布(stats/quality.yml の roll-spread-up / roll-spread-down /
#                 roll-center-inset による上下非対称の正規分布)で抽選され、fixed / per-quality の上に加算される
#                 （物理・魔法共用）。抽選値はアイテムの rollSeed で決定的（同じ品は常に同じ値。reloadしても不変）。
#                 中心modeは品質比例(高品質ほど max 寄り)。roll-center-inset を上げると極端品質でも端に張り付かず山形になる。
#                 fixed / per-quality を書いていないステに random だけ書いた場合、基礎0にロール分だけ加算される。
#   advanced:     任意。高度オプション。
#     randomize-grants: true のとき、fixed/per-quality/random に書いたステ種類のうち実際に付与するものを
#                       ステごとの確率でランダム化(rollSeedで決定的)。
#     grant-chances:    ステキー -> 0.0〜1.0。未記載キーは 1.0。randomize-grants が false なら無視。
#   ※ 解決順: アイテム個別(fixed/per-quality/random) とカテゴリ別 fallback.<weapon|armor|tool|other>.fixed は加算する。
#     バニラMaterial由来のTFステータスへのフォールバックは行わない。属性型ステータスはバニラ属性に加算される。
#   ※ fallback.<cat>.lore-default.<stat>: true ならそのキーを値が0でも Lore に出す（hide-when-zero バイパス）。
#     品質別/ランダム/高度なオプションはカテゴリ fallback では使わない（旧形式 fallback.fixed 直下は読み取り互換）。
#
# ■ 利用可能なステキー（権威は combat/damage.yml と stats/lore.yml。canonical化されるので大小/区切りは無視）
#   攻撃系: attack-power, percent-bonus-damage(追加ダメ: 与えた最終ダメージの割合を追加), crit-chance,
#           crit-damage, penetration, damage-modifier, fixed-damage, bleed-chance, bleed-damage
#   ※ flat-bonus-damage(旧: 追加ダメ(実))は廃止 — エディタ非表示。エンジン内部(毒コーティング等)のみ使用。
#   攻撃範囲(AoE): aoe-radius(半径ブロック), aoe-damage-rate(主命中ダメージに対する割合0.0〜), aoe-max-targets(対象上限,0=無制限)
#     ※近接主命中時に周囲へ splash=主命中TFダメージ×rate。hit-players等のグローバル設定は combat/damage.yml の aoe:。
#   offhand-stats-apply: このアイテムをオフハンドに持ったとき、そのステを戦闘集約に合算するか(true/false。既定 false)。
#                item直下に書く。旧・全体設定(combat/damage.yml の stat-unification.offhand-enabled)は廃止し、per-item化した。
#   アイテムCT系: item-cooldown(攻撃後この秒数だけ武器を使用不可にする物理CT=エンダーパール式。値は秒。
#           近接=CombatListener が直接消費。ArsPaperフォークの触媒詠唱(TrinityForgeBridge.itemCooldownSeconds
#           /startItemCooldown 経由・SpellCaster.java)も同じ item-cooldown を読み、触媒詠唱後にこのCTを開始する
#           ため「近接のみ」ではなくなった=2026-08-02 杖シリーズ導入時点)
#     ※CTはエンダーパール同様 Material 単位（ItemAssemblerがMaterial+CMD単位のcooldown_groupを刻むため実際には
#       同一カスタム品ID間でのみ共有し、別CMD/別Materialの武器では回避可）。
#   防御系: phys-resistance, magic-resistance, flat-defense, damage-reduction, dodge-chance
#   防具値: armor-defense-rate はバニラ防具値/Attribute.ARMOR にADD_NUMBERで加算する整数値
#           (例: armor-defense-rate: 8 は防具値+8)。armor-strength はTF戦闘における会心軽減率で、
#           0.0〜1.0 の割合値（バニラ靭性 Attribute.ARMOR_TOUGHNESS には写像しない）。
#   属性系(バニラ属性へ写像): max-health, knockback-resistance, move-speed,
#           attack-speed(2026-07-25確定: 絶対値方式・メインハンド専用。この値がそのまま実効攻撃速度
#           (毎秒の攻撃回数)になる。例: DIAMOND_SWORD に attack-speed: 1.18 と書けば実効は文字通り1.18。
#           このアイテムをメインハンドで持ったときにだけ効く(防具/オフハンド欄に書いても無視される)。
#           このアイテムに attack-speed を定義しなければ、TFは一切干渉しない(素手・そのMaterialの
#           バニラ既定値のまま。例: 未定義のツルハシ・シャベル等はバニラ本来の攻撃速度を保つ)。
#           0以下を書くと警告のうえ4.0(バニラ基礎)へフォールバックする。
#           計算・適用はプレイヤー単位(PerkAttributeApplier)で一元的に行う(アイテム個別のAttributeApplier
#           はATTACK_SPEED属性へ一切触れない)。
#           attack-speed-bonus(2026-07-25新設: 割合ボーナス・全ソース横断。武器/防具/オフハンド/
#           スキルツリーパーク/base-stats等、全ての発生源から集計した値を1つの合成割合として、
#           メインハンドのattack-speedが未定義でも常に乗算適用する(MULTIPLY_SCALAR_1、絶対値ADD_SCALARの
#           「base(4.0)のみに掛かる」動作とは異なり、絶対値適用後の実効速度そのものに掛かる)。
#           例: 素手(4.0) + attack-speed-bonus 0.10(10%) = 4.4。デバフの重ね掛けでも最終実効速度は
#           combat/damage.yml の attack-speed.min-effective(既定0.1)を下回らない。
#           ⚠️ combat/base-stats.yml のプレイヤー基礎ステ attack-speed/attack-speed-bonus も同じ意味論
#           (attack-speedは絶対値、attack-speed-bonusは割合加算)で扱われる。
#           attack-reach(近接の届く距離ブロック。既定リーチ3.0への加算)
#   補助系(実装済み): durability(最大耐久力。補助カテゴリのステとして fixed/per-quality/random で設定でき、値はfloorして
#           intの最大耐久になる。武器/ツール/防具など耐久を持つアイテムにのみ効果あり。0以下や小数は最低1にクランプ。
#           未設定なら旧来の item直下 durability: 上書き(後方互換、下記参照)にフォールバックし、それも無ければ
#           耐久値なし（無限）になる)、
#           mining-fortune(採掘幸運), fishing-luck / fishing-bonus(釣り系)
#           gathering-efficiency(2026-07-25新設、属性ベースを取り下げ再設計: バニラ属性ではなく実在の
#           「効率強化」エンチャントのレベルとして反映するため統合版/Geyserでも正しく動く。
#           装備/防具/オフハンド/スキルツリーパーク/base-stats等から通常通り合算される総合ステ。
#           適用先はメインハンドの道具1つだけ、かつその道具の use-skill が FARMING/MINING/WOODCUTTING/
#           DIGGING のいずれかのときだけ(GatheringEfficiencyEnchantApplierが合算値をfloorし、
#           stats/gathering-efficiency.yml の上限(既定5)でクランプして付与)。
#           ⚠️ クラフト時にツール自身へ効率強化エンチャントとして刻まれる tool-enchant-efficiency とは
#           別物(そちらはアイテムのエンチャントとして永続的に残り続け、プレイヤー総合ステータスには
#           合算されない。gathering-efficiencyは逆に「メインハンド装備中だけ効く」集計ステ)。
#   Ars/マナ系: mana-bonus, mana-regen, hit-mana-recovery, damage-mana-recovery,
#           thread-slots(スレッド(糸)装着枠数。値はfloorしてint。実際の装着枠効果はArsフォークが
#           このitem-stats.ymlの解決結果を読んで反映する。ここでは表示・語彙のみ)
#   ■ 2026-07-23 stat-gate-overhaul §2.1: 新規statキー(このフェーズでは語彙/lore/許可リストのみ追加。
#     consumer配線は後続フェーズ)
#     弓系: bow-accuracy(弓精度・符号反転=正が高精度), ammo-save-chance(矢節約率),
#           distance-damage-bonus(距離ダメージ), arrow-piercing(矢貫通,整数), arrow-velocity(矢速度),
#           arrow-knockback(矢ノックバック・単位m)
#           ※ 旧 bow-cooldown-reduction(弓CT短縮)は2026-07-31に廃止。弓のCT短縮は
#             cooldown-reduction(アイテムCT短縮)へ一本化した。
#     近接系: melee-knockback(追撃ノックバック・単位m。矢ノックバックと同じ単位系), stun-chance(スタン率),
#           power-attack-damage(空中攻撃ダメ),
#           power-attack-radius(空中攻撃半径),
#           coating-charges(コーティング回数上限ボーナス・整数。WeaponCoatingListenerがメインハンド武器
#           単体のこのステを floor して読み、Math.min(coating-base-max-stacks, 素材maxStacks) +
#           perk由来coating-stack-increase合計 に加算する。防具4部位の合算ではなく、その武器固有の値として扱う)
#     生存・汎用系: health-regen-bonus(自然回復量), hunger-save-chance(空腹節約率),
#           mob-drop-bonus(討伐ドロップ増加), skill-exp-bonus(スキル経験値増加),
#           cooldown-reduction(アイテムCT短縮・item-cooldownの秒数にのみ乗算。アクティブスキルには効かない),
#           <id>-cooldown-reduction(例: haste-active-mining-cooldown-reduction。ActiveSkill単位のCT短縮・
#           com.trinityforge.active のそのアクティブスキルCTにのみ乗算。アイテムCTにも他のActiveSkillにも効かない
#           — 2026-07-25 CT設計一本化 §2), loot-luck(幸運), mob-drop-quality(ドロップ品質),
#           gacha-rate-bonus(ガチャ確率UP), suspicious-respawn-chance(怪しいブロック復活),
#           hive-harvest-fortune(養蜂幸運), food-save-chance(食料節約率)
#     クラフト系: workbench-quality-bonus(作業台品質), ritual-quality-bonus(儀式品質),
#           workbench-upswing-bonus/ritual-upswing-bonus(上振れ拡大・作業台/儀式で別),
#           workbench-downswing-reduction/ritual-downswing-reduction(下振れ抑制・作業台/儀式で別),
#           craft-roll-up-bonus(ロール上振れ),
#           craft-roll-down-reduction(ロール下振れ抑制), craft-roll-inset(ロール収束)
#     fork consumer系: lapis-cost-reduction(ラピス消費軽減), source-cost-reduction(ソース消費軽減),
#           material-refund-chance(素材返還率), ingredient-save-chance(材料節約率)
#     ※ 上記のうち PERCENT表記のものは 0.0〜1.0 の割合値で指定する(他の割合系ステと同様)。
#   ※ 割合系(crit-chance / penetration / 各resistance / damage-reduction / dodge-chance / armor-strength 等)は
#     0.0〜1.0 の割合値で指定する。armor-defense-rate だけは防具ポイントの整数値である。
#   ※ 旧来の item直下 durability: 上書き値(正の整数)。fixed/per-quality/random と同じ階層(itemエントリ直下)に
#     書く後方互換フィールド。未指定なら耐久値なし（無限）。補助カテゴリの durability ステが設定されていればそちらが
#     優先される。例: durability: 3000
#
# ■ 記入例:
#   items:
#     NETHERITE_SWORD:
#       fixed:
#         attack-power: 9.0
#         crit-chance: 0.15
#       per-quality:
#         crit-damage: 0.05      # 品質1段ごとに +5%
#       random:
#         attack-power: { min: 0.0, max: 3.0 }   # 品質に応じて 0〜+3 をロールして上乗せ
#       durability: 3000                          # 最大耐久力を3000に上書き(item直下。ステと同階層)
#     "EMERALD#5104":
#       fixed: { flat-defense: 2.0 }
#
# ■ 2026-08-01 バランス調整(U5 / U6) — 武器バランスを触る前に必ず読むこと
#
#   【U5: 重武器と軽武器の実効DPS差は「+0〜+15%」に収める】
#   同日先行の要件1b で HEAVY_WEAPONS 66件だけに attack-power ×1.25 / attack-speed ×0.85 を
#   掛けたが、実効DPSで測ると軽武器比 +24% まで開いていたため、attack-power の倍率を
#   ×1.25 → ×1.157 へ引き下げた(素値からの倍率。現行値へ更に係数を掛け直したのではない)。
#   attack-speed の ×0.85 は「重武器は一撃の重さで差を付ける」という設計の根幹なので据え置く。
#
#   ⚠️ 実効DPSは「attack-power × attack-speed」では絶対に測れない。この素朴な式だと
#      重武器が軽武器の半分という真逆の結論が出る。正しくは次の2つを必ず入れる:
#        (1) 被弾側の無敵時間(10tick)による命中レート上限 = 最大 2発/秒。
#            これがあるので attack-speed 4.12 の軽武器は 2.0 相当までしか活かせず、手数の
#            優位を失う。TF は無敵時間を変更していない(NoDamageTicks を触るコードは無い)。
#        (2) combat/damage.yml の melee-charge(連打減衰)。振り間隔を最適化した前提で
#            倍率 = min-multiplier + t^exponent × (1-min-multiplier)、t = 経過tick ÷ (20/AS)。
#      さらに damage-modifier(期待値 = (min(1,端点)+max(1,端点))/2)を掛けて比較する。
#      この計算を固定した回帰テストが WeaponDpsParityTest。片側だけ動かすと即座に落ちる。
#
#   【U6: 近接想定外の品は attack-speed を最低値(0.1)にする】
#   弓 / クロスボウ / トライデント / Ars触媒(杖)は「殴る」ことを想定していないが、
#   attack-speed が 4(=バニラ最速)だったり、キー自体が無くて TF 不干渉(=バニラ 4.0)
#   だったりしたため、素振りだけで LIGHT_WEAPONS / ARCHERY のレベリングが成立していた。
#   combat/damage.yml の attack-speed.min-effective と同じ 0.1 へ揃える。
#   ⚠️ 0 以下を書くと AttackSpeedResolver が「著者ミス」と判断して 4.0 へ戻す(逆効果)ので、
#      「最低値」は 0 ではなく 0.1 であること。杖はキー自体が無かったので新設した。
#   ⚠️ attack-speed はバニラの Attribute.ATTACK_SPEED にしか写像しないので、弓の引き絞り
#      速度・トライデントの投擲・魔法の詠唱には一切影響しない。落ちるのは殴りだけ。
#
# 下はバニラ装備・ツールとTFネイティブ品の個別ステータス定義。

