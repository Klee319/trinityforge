# 2026-08-19 W-151 — W-126 で漏れた3武器種の始末（大斧の衝突解消 / レイピアの尖り新設）
#
# W-126 は「1武器種に尖り1つ」を敷いたが、既存の尖りを棚卸ししていなかったので3種が残っていた。
#   ウォーハンマー … 貫通が全武器種で【最低】＝すでに尖っている。据え置き。
#   大斧           … ダメージ補正が全武器種で【最高】＝尖ってはいるが、範囲も 3.5/0.35/4 で
#                    【大剣より強かった】。W-126 で大剣を範囲の主役にした狙いと正面衝突していた。
#   レイピア       … 貫通も会心率も「高いほうの一角」でしかなく、主役の軸が1つも無かった。
#
# どう変えたか:
#   大斧     …… 巻き込みを縮小。aoe-radius 3.5 -> 2.5 / aoe-damage-rate 0.35 -> 0.2（体数4は据え置き）。
#                尖りは「一撃の重さ」に一本化し、範囲は大剣へ明け渡す。全16本に適用。
#   レイピア …… 貫通の主役へ。fixed.penetration 0.26 -> 0.45（abyss 系の x1.3 味付けは比例で
#                保存し 0.338 -> 0.585）。槍・ハルバード・猟師の投槍の 0.312〜0.39 を必ず上回る。
#                ★ ユーザー指示「その分火力は下げること」の対価:
#                  attack-power x0.98（fixed / per-quality / random.min-max）、
#                  crit-chance 0.105 -> 0.05、crit-damage 0.405 -> 0.34、
#                  per-quality.crit-chance 0.0045 -> 0.002（高品質で元の会心率へ戻らないように）。
#                  = 会心の軸からは降りて、貫通1本に賭ける武器になる。
#
# ⚠️ penetration の per-quality と random は【意図的に据え置き】。倍率で追随させると壊れる:
#    ・per-quality を 0.005 -> 0.009 にすると abyss レイピアが高品質で貫通 0.97 に達し、
#      1.0 を超えた瞬間 (1 - defenseRate x (1 - penetration)) が反転して【ダメージを増幅】する
#      (ComponentDamageCalculator)。
#    ・random 幅を伸ばすと金のレイピア(min -0.325)が基礎 0.45 と合わさって【負の貫通】になり、
#      守備力を増幅する側に回る。据え置けば最悪ロールでも 0.45 - 0.078 = 0.372 で槍の基礎を上回る。
#
# ⚠️ レイピアの攻撃力を下げられる幅は【約3%が上限】。WeaponDpsParityTest が
#    「大斧 / レイピア」を同格ペアとして比 <= 1.16 で縛っており、変更前ですでに 1.1257(Lv25)、
#    変更後は 1.1490(Lv0) まで詰まっている。これ以上の火力引き下げは大斧側も下げないと通らない。
#    会心を削った分は DpsParity では相殺されない（あちらは会心を数えない）ので、
#    「火力を下げる」の実体は WeaponTierParityTest 側の比（レイピア/剣 0.7429 >= 下限0.71）で効く。
#
# 回帰は ShippedWeaponIdentityTest の theGreatswordSweepsHardest（旧 theGreataxeSweepsHardest。
# 最強の薙ぎ払いが大斧から大剣へ移ったので名前ごと入れ替えた）と、
# theGreataxeSweepStaysUnderTheGreatsword（大斧を同値へ戻す変更をここで落とす）。
