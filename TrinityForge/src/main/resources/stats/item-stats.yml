  # ==========================================================================
  # 防具の重装/軽装 序列ルール (2026-08-03 要件#17)
  #
  # 【直した不具合】重装(HEAVY_ARMOR)より軽装(LIGHT_ARMOR)のほうが硬かった。
  # 2026-07-25 のラダー調整は重装と軽装に「同じ守備力・同じ最大体力」を配り、差は
  # 回避/移動速度/防具値/物理耐性だけに置いた。ところがその物理耐性が軽装のほうが高く
  # (例 Lv60: 軽装 0.449 / 重装 0.260)、回避の優位と合わさって軽装が約16%硬かった。
  #
  # 【今の決まり】同じ必要レベルどうしで比べたとき:
  #   ・軽装の phys-resistance = 同レベル・同部位の重装の 0.60 倍
  #     (もともとそれ以下なら据え置き。素の革だけは Lv0 の銅と回避差が大きすぎるので半分にした)
  #   ・軽装の fixed.max-health = 0(体力ボーナスは重装の取り柄。軽装は random: の上振れ分だけ残る)
  #   ・phys-flat-defense と armor-defense-rate、random: ブロック、回避/移動速度/防具強度/
  #     スレッド枠/耐久/魔法防御は 2026-08-03 の作業では一切触っていない。
  #
  # 【2026-08-12 に上書きした部分】守備力(phys-flat-defense)と最大体力(max-health)の
  # 絶対値は、2026-07-25 のラダーではなく「F(L) = 0.5 x A(L)、A(L) = 8.0 x 1.0148^L」へ
  # 帯ごとに引き直した。
  # 旧ラダーは守備力(x44)を敵攻撃力(x40)とほぼ同勾配で伸ばしていたため、引き算段の残差が
  # ゼロ近傍か爆発かの二択になり、全帯で min-component-damage:1 の床値に張り付いていた。
  # 新しい絶対値は tools/config-editor/test/armor-ladder.test.js が出荷 yml から実測して
  # 固定し直している(同ファイルの F_MAX_BY_LEVEL と耐久回数ラダーのテスト群)。
  # ※ 上の「軽装の phys-resistance は重装の0.60倍」「軽装の fixed.max-health は0」という
  #   序列ルール自体は生きている(帯ごとに一律倍率を掛けたので相対比は保たれる)。
  #
  # 【結果】1セット装備時の実効被ダメージ係数(回避×防具値×耐性×守備力×体力プール)は
  # 重装のほうが低い(=硬い)。軽装比:
  #   Lv0 -21% / Lv0(骨鎧) -24% / Lv10 -24% / Lv15 -43% / Lv35 -48% /
  #   Lv45 -48% / Lv60 -59% / Lv80 -67% / Lv100 -62%
  # この序列は ArmorHeavyVersusLightDefenseOrderTest が出荷ymlを実読して固定している。
  # 数値を戻すと同テストが落ちる。
  #
  # 【できなかったこと】魔法防具(mage_* = 守護/魔織/糸)には同じ序列を付けられない。
  # item-stat-coverage.test.js が mage_* に対して phys-resistance / phys-flat-defense /
  # max-health を「未設定であること」で縛っており、使える軸が1つも残らないため。
  # ==========================================================================
