  # ==========================================================================
  # 守護/魔織シリーズの Lv80「賢者」/ Lv100「星詠み」(2026-08-03 追加)
  #
  # 【なぜ足したか】魔法防御(magic-flat-defense / magic-resistance)を持つ防具は
  # このシリーズだけで、上限が Lv60「大魔導士」だった。Lv61以降は装備を新調しても
  # 魔法防御が一切伸びず、「Lv60 の防具を着続けて物理を捨てる」か「魔法を捨てて
  # ネザライトを着る」かの二択に固定されていた(バニラ系防具は全部位 magic-* がゼロ)。
  # ダンジョンのコンセプトで magic-ratio 0.45 を割り当てた11ダンジョンが Lv61以降で
  # 対策不能に近くなるため、レベル相応の選択肢として2段追加した。
  #
  # 【数値の作り方】既存3段(Lv20/40/60)の段間比をそのまま延長している:
  #   durability ×1.6 / magic-flat-defense ×2.2 / mana-bonus ×2.25 /
  #   per-quality durability ×1.6 / quality-mode-offset -2 / mana-regen +1.2 /
  #   random phys-flat-defense ×2.5
  # 防御率(armor-defense-rate)・防具強度・回避・スレッド枠・移動速度は既存3段で
  # 一定なので据え置き。
  #
  # 【⚠️ 率(magic-resistance / random phys-resistance)だけ段間比を落としている】
  # 既存の段間比(魔法耐性 ×1.56)をそのまま延ばすと、Lv100 の1セット合計が
  # 0.365 → 0.57 → 0.89 になり 100% に張り付く。率は乗算で効くので、
  # 上限に近づくほど「1段上げただけで無敵になる」方向に壊れる。
  # レベル追随は【固定値(flat-defense)】側で行い、率は
  # magic-resistance ×1.18 → ×1.14(セット合計 0.365→0.43→0.49)、
  # random phys-resistance ×1.25 → ×1.20 に抑えている。
  # ここを触るときは率ではなく「無対策/対策済みで何発耐えるか」で判断すること。
  # ==========================================================================
