# TrinityForge - 釣りツリー B-alpha/B-beta 系flag/percent dedicated-effect consumer
# (各 skilltree/*.yml ノードの dedicated-effects: フィールド)のチューニング + 釣り「宝/ゴミ比率＋釣り運シフト」ドロップテーブル機構
# (2026-07-23 stat-gate-overhaul §2.3/§4)。
# 対象effectId: junk-to-scrap / fish-sell-toggle(#5修正により恒久no-op)
# 数値・Material一覧は全て暫定(要調整)。

# 後方互換フォールバック専用: fishing.groups が空(未設定)の間だけ、旧junk-to-scrap動作
# (この一覧でのMaterial判定)がそのまま使われる。fishing.groupsが設定されればこの一覧は無視される。
# 注意(要調整): FISHING_ROD は「朽ちた釣竿(ゴミ)」と「エンチャント付き釣竿(宝)」の両方があり得るが、
# Material単体では区別できないため、衝突を避けてこの一覧・treasure-materials双方から除外している。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/fishing-gimmick.md

junk-materials:
  - LEATHER_BOOTS
  - LEATHER
  - BONE
  - POTION
  - STRING
  - BOWL
  - STICK
  - INK_SAC
  - ROTTEN_FLESH
  - TRIPWIRE_HOOK
treasure-materials:
  - NAME_TAG
  - SADDLE
  - NAUTILUS_SHELL
  - ENCHANTED_BOOK
  - BOW
fish-sell:
  prices:
    COD: 2
    SALMON: 3
    TROPICAL_FISH: 6
    PUFFERFISH: 4
  max-sells-per-minute: 10
# 経験値の瓶詰め (feature:xp-bottle-store-unlock)
# 【2026-08-05 仕様変更】格納はガラス瓶の通常右クリック(sneak不要)。取り出しは充填済み経験値瓶の
# 右クリックで、手にはガラス瓶が戻る(経験値瓶を返すとガラス瓶→経験値瓶の無償変換路になるため)。
# ガラス瓶で水汲み・蜜採取・チェスト開けなどバニラの操作が成立するクリックでは何も起きない。
#
# return-rate は「取り出し時に返る割合」で、単位は 0.0〜1.0 の分数。
# 1.0 = 目減りなし。範囲外の値を書くとその段だけ起動時に警告つきでスキップされる。
#
# 【2026-07-30 修正】段の return-rate が 50/60/70/80 と % 表記で書かれていたため
# 検証([0,1])に落ちて 4段すべてがスキップされ、全プレイヤーがグローバル値の
# return-rate: 1(目減りゼロ)で運用されていた。
# skilltree/enchanting.yml B-3 の設計メモに「経験値増殖の観点からデバフ必須」と
# 明記されているので、グローバル値も目減りありへ揃えている。
# 段は上がるほど改善する(格下げが起きないようグローバル値 = 段1 にしてある)。
#
# tier は feature:xp-bottle-store-unlock の value。SCALE 化済みで value 省略 = tier 1。
# 段2〜4 は value: 2/3/4 を持つノードを置いたときに初めて到達する。
xp-bottle-store:
  store-amount: 100
  return-rate: 0.5
  tiers:
    "1":
      store-amount: 100
      return-rate: 0.5
    "2":
      store-amount: 200
      return-rate: 0.6
    "3":
      store-amount: 300
      return-rate: 0.7
    "4":
      store-amount: 400
      return-rate: 0.8
fishing:
  luck-per-level: 0.005
  bonus-per-level: 0.02
  ocean-biomes:
    - ocean
    - deep_ocean
    - warm_ocean
    - lukewarm_ocean
    - deep_lukewarm_ocean
    - cold_ocean
    - deep_cold_ocean
    - frozen_ocean
    - deep_frozen_ocean
  group-ratio:
    treasure-percent: 5
    junk-percent: 10
  groups:
    treasure:
      categories:
        gacha:
          display-name: 釣りガチャ券
          entries:
            - item: gacha_ticket_4
              weight: 3
              amount: 1
            - item: gacha_ticket_5
              weight: 1
              amount: 1
        # 2026-08-01 追加: ダンジョンの鍵(釣り枠2種)。宝グループ(treasure-percent: 5)の中の抽選。
        # 鍵をルート限定にする配分のうち、水系ダンジョン2種をここへ寄せた。
        # weight は騎士団の城3 : 闇の大聖堂2 で、より深い側を細くしてある。
        dungeon_keys:
          display-name: ダンジョンの鍵
          entries:
            - item: key_knight_castle
              weight: 3
              amount: 1
            - item: key_dark_cathedral
              weight: 2
              amount: 1
        treasure_vanilla:
          display-name: バニラ宝(移植)
          entries:
            - item: NAME_TAG
              weight: 1
              amount: 1
            - item: SADDLE
              weight: 1
              amount: 1
            - item: NAUTILUS_SHELL
              weight: 1
              amount: 1
            - item: BOW
              weight: 1
              amount: 1
    junk:
      categories:
        junk_vanilla:
          display-name: バニラゴミ(移植)
          entries:
            - item: LEATHER_BOOTS
              weight: 1
              amount: 1
            - item: LEATHER
              weight: 1
              amount: 1
            - item: BONE
              weight: 1
              amount: 1
            - item: STRING
              weight: 1
              amount: 1
            - item: BOWL
              weight: 1
              amount: 1
            - item: STICK
              weight: 1
              amount: 1
            - item: INK_SAC
              weight: 1
              amount: 1
            - item: ROTTEN_FLESH
              weight: 1
              amount: 1
            - item: TRIPWIRE_HOOK
              weight: 1
              amount: 1
        ocean_thread:
          display-name: 海洋の空スレッド
          scrap-exempt: true
          entries:
            - item: thread_empty
              weight: 1
              amount: 1
