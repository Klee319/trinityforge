# TrinityForge - 釣りツリー B-alpha/B-beta 系flag/percent dedicated-effect consumer
# (skilltree/dedicated-effects.yml)のチューニング + 釣り「宝/ゴミ比率＋釣り運シフト」ドロップテーブル機構
# (2026-07-23 stat-gate-overhaul §2.3/§4)。
# 対象effectId: junk-to-scrap / fish-sell-toggle(#5修正により恒久no-op)
# 数値・Material一覧は全て暫定(要調整)。

# 後方互換フォールバック専用: fishing.groups が空(未設定)の間だけ、旧junk-to-scrap動作
# (この一覧でのMaterial判定)がそのまま使われる。fishing.groupsが設定されればこの一覧は無視される。
# 注意(要調整): FISHING_ROD は「朽ちた釣竿(ゴミ)」と「エンチャント付き釣竿(宝)」の両方があり得るが、
# Material単体では区別できないため、衝突を避けてこの一覧・treasure-materials双方から除外している。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/fishing-gimmick.md

junk-materials:
  - LEATHER_BOOTS
  - LEATHER
  - BONE
  - POTION
  - STRING
  - BOWL
  - STICK
  - INK_SAC
  - ROTTEN_FLESH
  - TRIPWIRE_HOOK

treasure-materials:
  - NAME_TAG
  - SADDLE
  - NAUTILUS_SHELL
  - ENCHANTED_BOOK
  - BOW

fish-sell:
  prices:
    COD: 2.0
    SALMON: 3.0
    TROPICAL_FISH: 6.0
    PUFFERFISH: 4.0
  max-sells-per-minute: 10

xp-bottle-store:
  store-amount: 100
  return-rate: 1.0
  # tier別設定(任意、2026-07-26): 未記載なら上のグローバル既定値がそのまま全員に使われる(完全後方互換)。
  # tierはスキルツリーのノード value から決まる(feature:xp-bottle-store-unlock は SCALE、
  # value省略時はtier1が自動補完されるため既存の単一解放ノードは無改変で従来どおり動作する)。
  # tiers:
  #   1: { store-amount: 100, return-rate: 0.8 }
  #   2: { store-amount: 200, return-rate: 1.0 }

fishing:
  luck-per-level: 0.005
  bonus-per-level: 0.02
  ocean-biomes:
    - ocean
    - deep_ocean
    - warm_ocean
    - lukewarm_ocean
    - deep_lukewarm_ocean
    - cold_ocean
    - deep_cold_ocean
    - frozen_ocean
    - deep_frozen_ocean
  group-ratio:
    treasure-percent: 5.0
    junk-percent: 10.0
  groups:
    treasure:
      categories:
        gacha:
          display-name: "釣りガチャ券"
          entries:
            - item: tf_gacha_ticket_4
              weight: 3
              amount: 1
            - item: tf_gacha_ticket_5
              weight: 1
              amount: 1
        treasure_vanilla:
          display-name: "バニラ宝(移植)"
          entries:
            - item: NAME_TAG
              weight: 1
              amount: 1
            - item: SADDLE
              weight: 1
              amount: 1
            - item: NAUTILUS_SHELL
              weight: 1
              amount: 1
            - item: ENCHANTED_BOOK
              weight: 1
              amount: 1
            - item: BOW
              weight: 1
              amount: 1
    junk:
      categories:
        junk_vanilla:
          display-name: "バニラゴミ(移植)"
          entries:
            - item: LEATHER_BOOTS
              weight: 1
              amount: 1
            - item: LEATHER
              weight: 1
              amount: 1
            - item: BONE
              weight: 1
              amount: 1
            - item: POTION
              weight: 1
              amount: 1
            - item: STRING
              weight: 1
              amount: 1
            - item: BOWL
              weight: 1
              amount: 1
            - item: STICK
              weight: 1
              amount: 1
            - item: INK_SAC
              weight: 1
              amount: 1
            - item: ROTTEN_FLESH
              weight: 1
              amount: 1
            - item: TRIPWIRE_HOOK
              weight: 1
              amount: 1
        ocean_thread:
          display-name: "海洋の空スレッド"
          scrap-exempt: true
          entries:
            - item: thread_empty
              weight: 1
              amount: 1
