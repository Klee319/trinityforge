multiplier-layers:
  - id: layer_1
    name: 攻撃力％
    stat: attack-power
  - id: layer_2
    name: 出血ダメージ%
    stat: bleed-damage
  - id: layer_3
    name: 固定ダメージ%
    stat: fixed-damage
  # 2026-08-15(W-30): 出血ダメージ率(bleed-damage-rate)用のレイヤ。乗算レイヤは
  # 「1レイヤ=1ステ」なので、実数(layer_2)の定義に率を書いても実行時に無言で捨てられる
  # (PerkBuffResolver#withValidMultiplierLayers が基準ステ不一致を落とす)。
  - id: layer_4
    name: 出血ダメージ率%
    stat: bleed-damage-rate
