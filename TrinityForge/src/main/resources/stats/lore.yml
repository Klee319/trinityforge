# TrinityForge - Item stat lore presentation (lore-consistency concern; tune in M7).
# Turns each item's derived stats (stats/item-stats.yml) into ValhallaMMO-styled lore lines so addon
# items read consistently next to ValhallaMMO gear. Nothing is baked: editing here + /trinityforge reload
# re-styles existing items.
#
# layout.line-template is a MiniMessage string with three placeholders resolved per stat:
#   <icon>   the stat's icon string below (ValhallaMMO uses resource-pack PUA glyphs; paste yours)
#   <name>   the display name below
#   <value>  the formatted value, already colored by positive-color / negative-color
# layout.score-line-template renders the quality score header line. Placeholders:
#   <tier>      ティア色付きの【ティア名】 (stats/quality-tiers.yml の name/color)
#   <tier-name> 色なしのティア名
#   <score>     品質スコア値
# 表示順はカテゴリ内の order（小さいほど上）。
# category: attack/defense/craft/gathering/utility/ars/other (2026-07-23 7分類再編。旧 support は
# utility へ改名統合。"support" 文字列は後方互換のため引き続き utility として読み込める)
# unit: PERCENT以外の末尾単位（例: m / 秒）。PERCENTは自動で%。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/lore.md


layout:
  line-template: <gray><icon><name>：<value></gray>
  score-line-template: <tier><gray>:</gray>  <aqua><score>pt</aqua>
  positive-color: white
  negative-color: red
  header: []
  footer: []
  colors:
    fixed:
      negative: dark_gray
    roll: {}
bind:
  show-owner: true
  owner-line: "<gray>所有者: <white><owner></white></gray>"
  show-use-requirement: true
  use-requirement-line: "<gray>必要Lv: <white><level></white> <gray><skill></gray>"
stats:
  attack-power:
    name: 攻撃力
    icon: ""
    format: FLAT
    decimals: 1
    order: 1
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): バニラ attack_damage へは写像しない(AttributeProjection.java:71-72)。
    # CombatListener#onEntityDamageByEntity がitem+perk+addonを合算しTFパイプラインの物理基本ダメージへ
    # 代入する(CombatListener.java 233-336)。近接/弓/クロスボウ/トライデントいずれも同一経路。
    # モブ攻撃者はMobData.attackStats()由来の別経路(handleMobToPlayerDamage)を使いこのチャネルを
    # 消費しないため applies-to は PLAYER のみ。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER]
  attack-speed:
    name: 攻撃速度
    icon: ""
    format: FLAT
    decimals: 1
    order: 2
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): item-levelのAttribute.ATTACK_SPEEDは常に除外され(AttributeApplier.java
    # 62-71,86-91)、PerkAttributeApplier#applyAttackSpeed がメインハンド武器自身の値だけを
    # DerivedItemStats#resolve で直接解決してADD_NUMBERで適用する(PerkAttributeApplier.java 313-358,
    # 406-414)。プレイヤー限定(同クラスはPlayerにしか反応しない)。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: MAINHAND_ONLY
      applies-to: [PLAYER]
  attack-speed-bonus:
    name: 攻撃速度加算
    icon: ""
    format: PERCENT
    decimals: 1
    order: 3
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): 装備+パーク+アドオン+native armor-setを合算しAttribute.ATTACK_SPEEDへ
    # MULTIPLY_SCALAR_1で適用する(PerkAttributeApplier.collectAttackSpeedBonus 382-395、
    # AttributeProjection.java 90-101)。プレイヤー限定。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: ALL
      applies-to: [PLAYER]
  attack-reach:
    name: リーチ
    icon: ""
    format: FLAT
    decimals: 1
    order: 5
    show-sign: true
    hide-when-zero: true
    unit: m
    category: attack
    # 段階1宣言(2026-07-27): entity_interaction_range属性へADD_NUMBERで常時ミラー(AttributeProjection.java
    # 102-104)。max-health/move-speed/knockback-resistanceと同じ「加算ステ」群でAttributeApplier.java
    # 56-60が同一の適用規則(材質既定と両立)を明言している。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: ALL
      applies-to: [PLAYER, MOB]
  aoe-radius:
    name: ダメージ半径
    icon: ""
    format: FLAT
    decimals: 1
    order: 8
    show-sign: true
    hide-when-zero: true
    unit: m
    category: attack
    # 段階1宣言(2026-07-27): 近接主命中(ENTITY_ATTACK)限定でmaybeApplyAreaDamageへ渡される
    # (CombatListener.java 468-484, 1007-1069)。プレイヤー攻撃者限定。
    trigger:
      when: ON_MELEE_HIT
      sources: ALL
      applies-to: [PLAYER]
  aoe-max-targets:
    name: 対象上限
    icon: ""
    format: FLAT
    decimals: 0
    order: 9
    show-sign: true
    hide-when-zero: true
    unit: 体
    category: attack
    # 段階1宣言(2026-07-27): aoe-radiusと同じ近接主命中(ENTITY_ATTACK)ゲート内でmaxTargetsとして消費
    # (CombatListener.java 468-479, 1045-1050)。
    trigger:
      when: ON_MELEE_HIT
      sources: ALL
      applies-to: [PLAYER]
  aoe-damage-rate:
    name: 範囲ダメージ
    icon: ""
    format: PERCENT
    decimals: 0
    order: 9
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): aoe-radiusと同じ近接主命中(ENTITY_ATTACK)ゲート内でsplash=primaryDamage×rate
    # として消費(CombatListener.java 468-479, 1020-1029)。
    trigger:
      when: ON_MELEE_HIT
      sources: ALL
      applies-to: [PLAYER]
  percent-bonus-damage:
    name: 追加ダメ
    icon: ""
    format: PERCENT
    decimals: 0
    order: 11
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): AttackStatsの一員としてComponentDamageCalculator step1(ComponentDamageCalculator.java
    # 34-40)を通る。物理/弓/トライデント/モブ攻撃(MobData#attackStats)いずれも同一の共有8段パイプラインを
    # 通るためON_ANY_HIT。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
  damage-modifier:
    name: ダメージ補正
    icon: ""
    format: PERCENT
    decimals: 0
    order: 4
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): ComponentDamageCalculator step6(rollDamageModifierMultiplier、
    # ComponentDamageCalculator.java 72-73,86-103)。armor-strength(段階1既存宣言)と同じ共有パイプライン
    # 経由でON_ANY_HIT。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
  item-cooldown:
    name: CT
    icon: ""
    format: FLAT
    decimals: 1
    order: 3
    show-sign: true
    hide-when-zero: true
    unit: 秒
    category: other
    # 段階1宣言(2026-07-27): CombatListener#startItemCooldown(java 772-799)が近接主命中(ENTITY_ATTACK
    # 限定、ITEM_CT_CAUSES)の後にagg.mainhand()(メインハンド単体マップ、防具/オフハンドは混ぜない —
    # java 464-466のコメント参照)からitem-cooldownを読み、cooldown-reductionで短縮した秒数を
    # Player#setCooldownへ変換する。attack-speedと同じ「メインハンド単体」sources規約。
    # ITEM_COOLDOWN_MAX_TICKS(72000tick=1時間)は変換後のtick数の絶対上限であり、item-cooldown
    # 自身の秒数の上限ではないため cap ではなく max-duration-ticks で宣言する。
    trigger:
      when: ON_MELEE_HIT
      sources: MAINHAND_ONLY
      applies-to: [PLAYER]
    limits:
      max-duration-ticks: 72000
      max-duration-ticks-ref: "java:com.trinityforge.listeners.CombatListener#ITEM_COOLDOWN_MAX_TICKS"
  crit-chance:
    name: 会心率
    icon: ""
    format: PERCENT
    decimals: 1
    order: 30
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): AttackStatsのコンパクトコンストラクタでcapAtOne(1.0)により上限化される
    # (AttackStats.java:41)。ComponentDamageCalculator step3(59-64)で会心加算に使用、共有パイプライン
    # 経由でPLAYER/MOB双方(MobData#attackStats)。public定数化されたマジックナンバーではないため
    # cap-refは付けない。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 1.0
  crit-damage:
    name: 会心ダメージ
    icon: ""
    format: PERCENT
    decimals: 0
    order: 31
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): ComponentDamageCalculator step3(59-64)。crit-chanceと同じ共有パイプライン。
    # このステ自体に実装上の上限は無い(finiteOrZeroのみ、AttackStats.java:42)。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
  penetration:
    name: 貫通率
    icon: ""
    format: PERCENT
    decimals: 0
    order: 40
    show-sign: true
    hide-when-zero: true
    category: attack
    # 段階1宣言(2026-07-27): AttackStatsのコンパクトコンストラクタでcapAtOne(1.0)により上限化される
    # (AttackStats.java:43)。ComponentDamageCalculator step4(67)で防御率貫通に使用。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 1.0
  bleed-chance:
    name: 出血率
    icon: ""
    format: PERCENT
    decimals: 0
    order: 41
    show-sign: true
    hide-when-zero: true
    category: attack
  bleed-damage:
    name: 出血ダメージ
    icon: ""
    format: FLAT
    decimals: 1
    order: 42
    show-sign: true
    hide-when-zero: true
    category: attack
  armor-defense-rate:
    name: 防御力
    icon: ""
    format: FLAT
    decimals: 1
    order: 50
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): DefenseStats.defenseRate は SymmetricCombatService.component() 経路で
    # DefenseStats.cappedMitigation(combat/damage.yml defense.max-mitigation-rate)により被弾側の
    # 3レートと共通の上限を持つ(TrinityForge/src/main/java/com/trinityforge/combat/DefenseStats.java:123-131)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 0.9
      cap-ref: "combat/damage.yml#defense.max-mitigation-rate"
  armor-strength:
    name: 防具強度
    icon: ""
    format: PERCENT
    decimals: 1
    order: 51
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): DefenseStats.armorStrength(会心軽減率%)は SymmetricCombatService の
    # cappedCritReduction(combat/damage.yml defense.max-crit-reduction)で上限化される
    # (DefenseStats.java:142-150)。ComponentDamageCalculator:63 で会心加算時に適用。
    trigger:
      when: ON_ANY_HIT
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 1.0
      cap-ref: "combat/damage.yml#defense.max-crit-reduction"
  max-health:
    name: 体力増強
    icon: ""
    format: FLAT
    decimals: 1
    order: 52
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): AttributeApplier.java:58-71 のコメントにより GENERIC_MAX_HEALTH 属性への
    # 常時ミラー(加算)であることを確認。上限は宣言しない(config上のcap値を持たない)。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: ALL
      applies-to: [PLAYER, MOB]
  knockback-resistance:
    name: K耐性
    icon: ""
    format: PERCENT
    decimals: 0
    order: 53
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): knockback_resistance属性へADD_NUMBERで常時ミラー(AttributeProjection.java
    # 73-74)。max-health/move-speedと同じ「加算ステ」群(AttributeApplier.java 56-60)。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: ALL
      applies-to: [PLAYER, MOB]
  move-speed:
    name: 移動速度
    icon: ""
    format: PERCENT
    decimals: 0
    order: 54
    show-sign: true
    hide-when-zero: true
    category: utility
    # 段階1宣言(2026-07-27): AttributeApplier.java:58-71 のコメントにより MOVEMENT_SPEED 属性への
    # 常時ミラー(加算)であることを確認。上限は宣言しない(config上のcap値を持たない)。
    trigger:
      when: PASSIVE_ATTRIBUTE
      sources: ALL
      applies-to: [PLAYER, MOB]
  durability:
    name: 耐久値
    icon: ""
    format: INTEGER
    decimals: 0
    order: 1000
    show-sign: false
    hide-when-zero: true
    category: other
  phys-resistance:
    name: 物理耐性
    icon: ""
    format: PERCENT
    decimals: 0
    order: 60
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): DefenseStats.resistance は defense-rate と同じ cappedMitigation
    # (combat/damage.yml defense.max-mitigation-rate) で上限化される(DefenseStats.java:123-131)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 0.9
      cap-ref: "combat/damage.yml#defense.max-mitigation-rate"
  magic-resistance:
    name: 魔法耐性
    icon: ""
    format: PERCENT
    decimals: 0
    order: 61
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): phys-resistance と同じ DefenseStats.resistance フィールド(タイプ別)を
    # 経由するため同じ cap-ref。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 0.9
      cap-ref: "combat/damage.yml#defense.max-mitigation-rate"
  damage-reduction:
    name: 被ダメ軽減
    icon: ""
    format: PERCENT
    decimals: 0
    order: 65
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): DefenseStats.damageReduction も同じ cappedMitigation で上限化される
    # (DefenseStats.java:123-131)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 0.9
      cap-ref: "combat/damage.yml#defense.max-mitigation-rate"
  dodge-chance:
    name: 回避率
    icon: ""
    format: PERCENT
    decimals: 0
    order: 66
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): DodgeResolver が combat/damage.yml defense.max-dodge-chance を上限として
    # 使う(DodgeResolver.java:35)。実測ずれの実証キー(labels.js:170に上限記載無し)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER, MOB]
    limits:
      cap: 0.9
      cap-ref: "combat/damage.yml#defense.max-dodge-chance"
  reflect-flat:
    # 2026-07-25 課題2: 棘の鎧ステータス化。被弾時にこの固定値分だけ相手にダメージを与える。
    name: 反射率（実）
    icon: ""
    format: FLAT
    decimals: 1
    order: 67
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): CombatListener#onReflectDamage(MONITOR、victimがPlayerのときだけ発動)が
    # 被弾ダメージ確定後に読み、反射ダメージ量へ充填する(CombatListener.java 566-596)。
    # Math.max(0.0, ...)で負値は0へ床上げされる(line 583、publicなマジックナンバーではないため
    # floor-refは付けない)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER]
    limits:
      floor: 0
  reflect-percent:
    # 棘の鎧レベルL(装備全体の合計)は10%×Lをこの値へ寄与する(ReflectDamageBridge)。
    # バニラの棘の鎧ダメージ自体は二重にならないよう抑止し、反射はこちらへ一本化する
    # (バニラの耐久値消費は維持)。
    name: 反射率（割）
    icon: ""
    format: PERCENT
    decimals: 0
    order: 68
    show-sign: true
    hide-when-zero: true
    category: defense
    # 段階1宣言(2026-07-27): reflect-flatと同じCombatListener#onReflectDamageで消費、被弾ダメージの
    # 割合分を反射(CombatListener.java 566-596)。同じくMath.max(0.0, ...)で床上げ(line 584-585)。
    trigger:
      when: ON_DAMAGE_TAKEN
      sources: ALL
      applies-to: [PLAYER]
    limits:
      floor: 0
  gathering-efficiency:
    name: 最終効率
    icon: ""
    format: FLAT
    decimals: 1
    order: 80
    show-sign: true
    hide-when-zero: true
    category: gathering
    # 段階1宣言(2026-07-27): GatheringEfficiencyEnchantApplier#desiredLevelFor(java 229-244)が
    # aggregator.aggregate(player, mainhand)(全ソース合算)を読み、メインハンドの use-skill が
    # FARMING/MINING/WOODCUTTING/DIGGINGのときだけバニラEfficiencyエンチャントレベルへ常時ミラーする
    # (装備変更のたびに再計算・再適用、EntityEquipmentChangedEvent等)。バニラAttributeへの投影ではない
    # 独自ロジックの常時適用のためPASSIVE_ATTRIBUTEではなくPASSIVE。上限はstats/gathering-efficiency.yml
    # のmax-enchant-levelとcombat/stat-caps.ymlの上書きのどちらが効くか動的に決まり(統合参照先が
    # 1本に定まらない)、GatheringEfficiencyMath.HARD_CAP(255)も別途あるため、単一の-refで正しく
    # 表現できない。limitsは省略する。
    trigger:
      when: PASSIVE
      sources: ALL
      applies-to: [PLAYER]
  mining-fortune:
    name: 採掘運
    icon: ""
    format: FLAT
    decimals: 1
    order: 81
    show-sign: true
    hide-when-zero: true
    category: gathering
    # 段階1宣言(2026-07-27): MiningFortuneListener#onBlockDropItem(java 104-170)がBlockBreakEventの
    # 対になるBlockDropItemEvent(SURVIVALのPlayerのみ)でaggregator.aggregate(player, tool)(全ソース合算)
    # を読み、MININGスキルLvと合成した期待値ぶん追加ドロップをスポーンする。GatheringPolicy.MAX_EXTRAは
    # 「追加ドロップの個数」の上限でありmining-fortune自身の値の上限ではないため、limitsは省略する
    # (このステータス自体に数値上限は無い)。
    trigger:
      when: ON_BLOCK_BREAK
      sources: ALL
      applies-to: [PLAYER]
  fishing-luck:
    name: 釣り運
    icon: ""
    format: PERCENT
    decimals: 0
    order: 82
    show-sign: true
    hide-when-zero: true
    category: gathering
    # 段階1宣言(2026-07-27): FishingGimmickListener#luckTotalOf(java 206-215)がCAUGHT_FISH時に
    # aggregator.aggregate(player, rod)(全ソース合算)+ EnchantmentStatBridge宝釣り分 +
    # FISHINGスキルLv×係数を合成し宝/ゴミ抽選の比率シフトへ使う。プレイヤー限定。宝率自体は
    # [0.05, 95.0]にクランプされるが、それはfishing-luckの値そのものの上限ではなく派生値(宝%)の
    # 上限のため、limitsは省略する。
    trigger:
      when: ON_FISH
      sources: ALL
      applies-to: [PLAYER]
  fishing-bonus:
    name: 釣りボーナス
    icon: ""
    format: FLAT
    decimals: 1
    order: 83
    show-sign: true
    hide-when-zero: true
    category: gathering
    # 段階1宣言(2026-07-27): FishingQualityListener#dropFishingBonus(java 165-188)がCAUGHT_FISH時に
    # aggregator.aggregate(player, rod, rodFromOffhand)(全ソース合算)+ FISHINGスキルLv×係数を
    # 期待値化し、釣果が非装備のときだけ追加ドロップをスポーンする(装備は対象外、複製防止)。
    # プレイヤー限定。GatheringPolicy.MAX_EXTRAは追加ドロップ個数の上限でありこのステ自体の上限
    # ではないため、limitsは省略する。
    trigger:
      when: ON_FISH
      sources: ALL
      applies-to: [PLAYER]
  # tool-enchant-efficiency は 2026-07-26 に gathering-efficiency(最終効率)へ統合したため削除。
