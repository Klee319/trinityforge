# TrinityForge - Item stat lore presentation (lore-consistency concern; tune in M7).
# Turns each item's derived stats (stats/item-stats.yml) into ValhallaMMO-styled lore lines so addon
# items read consistently next to ValhallaMMO gear. Nothing is baked: editing here + /trinityforge reload
# re-styles existing items.
#
# layout.line-template is a MiniMessage string with three placeholders resolved per stat:
#   <icon>   the stat's icon string below (ValhallaMMO uses resource-pack PUA glyphs; paste yours)
#   <name>   the display name below
#   <value>  the formatted value, already colored by positive-color / negative-color
# layout.score-line-template renders the quality score header line. Placeholders:
#   <tier>      ティア色付きの【ティア名】 (stats/quality-tiers.yml の name/color)
#   <tier-name> 色なしのティア名
#   <score>     品質スコア値
# 表示順はカテゴリ内の order（小さいほど上）。
# category: attack/defense/craft/gathering/utility/ars/other (2026-07-23 7分類再編。旧 support は
# utility へ改名統合。"support" 文字列は後方互換のため引き続き utility として読み込める)
# unit: PERCENT以外の末尾単位（例: m / 秒）。PERCENTは自動で%。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/lore.md


layout:
  line-template: <gray><icon><name>：<value></gray>
  score-line-template: <tier><gray>:</gray>  <aqua><score>pt</aqua>
  positive-color: white
  negative-color: red
  header: []
  footer: []
  colors:
    fixed:
      negative: dark_gray
    roll: {}
bind:
  show-owner: true
  owner-line: "<gray>所有者: <white><owner></white></gray>"
  show-use-requirement: true
  use-requirement-line: "<gray>必要Lv: <white><level></white> <gray><skill></gray>"
