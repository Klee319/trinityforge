# TrinityForge - 伐採ギミック(各 skilltree/*.yml ノードの dedicated-effects: フィールドが付与する flag系consumer)チューニング
# 対象effectId: tree-fell (2026-07-25 gather-rework-active-framework §6 Q1: 旧small-tree-fell/
# large-tree-fell を統合。tierはノード側 dedicated-effects[].value で持つ)
# ドロップテーブル(drop-tables)は「葉/原木破壊」トリガー型の追加ドロップ(2026-07-23 stat-gate-overhaul §4)。
# 数値は全て暫定(要調整)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/woodcutting-gimmick.md

tree-fell:
  max-extra-logs: 8
  cooldown-ticks: 200
  break-leaves: true
  leaves-max: 512
  leaves-per-log: 6
  leaves-per-tick: 48
  leaves-decay-only: true
  scan-limit: 512
  max-horizontal-distance: 8
  max-vertical-distance: 32
  tiers:
    "1":
      max-extra-logs: 16
      leaves-max: 128
    "2":
      max-extra-logs: 32
      leaves-max: 256
    "3":
      max-extra-logs: 64
      leaves-max: 512
    "4":
      max-extra-logs: 128
      leaves-max: 1024
drop-tables:
  categories:
    apple:
      display-name: 金リンゴ
      trigger-chance-percent: 5
      entries:
        - item: GOLDEN_APPLE
          weight: 1
          amount: 1
    golden_apple:
      display-name: クリスタルリンゴ
      trigger-chance-percent: 1
      entries:
        - item: custom:tf_crystal_apple
          weight: 1
          amount: 1
    crystal_apple:
      display-name: エンチャント金リンゴ
      trigger-chance-percent: 0.1
      entries:
        - item: ENCHANTED_GOLDEN_APPLE
          weight: 1
          amount: 1
