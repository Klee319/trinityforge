# TrinityForge - 伐採ギミック(各 skilltree/*.yml ノードの dedicated-effects: フィールドが付与する flag系consumer)チューニング
# 対象effectId: tree-fell (2026-07-25 gather-rework-active-framework §6 Q1: 旧small-tree-fell/
# large-tree-fell を統合。tierはノード側 dedicated-effects[].value で持つ)
# ドロップテーブル(drop-tables)は「葉/原木破壊」トリガー型の追加ドロップ(2026-07-23 stat-gate-overhaul §4)。
# 数値は全て暫定(要調整)。
# 設定リファレンス(本文コメント移設先): docs/config-reference/stats/woodcutting-gimmick.md

tree-fell:
  max-extra-logs: 8
  cooldown-ticks: 200
  # 幹に繋がる葉も一緒に壊すか(2026-07-30)。false にすると原木だけ消えて葉が空中に残る。
  break-leaves: true
  # 巻き込む葉の上限 = 実際に伐った原木の本数 × この値。原木側のtier表へ自動追従する。
  # 葉は「伐採のおまけの片付け」なので道具の耐久は消費しない(TreeFellingListener 参照)。
  leaves-per-log: 6
  tiers:
    "1":
      max-extra-logs: 8
    "2":
      max-extra-logs: 16
    "3":
      max-extra-logs: 32
    "4":
      max-extra-logs: 64
drop-tables:
  categories:
    apple:
      display-name: リンゴ
      trigger-chance-percent: 5
      entries:
        - item: APPLE
          weight: 1
          amount: 1
    golden_apple:
      display-name: 金のリンゴ
      trigger-chance-percent: 1
      entries:
        - item: GOLDEN_APPLE
          weight: 1
          amount: 1
    crystal_apple:
      display-name: クリスタルリンゴ
      trigger-chance-percent: 0.5
      entries:
        - item: tf_crystal_apple
          weight: 1
          amount: 1
