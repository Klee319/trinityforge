# =================================================================================================
#  Sonar (antibot) — Velocity 側 plugins/Sonar/config.yml
#
#  【この YAML をそのまま上書きしない】
#  HuskSync と同じ理由。初回起動で生成された config.yml に対して、ここに挙げた方針だけを反映する。
#  Sonar は既定値のままでもボット洪水にはかなり効く。触るべき箇所は多くない。
#
#  Sonar が守るのは「アプリ層」まで。回線を埋める L3/L4 攻撃は防げない。
#  その線引きは ops/SECURITY.md に書いてある。
# =================================================================================================

# --- 有効化 ----------------------------------------------------------------------------------------
# 検証をどのタイミングで行うか。ALWAYS はサーバが平常時でも全接続を検証する。
# 25人規模なら常時検証で問題ない (検証は数秒で終わる)。
verification:
  timing: ALWAYS

  # 検証中のプレイヤーに課す物理チェック。既定を維持する。
  # 落下・衝突・パケット順序が人間として妥当かを見るので、
  # 単純なボットはここで全部落ちる。
  gravity:
    enabled: true
  collision:
    enabled: true

  # 検証にかける上限。長すぎると正規プレイヤーが待たされ、短すぎると素通りする。
  read-timeout: 8000
  write-timeout: 10000

  # 検証を通ったクライアントを一定時間記憶し、再接続で再検証しない。
  # サーバ移動のたびに検証されると体感が悪くなるため、ある程度長めに取る。
  remember-time: 1800000

# --- レート制限 --------------------------------------------------------------------------------------
# 同一 IP からの検証試行の間隔。Velocity の login-ratelimit と二重にかかる。
attack-tracker:
  # この閾値を超える新規接続/秒が続いたら「攻撃中」と判定する。
  min-players-for-attack: 8
  # 攻撃終了と見なすまでの猶予。すぐ解除すると波状攻撃で振り回される。
  min-attack-duration: 30000
  min-attack-threshold: 2
  attack-cooldown-delay: 3000

# --- ホワイトリスト運用と併用する場合 ------------------------------------------------------------------
# 25人規模では、Velocity 側のホワイトリストが無料で最も強力な対策になる。
# Sonar はその手前で「そもそもログイン処理まで到達させない」層として効く。
# 両方入れておくと、ホワイトリスト判定のコストすら攻撃者に払わせずに済む。

# --- ログ --------------------------------------------------------------------------------------------
logging:
  # 攻撃中に1接続ずつログを出すとディスクを食う。既定の抑制を維持する。
  enabled: true
