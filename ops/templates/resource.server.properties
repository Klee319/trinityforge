#
# 資源サーバ (新規) の server.properties。
#
# メインからコピーして、下記の値に書き換えたもの。
# メインと違えてある箇所には理由をコメントで書いてある。
#
# 注意: このファイルは週次リセットで削除しない (削除対象はワールドと一部のプラグイン状態だけ)。
#

# --- プロキシ配下 -------------------------------------------------------------------------------
# 外部から直接繋がせない。modern forwarding のなりすまし対策として必須。
server-ip=127.0.0.1
server-port=25567
online-mode=false

# --- RCON ---------------------------------------------------------------------------------------
# メインと別ポート。パスワードもメインと別のものにする。
# 設定後は環境変数 TF_RCON_RESOURCE_PASSWORD にも同じ値を入れる。
enable-rcon=true
rcon.port=25576
rcon.password=<十分に長いランダム文字列・メインとは別のもの>

# --- ワールド -----------------------------------------------------------------------------------
level-name=world
# 空にしておくと、毎週のリセットで必ず新しい地形になる。
# 固定シードにすると毎回同じ世界が生えてリセットの意味が薄れる。
level-seed=
level-type=minecraft:normal
generate-structures=true

# 資源サーバはボーダーを張らない (メインだけ 5000x5000)。
# 掘り尽くしたら次の週で作り直す運用なので、広いほうが都合がよい。
max-world-size=29999984

# --- ゲームプレイ -------------------------------------------------------------------------------
# メインの world は creative だが、資源サーバは全ワールド survival。
gamemode=survival
force-gamemode=false
difficulty=hard
pvp=false
hardcore=false
allow-flight=true
allow-nether=true

# メインは 0 だが、資源サーバはリセット直後にスポーン地点へ人が集中する。
# 湧き潰しと整地の取り合いを避けるため少しだけ保護する。
spawn-protection=16

spawn-animals=true
spawn-monsters=true
spawn-npcs=true

# --- 負荷 ---------------------------------------------------------------------------------------
# メインと同じ。資源サーバは新規チャンク生成が主な負荷なので、Chunky の事前生成のほうが効く。
view-distance=10
simulation-distance=6
max-players=25
entity-broadcast-range-percentage=100
network-compression-threshold=256
sync-chunk-writes=true
use-native-transport=true

# --- リソースパック -----------------------------------------------------------------------------
# メインと同じ URL / sha1 を指す。異なると移動のたびに再ダウンロードが走る。
# プロキシの OneTimePack で二重送信を抑止する。
require-resource-pack=true
resource-pack=<メインの server.properties と同じ URL>
resource-pack-sha1=<メインの server.properties と同じ sha1>
resource-pack-prompt=

# --- 閉じておくもの -----------------------------------------------------------------------------
enable-query=false
enable-status=true
enforce-secure-profile=false
management-server-enabled=false
white-list=false

# --- その他 -------------------------------------------------------------------------------------
motd=TrinityForge Resource
enable-command-block=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
op-permission-level=4
function-permission-level=2
player-idle-timeout=0

# 誰も居なければ tick を止めて CPU をメインへ明け渡す設定 (秒。-1 で無効)。
# 同一マシンで CPU を共有する構成なので魅力的に見えるが、【既定では無効にしてある】。
# tick が止まると Chunky の事前生成も止まるためで、資源サーバの事前生成は
# 「リセット直後、誰も居ない時間帯」に走らせるのが前提になっている。
# 事前生成を使わない運用に切り替えるなら 60 程度を入れてよい。
pause-when-empty-seconds=-1

max-tick-time=60000
log-ips=true
region-file-compression=deflate
